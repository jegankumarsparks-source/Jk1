<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Two of Us</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  body { background:#0b141a; color:#e9edef; display:flex; flex-direction:column; }
  #chat { display:flex; flex:1; flex-direction:column; height:100%; }
  /* ---- topbar ---- */
  #topbar { display:flex; align-items:center; gap:11px; padding:9px 14px; background:#202c33; box-shadow:0 1px 3px rgba(0,0,0,.4); z-index:2; }
  #avatar { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,#00a884,#025c4b); display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; color:#fff; flex:none; }
  #roomLabel { font-weight:600; font-size:16.5px; }
  #statusLine { font-size:12.5px; color:#8696a0; display:flex; align-items:center; gap:5px; }
  #statusLine .dot { width:8px; height:8px; border-radius:50%; background:#f15c6d; display:inline-block; }
  #statusLine .dot.on { background:#00a884; }
  /* ---- messages ---- */
  #msgs { flex:1; overflow-y:auto; padding:14px 10px 8px; display:flex; flex-direction:column; gap:3px;
          background:#0b141a url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60"><circle cx="30" cy="30" r="1" fill="%23182229"/></svg>'); }
  .row { display:flex; margin-bottom:3px; }
  .row.mine { justify-content:flex-end; }
  .bubble { max-width:80%; padding:7px 9px 5px; border-radius:12px; font-size:15.5px; line-height:1.38; word-wrap:break-word; background:#202c33; position:relative; box-shadow:0 1px 1px rgba(0,0,0,.3); }
  .row:not(.mine) .bubble { border-top-left-radius:4px; }
  .row.mine .bubble { background:#005c4b; border-top-right-radius:4px; }
  .bubble .who { font-size:12px; font-weight:700; margin-bottom:2px; }
  .who.b1 { color:#53bdeb; } .who.b2 { color:#f7c948; } .row.mine .bubble .who { color:#7ee8c7; }
  .bubble .meta { font-size:10.5px; color:#8696a0; text-align:right; margin-top:2px; }
  .row.mine .bubble .meta { color:#8ad8c3; }
  .bubble img.chatimg { display:block; max-width:240px; max-height:240px; border-radius:8px; margin:2px 0; }
  .bubble audio { display:block; max-width:230px; width:230px; height:40px; margin-top:2px; }
  .sys { align-self:center; font-size:12px; color:#d1d7db; background:#182229; padding:5px 13px; border-radius:12px; margin:5px 0; max-width:88%; text-align:center; }
  .sys.online { color:#7ee8c7; }
  .cantplay { font-size:12.5px; color:#f0b66b; font-style:italic; }
  /* ---- emoji panel ---- */
  #emojiPanel { display:none; padding:8px 10px; background:#202c33; border-top:1px solid #2a3942; flex-wrap:wrap; gap:2px; max-height:168px; overflow-y:auto; }
  #emojiPanel span { font-size:24px; padding:5px 7px; cursor:pointer; border-radius:8px; }
  #emojiPanel span:active { background:#2a3942; }
  /* ---- composer ---- */
  #composer { display:flex; align-items:flex-end; gap:6px; padding:8px 8px; background:#202c33; }
  #textIn { flex:1; padding:12px 14px; font-size:16px; border:none; border-radius:22px; background:#2a3942; color:#e9edef; outline:none; min-width:0; }
  .cbtn { width:46px; height:46px; flex:none; border:none; border-radius:50%; background:#00a884; color:#fff; font-size:19px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .cbtn:active { opacity:.85; }
  .cbtn.ghost { background:transparent; color:#8696a0; width:40px; height:46px; font-size:22px; }
  #micBtn.rec { background:#f15c6d; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.6; } }
  #recBar { display:none; align-items:center; gap:10px; flex:1; padding:0 6px; }
  #recDot { width:12px; height:12px; border-radius:50%; background:#f15c6d; animation:pulse 1s infinite; }
  #recTime { font-size:16px; font-variant-numeric:tabular-nums; }
  #recCancel { margin-left:auto; background:none; border:none; color:#8696a0; font-size:15px; cursor:pointer; }
</style>
</head>
<body>

<div id="chat">
  <div id="topbar">
    <div id="avatar">2U</div>
    <div>
      <div id="roomLabel">Two of Us</div>
      <div id="statusLine"><span class="dot" id="connDot"></span><span id="connText">connecting...</span></div>
    </div>
  </div>
  <div id="msgs"></div>
  <div id="emojiPanel"></div>
  <div id="composer">
    <button class="cbtn ghost" id="emojiBtn" title="Emoji">😊</button>
    <button class="cbtn ghost" id="attachBtn" title="Send image">📎</button>
    <input type="file" id="imgIn" accept="image/*" style="display:none">
    <div id="recBar">
      <span id="recDot"></span>
      <span id="recTime">0:00</span>
      <button id="recCancel">Cancel</button>
    </div>
    <input id="textIn" placeholder="Message (bot 1 / bot 2 to pick one)" autocomplete="off">
    <button class="cbtn" id="micBtn" title="Record voice"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg></button>
    <button class="cbtn" id="sendBtn" title="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M3 20v-6l8-2-8-2V4l19 8z"/></svg></button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var BROKER = "wss://broker.emqx.io:8084/mqtt";
  var client=null, room=null, myName=null, topic=null, joined=false;
  var uid="u"+Math.random().toString(36).slice(2,12);
  var mediaRec=null, recChunks=[], recStart=0, recTimer=null, recMime="";
  var onlineShown={};
  var $=function(id){return document.getElementById(id);};

  function esc(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
  function fmtTime(ts){ var d=new Date(ts); var h=d.getHours(), m=d.getMinutes(); return h+":"+(m<10?"0":"")+m; }
  function fmtDur(sec){ var m=Math.floor(sec/60), s=sec%60; return m+":"+(s<10?"0":"")+s; }
  function scrollBottom(){ var m=$("msgs"); m.scrollTop=m.scrollHeight; }
  function addSys(t, cls){ var d=document.createElement("div"); d.className="sys"+(cls?" "+cls:""); d.textContent=t; $("msgs").appendChild(d); scrollBottom(); }
  function showOnline(name){
    if(onlineShown[name]) return;           // dedupe: one pill per person per session
    onlineShown[name]=true;
    addSys(name+" is online", "online");
  }
  function whoClass(name){ if(name==="BOT 1") return "who b1"; if(name==="BOT 2") return "who b2"; return "who"; }
  function addMsg(m, mine){
    var row=document.createElement("div"); row.className="row"+(mine?" mine":"");
    var b=document.createElement("div"); b.className="bubble";
    var html='<div class="'+whoClass(m.from)+'">'+esc(m.from)+'</div>';
    if(m.type==="text"){
      html+='<div>'+esc(m.body)+'</div>';
    } else if(m.type==="voice"){
      html+='<audio controls preload="auto" src="data:'+m.mime+';base64,'+m.data+'"></audio>';
      if(m.dur) html+='<div style="font-size:11px;color:#8696a0">'+fmtDur(m.dur)+'</div>';
    } else if(m.type==="image"){
      html+='<img class="chatimg" src="data:'+m.mime+';base64,'+m.data+'">';
    }
    html+='<div class="meta">'+fmtTime(m.ts)+(mine?" ✓":"")+'</div>';
    b.innerHTML=html;
    row.appendChild(b);
    $("msgs").appendChild(row); scrollBottom();
    if(m.type==="voice"){
      var a=b.querySelector("audio");
      a.addEventListener("error",function(){
        var note=document.createElement("div"); note.className="cantplay";
        note.textContent="This voice format can't play on this device.";
        b.insertBefore(note, b.querySelector(".meta"));
        a.style.display="none";
      });
    }
  }

  function setConn(on, label){
    $("connDot").className="dot"+(on?" on":"");
    $("connText").textContent=label;
  }

  function publish(obj){
    if(!client || !client.connected) { addSys("Not connected - message not sent"); return false; }
    client.publish(topic, JSON.stringify(obj), {qos:0});
    return true;
  }

  function sendText(){
    var v=$("textIn").value.trim();
    if(!v) return;
    var m={type:"text", from:myName, uid:uid, body:v, ts:Date.now()};
    if(publish(m)){ addMsg(m, true); $("textIn").value=""; $("textIn").focus(); }
  }

  /* ---------- emoji picker ---------- */
  var EMOJIS="😀😄😁🤣😂🙂😉😊😍😘😜🤪🤔🤨😐🙄😴🥳😎🤩😢😭😡🤯🥺😇🤗🫡👍👎🙏👏🙌💪🔥✨🎉🎊❤️💔💯✅❌⚡🌟🍀🌈☀️🌙⭐🍕🍔☕🎂🏏⚽🎮🎵🎶📱💡🚀😹🫂🤝👀💥🎯🏆";
  var panelBuilt=false;
  function toggleEmoji(){
    var p=$("emojiPanel");
    if(!panelBuilt){
      for(var i=0;i<EMOJIS.length;i++){
        (function(ch){
          var s=document.createElement("span"); s.textContent=ch;
          s.addEventListener("click",function(){
            var inp=$("textIn"); inp.value+=ch; inp.focus();
          });
          p.appendChild(s);
        })(EMOJIS[i]);
      }
      panelBuilt=true;
    }
    p.style.display = (p.style.display==="flex") ? "none" : "flex";
  }

  /* ---------- image upload (resized, MQTT-safe) ---------- */
  function sendImage(file){
    if(!file) return;
    if(file.type==="image/gif" && file.size<200000){ return sendRawImage(file); }
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var max=320, w=img.width, h=img.height;
        if(w>h){ if(w>max){ h=Math.round(h*max/w); w=max; } } else { if(h>max){ w=Math.round(w*max/h); h=max; } }
        var cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        var q=0.72, dataUrl=cv.toDataURL("image/jpeg",q);
        while(dataUrl.length>260000 && q>0.3){ q-=0.12; dataUrl=cv.toDataURL("image/jpeg",q); }
        if(dataUrl.length>280000){ addSys("Image too large even after resize - try a smaller one"); return; }
        var m={type:"image", from:myName, uid:uid, mime:"image/jpeg", data:dataUrl.split(",")[1], ts:Date.now()};
        if(publish(m)) addMsg(m, true);
      };
      img.onerror=function(){ addSys("Couldn't read that image"); };
      img.src=String(fr.result);
    };
    fr.readAsDataURL(file);
  }
  function sendRawImage(file){
    var fr=new FileReader();
    fr.onload=function(){
      var m={type:"image", from:myName, uid:uid, mime:file.type, data:String(fr.result).split(",")[1], ts:Date.now()};
      if(publish(m)) addMsg(m, true);
    };
    fr.readAsDataURL(file);
  }

  /* ---------- voice ---------- */
  function pickMime(){
    if(!window.MediaRecorder) return null;
    var cands=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/aac","audio/ogg;codecs=opus"];
    for(var i=0;i<cands.length;i++){ if(MediaRecorder.isTypeSupported(cands[i])) return cands[i]; }
    return "";
  }
  function startRec(){
    if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      addSys("Mic needs the secure (https) version of this page - open the hosted link for voice notes");
      return;
    }
    if(!window.MediaRecorder){ addSys("Voice recording not supported in this browser"); return; }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      recMime=pickMime();
      try{ mediaRec=new MediaRecorder(stream, recMime?{mimeType:recMime}:undefined); }
      catch(e){ mediaRec=new MediaRecorder(stream); recMime=""; }
      recChunks=[];
      mediaRec.ondataavailable=function(ev){ if(ev.data && ev.data.size) recChunks.push(ev.data); };
      mediaRec.onstop=function(){
        stream.getTracks().forEach(function(t){t.stop();});
        var dur=Math.round((Date.now()-recStart)/1000);
        hideRec();
        if(dur<1){ addSys("Too short - hold the mic a little longer"); return; }
        var blob=new Blob(recChunks, {type:mediaRec.mimeType||recMime||"audio/webm"});
        if(blob.size>700000){ addSys("Voice note too long (keep under ~60s)"); return; }
        var fr=new FileReader();
        fr.onload=function(){
          var b64=String(fr.result).split(",")[1];
          var m={type:"voice", from:myName, uid:uid, mime:blob.type, data:b64, dur:dur, ts:Date.now()};
          if(publish(m)) addMsg(m, true);
        };
        fr.readAsDataURL(blob);
      };
      mediaRec.start(250);
      recStart=Date.now();
      showRec();
    }).catch(function(err){
      addSys("Microphone permission needed for voice notes - tap the mic and allow access");
    });
  }
  function stopRec(){ if(mediaRec && mediaRec.state!=="inactive") mediaRec.stop(); }
  function cancelRec(){
    if(mediaRec && mediaRec.state!=="inactive"){ mediaRec.ondataavailable=null; mediaRec.onstop=function(){}; mediaRec.stop(); }
    hideRec(); addSys("Recording cancelled");
  }
  function showRec(){
    $("recBar").style.display="flex"; $("textIn").style.display="none";
    $("micBtn").classList.add("rec");
    recTimer=setInterval(function(){
      var s=Math.floor((Date.now()-recStart)/1000);
      $("recTime").textContent=fmtDur(s);
      if(s>=60){ stopRec(); }
    },250);
  }
  function hideRec(){
    clearInterval(recTimer);
    $("recBar").style.display="none"; $("textIn").style.display="";
    $("micBtn").classList.remove("rec"); $("recTime").textContent="0:00";
  }

  /* ---------- join ---------- */
  function join(roomCode, name){
    if(typeof mqtt==="undefined"){ addSys("Couldn't load the chat library - check internet and reload"); return; }
    room=roomCode.toLowerCase().replace(/\s+/g,"-");
    myName=name.slice(0,24);
    topic="twoofus/v1/"+room+"/chat";
    $("roomLabel").textContent="Two of Us · "+room;
    document.title="Two of Us - "+room;
    var cid="twoofus-"+Math.random().toString(36).slice(2,12);
    client=mqtt.connect(BROKER,{clientId:cid, keepalive:30, reconnectPeriod:2000, connectTimeout:10000, clean:true});
    client.on("connect",function(){
      client.subscribe(topic,{qos:0},function(err){
        if(err){ setConn(false,"subscribe failed - retrying"); return; }
        setConn(true,"BOT 1 · BOT 2 online");
        if(!joined){ joined=true;
          addSys("You joined as "+myName+". BOT 1 and BOT 2 are live - say hi! Type 'bot 1 ...' or 'bot 2 ...' to talk to just one.");
          publish({type:"sys-join", from:myName, uid:uid, ts:Date.now()}); }
      });
    });
    client.on("reconnect",function(){ setConn(false,"reconnecting..."); });
    client.on("offline",function(){ setConn(false,"offline - reconnecting..."); });
    client.on("error",function(){ setConn(false,"connection problem - retrying"); });
    client.on("message",function(t,payload){
      if(t!==topic) return;
      var m; try{ m=JSON.parse(payload.toString()); }catch(e){ return; }
      if(!m || !m.from) return;
      if(m.uid===uid) return;
      if(m.type==="sys-join"){ showOnline(m.from); return; }
      if(m.type==="text"||m.type==="voice"||m.type==="image") addMsg(m,false);
    });
  }

  // AUTO-LOGIN (owner order 19:13): room + name embedded, he fills nothing.
  var AUTO_ROOM="123987", AUTO_NAME="Jegan";
  window.addEventListener("load", function(){ join(AUTO_ROOM, AUTO_NAME); });

  $("sendBtn").addEventListener("click", sendText);
  $("textIn").addEventListener("keydown", function(e){ if(e.key==="Enter") sendText(); });
  $("emojiBtn").addEventListener("click", toggleEmoji);
  $("attachBtn").addEventListener("click", function(){ $("imgIn").click(); });
  $("imgIn").addEventListener("change", function(){ sendImage(this.files[0]); this.value=""; });
  $("micBtn").addEventListener("click", function(){
    if(mediaRec && mediaRec.state!=="inactive") stopRec(); else startRec();
  });
  $("recCancel").addEventListener("click", cancelRec);
})();
</script>
</body>
</html>
