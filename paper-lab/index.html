<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JK Paper Lab - Solana 2x/3x/5x</title>
<style>

details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}summary{cursor:pointer;font-weight:600;font-size:13px}details>div{margin-top:8px}

select.sel{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px}

.sc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}.sc small{display:block;color:var(--mut);font-size:10px;text-transform:uppercase}.sc span{font-size:16px;font-weight:700}

.bWIN{background:#123524;color:var(--g)}.bLOSS{background:#3a1a22;color:var(--r)}.bRUG{background:#3a1a22;color:#ff8fa0;border:1px solid var(--r)}.bTIME{background:#2b2f36;color:var(--mut)}.bTP{background:#1f3b2f;color:var(--g)}

</style></head><body>
<div class="top"><div class="row"><div class="ttl">JK <b>Paper Lab</b> <span class="badge">PAPER ONLY</span></div><button class="btn s" onclick="side(1)">&#9776;</button></div>

<div class="eq"><div class="box"><small>Profit Bank</small><span id="hBank" class="y">-</span></div><div class="box"><small>Total P&amp;L</small><span id="hPnl">-</span></div><div class="box"><small>Cash</small><span id="hCash">-</span></div></div>

<div class="pg" id="p2"><div class="ctrl"><input class="search" id="cSearch" placeholder="Search closed..." oninput="renderClosed()"><select class="sel" id="cSort" onchange="renderClosed()"><option value="new">Newest</option><option value="pnl">P&amp;L</option><option value="mult">Multiple</option><option value="peak">Peak</option></select></div><div class="flt" id="cFlt"><button data-f="all" class="on">All</button><button data-f="win">Wins</button><button data-f="loss">Losses</button><button data-f="rug">Rugs</button><button data-f="2x">2x+</button><button data-f="3x">3x+</button><button data-f="5x">5x+</button></div><div id="closed"></div></div>
<div class="pg" id="p3"><div class="bank"><small class="m">PROFIT BANK (profit from winning closed trades)</small><span id="bBank">-</span></div><div id="bank"></div></div>
<div class="tabs"><button class="on" data-t="0">Radar</button><button data-t="1">Open<span class="cnt" id="cntOpen" style="display:none"></span></button><button data-t="2">Closed</button><button data-t="3">Bank</button></div>

<div id="sysIn"></div>
<label>Paper start capital $</label><input id="cStart" type="number"><label>Bet per coin $</label><input id="cBet" type="number"><label>Max open positions</label><input id="cMax" type="number"><label>Min score to auto-buy (0-100)</label><input id="cMin" type="number">
<label>Data mode</label><button class="btn s" id="cMode" onclick="toggleMode()" style="width:100%"></button>
<label>Auto paper-buy (phone mode)</label><button class="btn s" id="cAuto" onclick="toggleAuto()" style="width:100%"></button>
<label>Alerts on this page (sound + vibration)</label><button class="btn s" id="cAlert" onclick="toggleAlert()" style="width:100%"></button>
<div style="margin-top:14px"><button class="btn" onclick="saveCfg()">Save</button> <button class="btn s" onclick="scan()">Scan now</button></div>
<div style="margin-top:10px"><button class="btn s" onclick="exportJ()">Export JSON</button> <button class="btn s" onclick="exportCSV()">Export CSV (Excel)</button></div>
<div style="margin-top:14px"><button class="btn d" onclick="resetAll()">Reset book</button></div>
<details style="margin-top:12px"><summary>How the engine picks coins</summary><div class="m" style="font-size:12px" id="gatesTxt"></div></details>
<p class="m" style="font-size:11px">Paper money only. No wallet, no keys, no real trades. Fills include 3% simulated slippage/fees.</p></div>
<script>
// ===== ENGINE (pure, testable) =====
const CFG_DEFAULT={start:500,bet:20,maxOpen:10,friction:0.03,auto:true,minScore:62,
 minLiq:8000,maxMc:3000000,minAgeMin:8,maxAgeH:36,stop:0.70,tp2:0.40,tp3:0.30,timeStopH:12,rugLiq:3000,scanSec:45};
function pickPair(pairs){let b=null;for(const p of pairs||[]){if(p.chainId!=='solana')continue;if(!b||(p.liquidity&&p.liquidity.usd||0)>(b.liquidity&&b.liquidity.usd||0))b=p;}return b}
function evalCoin(p,C,now){
 const liq=p.liquidity&&p.liquidity.usd||0,mc=p.marketCap||p.fdv||0,vol=p.volume||{},tx=p.txns||{},pc=p.priceChange||{};
 const ageMin=p.pairCreatedAt?(now-p.pairCreatedAt)/60000:null;
 const m5b=tx.m5?tx.m5.buys:0,m5s=tx.m5?tx.m5.sells:0,h1b=tx.h1?tx.h1.buys:0,h1s=tx.h1?tx.h1.sells:0;
 const buy5=(m5b+m5s)?m5b/(m5b+m5s):0.5,buy1=(h1b+h1s)?h1b/(h1b+h1s):0.5;
 const gates=[];
 gates.push(['Liquidity >= $'+C.minLiq,liq>=C.minLiq]);
 gates.push(['MCap <= $'+(C.maxMc/1e6)+'M',mc>0&&mc<=C.maxMc]);
 gates.push(['Age '+C.minAgeMin+'m-'+C.maxAgeH+'h',ageMin!==null&&ageMin>=C.minAgeMin&&ageMin<=C.maxAgeH*60]);
 gates.push(['Buys > sells (5m)',buy5>=0.55]);
 gates.push(['Not already vertical (1h < +400%)',(pc.h1||0)<400]);
 gates.push(['Liq/MCap >= 4%',mc>0&&liq/mc>=0.04]);
 const pass=gates.every(g=>g[1]);
 // headroom: how far mcap can plausibly run (target ceiling $5M)
 const headroom=mc>0?Math.min(10,5e6/mc):0;
 let s=0;const why=[];
 const mom=Math.max(0,Math.min(1,((pc.m5||0)+5)/30)); s+=mom*20; if(pc.m5>3)why.push('5m +'+Math.round(pc.m5)+'%');
 const hm=(pc.h1||0); const h1s_=hm>=10&&hm<=150?1:hm>150&&hm<400?0.5:hm>0?0.4:0; s+=h1s_*15; if(hm>=10)why.push('1h +'+Math.round(hm)+'%');
 s+=Math.max(0,Math.min(1,(buy5-0.5)/0.3))*15; if(buy5>=0.6)why.push('buyers '+Math.round(buy5*100)+'% (5m)');
 s+=Math.max(0,Math.min(1,(buy1-0.5)/0.25))*8;
 const turn=liq?(vol.h1||0)/liq:0; s+=Math.max(0,Math.min(1,turn/3))*12; if(turn>=1)why.push('vol/liq '+turn.toFixed(1)+'x');
 s+=Math.max(0,Math.min(1,(headroom-1)/4))*15; if(headroom>=3)why.push('room to '+headroom.toFixed(1)+'x');
 s+=Math.max(0,Math.min(1,(Math.log10(Math.max(liq,1))-3.8)/1.2))*10;
 const txc=(tx.m5?tx.m5.buys+tx.m5.sells:0); s+=Math.max(0,Math.min(1,txc/150))*5;
 if(ageMin!==null&&ageMin<20)s-=6; // very new = riskier
 s=Math.round(Math.max(0,Math.min(100,s)));
 let tier=null;
 if(headroom>=5&&s>=C.minScore+6)tier='5x';else if(headroom>=3&&s>=C.minScore)tier='3x';else if(headroom>=2&&s>=C.minScore-6)tier='2x';
 return {score:s,tier,headroom,gates,pass,why,liq,mc,ageMin,buy5,price:parseFloat(p.priceUsd)||0};
}
function newPos(coin,price,C,now,tier,score){
 const eff=price*(1+C.friction),cost=C.bet;
 return {id:coin.mint+'_'+now,mint:coin.mint,sym:coin.sym,name:coin.name,entry:price,entryEff:eff,entryTime:now,cost,units:cost/eff,rem:cost/eff,
  banked:0,tp2:false,tp3:false,tp5:false,peak:1,stop:C.stop,tier,score,open:true,last:price,mult:1,events:[{t:now,e:'BUY',m:1,u:cost}]};
}
// manage one position given fresh price/liq; returns array of events, mutates pos
function managePos(pos,price,liq,now,C){
 const ev=[];if(!pos.open||!(price>0))return ev;
 pos.last=price;pos.mult=price/pos.entry;if(pos.mult>pos.peak)pos.peak=pos.mult;
 const sell=(frac,why)=>{const u=pos.rem*frac;const v=u*price*(1-C.friction);pos.rem-=u;pos.banked+=v;ev.push({t:now,e:why,m:pos.mult,u:v});};
 const closeAll=(why,val)=>{const v=val===undefined?pos.rem*price*(1-C.friction):val;pos.banked+=v;pos.rem=0;pos.open=false;pos.exitTime=now;pos.reason=why;pos.exitMult=pos.mult;ev.push({t:now,e:why,m:pos.mult,u:v});};
 if(liq!==null&&liq<C.rugLiq){closeAll('RUG',0);}
 else{
  if(pos.mult>=2&&!pos.tp2){pos.tp2=true;sell(C.tp2,'TP 2x');pos.stop=Math.max(pos.stop,1.0);}
  if(pos.mult>=3&&!pos.tp3){pos.tp3=true;sell(C.tp3/(1-C.tp2),'TP 3x');pos.stop=Math.max(pos.stop,2.0);}
  if(pos.mult>=5&&!pos.tp5&&pos.open){pos.tp5=true;closeAll('TP 5x');}
  if(pos.open&&pos.tp2){pos.stop=Math.max(pos.stop,pos.peak*0.65>=1?pos.peak*0.65:pos.stop);}
  if(pos.open&&pos.mult<=pos.stop){closeAll(pos.tp2?'TRAIL/BE STOP':'STOP');}
  else if(pos.open&&(now-pos.entryTime)/3600000>=C.timeStopH&&pos.mult<1.3){closeAll('TIME STOP');}
 }
 pos.pnl=pos.banked+(pos.open?pos.rem*price*(1-C.friction):0)-pos.cost;
 return ev;
}
function summarize(st){
 let cash=st.cfg.start,openVal=0,realised=0,bank=0;
 for(const p of st.pos){cash-=p.cost;cash+=p.banked;if(p.open)openVal+=p.rem*p.last*(1-st.cfg.friction);
  if(!p.open){const r=p.banked-p.cost;realised+=r;if(r>0)bank+=r;}}
 return {cash,openVal,equity:cash+openVal,realised,bank,pnl:cash+openVal-st.cfg.start};
}
function dayKey(t){return new Date(t).toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'})}
function dayWise(st){const m={};for(const p of st.pos)if(!p.open){const d=dayKey(p.exitTime);m[d]=m[d]||{pnl:0,n:0,w:0};const r=p.banked-p.cost;m[d].pnl+=r;m[d].n++;if(r>0)m[d].w++;}return m}
// ===== DATA + UI =====
const KEY='jkpl_v1',DX='https://api.dexscreener.com';
const SRV='https://paper-lab.jegankumarsparks.workers.dev/api/book';let MODE=localStorage.getItem('jkpl_mode')||'server';let PH=load();let ST=PH;let RADAR=[];let FIL='all',CFIL='all',lastScan=0,scanning=false,errs=0,lastErr='';
let POST={};try{POST=JSON.parse(localStorage.getItem('jkpl_post')||'{}')}catch(e){POST={}}
let ALERTS=localStorage.getItem('jkpl_alerts')!=='off';
let lastPostCheck=0,closedShown=60,prevLastScan=0,lastPoll=0;
let WL={};try{WL=JSON.parse(localStorage.getItem('jkpl_wl')||'{}')}catch(e){WL={}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.pos)return Object.assign({cfg:{...CFG_DEFAULT},seen:{}},s,{cfg:Object.assign({},CFG_DEFAULT,s.cfg)})}catch(e){}return {cfg:{...CFG_DEFAULT},pos:[],seen:{},created:Date.now(),log:[]}}
function save(){if(MODE==='server')return;localStorage.setItem(KEY,JSON.stringify(ST))}
function savePost(){try{localStorage.setItem('jkpl_post',JSON.stringify(POST))}catch(e){}}
function saveWL(){try{localStorage.setItem('jkpl_wl',JSON.stringify(WL))}catch(e){}}
function toggleWL(m,ev){ev.stopPropagation();if(WL[m])delete WL[m];else WL[m]=1;saveWL();renderRadar()}
function copyCA(m,btn){const done=()=>{btn.textContent='Copied!';setTimeout(()=>{btn.textContent='Copy CA'},1500)};

 cl.forEach((p,i)=>{cum+=p.pnl;pts.push([i+1,cum]);if(cum<min)min=cum;if(cum>max)max=cum});
 const W=300,H=80,pad=6,rng=Math.max(1,max-min);
 const xy=pts.map(pt=>{const x=pad+pt[0]/(pts.length-1)*(W-2*pad);const y=H-pad-(pt[1]-min)/rng*(H-2*pad);return x.toFixed(1)+','+y.toFixed(1)}).join(' ');
 const baseY=H-pad-(ST.cfg.start-min)/rng*(H-2*pad);
 return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:80px" preserveAspectRatio="none"><line x1="0" y1="'+baseY.toFixed(1)+'" x2="'+W+'" y2="'+baseY.toFixed(1)+'" stroke="#848e9c" stroke-width="0.5" stroke-dasharray="3,3"/><polyline points="'+xy+'" fill="none" stroke="'+(cum>=ST.cfg.start?'#0ecb81':'#f6465d')+'" stroke-width="1.8"/></svg><div class="row" style="font-size:10px;color:var(--mut)"><span>'+esc(dayKey(cl[0].exitTime))+'</span><span>dashed = $'+ST.cfg.start+' start</span><span>now '+usd(cum,0)+'</span></div>'}
function dchart(dw,days){const ds=days.slice(0,14).reverse();if(!ds.length)return '<p class="m" style="font-size:12px">No closed trades yet.</p>';
 const mx=Math.max(...ds.map(d=>Math.abs(dw[d].pnl)),1);
 return '<div class="dchart">'+ds.map(d=>{const v=dw[d].pnl,h=Math.max(2,Math.abs(v)/mx*70);return '<div class="dbar" title="'+d+': '+usd(v)+'"><i style="height:'+h+'px;background:'+(v>=0?'var(--g)':'var(--r)')+'"></i><small>'+d.slice(5)+'</small></div>'}).join('')+'</div>'}
function hallOfFame(){const cl=ST.pos.filter(p=>!p.open&&p.peak>=2).sort((a,b)=>b.peak-a.peak).slice(0,10);
 if(!cl.length)return '<p class="m" style="font-size:12px">No 2x+ hits yet. They land here with proof multiples.</p>';
 const medal=i=>i===0?'#fcd535':i===1?'#c0c0c0':i===2?'#cd7f32':'#2b2f36';
 return cl.map((p,i)=>'<div class="fame" onclick="coinSheet(\''+p.mint+'\')"><span class="medal" style="background:'+medal(i)+';color:'+(i<3?'#000':'#848e9c')+'">'+(i+1)+'</span><b>'+esc(p.sym)+'</b><span class="y" style="font-weight:800">'+p.peak.toFixed(2)+'x peak</span><span class="m" style="margin-left:auto">'+usd(p.pnl||0)+' banked</span></div>').join('')}
function rugReport(){const rugs=ST.pos.filter(p=>!p.open&&(p.reason||'')==='RUG');
 const lost=rugs.reduce((s,p)=>s+(p.cost-p.banked),0);
 const gated=RADAR.filter(c=>!c.e.pass).length;
 return '<div class="grid3"><div class="sc"><small>Rugs hit</small><span class="r">'+rugs.length+'</span></div><div class="sc"><small>Lost to rugs</small><span class="r">'+usd(lost,0)+'</span></div><div class="sc"><small>Risky gated now</small><span class="y">'+gated+'</span></div></div>'
 +(rugs.length?'<div style="margin-top:6px">'+rugs.slice(-8).reverse().map(p=>'<div class="fame" onclick="coinSheet(\''+p.mint+'\')"><span class="badge2 bRUG">RUG</span><b>'+esc(p.sym)+'</b><span class="m">'+fmtAgo(p.exitTime)+'</span><span class="r" style="margin-left:auto">'+usd(p.pnl||0)+'</span></div>').join('')+'</div>':'')}
function tierStats(){const t={};ST.pos.filter(p=>!p.open).forEach(p=>{const k=p.tier;t[k]=t[k]||{n:0,w:0,x2:0,x3:0,x5:0};t[k].n++;if(p.banked>p.cost)t[k].w++;if(p.tp2)t[k].x2++;if(p.tp3)t[k].x3++;if(p.tp5)t[k].x5++});
 const ks=Object.keys(t);return '<table><tr><th>Tier</th><th>N</th><th>Win</th><th>2x</th><th>3x</th><th>5x</th></tr>'+(ks.map(k=>'<tr><td>'+k+'</td><td>'+t[k].n+'</td><td>'+t[k].w+'</td><td>'+t[k].x2+'</td><td>'+t[k].x3+'</td><td>'+t[k].x5+'</td></tr>').join('')||'<tr><td colspan=6 class="m">Need closed trades</td></tr>')+'</table>'}
function activity(){const evs=[];for(const p of ST.pos)for(const e of (p.events||[]))evs.push({t:e.t,sym:p.sym,e:e.e,m:e.m,u:e.u,mint:p.mint});
 evs.sort((a,b)=>b.t-a.t);if(!evs.length)return '<p class="m" style="font-size:12px">No events yet.</p>';
 const ic=e=>e==='BUY'?'&#128994;':e.indexOf('TP')===0?'&#128993;':e==='RUG'?'&#9899;':e.indexOf('TIME')===0?'&#9200;':'&#128308;';
 return evs.slice(0,15).map(x=>'<div class="fame" onclick="coinSheet(\''+x.mint+'\')">'+ic(x.e)+' <b>'+esc(x.sym)+'</b> <span>'+esc(x.e)+' @ '+x.m.toFixed(2)+'x</span><span class="m" style="margin-left:auto">'+usd(x.u)+' &middot; '+fmtAgo(x.t)+'</span></div>').join('')}
function reasonStats(){const t={};ST.pos.filter(p=>!p.open).forEach(p=>{const k=p.reason||'CLOSED';t[k]=t[k]||{n:0,pnl:0};t[k].n++;t[k].pnl+=p.pnl||0});
 const ks=Object.keys(t).sort((a,b)=>t[b].n-t[a].n);return '<table><tr><th>Exit reason</th><th>N</th><th>Total P&amp;L</th><th>Avg</th></tr>'+(ks.map(k=>'<tr><td>'+esc(k)+'</td><td>'+t[k].n+'</td><td class="'+cls(t[k].pnl)+'">'+usd(t[k].pnl)+'</td><td class="'+cls(t[k].pnl/t[k].n)+'">'+usd(t[k].pnl/t[k].n,0)+'</td></tr>').join('')||'<tr><td colspan=4 class="m">-</td></tr>')+'</table>'}
function hourStats(){const h={};ST.pos.filter(p=>!p.open).forEach(p=>{const k=new Date(p.entryTime).toLocaleString('en-US',{timeZone:'Asia/Kolkata',hour:'2-digit',hour12:false});h[k]=h[k]||{n:0,pnl:0};h[k].n++;h[k].pnl+=p.pnl||0});
 const ks=Object.keys(h).sort();return '<table><tr><th>Entry hour (IST)</th><th>Trades</th><th>P&amp;L</th></tr>'+(ks.map(k=>'<tr><td>'+k+':00</td><td>'+h[k].n+'</td><td class="'+cls(h[k].pnl)+'">'+usd(h[k].pnl)+'</td></tr>').join('')||'<tr><td colspan=3 class="m">-</td></tr>')+'</table>'}
function postWatch(){const cl=ST.pos.filter(p=>POST[p.id]);if(!cl.length)return '<p class="m" style="font-size:12px">No closed coins in the 24h watch window yet. When a trade closes, its after-exit peak is tracked here for 24h.</p>';
 let up=0,down=0;cl.forEach(p=>{const r=POST[p.id];if(r.peak>p.exitMult*1.05)up++;else if(r.peak<p.exitMult*0.95)down++});
 return '<div class="grid3"><div class="sc"><small>Tracked</small><span>'+cl.length+'</span></div><div class="sc"><small>Ran higher</small><span class="y">'+up+'</span></div><div class="sc"><small>Faded</small><span class="g">'+down+'</span></div></div>'+cl.sort((a,b)=>(POST[b.id].peak-b.exitMult)-(POST[a.id].peak-a.exitMult)).slice(0,10).map(p=>'<div class="fame" onclick="coinSheet(\''+p.mint+'\')"><b>'+esc(p.sym)+'</b><span class="m"> exit '+p.exitMult.toFixed(2)+'x</span><span class="'+(POST[p.id].peak>p.exitMult?'y':'g')+'" style="margin-left:auto">peak '+POST[p.id].peak.toFixed(2)+'x</span></div>').join('')}
function renderBank(){
 const s=summarize(ST),dw=dayWise(ST),days=Object.keys(dw).sort().reverse();tween($('bBank'),s.bank,v=>usd(v));
 const today=dayKey(Date.now());const td=dw[today]||{pnl:0,n:0,w:0};
 let mo={};days.forEach(d=>{const k=d.slice(0,7);mo[k]=(mo[k]||0)+dw[d].pnl});
 const sc=scorecard();
 $('bank').innerHTML='<div class="eq"><div class="box"><small>Today</small><span class="'+cls(td.pnl)+'">'+usd(td.pnl)+'</span></div><div class="box"><small>Realised</small><span class="'+cls(s.realised)+'">'+usd(s.realised)+'</span></div><div class="box"><small>Win rate</small><span class="'+(sc.wr>=50?'g':'y')+'">'+sc.wr+'%</span></div></div>'
 +'<details open><summary>Scorecard</summary><div class="grid3" style="margin-top:8px">'
 +'<div class="sc"><small>Trades</small><span>'+sc.n+'</span></div><div class="sc"><small>Wins</small><span class="g">'+sc.w+'</span></div><div class="sc"><small>Win rate</small><span>'+sc.wr+'%</span></div>'
 +'<div class="sc"><small>Best trade</small><span class="g">'+(sc.best?usd(sc.best.pnl):'-')+'</span></div><div class="sc"><small>Worst trade</small><span class="r">'+(sc.worst?usd(sc.worst.pnl):'-')+'</span></div><div class="sc"><small>Avg hold</small><span>'+fmtDur(sc.hold)+'</span></div>'
 +'<div class="sc"><small>Avg win</small><span class="g">'+usd(sc.avgW)+'</span></div><div class="sc"><small>Avg loss</small><span class="r">-'+usd(sc.avgL)+'</span></div><div class="sc"><small>Profit factor</small><span>'+(sc.pf>=99?'99+':sc.pf.toFixed(2))+'</span></div>'
 +'<div class="sc"><small>2x hit</small><span class="g">'+sc.x2+'</span></div><div class="sc"><small>3x hit</small><span class="y">'+sc.x3+'</span></div><div class="sc"><small>5x hit</small><span class="p">'+sc.x5+'</span></div>'
 +'<div class="sc"><small>Streak</small><span class="'+(sc.streak.sign>0?'g':'r')+'">'+sc.streak.n+(sc.streak.sign>0?'W':'L')+'</span></div><div class="sc"><small>Best streak</small><span class="g">'+sc.longW+'W</span></div><div class="sc"><small>Rugs</small><span class="r">'+sc.rugs+'</span></div></div></details>'
 +'<details open><summary>Equity curve (from day 1)</summary><div class="ecurve" style="margin-top:8px">'+ecurve()+'</div></details>'
 +'<details open><summary>Day-wise profit (IST)</summary><div style="margin-top:8px">'+dchart(dw,days)+'</div><table><tr><th>Day</th><th>Trades</th><th>Wins</th><th>P&amp;L</th></tr>'+(days.map(d=>'<tr><td>'+d+(d===today?' (today)':'')+'</td><td>'+dw[d].n+'</td><td>'+dw[d].w+'</td><td class="'+cls(dw[d].pnl)+'">'+usd(dw[d].pnl)+'</td></tr>').join('')||'<tr><td colspan=4 class="m">No closed trades yet</td></tr>')+'</table>'
 +'<h4 style="margin:10px 0 4px">Month-wise</h4><table>'+(Object.keys(mo).map(k=>'<tr><td>'+k+'</td><td class="'+cls(mo[k])+'">'+usd(mo[k])+'</td></tr>').join('')||'<tr><td class="m">-</td></tr>')+'</table></details>'
 +'<details open><summary>Hall of Fame (2x+ hits)</summary><div style="margin-top:8px">'+hallOfFame()+'</div></details>'
 +'<details><summary>Rug Report</summary><div style="margin-top:8px">'+rugReport()+'</div></details>'
 +'<details><summary>Latest activity</summary><div style="margin-top:8px">'+activity()+'</div></details>'
 +'<details><summary>Exit reasons</summary><div style="margin-top:8px">'+reasonStats()+'</div></details>'
 +'<details><summary>Entry hour performance (IST)</summary><div style="margin-top:8px">'+hourStats()+'</div></details>'
 +'<details><summary>After-exit watch (24h)</summary><div style="margin-top:8px">'+postWatch()+'</div></details>'
 +'<details><summary>Hit rate by tier</summary><div style="margin-top:8px">'+tierStats()+'</div></details>'
}
function renderSys(){
 $('sysIn').innerHTML='<div class="note" style="margin-top:10px"><b>Mode: '+(MODE==='server'?'24/7 SERVER':'PHONE')+'</b><br>'+(MODE==='server'?'A Cloudflare cron scans every 2 minutes even when this page is closed; this page just displays the server book.':'This page scans Dexscreener every '+ST.cfg.scanSec+'s while open. When closed, prices are NOT tracked.')+'</div>'
 +'<div class="note">Last scan: '+(lastScan?new Date(lastScan).toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata'}):'never')+'<br>Book started: '+(ST.created?new Date(ST.created).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'})+' ('+((Date.now()-ST.created)/86400000).toFixed(1)+' days running)':'-')+'<br>Total positions: '+ST.pos.length+' | Coins on radar: '+RADAR.length+' | Errors in a row: '+errs+(lastErr?'<br>Last error: '+esc(lastErr):'')+'<br>Auto-buy: <b>'+(ST.cfg.auto?'ON':'OFF')+'</b> | min score '+ST.cfg.minScore+' | bet '+usd(ST.cfg.bet,0)+' | max open '+ST.cfg.maxOpen+'</div>';
 $('gatesTxt').textContent='Gates for auto-buy: liq >= $'+ST.cfg.minLiq+', MC <= $'+(ST.cfg.maxMc/1e6)+'M, age 8m-36h, 5m buyers >= 55%, 1h change < +400%, liq/MC >= 4%. Score blends 5m/1h momentum, buy pressure, volume/liquidity turnover, headroom to $5M MC and liquidity depth. Potential tier: 5x needs >=5x headroom, 3x >=3x, 2x >=2x. Scores are heuristics, not predictions.'}
function coinSheet(m){
 const c=RADAR.find(x=>x.mint===m),pos=ST.pos.filter(x=>x.mint===m);let h;
 if(c){const e=c.e,p=c.pair;h='<div class="row"><h3 style="margin:0">'+esc(c.name)+' <span class="m">'+esc(c.sym)+'</span></h3><button class="btn s" onclick="closeSheet()">X</button></div>'+pill(e.tier)
  +'<div class="kv" style="font-size:13px"><span>Price <b>$'+px(e.price)+'</b></span><span>MC <b>$'+short(e.mc)+'</b></span><span>Liq <b>$'+short(e.liq)+'</b></span><span>Vol 1h <b>$'+short(p.volume&&p.volume.h1||0)+'</b></span><span>Buyers 5m <b>'+Math.round(e.buy5*100)+'%</b></span><span>Headroom <b>'+e.headroom.toFixed(1)+'x</b> to $5M</span><span>5m '+pcol(p.priceChange&&p.priceChange.m5)+'</span><span>1h '+pcol(p.priceChange&&p.priceChange.h1)+'</span><span>6h '+pcol(p.priceChange&&p.priceChange.h6)+'</span><span>24h '+pcol(p.priceChange&&p.priceChange.h24)+'</span></div>'
  +'<p class="m">'+(e.why.length?'Why: '+esc(e.why.join(', ')):'No strong signal')+'</p>'
  +e.gates.map(g=>'<div class="ev">'+(g[1]?'<span class="g">PASS</span>':'<span class="r">FAIL</span>')+' '+esc(g[0])+'</div>').join('')
  +'<div style="margin-top:10px"><button class="btn" onclick="manualBuy(\''+m+'\')">Paper buy '+usd(ST.cfg.bet,0)+'</button></div>'}
 else{const p0=pos[0];h='<div class="row"><h3 style="margin:0">'+esc(p0.name||p0.sym)+'</h3><button class="btn s" onclick="closeSheet()">X</button></div>'}
 h+=links(m)+'<div style="margin-top:8px"><button class="btn s" onclick="copyCA(\''+m+'\',this)">Copy CA</button></div><p class="m" style="word-break:break-all;font-size:11px">'+m+'</p>';
 pos.slice().reverse().forEach(p=>{h+='<div class="coin" style="margin-top:10px"><div class="row"><b>'+(p.open?'OPEN':esc(p.reason))+'</b><b class="'+cls(p.pnl||0)+'">'+usd(p.pnl||0)+' ('+p.mult.toFixed(2)+'x)</b></div><div class="kv"><span>Bought <b>'+new Date(p.entryTime).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'})+'</b></span><span>Entry <b>$'+px(p.entry)+'</b></span><span>Cost <b>'+usd(p.cost)+'</b></span><span>Banked <b>'+usd(p.banked)+'</b></span><span>Peak <b>'+p.peak.toFixed(2)+'x</b></span><span>Stop <b>'+p.stop.toFixed(2)+'x</b></span><span>Held <b>'+fmtDur(((p.open?Date.now():p.exitTime)||p.entryTime)-p.entryTime)+'</b></span>'+(p.exitTime?'<span>Exit <b>'+new Date(p.exitTime).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'})+'</b></span>':'')+(!p.open?postLine(p):'')+'</div>'+p.events.map(e=>'<div class="ev">'+new Date(e.t).toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata'})+' - '+esc(e.e)+' @ '+e.m.toFixed(2)+'x ('+usd(e.u)+')</div>').join('')+(p.open?'<div style="margin-top:8px"><button class="btn d" onclick="sellNow(\''+p.id+'\')">Paper sell all now</button></div>':'')+'</div>'});
 $('sheetc').innerHTML=h;$('sheet').classList.add('on')
}
function render(){summaryHdr();renderRadar();renderOpen();renderClosed();renderBank();renderSys()}
function tab(i){document.querySelectorAll('.tabs button').forEach((b,j)=>b.classList.toggle('on',j==i));document.querySelectorAll('.pg').forEach((p,j)=>p.classList.toggle('on',j==i));scrollTo(0,0)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(+b.dataset.t));
document.querySelectorAll('#p0 .flt button').forEach(b=>b.onclick=()=>{FIL=b.dataset.f;document.querySelectorAll('#p0 .flt button').forEach(x=>x.classList.toggle('on',x===b));renderRadar()});
function side(o){$('side').classList.toggle('on',!!o);if(o){$('cStart').value=ST.cfg.start;$('cBet').value=ST.cfg.bet;$('cMax').value=ST.cfg.maxOpen;$('cMin').value=ST.cfg.minScore;$('cAuto').textContent='Auto-buy: '+(ST.cfg.auto?'ON':'OFF');$('cMode').textContent='Mode: '+(MODE==='server'?'24/7 SERVER':'PHONE (page open)')+' - tap to switch';$('cAlert').textContent='Alerts: '+(ALERTS?'ON':'OFF')}}
function toggleMode(){setMode(MODE==='server'?'phone':'server')}
function toggleAuto(){if(MODE==='server')return;ST.cfg.auto=!ST.cfg.auto;$('cAuto').textContent='Auto-buy: '+(ST.cfg.auto?'ON':'OFF');save()}
function saveCfg(){if(MODE==='server'){alert('Settings apply to Phone mode. The 24/7 server uses its defaults.');return}const n=(i,d)=>{const v=parseFloat($(i).value);return v>0?v:d};ST.cfg.start=n('cStart',500);ST.cfg.bet=n('cBet',20);ST.cfg.maxOpen=n('cMax',10);ST.cfg.minScore=n('cMin',62);save();side(0);render()}
function exportJ(){const b=new Blob([JSON.stringify(ST,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='paper-lab-book.json';a.click()}
function q(s){return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'}
function exportCSV(){const rows=[['day','symbol','name','mint','tier','score','entry_time_ist','exit_time_ist','entry_price','exit_mult','peak_mult','cost_usd','banked_usd','pnl_usd','status','reason','hold_min']];
 for(const p of ST.pos){const ex=p.exitTime||'';rows.push([dayKey(p.entryTime),p.sym,p.name,p.mint,p.tier,p.score,new Date(p.entryTime).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}),ex?new Date(ex).toLocaleString('en-IN',{timeZone:'Asia/Kolkata'}):'',p.entry,(p.exitMult||p.mult||0).toFixed(4),(p.peak||0).toFixed(4),p.cost,(p.banked||0).toFixed(2),(p.pnl||0).toFixed(2),p.open?'OPEN':'CLOSED',p.reason||'',Math.round(((ex||Date.now())-p.entryTime)/60000)])}
 const csv=rows.map(r=>r.map(q).join(',')).join('\r\n');const b=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='paper-lab-history.csv';a.click()}
function resetAll(){if(MODE==='server'){alert('Server book is managed by the server.');return}if(confirm('Reset the whole paper book?')){ST={cfg:ST.cfg,pos:[],seen:{},created:Date.now(),log:[]};save();side(0);render()}}
setInterval(()=>{document.querySelectorAll('[data-t0]').forEach(el=>{el.textContent=fmtDur(Date.now()-+el.dataset.t0)});const hn=$('hNext');if(hn){const pm=(MODE==='server'?20000:ST.cfg.scanSec*1000);const r=Math.max(0,Math.ceil((lastPoll+pm-Date.now())/1000));hn.textContent=r?'| next refresh '+r+'s':''}},1000);
render();scan();setInterval(()=>{if(!document.hidden)scan()},MODE==='server'?20000:ST.cfg.scanSec*1000);setInterval(summaryHdr,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastScan>20000)scan()});
</script></body></html>
