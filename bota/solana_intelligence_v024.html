<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Solana Intelligence v024 - Full Early-Entry Suite</title>
<style>
/* ===== THEME TOKENS (dark default; light via [data-theme=light]) ===== */
:root{
--bg:#0b0f14;--bg2:#0e141b;--card:#131a22;--card2:#182129;--line:#1f2a35;--line2:#27313d;
--txt:#dbe4ec;--dim:#7d8b99;--acc:#4da3ff;--acc2:#2f7fe0;
--ok:#2ecc71;--okbg:#0f2f1c;--warn:#f1c40f;--warnbg:#33290a;--bad:#e74c3c;--badbg:#33110d;
--gold:#ffd700;--goldbg:#332e0a;--shadow:0 2px 10px rgba(0,0,0,.35);
}
[data-theme="light"]{
--bg:#f4f6f9;--bg2:#e9edf2;--card:#ffffff;--card2:#f0f3f7;--line:#d5dde5;--line2:#c3cdd8;
--txt:#1c2733;--dim:#5d6d7d;--acc:#0b6bcb;--acc2:#0a5cb0;
--ok:#148f4d;--okbg:#dcf5e6;--warn:#8a6d00;--warnbg:#fff3c4;--bad:#c0392b;--badbg:#fbe3df;
--gold:#8a7500;--goldbg:#fff3c4;--shadow:0 2px 8px rgba(20,40,60,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,Segoe UI,Roboto,Noto Sans,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom));overflow-x:hidden}
button{font:inherit}
/* ===== HEADER ===== */
header{padding:10px 14px calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:16px;margin:0}
.sub{color:var(--dim);font-size:11px;margin-top:2px}
.hspacer{flex:1}
.iconbtn{background:var(--card);color:var(--txt);border:1px solid var(--line2);border-radius:10px;padding:7px 10px;font-weight:700;cursor:pointer;font-size:13px}
.iconbtn:active{transform:scale(.96)}
#status{font-size:11px;color:var(--dim);margin-top:4px;min-height:14px}
#status .live{color:var(--ok);font-weight:700}
/* ===== BOTTOM NAV (Android-first) ===== */
nav#bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom)}
nav#bnav button{flex:1 0 auto;min-width:64px;background:none;border:0;color:var(--dim);padding:8px 4px 7px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-top:2px solid transparent}
nav#bnav button .ic{font-size:17px;line-height:1}
nav#bnav button.on{color:var(--acc);border-top-color:var(--acc);font-weight:700}
/* ===== LAYOUT / CARDS ===== */
.wrap{padding:10px 10px 20px;display:grid;gap:10px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow);overflow:hidden}
.card h2{font-size:12px;margin:0 0 8px;color:var(--acc);text-transform:uppercase;letter-spacing:.6px}
.card h3{font-size:13px;margin:10px 0 6px}
.note{color:var(--dim);font-size:11px;margin-top:6px}
/* ===== BADGES ===== */
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:10px;font-weight:700;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}
.warn{background:var(--warnbg);color:var(--warn)}
.bad{background:var(--badbg);color:var(--bad)}
.dim{background:var(--card2);color:var(--dim)}
.gold{background:var(--goldbg);color:var(--gold)}
.acc{background:var(--card2);color:var(--acc)}
/* ===== CONTROLS ===== */
.controls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
input,select{background:var(--bg2);color:var(--txt);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:13px;max-width:100%}
input:focus,select:focus{outline:2px solid var(--acc2);outline-offset:-1px}
button.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:12px}
[data-theme="dark"] button.btn{color:#04121f}
button.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line2)}
button.btn.mini{padding:3px 9px;font-size:11px;border-radius:8px}
button.btn:active{transform:scale(.97)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
/* ===== TABLES (no horizontal page overflow: wrapper scrolls) ===== */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:520px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th{color:var(--dim);font-weight:700;font-size:11px;position:sticky;top:0;background:var(--card)}
tr:active td{background:var(--card2)}
@media(min-width:900px){tr:hover td{background:var(--card2)}}
/* ===== MISC ===== */
.mint{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--dim);word-break:break-all}
.inc{color:var(--warn);font-weight:700}
.hit{color:var(--gold);font-weight:700}
.tgt{font-family:ui-monospace,monospace;font-size:11px}
.star{cursor:pointer;font-size:17px;background:none;border:0;color:var(--dim);padding:2px 4px}
.star.on{color:var(--gold)}
.bar{height:5px;background:var(--card2);border-radius:4px;overflow:hidden;margin:2px 0 6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
ul{margin:6px 0 0 16px;padding:0}li{margin:3px 0}
a{color:var(--acc);text-decoration:none}
/* loading / empty / error / success states */
.state{padding:18px 12px;text-align:center;border-radius:10px;font-size:12px}
.state.loading{color:var(--dim)}
.state.empty{color:var(--dim);background:var(--card2)}
.state.error{color:var(--bad);background:var(--badbg)}
.state.success{color:var(--ok);background:var(--okbg)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.fresh{font-size:10px;color:var(--dim)}
.fresh.stale{color:var(--warn)}
/* score bars legend */
.comp{margin:4px 0}
.comp .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card);border:1px solid var(--line2);color:var(--txt);padding:9px 16px;border-radius:99px;font-size:12px;z-index:50;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--dim);font-size:9px}
.chart .bar2{fill:var(--acc)}
.chart .bar2.hot{fill:var(--gold)}
.chart .axis{stroke:var(--line2);stroke-width:1}
/* log */
#log{white-space:pre-wrap;max-height:150px;overflow:auto;font-size:11px}
/* settings rows */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.setrow label{font-size:13px}
.setrow .hint{font-size:11px;color:var(--dim)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.kv b{color:var(--dim);font-weight:600}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
details{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
summary{cursor:pointer;font-weight:700;font-size:12px;color:var(--acc)}
</style>
</head>
<body>
<header>
<div class="hrow">
<h1>Solana Intelligence <span class="badge dim">v024</span> <span class="badge gold">FULL SUITE</span></h1>
<span class="hspacer"></span>
<button class="iconbtn" id="themeBtn" title="dark / light theme">&#9789;</button>
<button class="iconbtn" id="refBtn" title="refresh all data now">&#8635;</button>
</div>
<div class="sub">Early-entry research suite. Paper only - no keys, no signing, no real money. Missing data is labeled, never guessed.</div>
<div id="status">booting...</div>
</header>
<nav id="bnav"></nav>
<div class="wrap" id="view"></div>
<div class="wrap"><div class="card"><h2>Diagnostics log</h2><div id="log" class="mint"></div></div></div>
<div id="toast"></div>
<script>
"use strict";
/* =====================================================================
   SOLANA INTELLIGENCE v024 - full early-entry research suite (paper only)
   Modules: A Token Radar | B Early-Entry Engine | C Wallet Intelligence |
   D Smart-Money Clusters | E Risk Engine | F Target Monitor (2x-5x) |
   G Watchlist + Alerts | H Data/System Health | I Outcomes + Paper Trading
   All data from free, keyless, browser-callable APIs. Nothing faked.
   ===================================================================== */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
/* ---------- endpoints (all keyless, free tiers) ---------- */
const GT_BASE="https://api.geckoterminal.com/api/v2/networks/solana";
const GT_NEW=GT_BASE+"/new_pools?page=1";
const DEX_BATCH="https://api.dexscreener.com/tokens/v1/solana/";
const DEX_TOKEN="https://api.dexscreener.com/latest/dex/tokens/";
const JUP_QUOTE="https://quote-api.jup.ag/v6/quote";
const SOLMINT="So11111111111111111111111111111111111111112";
const RPC_NODES=[
 "https://solana-rpc.publicnode.com",
 "https://solana.publicnode.com",
 "https://solana.api.onfinality.io/public"
];
/* ---------- constants ---------- */
const SEEN_TTL=6*3600e3;          // 6h outcome tracking window
const CLUSTER_TTL=24*3600e3;      // wallet cluster memory
const GHOST_LIQ=100; // v015: pool liquidity below $100 => quote not tradeable (drained pools can print absurd prices); prints/targets/alerts excluded
const DEFAULTS={theme:"dark",minLiq:0,sort:"age",refreshSec:90,paperSize:20,feePct:1.0,alertMult:2,sound:false};
const TARGETS=[2,3,4,5];
/* ---------- persistent state ---------- */
const S={
 // live
 pools:{},order:[],dex:{},solUsd:null,
 // tracked
 seen:{},          // mint -> {first,sym,p0,liq0,max,min,last,n,miss,m10,m60,h6,auth,wallets}
 watch:{},         // mint -> {sym,ref,addedAt,hits,liq0,lastPrice,lastMult,quote,alerts}
 ledger:[],        // paper positions
 walletIndex:{},   // wallet -> {pools:{mint:ts},first,last,totalBuys}
 health:{},        // source -> {ok,ms,ex,at}
 backoff:{},       // source -> untilTs
 settings:{...DEFAULTS},
 alerts:[],        // {t,msg,kind}
 healthHist:[]     // v011: [ts, source, ok(0/1)] - capped at 240 probes
};
const PERSIST=["seen","watch","ledger","walletIndex","settings","alerts","healthHist"];
for(const k of PERSIST){try{const v=localStorage.getItem("si4_"+k);if(v!=null)S[k]=JSON.parse(v);}catch(e){}}
const RESTORED={seen:Object.keys(S.seen||{}).length,watch:Object.keys(S.watch||{}).length,ledger:(S.ledger||[]).length,notes:Object.keys(S.notes||{}).length,at:Date.now()}; // v022: proof this page load restored prior state
const save=()=>{try{for(const k of PERSIST)localStorage.setItem("si4_"+k,JSON.stringify(S[k]));}catch(e){}};
/* v007: flush on page close/hide - a fast close used to lose the last seconds of changes */
window.addEventListener("pagehide",()=>{save();});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")save();});
/* ---------- tiny utils ---------- */
function log(m){const el=$("#log");if(el)el.textContent=`[${new Date().toLocaleTimeString()}] ${m}\n`+el.textContent;}
let toastT=null;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600);}
function fmtAge(ms){if(!ms)return"?";const s=(Date.now()-ms)/1e3;if(s<0)return"future?";if(s<60)return Math.floor(s)+"s";const m=s/60,h=m/60,d=h/24;if(d>=1)return d.toFixed(1)+"d";if(h>=1)return h.toFixed(1)+"h";return m.toFixed(1)+"m";}
function fmtUsd(x){if(x==null||isNaN(x))return"?";const n=Number(x);if(n>=1e6)return"$"+(n/1e6).toFixed(2)+"M";if(n>=1e3)return"$"+(n/1e3).toFixed(1)+"k";if(n>=1)return"$"+n.toFixed(2);return"$"+Number(n).toPrecision(3);}
function fmtPct(x,d=1){return x==null||isNaN(x)?"?":Number(x).toFixed(d)+"%";}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shortM(m){return m?m.slice(0,4)+".."+m.slice(-4):"?";}
const normSym=s=>(s||"").toUpperCase().replace(/[^A-Z0-9]/g,""); // v016: clone detection key
const priceDiv=(a,b)=>(a>0&&b>0)?Math.abs(a-b)/Math.min(a,b):null; // v017: cross-source divergence ratio (0.10 = 10%)
function maturityNote(winM){ // v024: the window is young - say which columns cannot be conclusive yet
 if(winM<15)return"rates are PREVIEW - tracking window under 15 minutes";
 if(winM<60)return"1h and 6h columns are PREVIEW - window under 60 minutes";
 if(winM<360)return"6h rates are PREVIEW - window under 6 hours";
 return"full 6h window covered";
}
function median(a){a=a.filter(x=>x!=null).sort((x,y)=>x-y);return a.length?a[Math.floor(a.length/2)]:null;}
function f2(x){return x==null?"n/a":x.toFixed(2)+"x";}
/* ---------- status line ---------- */
function setStatus(html,isLive){$("#status").innerHTML=(isLive?'<span class="live">&#9679;</span> ':'')+html;}
/* ---------- health + backoff aware fetch ---------- */
function setH(k,ok,ms,ex){S.health[k]={ok,ms,ex,at:new Date().toLocaleTimeString()};
 S.healthHist.push([Date.now(),k,ok?1:0]);if(S.healthHist.length>240)S.healthHist.splice(0,S.healthHist.length-240);}
function backedOff(k){return S.backoff[k]&&Date.now()<S.backoff[k];}
function backoffLeft(k){return backedOff(k)?Math.ceil((S.backoff[k]-Date.now())/1000):0;}
async function jf(url,src,timeoutMs=9000){
 if(src&&backedOff(src))throw new Error("backoff "+backoffLeft(src)+"s");
 const c=new AbortController();const tt=setTimeout(()=>c.abort(),timeoutMs);
 try{
  const r=await fetch(url,{signal:c.signal,headers:{Accept:"application/json"}});
  if(r.status===429){if(src)S.backoff[src]=Date.now()+60000;throw new Error("HTTP 429 (rate limited, 60s backoff)");}
  if(!r.ok)throw new Error("HTTP "+r.status);
  return await r.json();
 }catch(e){
  if(e.name==="AbortError")throw new Error("timeout "+timeoutMs+"ms");
  throw e;
 }finally{clearTimeout(tt);}
}
/* ---------- Solana RPC (multi-node failover, keyless) ---------- */
async function rpcCall(method,params){
 let lastErr=null;
 for(const u of RPC_NODES){
  try{
   const c=new AbortController();const tt=setTimeout(()=>c.abort(),8000);
   const r=await fetch(u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method,params}),signal:c.signal});
   clearTimeout(tt);
   if(r.status===429){lastErr="429";continue;}
   if(!r.ok){lastErr="HTTP "+r.status;continue;}
   const j=await r.json();
   if(j.error){lastErr=j.error.message||"rpc error";continue;}
   return{node:u,result:j.result};
  }catch(e){lastErr=e.message;}
 }
 return{node:null,result:null,error:lastErr};
}
/* =====================================================================
   DATA REFRESH PIPELINE
   step 1: GT new pools (discovery)
   step 2: Dex batch enrichment (30 mints/call) incl SOL price
   step 3: outcome tracking (all seen tokens, look-ahead guard)
   step 4: watchlist multiples + paper ledger marks
   ===================================================================== */
async function refreshAll(force){
 const t0=performance.now();
 /* --- step 1: discovery --- */
 if(!backedOff("gt")){
  try{
   const t1=performance.now();
   const d=await jf(GT_NEW,"gt");
   const rows=(d.data||[]);
   for(const p of rows){
    const a=p.attributes||{};
    const rel=(p.relationships&&p.relationships.base_token&&p.relationships.base_token.data)||{};
    const mint=(rel.id||"").replace(/^solana_/,"");
    if(!mint)continue;
    const tx=a.transactions||{};const m5=tx.m5||{};const h1=tx.h1||{};
    S.pools[mint]={
     mint,symbol:(a.name||"?").split(" / ")[0],
     pool:(p.id||"").replace(/^solana_/,""),
     created:a.pool_created_at?Date.parse(a.pool_created_at):null,
     price:a.base_token_price_usd!=null?Number(a.base_token_price_usd):null,
     liq:a.reserve_in_usd!=null?Number(a.reserve_in_usd):null,
     b5:m5.buys??null,s5:m5.sells??null,b1:h1.buys??null,s1:h1.sells??null,
     fdv:a.fdv_usd!=null?Number(a.fdv_usd):null
    };
    if(!S.order.includes(mint))S.order.push(mint);
   }
   setH("GeckoTerminal new_pools",true,Math.round(performance.now()-t1),rows.length+" pools");
  }catch(e){setH("GeckoTerminal new_pools",false,null,e.message);log("GT discovery failed: "+e.message);}
 }else{setH("GeckoTerminal new_pools",false,null,"backoff "+backoffLeft("gt")+"s");}
 /* --- step 2: dex batch enrichment --- */
 const want=[...new Set([SOLMINT,...S.order.slice(-60),...Object.keys(S.watch)])];
 if(!backedOff("dex")){
  try{
   const t2=performance.now();let n=0;
   for(let i=0;i<want.length;i+=30){
    const chunk=want.slice(i,i+30);
    try{
     const j=await jf(DEX_BATCH+chunk.join(","),"dex");
     for(const q of(j||[])){
      const a=q.baseToken&&q.baseToken.address;if(!a)continue;
      if(!S.dex[a]||((q.liquidity&&q.liquidity.usd)||0)>((S.dex[a].liquidity&&S.dex[a].liquidity.usd)||0))S.dex[a]=q;
      n++;
     }
    }catch(e){log("dex batch chunk failed: "+e.message);}
   }
   const sq=S.dex[SOLMINT];if(sq&&sq.priceUsd)S.solUsd=Number(sq.priceUsd);
   setH("DexScreener batch",true,Math.round(performance.now()-t2),n+" pairs / "+want.length+" mints");
  }catch(e){setH("DexScreener batch",false,null,e.message);log("dex batch failed: "+e.message);}
 }else{setH("DexScreener batch",false,null,"backoff "+backoffLeft("dex")+"s");}
 /* --- step 3: outcome tracking (every seen token, no survivorship) --- */
 const now=Date.now();
 for(const m of Object.keys(S.pools)){if(!S.seen[m])S.seen[m]={first:now,sym:S.pools[m].symbol};}
 for(const m of Object.keys(S.seen)){
  const s=S.seen[m];
  if(now-s.first>=SEEN_TTL&&!S.watch[m]){delete S.seen[m];continue;}
  const q=S.dex[m];const p=q?Number(q.priceUsd):0;
  const liqKnown=!!(q&&q.liquidity&&q.liquidity.usd!=null);
  const liq=liqKnown?Number(q.liquidity.usd):0;
  s.n=(s.n||0)+1;
  if(!(s.p0>0)&&p>0&&(!liqKnown||liq>=GHOST_LIQ)){s.p0=p;s.liq0=liqKnown?liq:null;if(!liqKnown)s.p0Unproven=true;} // look-ahead guard; unknown liq anchored but flagged UNPROVEN
  // v019: a point is a ghost when KNOWN liquidity collapses - under $100 absolute or under 20% of the opening liquidity (a $10k pool drained to $1.5k is drained, even though $1.5k > $100)
  const ghost=liqKnown&&s.liq0>0&&liq<Math.max(GHOST_LIQ,0.2*s.liq0);
  if(p>0&&s.p0>0&&!ghost){
   if(!liqKnown)s.liqUnk=(s.liqUnk||0)+1; // counted, but tradeability UNPROVEN for this point
   const mult=p/s.p0;
   s.max=Math.max(s.max||1,mult);s.min=Math.min(s.min||1,mult);s.last=mult;s.lastT=now;
   // v009: keep a capped replay series (mult vs time, >=60s apart, max 60 pts)
   s.series=s.series||[];
   if(!s.series.length||now-s.series[s.series.length-1][0]>=60000){s.series.push([now,+mult.toFixed(4)]);if(s.series.length>60)s.series.shift();}
   const en=exitNet(mult,s.liq0);if(en!=null)s.maxNet=Math.max(s.maxNet||0,en);
   const age=(now-s.first)/60000;
   for(const[lab,mins]of[["m10",10],["m60",60],["h6",360]]){if(!s[lab]&&age>=mins)s[lab]=mult;}
  }else if(p>0&&s.p0>0){s.ghost=(s.ghost||0)+1;s.lastGhostT=now; /* v015+v019: KNOWN drained liquidity - quote exists but is not tradeable, prints excluded */}
  else s.miss=(s.miss||0)+1;
 }
 /* --- step 4: watchlist multiples, hits, alerts, ledger --- */
 for(const[m,w]of Object.entries(S.watch)){
  const q=S.dex[m];const p=q?Number(q.priceUsd):null;
  if(p==null||w.ref==null)continue;
  const wliq=q&&q.liquidity?Number(q.liquidity.usd):null;
  if(wliq!=null&&w.liq0>0&&wliq<Math.max(GHOST_LIQ,0.2*w.liq0)){w.ghostLiq=true;continue;} // v015+v019: no target hits or alerts on a KNOWN drained pool; unknown liq stays honest, not "drained"
  w.ghostLiq=false;
  const mult=p/w.ref;
  for(const t of TARGETS){
   if(mult>=t&&!w.hits[t]){w.hits[t]=now;pushAlert("TARGET "+t+"x hit: "+w.sym+" (chart print only - not executable profit)","gold");}
  }
  if(!w.alerted&&mult>=(S.settings.alertMult||2)){w.alerted=true;pushAlert("Alert: "+w.sym+" reached "+mult.toFixed(2)+"x (your alert level "+S.settings.alertMult+"x)","warn");}
  w.lastPrice=p;w.lastMult=mult;w.liq0=w.liq0||(q&&q.liquidity?Number(q.liquidity.usd):null);

/* =====================================================================
   MODULE E: RISK ENGINE (keyless RPC - no rugcheck dependency)
   - mint/freeze authority via getAccountInfo (jsonParsed)
   - top-holder concentration via getTokenLargestAccounts
   ===================================================================== */
async function riskCheck(mint,force){
 const s=S.seen[mint]||(S.seen[mint]={first:Date.now(),sym:mint.slice(0,6)});
 if(s.risk&&!force)return s.risk;
 const out={at:Date.now(),mintAuth:null,freezeAuth:null,top1:null,top5:null,holdersObserved:null,supply:null,decimals:null,errors:[]};
 const a=await rpcCall("getAccountInfo",[mint,{encoding:"jsonParsed"}]);
 if(a.result&&a.result.value&&a.result.value.data&&a.result.value.data.parsed){
  const info=a.result.value.data.parsed.info||{};
  out.mintAuth=info.mintAuthority!=null;out.freezeAuth=info.freezeAuthority!=null;
  out.supply=info.supply!=null?Number(info.supply):null;out.decimals=info.decimals??null;
 }else out.errors.push("accountInfo: "+(a.error||"no parsed data"));
 const la=await rpcCall("getTokenLargestAccounts",[mint]);
 if(la.result&&Array.isArray(la.result.value)){
  const entries=la.result.value.map(v=>({addr:v.address,amt:Number(v.uiAmount||0)})).filter(v=>v.amt>0);
  const tot=entries.reduce((x,y)=>x+y.amt,0);
  out.holdersObserved=entries.length;
  if(tot>0){
   out.top1=+(100*Math.max(...entries.map(e=>e.amt))/tot).toFixed(1);
   out.top5=+(100*entries.slice(0,5).reduce((x,y)=>x+y.amt,0)/tot).toFixed(1);
  }
  // v006: classify top-5 token accounts by on-chain OWNER. If an owner equals the
  // GeckoTerminal pool address, that account is the pool's own vault - exclude it
  // from concentration and say so. Accounts whose owner cannot be read stay counted
  // and are flagged unclassified, so concentration stays an UPPER BOUND for them.
  const poolAddr=(S.pools[mint]&&S.pools[mint].pool)||null;
  const top=entries.slice(0,5);let poolExcluded=0,unclass=0;const keep=[];
  for(const e of top){
   let owner=null;
   const ai=await rpcCall("getAccountInfo",[e.addr,{encoding:"jsonParsed"}]);
   if(ai.result&&ai.result.value&&ai.result.value.data&&ai.result.value.data.parsed)owner=(ai.result.value.data.parsed.info||{}).owner||null;
   if(owner==null){unclass++;keep.push(e);continue;}
   if(poolAddr&&owner===poolAddr){poolExcluded++;continue;}
   keep.push(e);
  }
  if(tot>0&&keep.length){
   out.top1Ex=+(100*Math.max(...keep.map(e=>e.amt))/tot).toFixed(1);
   out.top5Ex=+(100*keep.reduce((x,y)=>x+y.amt,0)/tot).toFixed(1);
  }
  out.poolExcluded=poolExcluded;out.unclassified=unclass;
 }else{
  const le=String((la.error&&la.error.message)||la.error||"unavailable");
  out.errors.push(/pruned|long-term|slot.*cleaned/i.test(le)?"HISTORY_PRUNED: free RPC node pruned this history ("+le+")":"largestAccounts: "+le);
 }
 s.risk=out;save();
 return out;
}
function riskVerdict(mint){
 const s=S.seen[mint];const r=s&&s.risk;const p=S.pools[mint];const q=S.dex[mint];
 const liq=(q&&q.liquidity)?Number(q.liquidity.usd):(p?p.liq:null);
 const flags=[];
 if(!r)return{label:"NOT CHECKED",cls:"dim",flags,liq};
 if(r.mintAuth===true)flags.push("mint authority ACTIVE (supply printable)");
 if(r.freezeAuth===true)flags.push("freeze authority ACTIVE (wallets freezable)");
 if(r.top1Ex!=null&&r.top1Ex>50)flags.push("top non-pool holder ~"+r.top1Ex+"% of observed supply (pool vault excluded via on-chain owner match)");
 else if(r.top1!=null&&r.top1>50)flags.push("top holder ~"+r.top1+"% of observed (HOLDER_UNVERIFIED - may be pool/vault)");
 if(r.poolExcluded>0)flags.push(r.poolExcluded+" pool vault account(s) excluded from concentration - owner verified on-chain");
 if(r.unclassified>0)flags.push(r.unclassified+" of top-5 holder accounts unreadable - concentration for them stays an UPPER BOUND");
 if(liq!=null&&liq<1000)flags.push("very thin liquidity "+fmtUsd(liq));
 if(r.errors&&r.errors.length)flags.push("incomplete: "+r.errors.join("; "));
 const hard=(r.mintAuth===true)||(r.freezeAuth===true);
 return{label:hard?"HIGH RISK":(flags.length?"CAUTION":"NO RED FLAG OBSERVED"),cls:hard?"bad":(flags.length?"warn":"ok"),flags,liq};
}
/* =====================================================================
   MODULE B: EARLY-ENTRY ENGINE (explainable score, hard gates)
   Score components (weights are untuned defaults - NOT backtested):
   age 25 | liquidity 25 | buy/sell balance 20 | authorities 20 | data coverage 10
   Hard gates: mintAuth ACTIVE or freezeAuth ACTIVE -> REJECTED BY RISK GATE
   ===================================================================== */
function scoreToken(mint){
 const p=S.pools[mint];const s=S.seen[mint];const q=S.dex[mint];
 const r=s&&s.risk;
 const liq=(q&&q.liquidity)?Number(q.liquidity.usd):(p?p.liq:null);
 const ageMin=p&&p.created?(Date.now()-p.created)/60000:null;
 const comps={};
 // age: youngest scores highest, decays over 6h
 comps.age=(ageMin==null)?{v:0,st:"NOT_OBSERVED",note:"no pool timestamp"}:{v:Math.max(0,1-ageMin/360),st:"OBSERVED",note:ageMin.toFixed(0)+"m old"};
 // liquidity: log scale $500..$500k
 if(liq==null)comps.liquidity={v:0,st:"NOT_OBSERVED",note:"no liquidity data"};
 else{const t=Math.min(1,Math.max(0,(Math.log10(Math.max(liq,1))-Math.log10(500))/(Math.log10(500000)-Math.log10(500))));comps.liquidity={v:t,st:"OBSERVED",note:fmtUsd(liq)};}
 // buy/sell balance 5m
 const b5=(q&&q.txns&&q.txns.m5)?q.txns.m5.buys:(p?p.b5:null),s5=(q&&q.txns&&q.txns.m5)?q.txns.m5.sells:(p?p.s5:null);
 if(b5==null||s5==null||(b5+s5)===0)comps.flow={v:0,st:"NOT_OBSERVED",note:"no 5m txn data"};
 else{const ratio=b5/(b5+s5);comps.flow={v:Math.max(0,Math.min(1,(ratio-0.3)/0.4)),st:"OBSERVED",note:b5+"b/"+s5+"s 5m"};}
 // authorities
 if(!r)comps.authorities={v:0,st:"NOT_OBSERVED",note:"risk not checked - press Check risk"};
 else if(r.mintAuth==null)comps.authorities={v:0,st:"NOT_OBSERVED",note:"authority read failed"};
 else comps.authorities={v:(r.mintAuth||r.freezeAuth)?0:1,st:"OBSERVED",note:(r.mintAuth||r.freezeAuth)?"authority ACTIVE":"renounced"};
 // data coverage
 let cov=0,tot=4;cov+=liq!=null?1:0;cov+=ageMin!=null?1:0;cov+=(b5!=null)?1:0;cov+=(r&&r.mintAuth!=null)?1:0;
 comps.coverage={v:cov/tot,st:"OBSERVED",note:cov+"/"+tot+" fields present"};
 const W=S.settings.weights||{age:.25,liquidity:.25,flow:.20,authorities:.20,coverage:.10};
 let score=0,obs=0;
 for(const k in W){if(comps[k].st==="OBSERVED"){score+=W[k]*comps[k].v*100;obs+=W[k];}}
 const confidence=obs;
 const hard=[];
 if(r&&r.mintAuth===true)hard.push("mint authority ACTIVE");
 if(r&&r.freezeAuth===true)hard.push("freeze authority ACTIVE");
 const gated=hard.length>0;
 const verdict=gated?"REJECTED BY RISK GATE":(score>=60&&confidence>=0.7?"CANDIDATE":(score>=40?"WATCH":"LOW"));
 return{score:Math.round(score),confidence,gated,verdict,comps,hard,liq,ageMin};
}

/* =====================================================================
   MODULE D: SMART-MONEY CLUSTER ANALYSIS (repeat early buyers across pools)
   ===================================================================== */
function clusterScan(){
 const cutoff=Date.now()-CLUSTER_TTL;
 const rows=[];
 for(const[w,wi]of Object.entries(S.walletIndex||{})){
  const mints=Object.keys(wi.pools||{}).filter(m=>wi.pools[m]>cutoff);
  if(mints.length>=2)rows.push({wallet:w,pools:mints,buys:wi.totalBuys||0,last:wi.last});
 }
 rows.sort((a,b)=>b.pools.length-a.pools.length);
 // co-appearance clusters: wallets sharing >=2 pools
 const clusters=[];
 const used=new Set();
 for(const r of rows.slice(0,50)){
  if(used.has(r.wallet))continue;
  const mates=rows.filter(o=>o.wallet!==r.wallet&&!used.has(o.wallet)&&o.pools.filter(m=>r.pools.includes(m)).length>=2);
  if(mates.length>=1){
   const shared=[...new Set(mates.flatMap(o=>o.pools.filter(m=>r.pools.includes(m))))];
   clusters.push({lead:r.wallet,members:[r.wallet,...mates.map(o=>o.wallet)],sharedPools:shared});
   used.add(r.wallet);mates.forEach(o=>used.add(o.wallet));
  }
 }
 return{repeatWallets:rows,clusters,totalWallets:Object.keys(S.walletIndex||{}).length};
}

 let bars="";
 counts.forEach((c,i)=>{const h=(H-pad*2)*(c/maxC);const x=pad+i*bw;const y=H-pad-h;
  bars+=`<rect class="bar2" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-1.5).toFixed(1)}" height="${h.toFixed(1)}"><title>${fmtV(mn+i*range/buckets)} - ${fmtV(mn+(i+1)*range/buckets)}: ${c}</title></rect>`;});
 return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">

}

 const buckets=[[0,60],[60,75],[75,90],[90,101]];
 const rows=buckets.map(([lo,hi])=>{
  const inb=H.filter(x=>x.score>=lo&&x.score<hi);
  return{lab:lo+"-"+(hi>100?100:hi),n:inb.length,hit2:pct(x=>x.max>=2,inb),medMax:median(inb.map(x=>x.max))};
 });
 const baseHit=pct(s=>s.max>=2,A);
 const body=rows.map(r=>`<tr><td>${r.lab}</td><td>${r.n}</td><td>${r.n<3?'<span class="badge dim">INSUFFICIENT SAMPLE</span>':r.hit2}</td><td>${r.n<3?"-":f2(r.medMax)}</td></tr>`).join("");

/* ---------- MODULE G+: BASELINE REGISTRY (every token seen, per-token truth) ----------
   The aggregate base rate above hides WHICH tokens moved. This registry lists every token
   the scanner saw in the last 6h with its own first-observed price (look-ahead guarded),
   latest and max chart multiples, and honest status labels. No candidate cherry-picking. */
function baselineRows(){
 const now=Date.now();
 const rows=Object.entries(S.seen).map(([m,s])=>{
  const age=(now-s.first)/60000;
  const flat=!!(s.p0>0&&(s.max||1)===1&&(s.min||1)===1&&(s.n||0)>=3);
  let status,cls;
  if(!(s.p0>0)){status=(s.n||0)>=2?"NO VALID PRICE (feed never gave a chart price - not fabricated)":"AWAITING FIRST PRICE";cls="dim";}
  else if(flat){status="NO PRICE MOVEMENT (3+ polls, chart flat - untraded or dead pair; excluded from rates)";cls="dim";}
  else if((s.ghost||0)>=2&&now-(s.lastT||s.first)>5*60000){status="GHOST LIQ (known pool liquidity drained under $100 or 20% of opening - post-drain quotes excluded from prints/rates)";cls="warn";}
  else if(s.p0Unproven&&(s.liqUnk||0)>=2){status="LIQ UNKNOWN (feed gives no liquidity for this token - prints counted, tradeability UNPROVEN, not called drained)";cls="warn";}
  else if((s.miss||0)>=3&&now-(s.lastT||s.first)>10*60000){status="STALE (price feed lost it - last print kept, not extrapolated)";cls="warn";}
  else{status="TRACKING";cls="ok";}
  const dd=(s.max>1&&s.last!=null)?+(100*(1-s.last/s.max)).toFixed(1):null; // v012: giveback from peak %
  return{mint:m,sym:s.sym||shortM(m),age,p0:s.p0||null,last:s.last||null,max:s.max||null,maxNet:s.maxNet||null,dd,
   m10:s.m10||null,m60:s.m60||null,h6:s.h6||null,n:s.n||0,miss:s.miss||0,ghost:s.ghost||0,hit2:(s.max||0)>=2,flat,series:s.series||[],status,cls};
 });
 rows.sort((a,b)=>a.age-b.age); // newest (youngest) first
 return rows;
}

function recordBaseHist(){
 const A=Object.values(S.seen).filter(s=>s.p0>0&&(s.n||0)>=2);
 if(A.length<3)return;
 const last=S.baseHist[S.baseHist.length-1];
 if(last&&Date.now()-last.t<10*60e3)return; // one point per 10 min
 const p=f=>A.filter(f).length/A.length;
 S.baseHist.push({t:Date.now(),n:A.length,p2:+p(s=>s.max>=2).toFixed(3),p3:+p(s=>s.max>=3).toFixed(3),belowHalf:+p(s=>s.last<0.5).toFixed(3)});
 if(S.baseHist.length>144)S.baseHist.shift();
 try{localStorage.setItem("si4_baseHist",JSON.stringify(S.baseHist));}catch(e){}

 if(S.baseHist.length<2)return'<div class="state empty">base-rate history collects one point per 10 minutes - check back later</div>';

 for(const[key,color]of series){
  const pts=S.baseHist.map((b,i)=>((i/(S.baseHist.length-1))*(W-pad*2)+pad).toFixed(1)+","+(H-pad-b[key]*(H-pad*2)).toFixed(1)).join(" ");
  paths+=`<polyline fill="none" stroke="${color}" stroke-width="1.5" points="${pts}"/>`;
 }
 const legend=series.map(([k,c,l])=>`<span class="badge dim" style="color:${c}">${l}</span>`).join(" ");
 return`<svg class="chart" viewBox="0 0 ${W} ${H}"><line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/>${paths}</svg><div class="pillrow">${legend}</div>`;

 <p><b>Honest labels:</b> NOT OBSERVED / NOT_QUOTED / INSUFFICIENT SAMPLE / HOLDER_UNVERIFIED / HISTORY WINDOW LIMITED / HISTORY_PRUNED / NO VALID PRICE / STALE mean the free data cannot prove something. Nothing is fabricated to fill gaps.</p>
 <p><b>New in v024 - a young window admits it is young:</b> open the app for 20 minutes and a 6-hour hit rate would be a lie wearing a statistic's clothes. The baseline registry now shows its actual collection window (Xm of 360m) and marks the 10m and 1h columns with an asterisk until the window is old enough to support them. A rate is only as honest as the window behind it.</p>
 <p><b>New in v023 - the whole watchlist in one paste:</b> v021 moved one audit; the new Copy watchlist summary button moves them all. Every starred token sorted by multiple, with its reference price, hit targets and flags, ending with the honest line that chart prints are not executed profit. Your morning briefing to yourself is now one tap.</p>
 <p><b>New in v022 - warnings belong on the row, proof belongs on the page:</b> a token whose liquidity collapsed now wears a red DRAINED chip right in the Radar list - you see it before you ever open the detail. And the Health tab now shows exactly how many tokens, stars, ledger entries and notes this page load restored from storage. Persistence is proven with numbers, not adjectives.</p>
 <p><b>New in v021 - the audit travels as text:</b> every token detail page now has a Copy audit button. One tap and the honest summary is on your clipboard - age, liquidity, tracking record, authorities, flags, and the NOT VERIFIED lines that prove nothing was hidden. Paste it into a chat, a note, or a report; it reads the same everywhere because it is just text.</p>
 <p><b>New in v020 - your data can leave with you:</b> the export button made a report; the new Backup button makes a real backup - every section this app stores, in one file. Restore validates the file before touching anything, tells you exactly which sections will be overwritten, and asks first. Browser clears and device swaps no longer erase your watchlist and notes.</p>
 <p><b>New in v019 - drained means drained, unknown means unknown:</b> v015 blocked ghost prints under $100, but a $10,000 pool drained to $1,500 is just as drained. The rule is now relative too: under 20% of opening liquidity excludes the print. And when a feed simply has no liquidity number for a token, that is no longer treated as drained - the prints count, the token wears a LIQ UNKNOWN label, and tradeability stays honestly UNPROVEN.</p>
 <p><b>New in v018 - know what your browser is carrying:</b> the Health tab now lists every key this app stores with its real size, and a prune button removes only what is safe to lose: closed paper positions older than 7 days and tokens past the 6-hour tracking window. Your watchlist, notes and settings are never touched. An app that hides its own footprint should not be trusted with yours.</p>
 <p><b>New in v017 - when two feeds disagree, believe neither:</b> the Radar now compares the GeckoTerminal pool price with the DexScreener batch price on every row. A gap over 10% gets a FEED DIVERGE badge and a count in the header. Two free feeds that disagree are telling you at least one is stale or wrong - the honest answer is to show the fight, not to average it away.</p>
 <p><b>New in v016 - a ticker is never identity:</b> scammers spawn pools with the same symbol as a hot token within minutes. The Radar now counts how many live pools share each ticker (across every pool the feed returned, even ones your filters hide) and warns SYMBOL CLONE xN on the row. Always verify the mint on solscan - the letters in a ticker prove nothing.</p>
 <p><b>New in v015 - a drained pool is not a moon:</b> when liquidity falls under $100 a chart can show a million-x price nobody could ever sell at. Those ghost quotes are now excluded from prints, base rates, target hits and alerts, and the token is labeled GHOST LIQ so you can see exactly what was ignored and why.</p>
 <p><b>New in v014 - hear the alert, don't stare at the screen:</b> turn on Sound alerts in Settings and the app beeps when a watch token crosses your alert level. Browsers block audio until you tap once - press Test sound once to unlock it. It works only while the page is open; there is no backend.</p>
 <p><b>New in v013 - is that wallet actually good:</b> every wallet in the Clusters tab now carries its own track record - how many of its entries were tracked and how many printed 2x gross. Under 3 tracked entries it says UNPROVEN; above, it still warns that survivorship and a tiny sample cannot prove skill. A fast wallet is not automatically a smart wallet.</p>
 <p><b>New in v012 - a print you never sold is not a print you kept:</b> the Ledger now shows each token's giveback from its peak, and across every token that printed 2x gross, the median giveback and the share that handed back half or more. This is the honest cost of holding, measured on your own data - not a lecture.</p>
 <p><b>New in v011 - outages cannot blank the chart:</b> when the candle feed fails, the Detail view now draws the app's own recorded price points instead - clearly labeled FALLBACK, not candles, with the failure reason shown. The Health tab also keeps a persisted probe history per source: a source that flaps between OK and DOWN shows its true ok-rate, not just its last lucky status.</p>
 <p><b>New in v010 - does the score earn its keep:</b> the Signals tab now buckets every candidate the engine ever flagged by its score at flag time and compares forward outcomes, against the all-token baseline printed next to it. High bands must beat low bands AND the baseline, or the score has no edge - and bands under 3 candidates are marked INSUFFICIENT SAMPLE instead of being celebrated.</p>
 <p><b>New in v009 - does "early" actually win:</b> the Ledger tab now splits base rates by token age (0-15m, 15-60m, 1-6h). If the young bucket does not beat the older ones in your own collected data, "catch it early" has no proven edge - and the app says so. Baseline rows also carry a small replay sparkline of the token's multiple over time.</p>
 <p><b>New in v008 - how LONG did a print take:</b> the Targets tab now shows the minutes or hours each target took to print after you starred a token, plus a median per target across your starred set. A slow grind and a fast spike are different beasts; now you can see which is which.</p>
 <p><b>New in v007 - dead prices cannot fake a median:</b> tokens whose chart price never moves across 3+ polls (untraded or dead pairs) are labeled NO PRICE MOVEMENT and removed from every base-rate statistic, with the excluded count shown. And the app now saves on page close, so a fast exit cannot eat your last changes.</p>
 <p><b>New in v005 - audit the base rate yourself:</b> the Ledger tab now lists every token the scanner saw, one row each: first observed price, latest and max chart multiples, net-of-cost estimate, 10m/1h checks, and a status label. Export it as CSV and check any claim against the raw rows. When the free trades feed only shows a recent window but Dex reports heavy 24h activity, the app says HISTORY WINDOW LIMITED instead of pretending the token had few buyers.</p>
 <p><b>Limits:</b> alerts and tracking run only while this page is open. Wallet independence and sellability cannot be proven with free browser data.</p>

let _audioCtx=null;
function beep(){
 try{
  _audioCtx=_audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(_audioCtx.state==="suspended")_audioCtx.resume().catch(()=>{});
  const seq=[[880,0,.09],[1320,.12,.09]];
  for(const [freq,off,dur] of seq){
   const o=_audioCtx.createOscillator(),g=_audioCtx.createGain();
   o.type="sine";o.frequency.value=freq;
   const t0=_audioCtx.currentTime+off;
   g.gain.setValueAtTime(0,t0);
   g.gain.linearRampToValueAtTime(.18,t0+.01);
   g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
   o.connect(g);g.connect(_audioCtx.destination);
   o.start(t0);o.stop(t0+dur+.02);
  }
 }catch(e){/* audio unavailable - stay silent, never crash an alert */}
}

 rows.sort((a,b)=>b[1]-a[1]);

 return `<div class="note">Total ${(total/1024).toFixed(1)} KB across ${rows.length} keys on this device (UTF-16 estimate; quota is browser-dependent, ~5 MB typical - NOT guaranteed). The paper ledger grows until pruned.</div>

 render();
};
