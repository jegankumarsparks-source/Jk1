<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Solana Intelligence v062 - Full Early-Entry Suite</title>
<style>
/* ===== THEME TOKENS (dark default; light via [data-theme=light]) ===== */
:root{
--bg:#0a0c10;--bg2:#0f141a;--card:#141a23;--card2:#1b2430;--line:#232e3b;--line2:#2c3947;
--txt:#dbe4ec;--dim:#7d8b99;--acc:#f5a623;--acc2:#d18a10;
--ok:#2ecc71;--okbg:#0f2f1c;--warn:#f1c40f;--warnbg:#33290a;--bad:#e74c3c;--badbg:#33110d;
--gold:#ffd700;--goldbg:#332e0a;--shadow:0 6px 18px rgba(0,0,0,.5);--glow:rgba(245,166,35,.22);
}
[data-theme="light"]{
--bg:#f4f6f9;--bg2:#e9edf2;--card:#ffffff;--card2:#f0f3f7;--line:#d5dde5;--line2:#c3cdd8;
--txt:#16222e;--dim:#4d5f70;--acc:#c47f0e;--acc2:#9c6509;
--ok:#148f4d;--okbg:#dcf5e6;--warn:#8a6d00;--warnbg:#fff3c4;--bad:#c0392b;--badbg:#fbe3df;
--gold:#7a6700;--goldbg:#fff0bb;--shadow:0 2px 8px rgba(20,40,60,.14);--glow:rgba(196,127,14,.16);
}
/* accents come AFTER both themes so the user's explicit choice always wins (v035 bug caught in verification) */
[data-accent="blue"]{--acc:#4da3ff;--acc2:#2f7fe0;--glow:rgba(77,163,255,.22)}
[data-theme="light"][data-accent="blue"]{--acc:#0b6bcb;--acc2:#0a5cb0}
[data-accent="green"]{--acc:#2ecc71;--acc2:#25a35a;--glow:rgba(46,204,113,.2)}
[data-accent="amber"]{--acc:#f5a623;--acc2:#d18a10}
[data-accent="purple"]{--acc:#a06bff;--acc2:#7f4fe0;--glow:rgba(160,107,255,.22)}
[data-theme="light"][data-accent="green"]{--acc:#1e9e54;--acc2:#177a40}
[data-theme="light"][data-accent="amber"]{--acc:#c47f0e;--acc2:#9c6509}
[data-theme="light"][data-accent="purple"]{--acc:#7f4fe0;--acc2:#6538c0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,Segoe UI,Roboto,Noto Sans,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom));overflow-x:hidden}
button{font:inherit}
/* ===== HEADER ===== */
header{padding:10px 14px calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:20}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:16px;margin:0}
.sub{color:var(--dim);font-size:11px;margin-top:2px}
.hspacer{flex:1}
.iconbtn{background:var(--card);color:var(--txt);border:1px solid var(--line2);border-radius:12px;padding:7px 10px;font-weight:700;cursor:pointer;font-size:13px}
.iconbtn:active{transform:scale(.96)}
#status{font-size:11px;color:var(--dim);margin-top:4px;min-height:14px}
#rcd{background:var(--card2);border-radius:99px;padding:1px 8px}
#status .live{color:var(--ok);font-weight:700}
/* ===== BOTTOM NAV (Android-first) ===== */
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--line2) 25%,var(--card) 50%,var(--line2) 75%);background-size:200% 100%;animation:sk 1.2s linear infinite;margin:6px 0}
@keyframes sk{to{background-position:-200% 0}}
.obanner{border:1px solid var(--bad);border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:12px;background:var(--card)}
.obanner.warn{border-color:var(--warn)}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
details.card summary{cursor:pointer;list-style:none;min-height:44px;display:flex;align-items:center}
details.card summary::-webkit-details-marker{display:none}
details.card summary h2{display:inline}
details.card summary::after{content:"\25BE";margin-left:auto;color:var(--dim)}
details.card:not([open]) summary::after{content:"\25B8"}
nav#bnav button{min-height:48px}
nav#bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom)}
nav#bnav button{flex:1 0 auto;min-width:64px;background:none;border:0;color:var(--dim);padding:8px 4px 7px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-top:2px solid transparent}
nav#bnav button .ic{font-size:17px;line-height:1}
nav#bnav button.on{color:var(--acc);border-top-color:var(--acc);font-weight:700;background:linear-gradient(180deg,rgba(245,166,35,.13),transparent 75%)}
/* ===== LAYOUT / CARDS ===== */
.wrap{padding:10px 10px 20px;display:grid;gap:10px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);overflow:hidden;animation:cardIn .28s ease-out}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.skel{animation:none}.spin{animation-duration:2s}}
.card h2{font-size:12px;margin:0 0 8px;color:var(--acc);text-transform:uppercase;letter-spacing:.8px}
.card h3{font-size:13px;margin:10px 0 6px}
.note{color:var(--dim);font-size:11px;margin-top:6px}
/* ===== BADGES ===== */
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:10px;font-weight:700;white-space:nowrap}
.ok{background:var(--okbg);color:var(--ok)}
.warn{background:var(--warnbg);color:var(--warn)}
.bad{background:var(--badbg);color:var(--bad)}
.dim{background:var(--card2);color:var(--dim)}
.gold{background:var(--goldbg);color:var(--gold)}
.acc{background:var(--card2);color:var(--acc)}
/* ===== CONTROLS ===== */
.controls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
input,select{background:var(--bg2);color:var(--txt);border:1px solid var(--line2);border-radius:12px;padding:8px 10px;font-size:13px;max-width:100%}
input:focus,select:focus{outline:2px solid var(--acc2);outline-offset:-1px}
button.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0d0f13;border:0;border-radius:99px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:12px}
button.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line2);border-radius:99px}
button.btn.mini{padding:3px 10px;font-size:11px;border-radius:99px}
/* v044: measured mobile pass - mini buttons rendered 23-25px tall at 360px (thumb-hostile).
   On touch/coarse or narrow layouts, controls get reachable minimums; desktop density unchanged. */
@media (max-width:700px),(pointer:coarse){
button.btn{min-height:40px;padding:10px 16px}
button.btn.mini{min-height:36px;padding:7px 12px;font-size:12px}
input,select{min-height:40px}
.controls{gap:8px}
/* v044b: long warning badges (e.g. clone-count footer) measured 468px wide at 360px and were clipped by overflow-x:hidden - let them wrap on small/touch screens */
.badge{white-space:normal}
/* v044b: inline table links measured 17px tall - pad the hit box without changing visual layout */
td a{display:inline-block;padding:9px 4px;margin:-9px -4px}
}
button.btn:active{transform:scale(.97)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
/* ===== TABLES (no horizontal page overflow: wrapper scrolls) ===== */
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:520px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th{color:var(--dim);font-weight:700;font-size:11px;position:sticky;top:0;background:var(--card)}
tr:active td{background:var(--card2)}
@media(min-width:900px){tr:hover td{background:var(--card2)}}

/* ===== v060 REAL REDESIGN ===== */
body{background:radial-gradient(120% 60% at 90% -10%,var(--glow),transparent 60%),var(--bg);background-attachment:fixed}
header{padding:8px 12px calc(8px + env(safe-area-inset-top));backdrop-filter:blur(8px);background:rgba(10,12,16,.92)}
[data-theme="light"] header{background:rgba(244,246,249,.94)}
.hrow{flex-wrap:nowrap;gap:8px}
.logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0d0f13;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;box-shadow:0 0 14px var(--glow);flex:0 0 auto}
h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hrow .badge{flex:0 0 auto}
.iconbtn{width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:12px;flex:0 0 auto}
#status{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;margin-top:5px}
#status.open{white-space:normal}
nav#bnav{overflow:visible;background:rgba(20,26,35,.96);border-top:1px solid var(--line2);backdrop-filter:blur(10px)}
nav#bnav button{flex:1 1 0;min-width:0;position:relative}
nav#bnav button.on{background:none;border-top-color:transparent}
nav#bnav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 4px 4px;background:var(--acc);box-shadow:0 0 12px var(--acc)}
nav#bnav button.on .ic{filter:drop-shadow(0 0 6px var(--acc))}
[data-theme="light"] nav#bnav{background:rgba(255,255,255,.96)}
#moreSheet{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none}
#moreSheet.show{display:block}
#moreSheet .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55)}
#moreSheet .sheet{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom));background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:14px;box-shadow:0 0 30px var(--glow),var(--shadow);display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#moreSheet .sheet h3{grid-column:1/-1;margin:0;font-size:12px;color:var(--acc);text-transform:uppercase;letter-spacing:.8px}
#moreSheet .sheet button{background:var(--card2);color:var(--txt);border:1px solid var(--line2);border-radius:16px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;cursor:pointer}
#moreSheet .sheet button.on{border-color:var(--acc);color:var(--acc)}
#moreSheet .sheet .ic{font-size:20px}
.hero{background:radial-gradient(90% 120% at 100% 0%,var(--glow),transparent 60%),linear-gradient(165deg,var(--card2),var(--card));border:1px solid var(--acc2);box-shadow:0 0 26px var(--glow),var(--shadow)}
.hero h2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 4px}
.hero h2 .sm{font-size:10px;font-weight:400;color:var(--dim);text-transform:none;letter-spacing:0}
.herogrid{display:flex;align-items:center;gap:10px}
.gwrap{flex:0 0 150px;filter:drop-shadow(0 0 8px var(--glow))}
.gwrap svg{display:block;width:150px;height:auto}
.hinfo{flex:1;min-width:0}
.hinfo .hl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
.hinfo .hv{font-size:15px;font-weight:700;margin:1px 0 6px}
.feeds{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:var(--bg2);border-radius:99px;padding:3px 9px;font-size:11px;font-weight:700}
.fchip i{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
.fchip.k-ok{color:var(--ok)}.fchip.k-ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.fchip.k-bad{color:var(--bad)}.fchip.k-bad i{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.fl{font-size:10px;color:var(--dim)}
.statgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stat{background:var(--bg2);border:1px solid var(--line2);border-radius:18px;padding:10px 10px 9px;position:relative;overflow:hidden}
.stat .sic{color:var(--acc);width:26px;height:26px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:13px;margin-bottom:6px;border:1px solid var(--line2)}
.stat .sn{font-size:24px;font-weight:800;line-height:1.05}
.stat .sl{font-size:10px;color:var(--dim);margin-top:2px;text-transform:uppercase;letter-spacing:.4px}
.sn.k-acc{color:var(--acc)}.sn.k-ok{color:var(--ok)}.sn.k-bad{color:var(--bad)}.sn.k-gold{color:var(--gold)}.sn.k-warn{color:var(--warn)}.sn.k-dim{color:var(--txt)}
.qin{flex:1 1 100%;width:100%;border-radius:99px;padding:10px 16px}
.chiprow{scrollbar-width:none;display:flex;gap:8px;overflow-x:auto;width:100%;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}
.chiprow>*{flex:0 0 auto}
.chiprow select,.chiprow input{height:40px}
.chiprow input{width:96px!important}
.pillcount{background:var(--card2);color:var(--dim);border-radius:99px;padding:1px 9px;font-size:10px;font-weight:700;text-transform:none;letter-spacing:0;margin-left:6px}
.tlist{display:grid;gap:10px}
.trow{display:grid;grid-template-columns:36px minmax(0,1fr);gap:6px 8px;background:linear-gradient(165deg,var(--card2),var(--card));border:1px solid var(--line2);border-radius:18px;padding:10px}
.trow:active{border-color:var(--acc)}
.c-star{grid-column:1}
.c-tok{display:contents}
.tk{grid-column:2;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.tk b{font-size:16px}
.sgmeta{margin-left:auto;flex:none;display:flex;align-items:center;gap:8px}
.sgscore{min-width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--acc);background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line2) 0);position:relative}
.sgscore b{position:relative;z-index:1;font-size:14px;color:var(--acc)}
.details-fix{}
.sgscore::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--card2)}
.sgscore{isolation:isolate}.sgscore{z-index:0}
details.sigd>summary{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-height:48px}
details.sigd>summary .star,details.sigd>summary .badge{flex:none}
.sgsub{white-space:nowrap;font-size:10.5px;color:var(--dim);line-height:1.25;text-align:right}
.rk{background:var(--card2);border:1px solid var(--line2);border-radius:16px;padding:10px;margin:8px 0}
.rkh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.rkt{min-width:0;overflow:hidden;text-overflow:ellipsis}
.rk .rkm{grid-template-columns:1fr 1fr;grid-column:auto}
.rkb{margin-top:8px}
.wtbl,.wtbl tbody,.wtbl tr.wr,.wtbl td{display:block;box-sizing:border-box;width:100%;max-width:100%}
.wtbl td{overflow-wrap:anywhere}
.wtbl thead{display:none}
.wtbl tr.wr{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr);gap:6px 8px;background:var(--card2);border:1px solid var(--line2);border-radius:16px;padding:10px;margin:8px 0;align-items:start}
.wtbl td{border:0;padding:0;min-width:0;width:auto}
.wlist{overflow:hidden}.wtbl{min-width:0}.wtbl td{white-space:normal}
.wtbl td.w-star{grid-row:1}
.wtbl td.w-token{grid-column:2/4}
.wtbl td.w-ref,.wtbl td.w-multiple,.wtbl td.w-starred{background:var(--bg2);border-radius:12px;padding:6px 7px;font-weight:700;font-size:12px}
.wtbl td.w-ref{grid-column:1/3}.wtbl td.w-starred{grid-column:3/4}
.wtbl td.w-multiple{grid-column:1/4}
.wtbl td.w-actions{grid-column:1/4}
.wtbl td[data-l]:not(.w-token):not(.w-actions)::before{content:attr(data-l);display:block;font-size:9px;font-weight:400;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.ctabwrap{overflow:visible}
table.ctab{min-width:0;display:block}
table.ctab thead{display:none}
table.ctab tbody{display:block}
table.ctab tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;background:var(--card2);border:1px solid var(--line2);border-radius:16px;padding:10px;margin:8px 0}
table.ctab td{display:block;border:0;padding:0;white-space:normal;overflow-wrap:anywhere;min-width:0}
table.ctab td:first-child{grid-column:1/3;font-size:13px}
table.ctab td[data-l]:not(:first-child){background:var(--bg2);border-radius:12px;padding:6px 7px;font-weight:700;font-size:12px}
table.ctab td[data-l]:not(:first-child)::before{content:attr(data-l);display:block;font-size:9px;font-weight:400;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
table.ctab td.ctab-x{grid-column:1/3}
.rspark{display:block;margin-top:2px}.rspark svg{width:100%;height:16px;display:block}
.mrow{grid-column:1/3;display:grid;grid-template-columns:.85fr 1fr 1.45fr .9fr;gap:6px}
.c-m{background:var(--bg2);border-radius:12px;padding:6px 7px;font-size:11.5px;font-weight:700;min-width:0;overflow-wrap:anywhere}
.c-m::before{content:attr(data-l);display:block;font-size:9px;font-weight:400;color:var(--dim);text-transform:uppercase;letter-spacing:.4px}
.c-m .fresh{display:block;font-weight:400}
.c-chk,.c-sc{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.c-chk br,.c-sc br{display:none}
.lk{grid-column:1/3;display:flex;flex-wrap:wrap;gap:4px;font-size:0}
.lk a{font-size:12px;display:inline-block;padding:9px 10px;border-radius:99px;background:var(--card2)}
.trow .star{width:36px;height:36px;font-size:19px}
.card{border-radius:20px}
.card h2{letter-spacing:.9px}
.stat,.trow{animation:cardIn .28s ease-out}
@media (prefers-reduced-motion:reduce){.stat,.trow{animation:none}}
@media (min-width:700px){.tlist{grid-template-columns:repeat(2,minmax(0,1fr))}.statgrid{grid-template-columns:repeat(6,minmax(0,1fr))}}
/* ===== MISC ===== */
.mint{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--dim);word-break:break-all}
.inc{color:var(--warn);font-weight:700}
.hit{color:var(--gold);font-weight:700}
.tgt{font-family:ui-monospace,monospace;font-size:11px}
.star{cursor:pointer;font-size:17px;background:none;border:0;color:var(--dim);padding:2px 4px}
.star.on{color:var(--gold)}
.bar{height:5px;background:var(--card2);border-radius:4px;overflow:hidden;margin:2px 0 6px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
ul{margin:6px 0 0 16px;padding:0}li{margin:3px 0}
a{color:var(--acc);text-decoration:none}
/* loading / empty / error / success states */
.state{padding:18px 12px;text-align:center;border-radius:10px;font-size:12px}
.state.loading{color:var(--dim)}
.state.empty{color:var(--dim);background:var(--card2)}
.state.error{color:var(--bad);background:var(--badbg)}
.state.success{color:var(--ok);background:var(--okbg)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.fresh{font-size:10px;color:var(--dim)}
.fresh.stale{color:var(--warn)}
/* score bars legend */
.comp{margin:4px 0}
.comp .lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card);border:1px solid var(--line2);color:var(--txt);padding:9px 16px;border-radius:99px;font-size:12px;z-index:50;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--dim);font-size:9px}
.chart .bar2{fill:var(--acc)}
.chart .bar2.hot{fill:var(--gold)}
.chart .axis{stroke:var(--line2);stroke-width:1}
/* log */
#log{white-space:pre-wrap;max-height:150px;overflow:auto;font-size:11px}
/* settings rows */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.setrow label{font-size:13px}
.setrow .hint{font-size:11px;color:var(--dim)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.kv b{color:var(--dim);font-weight:600}
.pillrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
details{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
summary{cursor:pointer;font-weight:700;font-size:12px;color:var(--acc)}
</style>
</head>
<body>

function sanitizeKeys(){ /* v088: a crafted stored key (backup or storage tamper) renders raw into HTML and onclick attributes - purge non-whitelist keys at the trust boundary */
 let dropped=0;

window.saveWalName=w=>{const inp=$("#walname_"+CSS.escape(w));if(!inp)return;const v=inp.value.trim();if(v)S.walletNames[w]=v.slice(0,40);else delete S.walletNames[w];save();toast(v?"wallet alias saved":"alias cleared");render();};
const RESTORED={seen:Object.keys(S.seen||{}).length,watch:Object.keys(S.watch||{}).length,ledger:(S.ledger||[]).length,notes:Object.keys(S.notes||{}).length,at:Date.now()}; // v022: proof this page load restored prior state
const storagePrune=()=>{let pruned=0;const trim=(a,c)=>{if(Array.isArray(a)&&a.length>c){pruned+=a.length-c;a.splice(0,a.length-c);}};trim(S.healthHist,60);trim(S.alerts,50);trim(S.baseHist,100);trim(S.sigHist,80);for(const m of Object.keys(S.seen||{})){const sr=S.seen[m]&&S.seen[m].series;if(Array.isArray(sr)&&sr.length>20){pruned+=sr.length-20;sr.splice(0,sr.length-20);}}return pruned;};

  }catch(e2){

/* ---------- tiny utils ---------- */

let toastT=null;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600);}
function fmtAge(ms){if(!ms)return"?";const s=(Date.now()-ms)/1e3;if(s<0)return"future?";if(s<60)return Math.floor(s)+"s";const m=s/60,h=m/60,d=h/24;if(d>=1)return d.toFixed(1)+"d";if(h>=1)return h.toFixed(1)+"h";return m.toFixed(1)+"m";}
function fmtUsd(x){if(x==null||isNaN(x))return"?";const n=Number(x);if(n>=1e6)return"$"+(n/1e6).toFixed(2)+"M";if(n>=1e3)return"$"+(n/1e3).toFixed(1)+"k";if(n>=1)return"$"+n.toFixed(2);return"$"+Number(n).toPrecision(3);}

const isSafeKey=k=>typeof k==="string"&&/^[A-Za-z0-9_\-:.]{1,80}$/.test(k); /* v088: remote and restored keys render into HTML and onclick attributes - a charset whitelist so a crafted feed or backup key can never break out into the DOM. Not address-format validation (v077 does strict base58 for user input) */
function shortM(m){return m?m.slice(0,4)+".."+m.slice(-4):"?";}
const normSym=s=>(s||"").toUpperCase().replace(/[^A-Z0-9]/g,""); // v016: clone detection key
const priceDiv=(a,b)=>(a>0&&b>0)?Math.abs(a-b)/Math.min(a,b):null; // v017: cross-source divergence ratio (0.10 = 10%)
function maturityNote(winM){ // v024: the window is young - say which columns cannot be conclusive yet

}

/* ---------- status line ---------- */
function setStatus(html,isLive){$("#status").innerHTML=(isLive?'<span class="live">&#9679;</span> ':'')+html+' <span id="rcd" class="fresh" title="countdown to the next automatic refresh (your interval in Settings)"></span>';}
/* ---------- health + backoff aware fetch ---------- */
function setH(k,ok,ms,ex){S.health[k]={ok,ms,ex,at:new Date().toLocaleTimeString(),atMs:Date.now()}; /* v043: real timestamp for cycle freshness */
 S.healthHist.push([Date.now(),k,ok?1:0,ms||0]);if(S.healthHist.length>240)S.healthHist.splice(0,S.healthHist.length-240);}
function backedOff(k){return S.backoff[k]&&Date.now()<S.backoff[k];}
function backoffLeft(k){return backedOff(k)?Math.ceil((S.backoff[k]-Date.now())/1000):0;}
async function jf(url,src,timeoutMs=9000){
 if(src&&backedOff(src))throw new Error("backoff "+backoffLeft(src)+"s");
 const c=new AbortController();const tt=setTimeout(()=>c.abort(),timeoutMs);
 try{
  const r=await fetch(url,{signal:c.signal,headers:{Accept:"application/json"}});
  if(r.status===429){if(src)S.backoff[src]=Date.now()+60000;throw new Error("HTTP 429 (rate limited, 60s backoff)");}
  if(!r.ok)throw new Error("HTTP "+r.status);
  return await r.json();
 }catch(e){
  if(e.name==="AbortError")throw new Error("timeout "+timeoutMs+"ms");
  throw e;
 }finally{clearTimeout(tt);}
}
/* ---------- Solana RPC (multi-node failover, keyless) ---------- */
async function rpcCall(method,params){
 let lastErr=null;
 for(const u of RPC_NODES){
  try{
   const c=new AbortController();const tt=setTimeout(()=>c.abort(),8000);
   const r=await fetch(u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method,params}),signal:c.signal});
   clearTimeout(tt);
   if(r.status===429){lastErr="429";continue;}
   if(!r.ok){lastErr="HTTP "+r.status;continue;}
   const j=await r.json();
   if(j.error){lastErr=j.error.message||"rpc error";continue;}
   return{node:u,result:j.result};
  }catch(e){lastErr=e.message;}
 }
 return{node:null,result:null,error:lastErr};
}
/* =====================================================================
   DATA REFRESH PIPELINE
   step 1: GT new pools (discovery)
   step 2: Dex batch enrichment (30 mints/call) incl SOL price
   step 3: outcome tracking (all seen tokens, look-ahead guard)
   step 4: watchlist multiples + paper ledger marks
   ===================================================================== */
let refreshInflight=false; /* v078: a manual refresh during an in-flight scan used to start a second interleaved run, double-counting every token observation */
async function refreshAll(force){
 if(refreshInflight){setStatus("scan already running - duplicate refresh skipped",true);return;}
 refreshInflight=true;
 const t0=performance.now();
 try{
 setStatus("scanning... fetching new pools (GeckoTerminal)",true);
 /* --- step 1: discovery --- */
 if(!backedOff("gt")){
  try{
   const t1=performance.now();
   const d=await jf(GT_NEW,"gt");
   if(!d||!Array.isArray(d.data))throw new Error("malformed GT response: data array missing - marked DOWN, never read as 0 pools"); /* v045 */
   const rows=(d.data||[]);let badK=0; /* v088 */
   for(const p of rows){
    const a=p.attributes||{};
    const rel=(p.relationships&&p.relationships.base_token&&p.relationships.base_token.data)||{};
    const mint=(rel.id||"").replace(/^solana_/,"");
    if(!isSafeKey(mint)){badK++;continue;} /* v088: a crafted mint key would otherwise flow raw into HTML and onclick handlers */

    const tx=a.transactions||{};const m5=tx.m5||{};const h1=tx.h1||{};
    S.pools[mint]={
     mint,symbol:(a.name||"?").split(" / ")[0],
     pool:(p.id||"").replace(/^solana_/,""),
     created:a.pool_created_at?Date.parse(a.pool_created_at):null,
     price:a.base_token_price_usd!=null?Number(a.base_token_price_usd):null,
     liq:a.reserve_in_usd!=null?Number(a.reserve_in_usd):null,
     b5:m5.buys??null,s5:m5.sells??null,b1:h1.buys??null,s1:h1.sells??null,
     fdv:a.fdv_usd!=null?Number(a.fdv_usd):null
    };
    if(!S.order.includes(mint))S.order.push(mint);
   }
   setH("GeckoTerminal new_pools",true,Math.round(performance.now()-t1),rows.length+" pools"+(badK?" ("+badK+" malformed-key row"+(badK===1?"":"s")+" dropped)":""));
   setStatus("scanning... "+rows.length+" pools in | enriching prices (DexScreener)",true);
  }catch(e){setH("GeckoTerminal new_pools",false,null,e.message);log("GT discovery failed: "+e.message);}
 }else{setH("GeckoTerminal new_pools",false,null,"backoff "+backoffLeft("gt")+"s");}
 /* --- step 2: dex batch enrichment --- */
 const want=[...new Set([SOLMINT,...S.order.slice(-60),...Object.keys(S.watch)])];
 if(!backedOff("dex")){
  try{
   const t2=performance.now();let n=0,okC=0,failC=0,lastErr=""; /* v045: a failed chunk can no longer ride into an OK probe */
   for(let i=0;i<want.length;i+=30){
    const chunk=want.slice(i,i+30);
    try{
     const j=await jf(DEX_BATCH+chunk.join(","),"dex");
     if(!Array.isArray(j))throw new Error("malformed Dex response: pair array missing");
     for(const q of(j||[])){
      const a=q.baseToken&&q.baseToken.address;if(!isSafeKey(a))continue; /* v088 */
      if(!S.dex[a]||((q.liquidity&&q.liquidity.usd)||0)>((S.dex[a].liquidity&&S.dex[a].liquidity.usd)||0))S.dex[a]=q;
      n++;
     }
     okC++;
     setStatus("scanning... enriching "+Math.min(i+30,want.length)+"/"+want.length+" mints | "+n+" pairs so far",true);
    }catch(e){failC++;lastErr=e.message;log("dex batch chunk failed: "+e.message);}
   }
   const sq=S.dex[SOLMINT];if(sq&&sq.priceUsd)S.solUsd=Number(sq.priceUsd);
   if(failC===0)setH("DexScreener batch",true,Math.round(performance.now()-t2),n+" pairs / "+want.length+" mints");
   else if(okC===0)setH("DexScreener batch",false,null,(lastErr||"all chunks failed")+" - enrichment UNAVAILABLE; other sources only, prices never invented");
   else setH("DexScreener batch",false,Math.round(performance.now()-t2),"PARTIAL: "+okC+"/"+(okC+failC)+" chunks ok ("+(lastErr||"")+") - unenriched tokens stay labeled, never guessed"); /* v045 */
  }catch(e){setH("DexScreener batch",false,null,e.message);log("dex batch failed: "+e.message);}
 }else{setH("DexScreener batch",false,null,"backoff "+backoffLeft("dex")+"s");}
 setStatus("scanning... tracking "+Object.keys(S.seen).length+" tokens",true);
 /* --- step 3: outcome tracking (every seen token, no survivorship) --- */
 const now=Date.now();
 for(const m of Object.keys(S.pools)){if(!S.seen[m])S.seen[m]={first:now,sym:S.pools[m].symbol};}
 for(const m of Object.keys(S.seen)){
  const s=S.seen[m];
  if(now-s.first>=SEEN_TTL&&!S.watch[m]){delete S.seen[m];continue;}
  const q=S.dex[m];const p=q?Number(q.priceUsd):0;
  const liqKnown=!!(q&&q.liquidity&&q.liquidity.usd!=null);
  const liq=liqKnown?Number(q.liquidity.usd):0;
  s.n=(s.n||0)+1;
  if(!(s.p0>0)&&p>0&&(!liqKnown||liq>=ghostFloor())){s.p0=p;s.liq0=liqKnown?liq:null;if(!liqKnown)s.p0Unproven=true;} // look-ahead guard; unknown liq anchored but flagged UNPROVEN
  // v019: a point is a ghost when KNOWN liquidity collapses - under $100 absolute or under 20% of the opening liquidity (a $10k pool drained to $1.5k is drained, even though $1.5k > $100)
  const ghost=liqKnown&&s.liq0>0&&liq<Math.max(ghostFloor(),0.2*s.liq0);
  if(p>0&&s.p0>0&&!ghost){
   if(!liqKnown)s.liqUnk=(s.liqUnk||0)+1; // counted, but tradeability UNPROVEN for this point
   const mult=p/s.p0;
   s.max=Math.max(s.max||1,mult);s.min=Math.min(s.min||1,mult);s.last=mult;s.lastT=now;
   // v009: keep a capped replay series (mult vs time, >=60s apart, max 60 pts)
   s.series=s.series||[];
   if(!s.series.length||now-s.series[s.series.length-1][0]>=60000){s.series.push([now,+mult.toFixed(4)]);if(s.series.length>60)s.series.shift();}
   const en=exitNet(mult,s.liq0);if(en!=null)s.maxNet=Math.max(s.maxNet||0,en);
   const age=(now-s.first)/60000;
   for(const[lab,mins]of[["m10",10],["m60",60],["h6",360]]){if(!s[lab]&&age>=mins)s[lab]=mult;}
  }else if(p>0&&s.p0>0){s.ghost=(s.ghost||0)+1;s.lastGhostT=now; /* v015+v019: KNOWN drained liquidity - quote exists but is not tradeable, prints excluded */}
  else s.miss=(s.miss||0)+1;
 }
 /* --- step 4: watchlist multiples, hits, alerts, ledger --- */
 for(const[m,w]of Object.entries(S.watch)){
  const q=S.dex[m];const p=q?Number(q.priceUsd):null;
  if(p==null||w.ref==null)continue;
  const wliq=q&&q.liquidity?Number(q.liquidity.usd):null;
  if(wliq!=null&&w.liq0>0&&wliq<Math.max(ghostFloor(),0.2*w.liq0)){w.ghostLiq=true;continue;} // v015+v019: no target hits or alerts on a KNOWN drained pool; unknown liq stays honest, not "drained"
  w.ghostLiq=false;
  const mult=p/w.ref;
  for(const t of TARGETS){
   if(mult>=t&&!w.hits[t]){w.hits[t]=now;buzz();pushAlert("TARGET "+t+"x hit: "+w.sym+" (chart print only - not executable profit)","gold");}
  }
  const lvl=w.alertMult||S.settings.alertMult||2; /* v035: per-token override wins over the global level */
  if(!w.alerted&&mult>=lvl){w.alerted=true;pushAlert("Alert: "+w.sym+" reached "+mult.toFixed(2)+"x (alert level "+lvl+"x"+(w.alertMult?" - token override":"")+")","warn");}
  w.lastPrice=p;w.lastMult=mult;w.lastPxAt=now; /* v037: freshness stamp for stale bar labeling */
  w.liq0=w.liq0||(q&&q.liquidity?Number(q.liquidity.usd):null);
  const L=S.ledger.find(l=>l.mint===m&&!l.closed);
  if(L){L.mark=p;L.net=(w.quote&&w.quote.status==="QUOTED")?(mult*(1+w.quote.rtPct/100)):exitNet(mult,L.liq0);}
 }
 if(typeof recordHistory==="function")recordHistory();
 if(typeof recordSignals==="function")recordSignals();
 save();
 /* v043: cycle bookkeeping - an update cycle succeeds only if at least one source answered */
 const cycNow=Date.now();
 const touched=Object.entries(S.health).filter(([k,h])=>h.atMs&&h.atMs>=cycNow-180000);
 const okSrc=touched.filter(([k,h])=>h.ok).map(([k])=>k);
 S.cycle.lastTry=cycNow;
 if(okSrc.length){S.cycle.lastOk=cycNow;S.cycle.fails=0;}else{S.cycle.fails=(S.cycle.fails||0)+1;}
 setStatus("scan "+new Date().toLocaleTimeString()+" | "+S.order.length+" pools | "+Object.keys(S.seen).length+" tracked | "+Math.round(performance.now()-t0)+"ms | free sources, paper only",true);
 render();
 }catch(e){log("refreshAll crashed: "+(e&&e.message));setStatus("scan hit an error: "+(e&&e.message)+" - previous data kept on screen, never invented",false);render();}
 finally{refreshInflight=false;}
}
/* ---------- exit-cost estimate (constant-product approximation) ---------- */
function exitNet(gross,liq0){
 if(!(gross>0))return null;
 if(!(liq0>0))return null;
 const fee=(S.settings.feePct??1)/100;
 const sell=(S.settings.paperSize||20)*gross;
 const impact=sell/(liq0+sell);
 return gross*(1-fee)*(1-impact);
}
/* ---------- alerts ---------- */
function pushAlert(msg,kind){
 const now=Date.now();
 if(kind!=="gold"){const dupe=S.alerts.find(a=>a.msg===msg&&a.kind===(kind||"info")&&now-a.t<10*60*1000);if(dupe)return;}
 S.alerts.unshift({t:now,msg,kind:kind||"info"});
 if(S.alerts.length>50)S.alerts.length=50;
 save();log(msg);
 if($("#toast"))toast(msg);
}
/* =====================================================================
   MODULE E: RISK ENGINE (keyless RPC - no rugcheck dependency)
   - mint/freeze authority via getAccountInfo (jsonParsed)
   - top-holder concentration via getTokenLargestAccounts
   ===================================================================== */
async function riskCheck(mint,force){
 const s=S.seen[mint]||(S.seen[mint]={first:Date.now(),sym:mint.slice(0,6)});
 if(s.risk&&!force)return s.risk;
 const out={at:Date.now(),mintAuth:null,freezeAuth:null,top1:null,top5:null,holdersObserved:null,supply:null,decimals:null,errors:[]};
 const a=await rpcCall("getAccountInfo",[mint,{encoding:"jsonParsed"}]);
 if(a.result&&a.result.value&&a.result.value.data&&a.result.value.data.parsed){
  const info=a.result.value.data.parsed.info||{};
  out.mintAuth=info.mintAuthority!=null;out.freezeAuth=info.freezeAuthority!=null;
  out.supply=info.supply!=null?Number(info.supply):null;out.decimals=info.decimals??null;
 }else out.errors.push("accountInfo: "+(a.error||"no parsed data"));
 const la=await rpcCall("getTokenLargestAccounts",[mint]);
 if(la.result&&Array.isArray(la.result.value)){
  const entries=la.result.value.map(v=>({addr:v.address,amt:Number(v.uiAmount||0)})).filter(v=>v.amt>0);
  const tot=entries.reduce((x,y)=>x+y.amt,0);
  out.holdersObserved=entries.length;
  /* v040 audit fix: top1/top5 are shares of the OBSERVED top-account list only (UPPER BOUND basis).
     Shares of real total supply are computed separately, only when supply+decimals verified. */
  const supplyUi=(out.supply>0&&out.decimals!=null)?out.supply/Math.pow(10,out.decimals):null;
  out.supplyUi=supplyUi;
  if(tot>0){
   out.top1=+(100*Math.max(...entries.map(e=>e.amt))/tot).toFixed(1);
   out.top5=+(100*entries.slice(0,5).reduce((x,y)=>x+y.amt,0)/tot).toFixed(1);

function scoreToken(mint){
 const p=S.pools[mint];const s=S.seen[mint];const q=S.dex[mint];
 const r=s&&s.risk;
 const liq=(q&&q.liquidity)?Number(q.liquidity.usd):(p?p.liq:null);
 const ageMin=p&&p.created?(Date.now()-p.created)/60000:null;
 const comps={};
 // age: youngest scores highest, decays over 6h
 comps.age=(ageMin==null)?{v:0,st:"NOT_OBSERVED",note:"no pool timestamp"}:{v:Math.max(0,1-ageMin/360),st:"OBSERVED",note:ageMin.toFixed(0)+"m old"};
 // liquidity: log scale $500..$500k
 if(liq==null)comps.liquidity={v:0,st:"NOT_OBSERVED",note:"no liquidity data"};
 else{const t=Math.min(1,Math.max(0,(Math.log10(Math.max(liq,1))-Math.log10(500))/(Math.log10(500000)-Math.log10(500))));comps.liquidity={v:t,st:"OBSERVED",note:fmtUsd(liq)};}

 else{const ratio=b5/(b5+s5);comps.flow={v:Math.max(0,Math.min(1,(ratio-0.3)/0.4)),st:"OBSERVED",note:b5+"b/"+s5+"s 5m"};}

 if(!r)comps.authorities={v:0,st:"NOT_OBSERVED",note:"risk not checked - press Check risk"};
 else if(r.mintAuth==null||r.freezeAuth==null)comps.authorities={v:0,st:"NOT_OBSERVED",note:"authority read incomplete ("+(r.mintAuth==null?"mint":"freeze")+" unknown) - failed reads are never safe",conf:1};
 else comps.authorities={v:(r.mintAuth||r.freezeAuth)?0:1,st:"OBSERVED",note:(r.mintAuth||r.freezeAuth)?"authority ACTIVE":"both renounced"};
 // data coverage
 let cov=0,tot=4;cov+=liq!=null?1:0;cov+=ageMin!=null?1:0;cov+=(b5!=null)?1:0;cov+=(r&&r.mintAuth!=null)?1:0;
 comps.coverage={v:cov/tot,st:"OBSERVED",note:cov+"/"+tot+" fields present"};
 const W=S.settings.weights&&typeof S.settings.weights==="object"?S.settings.weights:{age:.25,liquidity:.25,flow:.20,authorities:.20,coverage:.10};

 let score=0,obs=0;

 const _lastOk=(S.cycle&&S.cycle.lastOk)||0;

 const _dataAge=_lastOk?(Date.now()-_lastOk):Infinity;

  comps.freshness={v:0,st:"NOT_OBSERVED",note:"live data is "+(_lastOk?Math.round(_dataAge/1000)+"s old":"not fetched yet this session")+" (limit "+Math.round(_staleWin/1000)+"s) - confidence capped below the CANDIDATE bar until a fresh cycle; stale fields are never HIGH confidence"};
 }
 const hard=[];
 if(r&&r.mintAuth===true)hard.push("mint authority ACTIVE");
 if(r&&r.freezeAuth===true)hard.push("freeze authority ACTIVE");

async function walletScan(mint){

  const tkey=a=>a.tx_hash||(a.tx_from_address+"|"+(a.block_timestamp||"")+"|"+a.kind+"|"+(a.from_token_amount||"")+"|"+(a.price_from_in_usd||""));

/* =====================================================================
   MODULE D: SMART-MONEY CLUSTER ANALYSIS (repeat early buyers across pools)
   ===================================================================== */
function clusterScan(){
 const cutoff=Date.now()-CLUSTER_TTL;
 const rows=[];
 for(const[w,wi]of Object.entries(S.walletIndex||{})){
  const mints=Object.keys(wi.pools||{}).filter(m=>wi.pools[m]>cutoff);
  if(mints.length>=2)rows.push({wallet:w,pools:mints,buys:wi.totalBuys||0,last:wi.last});
 }
 rows.sort((a,b)=>b.pools.length-a.pools.length);
 // co-appearance clusters: wallets sharing >=2 pools
 const clusters=[];
 const used=new Set();
 for(const r of rows.slice(0,50)){
  if(used.has(r.wallet))continue;
  const mates=rows.filter(o=>o.wallet!==r.wallet&&!used.has(o.wallet)&&o.pools.filter(m=>r.pools.includes(m)).length>=2);
  if(mates.length>=1){
   const shared=[...new Set(mates.flatMap(o=>o.pools.filter(m=>r.pools.includes(m))))];
   clusters.push({lead:r.wallet,members:[r.wallet,...mates.map(o=>o.wallet)],sharedPools:shared});
   used.add(r.wallet);mates.forEach(o=>used.add(o.wallet));
  }
 }
 return{repeatWallets:rows,clusters,totalWallets:Object.keys(S.walletIndex||{}).length};
}

 for(const v of vals){let b=Math.floor((v-mn)/range*buckets);if(b>=buckets)b=buckets-1;if(b<0)b=0;counts[b]++;}
 const maxC=Math.max(...counts,1);
 const W=300,H=90,pad=14,bw=(W-pad*2)/buckets;
 let bars="";
 counts.forEach((c,i)=>{const h=(H-pad*2)*(c/maxC);const x=pad+i*bw;const y=H-pad-h;
  bars+=`<rect class="bar2" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-1.5).toFixed(1)}" height="${h.toFixed(1)}"><title>${fmtV(mn+i*range/buckets)} - ${fmtV(mn+(i+1)*range/buckets)}: ${c}</title></rect>`;});
 return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">
 <line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/>
 ${bars}
 <text x="${pad}" y="${H-3}">${esc(fmtV(mn))}</text>
 <text x="${W-pad}" y="${H-3}" text-anchor="end">${esc(fmtV(mx))}</text>
 <text x="${pad}" y="10">${esc(label)} (n=${vals.length})</text></svg>`;
}
function svgSparkline(points){

}

function scoreCalibCard(){
 const H=(S.sigHist||[]).filter(x=>x.max!=null);
 const A=Object.values(S.seen).filter(s=>s.p0>0&&(s.n||0)>=2&&!((s.max||1)===1&&(s.min||1)===1&&(s.n||0)>=3));
 const buckets=[[0,60],[60,75],[75,90],[90,101]];
 const rows=buckets.map(([lo,hi])=>{
  const inb=H.filter(x=>x.score>=lo&&x.score<hi);
  return{lab:lo+"-"+(hi>100?100:hi),n:inb.length,hit2:pct(x=>x.max>=2,inb),medMax:median(inb.map(x=>x.max))};
 });
 const baseHit=pct(s=>s.max>=2,A);
 const body=rows.map(r=>`<tr><td>${r.lab}</td><td>${r.n}</td><td>${r.n<3?'<span class="badge dim">INSUFFICIENT SAMPLE</span>':r.hit2}</td><td>${r.n<3?"-":f2(r.medMax)}</td></tr>`).join("");
 return`<div class="card"><h3>Score calibration - does the score earn its keep? (v010)</h3>
 <div class="tscroll"><table><thead><tr><th>Score band</th><th>n</th><th>2x gross</th><th>median max</th></tr></thead><tbody>${body}</tbody></table></div>
 <div class="note">Every candidate the engine ever flagged, bucketed by its score AT FLAG TIME, against its forward outcome. Baseline (all moving tokens) 2x gross: ${baseHit} over ${A.length} tokens. If high bands do not beat low bands AND the baseline, the score has no edge - bands with under 3 candidates are marked INSUFFICIENT SAMPLE, not celebrated.</div></div>`;
}

/* ---------- MODULE G+: BASELINE REGISTRY (every token seen, per-token truth) ----------
   The aggregate base rate above hides WHICH tokens moved. This registry lists every token
   the scanner saw in the last 6h with its own first-observed price (look-ahead guarded),
   latest and max chart multiples, and honest status labels. No candidate cherry-picking. */
function baselineRows(){
 const now=Date.now();
 const rows=Object.entries(S.seen).map(([m,s])=>{
  const age=(now-s.first)/60000;
  const flat=!!(s.p0>0&&(s.max||1)===1&&(s.min||1)===1&&(s.n||0)>=3);
  let status,cls;
  if(!(s.p0>0)){status=(s.n||0)>=2?"NO VALID PRICE (feed never gave a chart price - not fabricated)":"AWAITING FIRST PRICE";cls="dim";}
  else if(flat){status="NO PRICE MOVEMENT (3+ polls, chart flat - untraded or dead pair; excluded from rates)";cls="dim";}
  else if((s.ghost||0)>=2&&now-(s.lastT||s.first)>5*60000){status="GHOST LIQ (known pool liquidity drained under $100 or 20% of opening - post-drain quotes excluded from prints/rates)";cls="warn";}
  else if(s.p0Unproven&&(s.liqUnk||0)>=2){status="LIQ UNKNOWN (feed gives no liquidity for this token - prints counted, tradeability UNPROVEN, not called drained)";cls="warn";}
  else if((s.miss||0)>=3&&now-(s.lastT||s.first)>10*60000){status="STALE (price feed lost it - last print kept, not extrapolated)";cls="warn";}
  else{status="TRACKING";cls="ok";}
  const dd=(s.max>1&&s.last!=null)?+(100*(1-s.last/s.max)).toFixed(1):null; // v012: giveback from peak %
  return{mint:m,sym:s.sym||shortM(m),age,p0:s.p0||null,last:s.last||null,max:s.max||null,maxNet:s.maxNet||null,dd,
   m10:s.m10||null,m60:s.m60||null,h6:s.h6||null,n:s.n||0,miss:s.miss||0,ghost:s.ghost||0,hit2:(s.max||0)>=2,flat,series:s.series||[],status,cls};
 });
 rows.sort((a,b)=>a.age-b.age); // newest (youngest) first
 return rows;
}

function healthReliabilityCard(){
 const H=S.healthHist||[];
 if(H.length<4)return'<div class="card"><h3>Source reliability (this session)</h3><div class="note">Collecting probe history - appears after a few refreshes. Persisted across reloads, capped at 240 probes.</div></div>';
 const by={};
 for(const[ts,k,ok]of H){const b=by[k]||(by[k]={n:0,ok:0,lastDown:null});b.n++;if(ok)b.ok++;else b.lastDown=ts;}
 const rows=Object.entries(by).map(([k,b])=>`<tr><td>${esc(k)}</td><td>${b.n}</td>
  <td><span class="badge ${b.ok/b.n>0.9?"ok":(b.ok/b.n>0.5?"warn":"bad")}">${Math.round(100*b.ok/b.n)}%</span></td>
  <td>${b.lastDown?fmtAge(b.lastDown)+" ago":"never this session"}</td></tr>`).join("");
 // v032: aggregate data confidence - availability of the free feeds, NOT signal quality (a 100% here still cannot prove sellability)
 let tn=0,tok=0;for(const k in by){tn+=by[k].n;tok+=by[k].ok;}
 const conf=tn?Math.round(100*tok/tn):null;
 const confCls=conf==null?"dim":(conf>=90?"ok":(conf>=60?"warn":"bad"));
 return`<div class="card"><h3>Source reliability (this session)</h3>
 <div class="pillrow"><span class="badge ${confCls}" title="share of successful feed probes in this session's recorded history">data confidence: ${conf==null?"n/a":conf+"%"}</span><span class="badge dim">feed availability only - NOT signal quality</span></div>
 <div class="tscroll"><table><thead><tr><th>Source</th><th>Probes</th><th>OK rate</th><th>Last failure</th></tr></thead><tbody>${rows}</tbody></table></div>
 <div class="note">New in v011: every probe is recorded (persisted, capped at 240). A source that flaps shows here even when the current status is OK - last-probe status alone would hide it.</div></div>`;
}

}

/* ---------- base-rate time series (chart of the truth over time) ---------- */
S.baseHist=S.baseHist||[];
try{const v=localStorage.getItem("si4_baseHist");if(v)S.baseHist=JSON.parse(v);}catch(e){}
function recordBaseHist(){
 const A=Object.values(S.seen).filter(s=>s.p0>0&&(s.n||0)>=2);
 if(A.length<3)return;
 const last=S.baseHist[S.baseHist.length-1];
 if(last&&Date.now()-last.t<10*60e3)return; // one point per 10 min
 const p=f=>A.filter(f).length/A.length;
 S.baseHist.push({t:Date.now(),n:A.length,p2:+p(s=>s.max>=2).toFixed(3),p3:+p(s=>s.max>=3).toFixed(3),belowHalf:+p(s=>s.last<0.5).toFixed(3)});
 if(S.baseHist.length>144)S.baseHist.shift();
 try{localStorage.setItem("si4_baseHist",JSON.stringify(S.baseHist));}catch(e){try{storagePrune();localStorage.setItem("si4_baseHist",JSON.stringify(S.baseHist));}catch(e2){toast("storage full - baseline history not saved; export a backup from Settings");}}
}
function baseHistChart(){
 if(S.baseHist.length<2)return'<div class="state empty">base-rate history collects one point per 10 minutes - check back later</div>';
 const W=300,H=80,pad=14;
 const series=[["p2","var(--gold)","% reached 2x"],["p3","var(--acc)","% reached 3x"],["belowHalf","var(--bad)","% below 0.5x"]];
 let paths="";
 for(const[key,color]of series){
  const pts=S.baseHist.map((b,i)=>((i/(S.baseHist.length-1))*(W-pad*2)+pad).toFixed(1)+","+(H-pad-b[key]*(H-pad*2)).toFixed(1)).join(" ");
  paths+=`<polyline fill="none" stroke="${color}" stroke-width="1.5" points="${pts}"/>`;
 }
 const legend=series.map(([k,c,l])=>`<span class="badge dim" style="color:${c}">${l}</span>`).join(" ");
 return`<svg class="chart" viewBox="0 0 ${W} ${H}"><line class="axis" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/>${paths}</svg><div class="pillrow">${legend}</div>`;
}
/* ---------- RPC node latency monitor ---------- */
S.nodeLat=S.nodeLat||{};
async function probeNodes(){
 const el=$("#nodeLatBody");if(!el)return;
 el.innerHTML=stateBlock("loading","probing "+RPC_NODES.length+" RPC nodes...");
 const rows=[];
 for(const u of RPC_NODES){
  const t0=performance.now();let ok=false,ex="";
  try{
   const c=new AbortController();const tt=setTimeout(()=>c.abort(),6000);
   const r=await fetch(u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({jsonrpc:"2.0",id:1,method:"getHealth"}),signal:c.signal});
   clearTimeout(tt);ok=r.ok;if(!ok)ex="HTTP "+r.status;
  }catch(e){ex=e.message;}
  const ms=Math.round(performance.now()-t0);
  S.nodeLat[u]={ok,ms,ex,at:Date.now()};
  rows.push(`<tr><td class="mint">${esc(u.replace("https://",""))}</td><td><span class="badge ${ok?"ok":"bad"}">${ok?"OK":"DOWN"}</span></td><td>${ms}ms</td><td class="mint">${esc(ex)}</td></tr>`);
 }
 el.innerHTML=`<div class="tscroll"><table><thead><tr><th>Node</th><th>Status</th><th>Latency</th><th>Error</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
 try{cardifyTables();}catch(e){} /* v072 */
}
window.probeNodes=probeNodes;

/* ---------- ledger analytics (per-position truth) ---------- */
function ledgerAnalytics(){
 const L=S.ledger;if(!L.length)return"";
 const nets=L.map(l=>l.net).filter(n=>n!=null);
 const wins=nets.filter(n=>n>1).length;
 const best=L.reduce((a,l)=>(l.net!=null&&(a==null||l.net>a.net))?l:a,null);
 const worst=L.reduce((a,l)=>(l.net!=null&&(a==null||l.net<a.net))?l:a,null);
 const hold=L.map(l=>l.closed?(l.closedAt!=null?(l.closedAt-l.t)/60000:null):(Date.now()-l.t)/60000).filter(x=>x!=null);
 const noClose=L.filter(l=>l.closed&&l.closedAt==null).length;
 return`<div class="kv">
 <b>positions</b><span>${L.length} (${L.filter(l=>!l.closed).length} open)</span>${noClose?`<b>hold time</b><span class="inc">${noClose} closed position${noClose===1?"":"s"} from before close-time recording - duration unavailable, excluded from median (never invented)</span>`:""}
 <b>win rate (net&gt;1)</b><span>${nets.length?Math.round(100*wins/nets.length)+"% of "+nets.length:"n/a"}</span>
 <b>best</b><span>${best?esc(best.sym)+" "+best.net.toFixed(2)+"x":"n/a"}</span>
 <b>worst</b><span>${worst?esc(worst.sym)+" "+worst.net.toFixed(2)+"x":"n/a"}</span>
 <b>median hold</b><span>${hold.length?median(hold).toFixed(0)+" min":"n/a"}</span></div>`;
}

window.snapshotOut=()=>{

};
window.snapshotIn=ev=>{
 const f=ev.target.files&&ev.target.files[0];if(!f)return;
 const rd=new FileReader();
 rd.onload=()=>{try{
  const j=JSON.parse(rd.result);
  if(j.v!==4)throw new Error("snapshot version "+j.v+" - this app reads v4 snapshots");
  for(const k of["seen","watch","ledger","walletIndex","settings","sigHist","baseHist","notes"])if(j[k]!=null)S[k]=j[k];
  save();applySettings();render();toast("snapshot restored");
 }catch(e){toast("import failed: "+e.message);}};
 rd.readAsText(f);
};
/* ---------- onboarding (first run; dismissible, persisted) ---------- */
function onboard(){
 if(S.settings.onboarded)return;
 const ov=document.createElement("div");
 ov.id="onboard";
 ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px";
 ov.innerHTML=`<div style="background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:16px;max-width:480px;max-height:84vh;overflow:auto;color:var(--txt)">
 <h2 style="margin:0 0 8px">Solana Intelligence ${VER}</h2>
 <div style="font-size:13px;line-height:1.6">
 <p>This is a <b>paper-research</b> suite for very new Solana tokens. It never touches real money, keys or signing.</p>
 <p><b>Start here:</b> Radar shows brand-new pools. Tap a token name for its full detail (score breakdown, on-chain risk, wallet evidence, candles). Star a token to open a $${S.settings.paperSize||20} paper position and start 2x-5x monitoring.</p>
 <p><b>Learn the truth tabs:</b> Ledger shows base rates for EVERY token seen (not just picks) and your paper positions net of exit costs. Signals history tracks candidates from flag time. If starred picks do not beat the base rate, there is no edge - the app says so.</p>
 <p><b>Honest labels:</b> NOT OBSERVED / NOT_QUOTED / INSUFFICIENT SAMPLE / HOLDER_UNVERIFIED / HISTORY WINDOW LIMITED / HISTORY_PRUNED / NO VALID PRICE / STALE mean the free data cannot prove something. Nothing is fabricated to fill gaps.</p>
 <p><b>New in v036 - overlap you can drill into:</b> open any token and see exactly which multi-pool wallets entered it and when; open any wallet and see which other wallets share 2+ pools with it. Two clicks from "something feels coordinated" to the actual evidence table - with the honest label intact: overlap is observable, its reason is not.</p>
<p><b>New in v060 - a real redesign, built from a real phone screenshot:</b> the header is now one compact row (title, version, theme, refresh) with the paragraph moved to Settings; the bottom bar shows 4 tabs plus a More sheet so nothing is clipped; the Radar opens with a semicircle freshness gauge, live feed chips and icon stat cards (no more colored boxes behind numbers); token rows are rounded cards with age, liquidity, price and buy/sell tiles, score and status chips, and tappable link pills. Every number is still read from live state.</p>
<p><b>New in v059 - evidence time per source:</b> Bot B's BA-006 audit was right about this app too: the decision card showed one cycle-level fetch time for everything. Now GeckoTerminal and DexScreener each show their own last probe time (and say FAILED if the last probe failed), and the RPC read keeps its own time, so one source updating moves only its own time.</p>
<p><b>New in v058 - confidence that dies with stale data:</b> a challenge audit (BA-002) proved the confidence number only counted missing fields, so a 10-minute-old quote with everything filled still read HIGH. Now, when live data is older than two refresh intervals (or never fetched), confidence is capped below the CANDIDATE bar and a freshness component says why. Also (BA-003): the decision card now names every evidence source with its fetch time - price/liquidity/flow from GeckoTerminal + DexScreener, authorities from the Solana RPC with the exact read time, wallet evidence labeled co-appearance only.</p>
<p><b>New in v057 - the full visual redesign:</b> the whole dashboard moves to the premium command-center look: deeper dark palette, amber as the default accent (blue, green and purple stay one tap away - your saved choice always wins), pill-shaped gradient buttons, 16px rounded cards, a glowing active tab in the bottom bar, and a circular data-freshness gauge on the Radar that drains from green to amber to red over two refresh intervals - a stale feed looks stale at a glance. The header version badge is now covered by a self-test so it can never lag the build again. Every feature, data feed and honest label is unchanged - this pass is visual only. Honest note added: release-time 360px mobile checks run in headless Chromium emulation, physical devices NOT TESTED.</p>
<p><b>New in v056 - command center, stage 1:</b> the Radar now opens with a live overview strip - discovered / qualified / rejected / monitoring / critical alerts (last hour) / feed status - every number computed from real state, zero shown as zero, and a freshness line stating exactly when live data last arrived.</p>
<p><b>New in v055 - receipts on the wall:</b> Settings now carries a Data sources &amp; research log (every external dependency with why-it-is-used, cost/license and last-checked date - all free tiers, none called unlimited) and a structured Upgrade log (each recent release with date and what changed, every old version still in the repository for rollback).</p>
<p><b>New in v054 - every token gets a decision card:</b> open any token and the first card now carries Bot A's canonical status - WATCH, QUALIFIED, REJECTED or DATA INCOMPLETE - with the reasons, what would change the decision, and the next trigger. Score components are tagged VERIFIED or MISSING, the score itself stays labeled ESTIMATE (untuned weights), and nothing is ever promised. This is the dual-AI challenge format, built in.</p>
<p><b>New in v053 - the app picks itself up fast:</b> if a scan cycle fails completely or the discovery source is down, the next scan comes in 20 seconds instead of waiting out the full interval, and the countdown says "retry (source down)" in plain words so you always know why. Once a source answers again, the normal cadence resumes. Proven by two new self-tests.</p>
<p><b>New in v052 - fault tolerance you can watch, not just trust:</b> the self-test suite now injects real failures into the fetch layer and proves the app behaves: a malformed 200 is rejected (never read as zero pools), an HTTP 429 throws and arms a visible 60-second backoff, a hung source times out cleanly instead of freezing the scan, and during backoff the network is never even touched. Open the Health tab and watch all four go green.</p>
<p><b>New in v051 - hold-out proof, not one lucky window:</b> the 2x gross base rate now faces a hold-out check: tokens split in time order into an older half and a newer half, and both rates are shown side by side with their n. If either half has under 30 tokens the card says NOT PROVEN in plain words. A rate that only lived in one window is a story, not a stat - this card refuses to tell stories.</p>
<p><b>New in v050 - a full disk can no longer eat your data silently:</b> every save path (state, notes, signal history, baseline history) used to swallow storage-full errors in an empty catch - the app would quietly stop saving and you would only find out after losing everything. Now the app prunes its oldest disposable history, retries the save, tells you what it pruned, and if storage stays full it says STORAGE FULL in plain words with backup instructions. Two new self-tests force both failures and prove the behavior.</p>
<p><b>New in v049 - no silent window, ever:</b> the status line now narrates every scan live - pools discovered, enrichment chunk by chunk with a running pair count, then the tracked-token count - so even on a slow connection you always see the scan working instead of a frozen screen. And if a scan ever crashes mid-way, the line says so honestly and keeps your previous data on screen (a competing scanner was measured leaving users 24 seconds with zero feedback; that class of fault is now impossible here and covered by two new self-tests).</p>
<p><b>New in v048 - exports you can trust, proven by test:</b> the audit found that the CSV escaper corrupted any field containing a double quote (it swapped quotes for apostrophes) and that exported files were open to spreadsheet formula injection - cells starting with =, +, - or @ execute as formulas when opened in Excel or Sheets. Both fixed across all seven CSV exports: quotes now double per RFC 4180, dangerous leading characters get an apostrophe prefix, and four new self-tests prove the escaper round-trips, the guard holds, and backup files pass their own validator while corrupt files are refused.</p>
<p><b>New in v047 - a score you can see, that refuses to bluff:</b> every Radar row now shows its score chip (number + verdict + a low-conf marker when thin data dragged confidence down), and the Radar can sort by highest score. The audit behind it found something important: a strong-looking token could previously reach CANDIDATE without its mint/freeze authorities ever being read. That is fixed - no authority read, no CANDIDATE, however pretty the numbers. Unchecked caps at WATCH. The chip never pretends: unobserved parts earn zero, and the full component breakdown stays one tap away in Signals.</p>
<p><b>New in v046 - one dead feed now shows up everywhere:</b> the sabotage testing went further - discovery alive but enrichment dead, then the on-chain nodes dead. The app behaved honestly (dead sources DOWN, authorities NOT OBSERVED, verdict CAUTION - never "safe") - except you had to open the Health tab to know anything was wrong. Now a slim PARTIAL FEED bar appears above every screen naming the dead source and its reason, with a retry button, until it recovers. What is broken is always visible where you are looking, not one tab away.</p>
<p><b>New in v045 - we broke the feeds on purpose:</b> this version was tested with deliberately sabotaged data sources (garbled JSON, rate-limit responses, timeouts). The sabotage caught a real bug: when a DexScreener chunk failed, the failure was logged but the source still recorded a HEALTHY probe - a dead feed looked like a quiet one, and the confidence meter believed it. Now every failed chunk counts: the source shows DOWN, or PARTIAL with exact chunk counts when only some failed, and wrongly-shaped responses are rejected instead of read as empty. Missing data stays labeled. A feed that cannot answer can no longer pretend it did.</p>
<p><b>New in v044 - built for thumbs, proven by measurement:</b> the whole app was rendered at a real 360px phone viewport and every interactive element was measured. No sideways page scroll exists (long tables scroll inside their own boxes, as designed) - but the small action buttons measured only 23-25px tall, too small for a thumb. On phones and touch screens those controls now grow to 36-40px minimums; the desktop layout keeps its dense look. The Health self-test now measures overflow and tap-target heights on every run and says SKIP when a check does not apply to the current screen - a skip is reported, never counted as a pass.</p>
<p><b>New in v043 - the app shows its own heartbeat:</b> the Health tab now opens with an Update cycle card: when the last good refresh happened, when the last attempt ran, how many cycles in a row have failed (UPDATE FAILED, counted, never hidden), and how fresh each data source is right now. If a source stops answering you see DATA INCOMPLETE or STALE in plain words - the app would rather show you a wound than paint over it.</p>
<p><b>New in v042 - silence is not a verdict:</b> when the feeds drop a token for half an hour, the journal now says LOST FEED instead of letting its last price pose as a fading chart. Filter chips sit on the journal (printed / held / below / faded / lost / early) with live counts, so one tap shows exactly how the flags are doing. Cards now settle in with a short, quiet motion - and if your phone asks for reduced motion, the app listens.</p>
<p><b>New in v041 - the journal starts judging itself:</b> each flagged token now earns a plain verdict once there are enough observations - printed, held, below ref, or faded - all from recorded multiples, never adjectives. And the journal now compares its own hit rate against every token the app saw: if the flags do not beat the baseline, the app says there is no edge, in writing, next to both sample sizes. A score that cannot beat the base rate is a checklist, not a signal - v041 makes the app admit which one it currently is.</p>
<p><b>New in v040 - three quiet math bugs, fixed in the open:</b> holder percentages now say exactly what they divide by (verified total supply when the chain confirms it, otherwise an explicitly labeled upper bound on observed balances - never "% of supply" by accident); the authorities part of the score only counts when both mint AND freeze authority were actually read; and closed paper positions measure hold time to the moment you closed them, not to whenever you look. Old closed entries without a close time say "unavailable" - a missing fact is shown, never invented.</p>
<p><b>New in v039 - a dead pipe replaced, honestly:</b> the audit probed every endpoint the app uses from the live page itself. One was dead: the old Jupiter quote address could never answer again, so quoted round-trips always said NOT_QUOTED. The app never faked a number - and now it does not have to: the quote module points at a verified-working endpoint, and the RT button can really quote again. When it still cannot (thin pool, no route), NOT_QUOTED stays - an honest no, never an invented yes.</p>
<p><b>New in v038 - scores you can weigh, records you can keep:</b> open any token and the score breakdown now shows what each part is worth (its weight) and exactly how many points it added - a part that was NOT OBSERVED adds zero, and you see that. The signal journal now downloads as a CSV you can keep outside the browser, and each journal row compares the liquidity at flag time against right now, with the signed change. Points explain a checklist; they never predict a price.</p>
<p><b>New in v037 - progress you can see, history you can trust:</b> every starred row now shows a small bar filling toward its next unhit target (2x, 3x, then 5x), and signal history entries carry the facts as they were at flag time - liquidity, pool age, which score components were observed. A bar is progress, not a promise; frozen flag-time facts mean later events cannot rewrite the record of what the engine saw when it flagged.</p>
<p><b>New in v035 - your thresholds, your rows:</b> a starred token can now carry its own alert level (the alert button on its watchlist row) - one token can scream at 1.5x while the rest wait for 3x. Radar rows wear a CLUSTER chip when wallets active across 2+ new pools entered the token: real co-appearance evidence from the wallet index, labeled as exactly that and nothing more. Light mode also got a contrast pass - dim text and gold badges are darker, so daylight reading stops washing out.</p>
<p><b>New in v034 - time and evidence you can see:</b> the header now counts down to the next refresh, and Health draws the last 30 probes per source as green/red bars with average latency - flapping sources look like what they are. Two opt-in Android comforts: keep-screen-awake and vibrate-on-target (both labeled NOT TESTED from the build box). Every detail page has one-tap Copy mint, the error log can be cleared, the watchlist sorts your way (multiple, newest, name - saved), and the welcome card finally says the real version number. The priority pass added wallet evidence tables (every entry shows its tracked outcome), accent themes, and a fast 40-row render cap on big Radar lists.</p>
<p><b>New in v033 - the app tells you when it is blind:</b> when every free feed fails, a banner now says so with a one-tap retry - and anything you still see is stored data wearing its FALLBACK label, never dressed up as live. The Ledger separates REALISED profit (closed positions only) from UNREALISED marks (numbers that can vanish), and a new session report copies the day's honest summary in one tap. Every token now links out to GMGN and Binance Web3 (navigation only - never a listing claim), the Detail view shows recorded price points as a real table, and the keyboard is a first-class citizen: arrows switch tabs, R refreshes, / searches, 1-9 jump tabs, Escape goes back.</p>
<p><b>New in v032 - one number for feed health, honestly fenced:</b> the Health tab now opens with a data-confidence percentage: the share of successful feed probes this session. It answers "is the data flowing?" - and its label says exactly what it cannot answer: a 95% here says nothing about whether any token is sellable. A number without a fence becomes a rumor.</p>
 <p><b>New in v031 - a quieter list that admits it is quieter:</b> two new toggle chips on the Radar: hide drained (pools whose liquidity collapsed) and hide clones (tickers shared by 2+ live pools). When they hide anything, the note line says exactly how many rows are hidden. Filters that silently shrink the world are how rugs look rare; these announce themselves.</p>
 <p><b>New in v030 - give the shadow a name:</b> tracking a wallet as 7xKq..9f is how you lose it. Open any wallet in Clusters, name it (fast-bot-1, lucky-wallet, whatever sticks), and the alias follows it through the cluster table, the detail page, and your backups. An alias is your label, not an identity the chain proved - the UNVERIFIED line still stands.</p>
 <p><b>New in v029 - early means early:</b> the Radar now has a max-age box: type 30 and only pools under 30 minutes old show. A pool with no timestamp from the source is dropped, not guessed young - an unknown age is not a young age. Set it once and it sticks with your other filters.</p>
 <p><b>New in v028 - no dead-end tables:</b> the baseline registry audited every token but made you memorize a mint to act on it. Every row now opens the full detail in one tap and carries its own star button. An audit you cannot act on is homework; now it is a doorway.</p>
 <p><b>New in v027 - your thesis next to your multiple:</b> notes existed only on the detail page, far from the decision. Now a starred token shows its note excerpt right on the watchlist row, and the copied summary carries the note with it - so when a token hits 3x you see WHY you starred it, not just THAT you did.</p>
 <p><b>New in v026 - an alert log you can audit:</b> the alerts panel now filters to just targets or just warnings with live counts, and exports the full history as CSV with real timestamps. What the app told you and when is now a file you can check, not a memory you have to trust.</p>
 <p><b>New in v025 - your honesty threshold, your call:</b> the $100 drained-pool floor was my default, not a law of nature. It is now a Settings number: raise it to be stricter about what counts as tradeable, lower it for dust-liquidity chains. Whatever you set, the 20%-of-opening rule still rides on top, and an invalid value falls back to $100 instead of silently breaking the gate.</p>
 <p><b>New in v024 - a young window admits it is young:</b> open the app for 20 minutes and a 6-hour hit rate would be a lie wearing a statistic's clothes. The baseline registry now shows its actual collection window (Xm of 360m) and marks the 10m and 1h columns with an asterisk until the window is old enough to support them. A rate is only as honest as the window behind it.</p>
 <p><b>New in v023 - the whole watchlist in one paste:</b> v021 moved one audit; the new Copy watchlist summary button moves them all. Every starred token sorted by multiple, with its reference price, hit targets and flags, ending with the honest line that chart prints are not executed profit. Your morning briefing to yourself is now one tap.</p>
 <p><b>New in v022 - warnings belong on the row, proof belongs on the page:</b> a token whose liquidity collapsed now wears a red DRAINED chip right in the Radar list - you see it before you ever open the detail. And the Health tab now shows exactly how many tokens, stars, ledger entries and notes this page load restored from storage. Persistence is proven with numbers, not adjectives.</p>
 <p><b>New in v021 - the audit travels as text:</b> every token detail page now has a Copy audit button. One tap and the honest summary is on your clipboard - age, liquidity, tracking record, authorities, flags, and the NOT VERIFIED lines that prove nothing was hidden. Paste it into a chat, a note, or a report; it reads the same everywhere because it is just text.</p>
 <p><b>New in v020 - your data can leave with you:</b> the export button made a report; the new Backup button makes a real backup - every section this app stores, in one file. Restore validates the file before touching anything, tells you exactly which sections will be overwritten, and asks first. Browser clears and device swaps no longer erase your watchlist and notes.</p>
 <p><b>New in v019 - drained means drained, unknown means unknown:</b> v015 blocked ghost prints under $100, but a $10,000 pool drained to $1,500 is just as drained. The rule is now relative too: under 20% of opening liquidity excludes the print. And when a feed simply has no liquidity number for a token, that is no longer treated as drained - the prints count, the token wears a LIQ UNKNOWN label, and tradeability stays honestly UNPROVEN.</p>
 <p><b>New in v018 - know what your browser is carrying:</b> the Health tab now lists every key this app stores with its real size, and a prune button removes only what is safe to lose: closed paper positions older than 7 days and tokens past the 6-hour tracking window. Your watchlist, notes and settings are never touched. An app that hides its own footprint should not be trusted with yours.</p>
 <p><b>New in v017 - when two feeds disagree, believe neither:</b> the Radar now compares the GeckoTerminal pool price with the DexScreener batch price on every row. A gap over 10% gets a FEED DIVERGE badge and a count in the header. Two free feeds that disagree are telling you at least one is stale or wrong - the honest answer is to show the fight, not to average it away.</p>
 <p><b>New in v016 - a ticker is never identity:</b> scammers spawn pools with the same symbol as a hot token within minutes. The Radar now counts how many live pools share each ticker (across every pool the feed returned, even ones your filters hide) and warns SYMBOL CLONE xN on the row. Always verify the mint on solscan - the letters in a ticker prove nothing.</p>
 <p><b>New in v015 - a drained pool is not a moon:</b> when liquidity falls under $100 a chart can show a million-x price nobody could ever sell at. Those ghost quotes are now excluded from prints, base rates, target hits and alerts, and the token is labeled GHOST LIQ so you can see exactly what was ignored and why.</p>
 <p><b>New in v014 - hear the alert, don't stare at the screen:</b> turn on Sound alerts in Settings and the app beeps when a watch token crosses your alert level. Browsers block audio until you tap once - press Test sound once to unlock it. It works only while the page is open; there is no backend.</p>
 <p><b>New in v013 - is that wallet actually good:</b> every wallet in the Clusters tab now carries its own track record - how many of its entries were tracked and how many printed 2x gross. Under 3 tracked entries it says UNPROVEN; above, it still warns that survivorship and a tiny sample cannot prove skill. A fast wallet is not automatically a smart wallet.</p>
 <p><b>New in v012 - a print you never sold is not a print you kept:</b> the Ledger now shows each token's giveback from its peak, and across every token that printed 2x gross, the median giveback and the share that handed back half or more. This is the honest cost of holding, measured on your own data - not a lecture.</p>
 <p><b>New in v011 - outages cannot blank the chart:</b> when the candle feed fails, the Detail view now draws the app's own recorded price points instead - clearly labeled FALLBACK, not candles, with the failure reason shown. The Health tab also keeps a persisted probe history per source: a source that flaps between OK and DOWN shows its true ok-rate, not just its last lucky status.</p>
 <p><b>New in v010 - does the score earn its keep:</b> the Signals tab now buckets every candidate the engine ever flagged by its score at flag time and compares forward outcomes, against the all-token baseline printed next to it. High bands must beat low bands AND the baseline, or the score has no edge - and bands under 3 candidates are marked INSUFFICIENT SAMPLE instead of being celebrated.</p>
 <p><b>New in v009 - does "early" actually win:</b> the Ledger tab now splits base rates by token age (0-15m, 15-60m, 1-6h). If the young bucket does not beat the older ones in your own collected data, "catch it early" has no proven edge - and the app says so. Baseline rows also carry a small replay sparkline of the token's multiple over time.</p>
 <p><b>New in v008 - how LONG did a print take:</b> the Targets tab now shows the minutes or hours each target took to print after you starred a token, plus a median per target across your starred set. A slow grind and a fast spike are different beasts; now you can see which is which.</p>
 <p><b>New in v007 - dead prices cannot fake a median:</b> tokens whose chart price never moves across 3+ polls (untraded or dead pairs) are labeled NO PRICE MOVEMENT and removed from every base-rate statistic, with the excluded count shown. And the app now saves on page close, so a fast exit cannot eat your last changes.</p>
 <p><b>New in v005 - audit the base rate yourself:</b> the Ledger tab now lists every token the scanner saw, one row each: first observed price, latest and max chart multiples, net-of-cost estimate, 10m/1h checks, and a status label. Export it as CSV and check any claim against the raw rows. When the free trades feed only shows a recent window but Dex reports heavy 24h activity, the app says HISTORY WINDOW LIMITED instead of pretending the token had few buyers.</p>
 <p><b>Limits:</b> alerts and tracking run only while this page is open. Wallet independence and sellability cannot be proven with free browser data.</p>

let _audioCtx=null;
function beep(){
 try{
  _audioCtx=_audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(_audioCtx.state==="suspended")_audioCtx.resume().catch(()=>{});
  const seq=[[880,0,.09],[1320,.12,.09]];
  for(const [freq,off,dur] of seq){
   const o=_audioCtx.createOscillator(),g=_audioCtx.createGain();
   o.type="sine";o.frequency.value=freq;
   const t0=_audioCtx.currentTime+off;
   g.gain.setValueAtTime(0,t0);
   g.gain.linearRampToValueAtTime(.18,t0+.01);
   g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
   o.connect(g);g.connect(_audioCtx.destination);
   o.start(t0);o.stop(t0+dur+.02);
  }
 }catch(e){/* audio unavailable - stay silent, never crash an alert */}
}

function storageReport(){
 const rows=[];let total=0;
 for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k||!k.startsWith("si4_"))continue;const v=localStorage.getItem(k)||"";const b=v.length*2;total+=b;rows.push([k,b]);}
 rows.sort((a,b)=>b[1]-a[1]);

 return `<div class="note">Total ${(total/1024).toFixed(1)} KB across ${rows.length} keys on this device (UTF-16 estimate; quota is browser-dependent, ~5 MB typical - NOT guaranteed). The paper ledger grows until pruned.</div>
 <div class="controls"><button class="btn mini" onclick="pruneStorage()">prune old data</button></div>

}
window.pruneStorage=()=>{
 if(!confirm("Prune local data? Removes closed paper positions older than 7 days and seen-tokens past the 6h tracking window. Watchlist, notes, settings and wallet index are KEPT."))return;

 render();
};

 ["Why free data, honestly labeled, beats paid promises",

 ["What NOT TESTED means on this app",

 ["The CLUSTER chip - overlap, not intelligence",
