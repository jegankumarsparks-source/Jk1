function viewLearn(){
 const started='<div class="card"><h2>Getting started - first 10 minutes</h2><ol class="note" style="line-height:1.9"><li><b>1.</b> Open the Radar tab. Rows are new pools from the free feeds. A green SOURCE OK strip means data is live; a banner means stored data only.</li><li><b>2.</b> Tap any row. Read the score components - OBSERVED or NOT OBSERVED. Never act on a score with unread parts.</li><li><b>3.</b> Press <b>Check risk</b> on the detail. Mint authority ACTIVE means supply can be printed; freeze ACTIVE means your tokens can be frozen. Either one is a hard pass for most people.</li><li><b>4.</b> Star (&#9734;) one token to open a fake-$20 paper position. You are now practicing, not trading.</li><li><b>5.</b> Watch the Targets tab. 2x-5x here are chart prints vs your recorded reference - labeled, never promised profit.</li><li><b>6.</b> Open Ledger and compare your starred picks against the ALL-token base rates. No edge over the base rate = no edge, and the app says so.</li><li><b>7.</b> Turn on Sound alerts in Settings and tap Test sound once (the browser requires that tap). Alerts only fire while the page is open.</li><li><b>8.</b> Settings - Backup. Download your JSON now, before you need it.</li><li><b>9.</b> Skim the topics below whenever a label confuses you - every honest label in the app is explained here in English and Tanglish.</li><li><b>10.</b> Remember the footer: PAPER ONLY. NOT FINANCIAL ADVICE. Nothing here is a promise about real money.</li></ol></div>';
 return started+`<div class="card"><h2>Learn - the concepts behind every number</h2>
 <div class="note">Short bilingual explainers (English + Tamil) for the ideas this app is built on. Understanding these matters more than any single score.</div>
 <div class="controls"><button class="btn mini ghost" onclick="exportLearnTXT()">export guide as TXT</button> <span class="hint">the guide travels too - plain text, open anywhere</span></div>
 ${LEARN.map(([t,e,ta])=>`<details><summary>${t}</summary><p style="font-size:13px">${e}</p><p style="font-size:12px;color:var(--dim)">${ta}</p></details>`).join("")}
 <div class="card"><h3>The one rule</h3><p style="font-size:13px">A chart multiple is not money. Money = entry price, exit price, fees, slippage, and whether anyone is there to buy what you sell. This app exists to measure that honestly - paper first, always.</p></div></div>`;
}
/* ---------- export the whole Learn guide as plain text ---------- */
window.exportLearnTXT=()=>{
 const lines=["SOLANA INTELLIGENCE v056 - LEARN GUIDE (plain-text export)","Every honest label in the app, explained in English + Tanglish. PAPER ONLY - NOT FINANCIAL ADVICE.","="+"".padEnd(70,"=")];
 for(const [t,e,ta] of LEARN){lines.push("","## "+t,"","EN: "+e,"","TA: "+ta);}
 lines.push("","GETTING STARTED: Radar row -> detail -> Check risk -> star for fake-$20 paper -> Targets -> compare vs base rates in Ledger -> backup in Settings. Sound alerts need one tap. Footer rule: a chart multiple is not money.");
 const blob=new Blob([lines.join("\n")],{type:"text/plain"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="solana_intelligence_v056_learn_guide_"+Date.now()+".txt";a.click();
 toast("learn guide exported ("+LEARN.length+" topics)");
};
/* ---------- daily summary report (shareable text) ---------- */
window.buildReport=()=>{
 const A=Object.values(S.seen).filter(s=>s.p0>0&&(s.n||0)>=2);
 const open=S.ledger.filter(l=>!l.closed);
 const L=["SOLANA INTELLIGENCE v004 - status report","time: "+new Date().toLocaleString(),"",
 "pools in radar: "+S.order.length+" | tracked 6h: "+Object.keys(S.seen).length+" | wallet index: "+Object.keys(S.walletIndex||{}).length,
 "base rates (n="+A.length+"): 2x "+pct(s=>s.max>=2,A)+" | 3x "+pct(s=>s.max>=3,A)+" | below 0.5x "+pct(s=>s.last<0.5,A),
 "median multiple: 10m "+f2(median(A.map(s=>s.m10)))+" | 1h "+f2(median(A.map(s=>s.m60))),
 "candidates recorded: "+S.sigHist.length+" | watchlist: "+Object.keys(S.watch).length+" | paper positions: "+S.ledger.length+" ("+open.length+" open)",
 "sources: "+Object.entries(S.health).map(([k,v])=>k+"="+(v.ok?"OK":"DOWN")).join(", "),"",
 "PAPER RESEARCH ONLY - no real money, no advice. Chart multiples are not executable profits."];
 const txt=L.join("\n");
 const el=$("#reportOut");
 if(el){el.style.display="block";el.value=txt;}
 if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>toast("report copied")).catch(()=>toast("report ready - copy manually"));}
 else toast("report ready - copy manually");
};
/* ---------- bulk watchlist actions ---------- */
window.quoteAll=async()=>{
 const ks=Object.keys(S.watch);if(!ks.length){toast("nothing starred");return;}
 toast("quoting "+ks.length+" tokens (sequential, rate-friendly)...");
 for(const m of ks){const w=S.watch[m];if(!w)continue;w.quote=await quoteRT(m);save();render();}
 toast("quotes done");
};
window.clearClosed=()=>{const n=S.ledger.length;const closable=S.ledger.filter(l=>l.closed).length;if(!closable){toast("no closed positions to clear");return;}if(!confirm("Clear "+closable+" closed paper positions from the ledger? Their realised profit/loss history is removed permanently. Open positions are KEPT."))return;S.ledger=S.ledger.filter(l=>!l.closed);save();toast("removed "+(n-S.ledger.length)+" closed positions");render();};
/* ---------- v034: wake lock (keep screen awake while open) ---------- */
let wakeLock=null;
async function applyWake(){
 const want=!!S.settings.wake;
 if(!want){if(wakeLock){try{await wakeLock.release();}catch(e){} wakeLock=null;}return;}
 if(!("wakeLock" in navigator)){toast("wake lock unsupported in this browser");return;}
 try{wakeLock=await navigator.wakeLock.request("screen");}catch(e){toast("wake lock refused: "+e.message);}
}
window.toggleWake=async()=>{S.settings.wake=!S.settings.wake;save();await applyWake();render();toast(S.settings.wake?"screen stays awake while this page is open (battery cost)":"wake lock off");};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S.settings.wake)applyWake();});
/* ---------- v034: vibrate on target hit (Android) ---------- */
function buzz(){if(S.settings.vib&&"vibrate" in navigator){try{navigator.vibrate(180);}catch(e){}}}
/* ---------- v034: one-tap copy mint ---------- */
window.copyMint=async m=>{try{await navigator.clipboard.writeText(m);toast("mint copied: "+shortM(m));}catch(e){toast("copy failed: "+e.message);}};
/* ---------- v034: clear runtime error log ---------- */
window.clearErrLog=()=>{if(!S.errLog.length){toast("error log already empty");return;}const n=S.errLog.length;S.errLog=[];save();render();toast("cleared "+n+" logged errors");};
/* ---------- keyboard shortcuts ---------- */
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"&&detailMint){backTo("Radar");return;}
 if(e.target.matches("input,textarea,select"))return;
 const i=TABS.findIndex(([t])=>t===tab);
 if(e.key==="ArrowRight"){go(TABS[(i+1)%TABS.length][0]);}
 else if(e.key==="ArrowLeft"){go(TABS[(i-1+TABS.length)%TABS.length][0]);}
 else if(e.key==="r"||e.key==="R"){refreshAll(true);}
 else if(e.key==="/"){e.preventDefault();const q=document.getElementById("q");if(q){go("Radar");setTimeout(()=>{const q2=document.getElementById("q");if(q2)q2.focus();},50);}}
 else if(/^[1-9]$/.test(e.key)){const t=TABS[Number(e.key)-1];if(t){detailMint=null;go(t[0]);}}
});
/* ---------- global error capture (visible in Health) ---------- */
S.errLog=S.errLog||[];
window.addEventListener("error",e=>{S.errLog.unshift({t:Date.now(),msg:String(e.message||e.error||"unknown")});if(S.errLog.length>20)S.errLog.length=20;});
window.addEventListener("unhandledrejection",e=>{S.errLog.unshift({t:Date.now(),msg:"promise: "+String(e.reason||"unknown")});if(S.errLog.length>20)S.errLog.length=20;});
function errLogBlock(){
 if(!S.errLog.length)return'<span class="badge ok">no runtime errors captured</span>';
 return S.errLog.slice(0,10).map(x=>`<div class="note"><span class="badge bad">${new Date(x.t).toLocaleTimeString()}</span> ${esc(x.msg)}</div>`).join("");
}

TABS.splice(10,0,["Learn","&#128218;"]);

const _viewSettings0=VIEWS.Settings||viewSettings;
VIEWS.Settings=function(){return _viewSettings0()+'<div class="card"><h2>Snapshot (backup / restore)</h2><div class="controls"><button class="btn mini" onclick="snapshotOut()">download snapshot</button><label class="btn mini ghost" style="cursor:pointer">restore snapshot<input type="file" accept="application/json" style="display:none" onchange="snapshotIn(event)"></label></div><div class="note">Full local state (tracking, watchlist, ledger, settings) as a JSON file - move between devices or back up before clearing.</div></div>';};
function probeCard(){
 const srcs=[...new Set(S.healthHist.map(h=>h[1]))];
 if(!srcs.length)return'<div class="card"><h2>Source probe history (v034)</h2>'+stateBlock("empty","no probes yet this session")+'</div>';
 const cards=srcs.map(k=>{
  const rows=S.healthHist.filter(h=>h[1]===k).slice(-30);
  const okN=rows.filter(h=>h[2]).length;
  const bars=rows.map(h=>`<rect x="0" y="0" width="3" height="${h[2]?10:4}" fill="${h[2]?"var(--ok)":"var(--bad)"}"/>`);
  const W=rows.length*5;
  const rects=rows.map((h,i)=>`<rect x="${i*5}" y="${h[2]?2:8}" width="3" height="${h[2]?10:4}" fill="${h[2]?"var(--ok)":"var(--bad)"}"><title>${new Date(h[0]).toLocaleTimeString()} ${h[2]?"ok "+(h[3]||0)+"ms":"DOWN"}</title></rect>`).join("");
  const lat=rows.filter(h=>h[2]).map(h=>h[3]||0);
  const avg=lat.length?Math.round(lat.reduce((a,b)=>a+b,0)/lat.length):0;
  return`<div class="kv"><b>${esc(k)}</b><span>${okN}/${rows.length} ok${lat.length?" - avg "+avg+"ms":""}</span></div><svg width="${W}" height="14" style="display:block;margin:2px 0 6px">${rects}</svg>`;
 }).join("");
 return'<div class="card"><h2>Source probe history (v034)</h2><div class="note">Last 30 probes per source: green bar = ok (height), red = DOWN. Hover a bar for time and latency. This is availability evidence, not signal quality.</div>'+cards+'</div>';
}
const _viewHealth2=VIEWS.Health;
VIEWS.Health=function(){return _viewHealth2()+'<div class="card"><h2>Runtime errors</h2><div class="controls"><button class="btn mini ghost" onclick="clearErrLog()">clear error log</button></div>'+errLogBlock()+'</div><div class="card"><h2>Status report</h2><div class="controls"><button class="btn mini" onclick="buildReport()">build + copy report</button></div><textarea id="reportOut" rows="10" style="display:none;width:100%;background:var(--bg2);color:var(--txt);border:1px solid var(--line2);border-radius:10px;padding:8px;font-size:11px"></textarea></div>';};
render();
</script>
<script>

 const st=c.fails>0?'<span class="badge bad">UPDATE FAILED x'+c.fails+'</span>':(c.lastOk?'<span class="badge ok">CYCLE OK</span>':'<span class="badge dim">NOT OBSERVED YET</span>');
 const srcs=Object.entries(S.health||{}).map(([k,h])=>{
  const ageM=h.atMs?Math.round((Date.now()-h.atMs)/60000):null;
  const lab=h.atMs==null?'<span class="badge dim">NOT OBSERVED</span>':(h.ok?(ageM!=null&&ageM>=5?'<span class="badge warn">STALE '+ageM+'m</span>':'<span class="badge ok">fresh</span>'):'<span class="badge bad">DATA INCOMPLETE</span>');
  return`<b>${esc(k)}</b><span>${lab} <span class="fresh">${h.atMs?ago(h.atMs):"-"}${h.ms!=null?" | "+h.ms+"ms":""}${h.ex?" | "+esc(String(h.ex).slice(0,60)):""}</span></span>`;
 }).join("")||'<div class="note">no sources probed yet</div>';
 return'<div class="card"><h2>Update cycle (v043)</h2><div class="kv">'
 +'<b>status</b><span>'+st+'</span>'

 +'<b>last attempt</b><span>'+ago(c.lastTry)+'</span>'

 +'</div><div class="kv">'+srcs+'</div>'
 +'<div class="note">A cycle counts as successful only when at least one source actually answered. STALE = no fresh answer in 5+ minutes. DATA INCOMPLETE = that source failed its last attempt - its data is labeled, never fabricated. This page updates only while open; there is no backend scheduler.</div></div>';
}

VIEWS.Settings=function(){return _viewSettings1().replace('<div class="setrow"><div><label>Clear all local data</label>','<div class="setrow"><div><label>Browser notifications</label><div class="hint">target-hit alerts as system notifications - only while this page is open</div></div><button class="btn ghost" onclick="enableNotif()">'+(S.settings.notif?"notifications on":"enable")+'</button></div><div class="setrow"><div><label>Clear all local data</label>');};
