name: Solana Radar server scanner
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: solana-radar-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run one scanner cycle (keyless public data, paper only)
        run: node solana-radar/server/scanner.mjs
      - name: Commit and push scanner state + feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "JK RADAR SERVER SCANNER (paper bot)"
          git config user.email "jegankumarsparks@gmail.com"
          git add solana-radar/server-scan.json solana-radar/server/state.json
          if git diff --cached --quiet; then
            echo "no changes"; exit 0
          fi
          git commit -m "radar-server: scan cycle $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main || exit 1
          done
          exit 1
