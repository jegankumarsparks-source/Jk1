<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14"><link rel="icon" href="data:,">
<title>$500 → $800 | Paper Challenge</title>
<style>
:root{--bg:#070b14;--card:#0f1729;--card2:#16203a;--line:#222f4d;--txt:#eaf0ff;--dim:#8b9bc0;--grn:#10d98a;--red:#ff4d6d;--yel:#fbbf24;--acc:#22d3ee;--vio:#8b5cf6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(900px 420px at 90% -10%,#1b1450 0,transparent 60%),radial-gradient(800px 400px at -10% 0,#08334a 0,transparent 55%),var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding:0 0 40px}
a{color:var(--acc);text-decoration:none}
.wrap{max-width:980px;margin:0 auto;padding:12px 14px}
.top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.top b{color:var(--txt);font-size:14px;letter-spacing:.3px}
.pill{margin-left:auto;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:#0c1528;font-weight:700;font-size:11px;white-space:nowrap}
.pill.on{color:var(--grn);border-color:#10d98a66;background:#0b2a22}.pill.on i{animation:pu 1.4s infinite;font-style:normal}
.pill.stale{color:var(--yel);border-color:#fbbf2466;background:#2a2108}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.2}}
.hero{margin-top:12px;padding:18px 16px 16px;border-radius:20px;background:linear-gradient(145deg,#12204a,#0d1630 60%,#101a38);border:1px solid #2a3a66;box-shadow:0 10px 40px #0008;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-40% -20% auto auto;width:300px;height:300px;background:radial-gradient(circle,#22d3ee33,transparent 65%);animation:fl 7s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(-40px,30px)}}
.lab{font-size:12px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase}
.big{font-size:clamp(38px,11vw,64px);font-weight:900;letter-spacing:-1px;line-height:1.05;margin:2px 0}
.big.up{color:var(--grn)}.big.dn{color:var(--txt)}
.sub{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.pos{color:var(--grn)}.neg{color:var(--red)}
.bar{margin-top:16px;height:16px;background:#0a1226;border:1px solid var(--line);border-radius:12px;position:relative;overflow:hidden}
.fill{height:100%;width:0;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#10d98a);transition:width 1.2s cubic-bezier(.2,.8,.2,1);position:relative}
.fill:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff5,transparent);animation:sh 2.4s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.bl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.st b{display:block;font-size:17px}.st span{font-size:11px;color:var(--dim)}
h2{font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);margin:20px 2px 8px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.coin{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;position:relative;overflow:hidden;animation:in .5s both;transition:transform .15s,border-color .2s}
.coin:active{transform:scale(.98)}.coin:hover{border-color:var(--acc)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.coin.win{border-color:#10d98a88;box-shadow:0 0 22px #10d98a22}.coin.loss{border-color:#ff4d6d55}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sym{font-weight:800;font-size:17px}.tag{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:1px 6px;margin-left:6px}
.mult{font-weight:900;font-size:22px}
.mini{height:8px;background:#0a1226;border-radius:6px;margin:10px 0 6px;position:relative;overflow:hidden}
.mini i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .8s,background .4s}
.mini u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff9}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.flash{animation:fg .9s}.flashd{animation:fr .9s}
@keyframes fg{30%{background:#10d98a33}}@keyframes fr{30%{background:#ff4d6d33}}
.empty{padding:26px;text-align:center;color:var(--dim);border:1px dashed var(--line);border-radius:16px}
details{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
summary{cursor:pointer;padding:10px 0;color:var(--dim);font-size:13px}
.cl{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
.foot{margin-top:22px;font-size:11px;color:var(--dim);text-align:center;line-height:1.6}
.sheet{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(4px)}
.sheet.show{display:flex}.sheet>div{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:linear-gradient(170deg,#16203a,#0d1428);border:1px solid #2a3a66;border-radius:22px 22px 0 0;padding:16px 16px 28px;animation:up .28s ease-out}
@media(min-width:700px){.sheet{align-items:center}.sheet>div{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.x{float:right;background:#0c1528;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:5px 12px;font-size:14px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.kv div{background:#0b1226;border:1px solid var(--line);border-radius:12px;padding:8px 10px}.kv span{display:block;font-size:11px;color:var(--dim)}.kv b{font-size:14px;word-break:break-all}
.lk{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.lk a{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#0c1528;font-size:13px;font-weight:700}
.ca{font:11px monospace;color:var(--dim);word-break:break-all;margin-top:10px}
@media(max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap">
<div class="top"><b>🎯 $500 → $800</b><span>paper challenge</span><span class="pill" id="pill">loading…</span></div>
<div class="hero">
 <div class="lab">Equity (paper)</div>
 <div class="big" id="eq">$—</div>
 <div class="sub"><span id="pnl">P&amp;L —</span><span id="real" class="pos"></span><span id="togo" style="color:var(--dim)"></span></div>
 <div class="bar"><div class="fill" id="fill"></div></div>
 <div class="bl"><span>$500 start</span><span id="pct">0%</span><span>$800 goal</span></div>
</div>
<div class="stats">
 <div class="st"><b id="s_open">–</b><span>open</span></div>
 <div class="st"><b id="s_cash">–</b><span>cash</span></div>
 <div class="st"><b id="s_wl">–</b><span>wins / losses</span></div>
 <div class="st"><b id="s_real">–</b><span>realised</span></div>
</div>
<h2><span>Coins bought</span><span id="cnt"></span></h2>
<div class="grid" id="grid"><div class="empty">Loading…</div></div>
<details id="cd"><summary id="csum">Closed trades</summary><div id="cl"></div></details>
<div class="foot" id="foot"></div>
</div>
<div class="sheet" id="sheet" onclick="if(event.target===this)hide()"><div id="sb"></div></div>
<script>
const $=id=>document.getElementById(id);let D=null,prev={},eqShown=null;
const fmt=(n,d=2)=>n==null?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const usd=n=>(n<0?'-':'')+'$'+fmt(Math.abs(n));const sg=n=>(n>=0?'+':'-')+'$'+fmt(Math.abs(n));
function px(v){if(v==null)return'—';v=Number(v);if(v>=1)return '$'+v.toFixed(4);if(v>=0.01)return '$'+v.toFixed(5);return '$'+v.toFixed(9).replace(/0+$/,'')}
function ist(iso){const d=new Date(iso);return d.toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit',hour12:true})}
function left(ep){let s=Math.max(ep-Date.now()/1000,0);return Math.floor(s/3600)+'h '+String(Math.floor(s%3600/60)).padStart(2,'0')+'m'}
function k(v){v=Number(v||0);return v>=1e6?'$'+(v/1e6).toFixed(2)+'M':v>=1e3?'$'+(v/1e3).toFixed(1)+'K':'$'+v.toFixed(0)}
function anim(el,from,to){const t0=performance.now();(function f(t){let p=Math.min((t-t0)/700,1);el.textContent=usd(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
function render(){
 const d=D;const up=d.pnl>=0;
 const e=$('eq');e.className='big '+(up?'up':'dn');
 if(eqShown==null)e.textContent=usd(d.equity);else if(eqShown!==d.equity)anim(e,eqShown,d.equity);eqShown=d.equity;
 $('pnl').innerHTML='P&amp;L <b class="'+(up?'pos':'neg')+'">'+sg(d.pnl)+' ('+(d.pnl/d.start*100>=0?'+':'')+fmt(d.pnl/d.start*100,1)+'%)</b>';
 $('real').textContent='realised '+sg(d.realised);$('real').className=d.realised>=0?'pos':'neg';
 const need=d.target-d.equity;$('togo').textContent=need>0?usd(need)+' to go':'🎉 goal reached (paper)';
 $('fill').style.width=Math.max(d.progress_pct,d.pnl>0?2:0)+'%';$('pct').textContent=fmt(d.progress_pct,1)+'% of the way';
 $('s_open').textContent=d.open.length+'/'+d.max_open;$('s_cash').textContent=usd(d.cash);
 $('s_wl').textContent=d.wins+' / '+(d.n_closed-d.wins);$('s_real').textContent=sg(d.realised);$('s_real').className=d.realised>=0?'pos':'neg';
 $('cnt').textContent=d.open.length+' open';
 const g=$('grid');
 if(!d.open.length){g.innerHTML='<div class="empty">No open coins right now. Waiting for the next signal.</div>'}
 else g.innerHTML=d.open.map((c,i)=>{const w=c.mult>=1;const pos=Math.min(Math.max((c.mult-0.7)/(1.5-0.7),0),1)*100;
  const fl=prev[c.mint]!=null&&prev[c.mint]!==c.mult?(c.mult>prev[c.mint]?'flash':'flashd'):'';
  return '<div class="coin '+(c.mult>=1.2?'win':c.mult<0.85?'loss':'')+' '+fl+'" style="animation-delay:'+(i*40)+'ms" onclick="openC(\''+c.mint+'\')">'+
  '<div class="row"><div><span class="sym">$'+c.sym+'</span><span class="tag">'+c.src+'</span></div><div class="mult '+(w?'pos':'neg')+'">'+fmt(c.mult)+'x</div></div>'+
  '<div class="mini"><i style="width:'+pos+'%;background:'+(w?'linear-gradient(90deg,#22d3ee,#10d98a)':'linear-gradient(90deg,#ff4d6d,#fb923c)')+'"></i><u style="left:'+((1-0.7)/(0.8)*100)+'%"></u></div>'+
  '<div class="meta"><span>bought '+ist(c.entry_time)+' IST</span><span class="'+(c.pnl>=0?'pos':'neg')+'">'+sg(c.pnl)+'</span></div>'+
  '<div class="meta" style="margin-top:3px"><span>peak '+fmt(c.peak)+'x</span><span>exit in '+left(c.exit_by_epoch)+'</span></div></div>'}).join('');
 d.open.forEach(c=>prev[c.mint]=c.mult);
 $('csum').textContent='Closed trades ('+d.n_closed+')';
 $('cl').innerHTML=d.closed.map(c=>'<div class="cl" onclick="openX(\''+c.mint+'\')"><span><b>$'+c.sym+'</b> <span style="color:var(--dim)">'+c.stage+' · '+ist(c.exit_time)+'</span></span><span class="'+(c.pnl>=0?'pos':'neg')+'">'+fmt(c.exit_mult)+'x · '+sg(c.pnl)+'</span></div>').join('')||'<div class="cl" style="color:var(--dim)">none yet</div>';
 $('foot').innerHTML='PAPER ONLY, no real money. $'+d.bet+' per coin, max '+d.max_open+' open. Sell rules: -30% stop, full sell at '+d.rules.tp_mult+'x, '+d.rules.max_hold_h+'h max hold, rug = full loss. Marks include 3% modelled friction.<br>A paper result is not proof of an edge and not advice. $800 is a goal, not a prediction.';
}
function links(l){return '<div class="lk"><a href="'+l.dexscreener+'" target="_blank" rel="noopener">DexScreener</a><a href="'+l.gmgn+'" target="_blank" rel="noopener">GMGN</a><a href="'+l.solscan+'" target="_blank" rel="noopener">Solscan</a></div>'}
function openC(m){const c=D.open.find(x=>x.mint===m);if(!c)return;
 $('sb').innerHTML='<button class="x" onclick="hide()">✕</button><div class="lab">'+c.src+' signal · open</div><div class="big '+(c.mult>=1?'up':'')+'" style="font-size:40px">$'+c.sym+' <span class="'+(c.mult>=1?'pos':'neg')+'">'+fmt(c.mult)+'x</span></div>'+
 '<div class="kv"><div><span>Bought</span><b>'+ist(c.entry_time)+' IST</b></div><div><span>Entry price (raw)</span><b>'+px(c.entry_price)+'</b></div>'+
 '<div><span>Invested</span><b>'+usd(c.invested)+'</b></div><div><span>Value now</span><b>'+usd(c.value)+'</b></div>'+
 '<div><span>P&amp;L</span><b class="'+(c.pnl>=0?'pos':'neg')+'">'+sg(c.pnl)+'</b></div><div><span>Peak</span><b>'+fmt(c.peak)+'x</b></div>'+
 '<div><span>Stop (-30%)</span><b>'+px(c.sl_price)+'</b></div><div><span>Take profit (1.5x, full)</span><b>'+px(c.tp_price)+'</b></div>'+
 '<div><span>Time exit in</span><b>'+left(c.exit_by_epoch)+'</b></div><div><span>Milestones hit</span><b>'+(c.milestones&&c.milestones.length?c.milestones.join('x, ')+'x':'none yet')+'</b></div>'+
 '<div><span>MC / Liq at entry</span><b>'+k(c.mc)+' / '+k(c.liq)+'</b></div><div><span>1h vol · age</span><b>'+k(c.v1h)+' · '+(c.age_h!=null?fmt(c.age_h,1)+'h':'—')+'</b></div></div>'+
 links(c.links)+'<div class="ca">'+c.mint+'</div><div class="ca">Paper position. Marks net of 3% modelled friction.</div>';$('sheet').classList.add('show')}
function openX(m){const c=D.closed.find(x=>x.mint===m);if(!c)return;
 $('sb').innerHTML='<button class="x" onclick="hide()">✕</button><div class="lab">closed · '+c.stage+'</div><div class="big" style="font-size:36px">$'+c.sym+' <span class="'+(c.pnl>=0?'pos':'neg')+'">'+fmt(c.exit_mult)+'x</span></div>'+
 '<div class="kv"><div><span>P&amp;L</span><b class="'+(c.pnl>=0?'pos':'neg')+'">'+sg(c.pnl)+'</b></div><div><span>Peak</span><b>'+fmt(c.peak)+'x</b></div><div><span>Bought</span><b>'+ist(c.entry_time)+' IST</b></div><div><span>Sold</span><b>'+ist(c.exit_time)+' IST</b></div><div><span>Entry price</span><b>'+px(c.entry_price)+'</b></div><div><span>Exit reason</span><b>'+c.stage+'</b></div></div>'+links(c.links)+'<div class="ca">'+c.mint+'</div>';$('sheet').classList.add('show')}
function hide(){$('sheet').classList.remove('show')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
let last='';
let lastApi=0;
async function fetchData(){
 const t=Date.now();
 if(t-lastApi>=70000){lastApi=t;try{const r=await fetch('https://api.github.com/repos/jegankumarsparks-source/Jk1/contents/data/main500.json?ref=live',{headers:{'Accept':'application/vnd.github.raw'},cache:'no-cache'});if(r.ok)return await r.json()}catch(e){}}
 else if(D)return null;
 try{const r=await fetch('https://raw.githubusercontent.com/jegankumarsparks-source/Jk1/live/data/main500.json?t='+t,{cache:'no-store'});return await r.json()}catch(e){}
 try{const r=await fetch('data/main500.json?t='+t,{cache:'no-store'});return await r.json()}catch(e){}
 return null}
async function load(){const x=await fetchData();if(x&&(!D||(x.state_epoch||x.publish_epoch)>=(D.state_epoch||D.publish_epoch))){D=x;const s=JSON.stringify(D);if(s!==last){last=s;render()}}
 if(D){const age=Date.now()/1000-(D.state_epoch||D.publish_epoch);const p=$('pill');p.className='pill '+(age<300?'on':'stale');p.innerHTML=age<300?'<i>●</i> LIVE · '+Math.round(age)+'s ago':'⚠ data '+Math.round(age/60)+'m old'}}
load();setInterval(load,8000);setInterval(()=>{if(D){const age=Date.now()/1000-(D.state_epoch||D.publish_epoch);const p=$('pill');p.className='pill '+(age<300?'on':'stale');p.innerHTML=age<300?'<i>●</i> LIVE · '+Math.round(age)+'s ago':'⚠ data '+Math.round(age/60)+'m old'}},1000);
</script></body></html>
