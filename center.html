<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JK AI MEME RADAR - Command Center</title>
<style>
:root{--bg:#0c1117;--card:#141c26;--card2:#1b2634;--line:#24334a;--txt:#e8eef5;--dim:#8fa3bb;--grn:#22c55e;--yel:#eab308;--red:#ef4444;--blu:#3b82f6;--acc:#34d399;--gold:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Roboto,sans-serif;font-size:15px;padding-bottom:76px;max-width:720px;margin:0 auto}
a{color:var(--acc);text-decoration:none}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0c1117 85%,transparent);padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px}
h1{font-size:17px;letter-spacing:.5px}
.live{font-size:11px;padding:3px 8px;border-radius:20px;background:#123; border:1px solid var(--line);color:var(--dim)}
.live.on{color:var(--grn);border-color:var(--grn)}
.live.stale{color:var(--yel);border-color:var(--yel)}
.rbtn{margin-left:auto;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 12px;font-size:14px;min-height:40px}
.fresh{font-size:11px;color:var(--dim);margin-top:4px}
.search{margin-top:8px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;color:var(--txt)}
.pad{padding:12px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 14px}
.main-card{border:2px solid var(--gold);background:linear-gradient(135deg,#1a1a10,#141c26)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 14px}
.counter{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;min-height:64px}
.counter b{display:block;font-size:19px}
.counter span{font-size:10.5px;color:var(--dim);display:block;margin-top:3px;line-height:1.25}
.tag{font-size:10px;padding:2px 7px;border-radius:8px;background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.tag.g{color:var(--grn)} .tag.y{color:var(--yel)} .tag.r{color:var(--red)} .tag.b{color:var(--blu)} .tag.gold{color:var(--gold);border-color:var(--gold)}
.row{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--line);min-height:52px}
.row:last-child{border-bottom:none}
.row .sym{font-weight:700;min-width:74px}
.row .sub{font-size:11px;color:var(--dim)}
.row .val{margin-left:auto;text-align:right;font-size:13px}
.pos{color:var(--grn)} .neg{color:var(--red)}
.btn{display:inline-block;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.5px;margin:3px 4px 0 0;min-height:38px;color:var(--txt)}
.btn.ca{background:#0d2818;border-color:var(--grn);color:var(--grn)}
.sec{font-size:12px;color:var(--dim);letter-spacing:1px;margin:14px 14px 4px;text-transform:uppercase}
.kv{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-bottom:1px dashed #1c2a3d}
.kv:last-child{border:none}
.kv b{font-weight:600}
.kv span{color:var(--dim)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#0a0e13;border-top:1px solid var(--line);display:flex;max-width:720px;margin:0 auto}
nav a{flex:1;text-align:center;padding:10px 0 12px;color:var(--dim);font-size:11px}
nav a.on{color:var(--acc)}
nav a i{display:block;font-style:normal;font-size:18px;margin-bottom:2px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 13px;font-size:12.5px;color:var(--dim);min-height:36px}
.chip.on{color:var(--acc);border-color:var(--acc)}
select.chip{appearance:none}
.warn{background:#2a1503;border:1px solid #7c4a03;color:#fbbf24;border-radius:10px;padding:10px;font-size:12px;margin:8px 14px}
.exp{background:#101c2c;border:1px dashed var(--blu);color:#9ec5ff;border-radius:10px;padding:8px 10px;font-size:11.5px;margin:8px 14px}
.back{display:inline-block;margin:10px 14px 0;color:var(--dim);font-size:14px;padding:6px 0}
.sigchip{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1px;padding:3px 8px;border-radius:6px;border:1px solid}
.st-EXTREME{color:#ff5df2;border-color:#ff5df2;background:#ff5df218}
.st-STRONG{color:var(--gold);border-color:var(--gold);background:#f2c94c18}
.st-BUILDING{color:var(--blu);border-color:var(--blu);background:#4c9af218}
.st-WATCHING{color:var(--dim);border-color:var(--line)}
.st-BLOCKED,.st-INVALIDATED{color:var(--red);border-color:var(--red);background:#f24c4c14}
.st-EXPIRED{color:var(--dim);border-color:var(--line);opacity:.6}
.why-line{font-size:13px;line-height:1.7;padding:2px 0}
.pill{font-size:11px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);color:var(--dim);cursor:pointer;margin:2px 4px 2px 0;display:inline-block}
.pill.on{color:var(--acc);border-color:var(--acc)}
pre{white-space:pre-wrap;word-break:break-all;font-size:11px;color:var(--dim)}
.big{font-size:24px;font-weight:800}
.center{text-align:center;color:var(--dim);padding:30px;font-size:13px}
.mono{font-family:ui-monospace,monospace;font-size:11px;word-break:break-all}

/* 🔥 FIVE-WALLET FRESH TEST */
.fw-sec{margin:12px 0 4px}
.fw-head{display:flex;align-items:center;gap:8px;margin:2px 16px 8px;flex-wrap:wrap}
.fw-head b{font-size:14px;letter-spacing:.5px}
.fw-grid{display:grid;grid-template-columns:1fr;gap:10px;margin:0 14px}
@media(min-width:560px){.fw-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
.fw-card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;transition:border-color .4s,transform .15s;position:relative;overflow:hidden}
.fw-card:active{transform:scale(.98)}
.fw-card.leader{border-color:var(--gold);box-shadow:0 0 18px #fbbf2422}
.fw-rank{font-size:11px;color:var(--dim)}
.fw-badge{font-size:10px;padding:2px 8px;border-radius:8px;border:1px solid var(--gold);color:var(--gold)}
.fw-name{font-size:16px;font-weight:800;margin:6px 0 2px}
.fw-eq{font-size:24px;font-weight:800;transition:color .3s}
.fw-eq.up{color:var(--grn)}.fw-eq.dn{color:var(--red)}
.fw-pl{font-size:12.5px}
.fw-bar{height:8px;border-radius:6px;background:#0a0e13;border:1px solid var(--line);margin:8px 0 4px;overflow:hidden}
.fw-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blu),var(--acc));transition:width .8s ease}
.fw-fill.done{background:linear-gradient(90deg,var(--grn),var(--gold))}
.fw-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:6px}
.fw-sum{background:linear-gradient(135deg,#12202e,var(--card));border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 14px}
.fw-sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.fw-sumgrid>div{text-align:center;background:#0a0e1366;border:1px solid var(--line);border-radius:10px;padding:8px 4px}
.fw-sumgrid b{display:block;font-size:15px}
.fw-sumgrid span{font-size:9.5px;color:var(--dim);display:block;margin-top:2px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>⚡ JK AI MEME RADAR</h1>
    <span id="livechip" class="live">connecting…</span>
    <button class="rbtn" onclick="hardRefresh()">⟳ Refresh</button>
  </div>
  <div class="fresh" id="freshline">loading…</div>
  <input class="search" id="search" placeholder="🔎 token / symbol / CA / wallet…" oninput="doSearch(this.value)">
</header>
<div id="app"><div class="center">loading command center…</div></div>
<nav>
  <a href="#/" data-r="/"><i>🏠</i>Home</a>
  <a href="#/list/watch" data-r="/list"><i>🎯</i>Tokens</a>
  <a href="#/wallets" data-r="/wallets"><i>👛</i>Wallets</a>
  <a href="#/paper" data-r="/paper"><i>👑</i>Paper</a>
  <a href="#/performance" data-r="/performance"><i>📊</i>Results</a>
  <a href="#/status" data-r="/status"><i>📡</i>Status</a>
  <a href="#/signals" data-r="/signals"><i>🚨</i>Signals</a>
</nav>
<script>
const B='data/';
let S={status:null,summary:null,tokens:null,wallets:null,paper:null,sig:null,health:null,v2:null,performance:null,fw:null,tc:{},wc:{}};
let lastTs=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const na=v=>(v===null||v===undefined||v==='')?'<span class="sub">N/A</span>':v;
const k=v=>v==null?'N/A':(v>=1e9?'$'+(v/1e9).toFixed(2)+'B':v>=1e6?'$'+(v/1e6).toFixed(2)+'M':v>=1e3?'$'+(v/1e3).toFixed(1)+'K':'$'+(+v).toFixed(2));
const px=p=>p==null?'N/A':(p<0.001?p.toExponential(2):(+p).toPrecision(4));
const x2=m=>m==null?'N/A':'x'+(+m).toFixed(2);
const ist=iso=>{if(!iso)return'N/A';try{const d=new Date(iso);return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Kolkata'});}catch(e){return'N/A';}};
const istd=iso=>{if(!iso)return'N/A';try{const d=new Date(iso);return d.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Kolkata'});}catch(e){return'N/A';}};
const ago=iso=>{if(!iso)return'N/A';const s=(Date.now()-new Date(iso))/1e3;if(s<60)return Math.round(s)+'s ago';if(s<3600)return Math.round(s/60)+'m ago';return(s/3600).toFixed(1)+'h ago';};
const dur=s=>{if(s==null)return'N/A';s=+s;if(s<60)return s+'s';if(s<3600)return Math.round(s/60)+'m';if(s<86400)return(s/3600).toFixed(1)+'h';return(s/86400).toFixed(1)+'d';};
async function j(p){const r=await fetch(B+p+'?v='+(lastTs||Date.now()));if(!r.ok)throw new Error(p+' '+r.status);return r.json();}
async function loadAll(){
  S.status=await j('status.json');
  if(S.status.ts!==lastTs){
    lastTs=S.status.ts;
    [S.summary,S.tokens,S.wallets,S.paper]=await Promise.all([j('summary.json'),j('tokens.json'),j('wallets.json'),j('paper.json')]);
    try{S.sig=await j('sig_feed.json');}catch(e){S.sig=S.sig||{signals:[]};}
    try{S.health=await j('sig_health.json');}catch(e){S.health=S.health||{components:{}};}
    try{S.v2=await j('sig_v2.json');}catch(e){S.v2=S.v2||{v2:{}};}
    try{S.performance=await j('performance.json');}catch(e){S.performance={error:'UNAVAILABLE'};}
    try{S.fw=await j('fwtest.json');}catch(e){S.fw=S.fw||null;}
  }
  freshness();
}
function freshness(){
  const st=S.status;if(!st)return;
  const ageS=(Date.now()-new Date(st.publish_time))/1e3;
  const chip=$('livechip');
  chip.className='live '+(ageS<600?'on':'stale');
  chip.textContent=ageS<600?'● LIVE':'◌ STALE';
  $('freshline').textContent='Data updated '+ago(st.publish_time)+' (last engine publish '+ist(st.publish_time)+' IST) · auto-refresh 10s';
}
async function hardRefresh(){lastTs=0;try{await loadAll();}catch(e){}route();}
setInterval(async()=>{try{await loadAll();}catch(e){freshnessOffline();}},10000);
function freshnessOffline(){const chip=$('livechip');chip.className='live stale';chip.textContent='◌ OFFLINE';}
async function tchunk(n){if(!S.tc[n])S.tc[n]=await j('tc_'+n+'.json');return S.tc[n];}
async function wchunk(n){if(!S.wc[n])S.wc[n]=await j('wc_'+n+'.json');return S.wc[n];}
async function token(mint){const ix=S.tokens[mint];if(!ix)return null;const ch=await tchunk(ix.c);return ch[mint];}
async function wallet(a){const ix=S.wallets[a];if(!ix)return null;const ch=await wchunk(ix.c);return ch[a];}
function links(d){
  const m=d.mint;
  let h=`<a class="btn" href="https://gmgn.ai/sol/token/${m}" target="_blank">🟢 GMGN</a>`+
        `<a class="btn" href="https://dexscreener.com/solana/${m}" target="_blank">📊 DEX</a>`+
        `<a class="btn" href="https://solscan.io/token/${m}" target="_blank">🔎 SOLSCAN</a>`;
  if(d.binance&&d.sym)h+=`<a class="btn" href="https://www.binance.com/en/trade/${encodeURIComponent(d.sym.toUpperCase())}USDT" target="_blank">🟡 BINANCE</a>`;
  return h;
}
function copyCA(t){navigator.clipboard&&navigator.clipboard.writeText(t);event.target.textContent='✅ COPIED';setTimeout(()=>route(),700);}
function row(mint,ix,extra){
  return `<div class="row" onclick="location.hash='#/token/${mint}'">
    <div><div class="sym">$${esc(ix.sym||mint.slice(0,6))}</div><div class="sub">${esc(ix.status||'')}${ix.paper?' · 📄paper':''}${ix.binance?' · 🟡binance':''}</div></div>
    <div class="val">${extra||''}<div class="sub">mc ${k(ix.mc)} · liq ${k(ix.liq)}</div></div></div>`;
}

/* ---------- LIVE SIGNALS (Phase 4) ---------- */
let sigStateFilter='ALL',sigSort='score';
function sigCard(s){
  const blocked=!!s.blocked_reason,m=s.market||{},f=s.factors||{};
  const state=blocked?'BLOCKED':s.state;
  return `<div class="card" onclick="location.hash='#/sig/${s.sig_id}'">
  <div class="hrow"><span class="sigchip st-${state}">${blocked?'🔴 HIGH RISK — SIGNAL BLOCKED':'🚨 '+s.state}</span>
  <span class="sub" style="margin-left:auto">${ago(new Date((s.updated_at||0)*1000).toISOString())}</span></div>
  <div class="hrow" style="margin-top:8px"><b style="font-size:18px">$${esc(s.sym||s.sig_id.slice(4))}</b>
  <span class="sub">score</span><b class="${(s.score||0)>=80?'pos':''}">${(+s.score||0).toFixed(1)}</b>
  <span class="sub" style="margin-left:auto">mc ${k(m.mc)} · liq ${k(m.liq)}</span></div>
  <div class="sub">⏱ data ${f.data_age_s!=null?dur(f.data_age_s):'?'} old · ${esc(f.source||'helius')}</div>
  <div class="sub" style="margin-top:4px">buy ${k(f.buy_usd)} vs sell ${k(f.sell_usd)} · net ${k(f.net)} · large buys ${f.large_buys||0} · smart ${f.smart_count||0}</div>
  ${blocked?`<div class="neg" style="font-size:12px;margin-top:6px">⚠️ ${esc(s.blocked_reason)}</div>`
           :(s.why||[]).slice(0,2).map(w=>`<div class="why-line pos">✓ ${esc(w)}</div>`).join('')}
  ${(s.risks||[]).slice(0,1).map(r=>`<div class="why-line" style="color:var(--yel)">⚠️ ${esc(r)}</div>`).join('')}
  </div>`;
}
async function vSignals(){
  const feed=(S.sig&&S.sig.signals)||[];
  const states=['ALL','WATCHING','BUILDING','STRONG','EXTREME','BLOCKED','DONE'];
  const match=s=>{
    if(sigStateFilter==='ALL')return true;
    if(sigStateFilter==='BLOCKED')return !!s.blocked_reason;
    if(sigStateFilter==='DONE')return ['EXPIRED','INVALIDATED'].includes(s.state);
    return s.state===sigStateFilter&&!s.blocked_reason;};
  let arr=feed.filter(match);
  arr.sort(sigSort==='time'?(a,b)=>(b.updated_at||0)-(a.updated_at||0):(a,b)=>(b.score||0)-(a.score||0));
  let h=`<a class="back" href="#/">← home</a><div class="sec">🚨 LIVE SIGNALS (${feed.length} tracked)</div>
  <div style="margin:4px 14px">${states.map(st=>`<span class="pill ${st===sigStateFilter?'on':''}" onclick="sigStateFilter='${st}';route()">${st}</span>`).join('')}
  <span class="pill" onclick="sigSort=sigSort==='score'?'time':'score';route()">sort: ${sigSort==='score'?'score':'newest'}</span></div>`;
  if(!arr.length)h+=`<div class="card center">no ${sigStateFilter==='ALL'?'':sigStateFilter+' '}signals right now — the engine only surfaces real on-chain evidence. Nothing manufactured.</div>`;
  h+=arr.map(sigCard).join('');
  h+=`<div class="warn">⚠️ Signals are monitoring intel from live on-chain data - never buy advice. Score 90+ EXTREME · 80+ STRONG · 70+ BUILDING · below 70 watching only.</div>`;
  return h;
}
async function vSigDetail(id){
  let d;try{d=await j('sig_'+id+'.json');}catch(e){return `<a class="back" href="#/signals">← signals</a><div class="center">signal not found</div>`;}
  const s=d.signal,m=s.market||{},f=d.factors_full||{},c=d.components||{};
  const blocked=!!s.blocked_reason,state=blocked?'BLOCKED':s.state;
  const ts=(s.top_smart||[])[0];
  let h=`<a class="back" href="#/signals">← signals</a>
  <div class="card"><div class="hrow"><span class="sigchip st-${state}">${blocked?'🔴 HIGH RISK — SIGNAL BLOCKED':'🚨 '+s.state}</span>
  <b style="font-size:20px;margin-left:8px">$${esc(s.sym||'')}</b>
  <span class="sub" style="margin-left:auto">${s.sig_id}</span></div>
  <div class="hrow" style="margin-top:8px"><span class="sub">score</span><b class="${(s.score||0)>=80?'pos':''}" style="font-size:22px">${(+s.score||0).toFixed(1)}</b>
  <span class="sub" style="margin-left:auto">detected ${istd(new Date((s.created_at||0)*1000).toISOString())} IST · updated ${ago(new Date((s.updated_at||0)*1000).toISOString())}</span></div>
  <div class="hrow" style="margin-top:10px;gap:6px;flex-wrap:wrap">
    <span class="btn" onclick="copyCA('${s.mint}')">📋 TAP TO COPY CA</span>
    <a class="btn" href="#/token/${s.mint}">🎯 TOKEN DRILL-DOWN</a>
    ${ts?`<a class="btn" href="#/wallet/${ts}">👛 TOP SMART WALLET</a>`:''}
  </div>
  <div class="hrow" style="margin-top:6px;gap:6px;flex-wrap:wrap">
    <a class="btn" href="https://gmgn.ai/sol/token/${s.mint}" target="_blank">🟢 GMGN</a>
    <a class="btn" href="https://dexscreener.com/solana/${s.mint}" target="_blank">📊 DEX</a>
    <a class="btn" href="https://solscan.io/token/${s.mint}" target="_blank">🔎 SOLSCAN</a>
  </div></div>`;
  h+=`<div class="sec">WHY THIS SIGNAL?</div><div class="card">
  ${(d.why||[]).map(w=>`<div class="why-line pos">✓ ${esc(w)}</div>`).join('')||'<div class="sub">building evidence - no factors crossed their bars yet</div>'}
  ${(d.risks||[]).map(r=>`<div class="why-line" style="color:var(--yel)">⚠️ Risk: ${esc(r)}</div>`).join('')}
  ${blocked?`<div class="why-line neg">🔴 ${esc(s.blocked_reason)}</div>`:''}</div>`;
  const v2=(S.v2&&S.v2.v2&&S.v2.v2[id])||null;
  if(v2){const vc=v2.components||{},vw=v2.why||{};
    h+=`<div class="sec">V2 SMART MONEY (debug - production score unchanged)</div><div class="card">
    <div class="hrow"><span class="sub">V2 score</span><b>${(+v2.score_v2||0).toFixed(1)}</b>
    <span class="sub">vs production</span><b>${(+s.score||0).toFixed(1)}</b>
    <span class="sub" style="margin-left:auto">${esc(v2.gate||'')}</span></div>
    <div class="grid" style="margin-top:8px">
    <div class="counter"><b>${vc.smart_quality||0}</b><span>smart quality</span></div>
    <div class="counter"><b>${vc.cluster||0}</b><span>cluster</span></div>
    <div class="counter"><b>${vc.earlyness||0}</b><span>earlyness</span></div>
    <div class="counter"><b>${vc.net_pressure||0}</b><span>net pressure</span></div>
    <div class="counter"><b>${vc.whale_flow||0}</b><span>whale flow</span></div>
    <div class="counter"><b>${vc.liq_quality||0}</b><span>liq quality</span></div></div>
    ${v2.cluster?`<div class="pos" style="margin-top:6px;font-size:12px">🔥 SMART MONEY CLUSTER: ${v2.cluster.n} quality wallets · $${(+v2.cluster.usd||0).toLocaleString()} · avg quality ${v2.cluster.avg_q}</div>`:''}
    ${(vw.why||[]).slice(0,3).map(w=>`<div class="why-line" style="font-size:12px">${esc(w)}</div>`).join('')}
    </div>`;}
  h+=`<div class="sec">SCORE BREAKDOWN</div><div class="card"><div class="grid">
  ${['pressure','smart','cluster','accel','liq_health','whale'].map(kk=>`<div class="counter"><b>${(+(c[kk]||0)).toFixed(1)}</b><span>${kk.replace('_',' ')}</span></div>`).join('')}
  </div></div>`;
  h+=`<div class="sec">ON-CHAIN ACTIVITY</div><div class="card"><div class="grid">
  <div class="counter"><b>${k(f.buy_usd)}</b><span>buy volume</span></div>

async function vPerformance(){
  const P=S.performance;

    <div class="kv"><span>Avg win / loss</span><b>${money(b.average_win)} / ${money(b.average_loss)}</b></div>
    <div class="kv"><span>Observed avg MFE / MAE (n=${b.sampled_excursion_n})</span><b>${num(b.sampled_mfe_pct)}% / ${num(b.sampled_mae_pct)}%</b></div>
    <div class="kv"><span>Max drawdown</span><b>${esc(b.max_drawdown_note)}</b></div>
    <div class="kv"><span>Avg hold / time-to-peak</span><b>${b.average_holding_s==null?'UNAVAILABLE':dur(b.average_holding_s)} / ${b.average_time_to_peak_s==null?'UNAVAILABLE':dur(b.average_time_to_peak_s)}</b></div>
    <div class="kv"><span>Best / worst realized trade</span><b>${b.best_trade?esc(b.best_trade.sym)+' '+money(b.best_trade.realized_pnl):'UNAVAILABLE'} / ${b.worst_trade?esc(b.worst_trade.sym)+' '+money(b.worst_trade.realized_pnl):'UNAVAILABLE'}</b></div>

  return h;
}

let searchT=null;
async function doSearch(q){
  clearTimeout(searchT);
  if(!q||q.length<2)return;
  searchT=setTimeout(async()=>{
    q=q.trim();
    if(S.tokens[q])return location.hash='#/token/'+q;
    if(S.wallets[q])return location.hash='#/wallet/'+q;
    const ql=q.toLowerCase();
    const tm=Object.keys(S.tokens).filter(m=>(S.tokens[m].sym||'').toLowerCase().includes(ql)||m.toLowerCase().startsWith(ql)).slice(0,10);
    const wm=Object.keys(S.wallets).filter(a=>a.toLowerCase().startsWith(ql)).slice(0,5);
    let h=`<a class="back" href="#/">← home</a><div class="sec">SEARCH "${esc(q)}"</div>`;
    if(!tm.length&&!wm.length)h+=`<div class="center">no matches in tracked tokens/wallets</div>`;
    if(tm.length)h+=`<div class="card" style="padding:0 12px">${tm.map(m=>row(m,S.tokens[m])).join('')}</div>`;
    if(wm.length)h+=`<div class="card" style="padding:0 12px">${wm.map(a=>`<div class="row" onclick="location.hash='#/wallet/${a}'"><div class="sym">…${a.slice(-8)}</div><div class="val">${S.wallets[a].score!=null?(+S.wallets[a].score).toFixed(1):'N/A'}</div></div>`).join('')}</div>`;
    $('app').innerHTML=h;
  },250);
}
async function route(){
  const h=(location.hash||'#/').slice(1);
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',h.startsWith(a.dataset.r)));
  let html;
  try{
    if(!S.summary)await loadAll();
    if(h==='/'||h==='')html=await vHome();
    else if(h.startsWith('/list/'))html=await vList(h.split('/')[2]);
    else if(h.startsWith('/token/'))html=await vToken(h.split('/')[2]);
    else if(h.startsWith('/wallet/'))html=await vWallet(h.split('/')[2]);
    else if(h==='/wallets')html=await vWallets();
    else if(h==='/paper')html=await vPaper();
    else if(h==='/performance')html=await vPerformance();
    else if(h==='/status')html=await vStatus();
    else if(h==='/signals')html=await vSignals();
    else if(h.startsWith('/sig/'))html=await vSigDetail(h.split('/')[2]);
    else html=await vHome();
  }catch(e){html=`<div class="center">load error: ${esc(e.message)}<br><br><button class="btn" onclick="hardRefresh()">retry</button></div>`;}
  $('app').innerHTML=html;
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
(async()=>{try{await loadAll();}catch(e){}$('app').innerHTML='<div class="center">connecting…</div>';route();})();
