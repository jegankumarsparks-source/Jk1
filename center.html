<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b14"><link rel="icon" href="data:,">
<title>JK Wallet Tracker</title>
<style>
:root{--bg:#070b14;--card:#0f1729;--card2:#16203a;--line:#222f4d;--txt:#eaf0ff;--dim:#8b9bc0;--grn:#10d98a;--red:#ff4d6d;--yel:#fbbf24;--acc:#22d3ee;--vio:#8b5cf6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(900px 420px at 90% -10%,#1b1450 0,transparent 60%),radial-gradient(800px 400px at -10% 0,#08334a 0,transparent 55%),var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding:0 0 40px}
a{color:var(--acc);text-decoration:none}
.wrap{max-width:980px;margin:0 auto;padding:12px 14px}
.top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.top b{color:var(--txt);font-size:14px;letter-spacing:.3px}
.pill{margin-left:auto;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:#0c1528;font-weight:700;font-size:11px;white-space:nowrap}
.pill.on{color:var(--grn);border-color:#10d98a66;background:#0b2a22}.pill.on i{animation:pu 1.4s infinite;font-style:normal}
.pill.stale{color:var(--yel);border-color:#fbbf2466;background:#2a2108}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.2}}
.hero{margin-top:12px;padding:18px 16px 16px;border-radius:20px;background:linear-gradient(145deg,#12204a,#0d1630 60%,#101a38);border:1px solid #2a3a66;box-shadow:0 10px 40px #0008;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-40% -20% auto auto;width:300px;height:300px;background:radial-gradient(circle,#22d3ee33,transparent 65%);animation:fl 7s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(-40px,30px)}}
.lab{font-size:12px;color:var(--dim);letter-spacing:.8px;text-transform:uppercase}
.big{font-size:clamp(38px,11vw,64px);font-weight:900;letter-spacing:-1px;line-height:1.05;margin:2px 0}
.big.up{color:var(--grn)}.big.dn{color:var(--txt)}
.sub{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.pos{color:var(--grn)}.neg{color:var(--red)}
.bar{margin-top:16px;height:16px;background:#0a1226;border:1px solid var(--line);border-radius:12px;position:relative;overflow:hidden}
.fill{height:100%;width:0;border-radius:12px;background:linear-gradient(90deg,#22d3ee,#10d98a);transition:width 1.2s cubic-bezier(.2,.8,.2,1);position:relative}
.fill:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff5,transparent);animation:sh 2.4s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.bl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.st b{display:block;font-size:17px}.st span{font-size:11px;color:var(--dim)}
h2{font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);margin:20px 2px 8px;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.coin{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;position:relative;overflow:hidden;animation:in .5s both;transition:transform .15s,border-color .2s}
.coin:active{transform:scale(.98)}.coin:hover{border-color:var(--acc)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.coin.win{border-color:#10d98a88;box-shadow:0 0 22px #10d98a22}.coin.loss{border-color:#ff4d6d55}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sym{font-weight:800;font-size:17px}.tag{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:8px;padding:1px 6px;margin-left:6px}
.mult{font-weight:900;font-size:22px}
.mini{height:8px;background:#0a1226;border-radius:6px;margin:10px 0 6px;position:relative;overflow:hidden}
.mini i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;transition:width .8s,background .4s}
.mini u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff9}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--dim)}
.flash{animation:fg .9s}.flashd{animation:fr .9s}
@keyframes fg{30%{background:#10d98a33}}@keyframes fr{30%{background:#ff4d6d33}}
.empty{padding:26px;text-align:center;color:var(--dim);border:1px dashed var(--line);border-radius:16px}
details{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
summary{cursor:pointer;padding:10px 0;color:var(--dim);font-size:13px}
.cl{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
.foot{margin-top:22px;font-size:11px;color:var(--dim);text-align:center;line-height:1.6}
.sheet{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(4px)}
.sheet.show{display:flex}.sheet>div{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:linear-gradient(170deg,#16203a,#0d1428);border:1px solid #2a3a66;border-radius:22px 22px 0 0;padding:16px 16px 28px;animation:up .28s ease-out}
@media(min-width:700px){.sheet{align-items:center}.sheet>div{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.x{float:right;background:#0c1528;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:5px 12px;font-size:14px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.kv div{background:#0b1226;border:1px solid var(--line);border-radius:12px;padding:8px 10px}.kv span{display:block;font-size:11px;color:var(--dim)}.kv b{font-size:14px;word-break:break-all}
.lk{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.lk a{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#0c1528;font-size:13px;font-weight:700}
.ca{font:11px monospace;color:var(--dim);word-break:break-all;margin-top:10px}
.cyc{margin-top:12px;padding:12px 14px;border-radius:16px;background:linear-gradient(145deg,#1a1450,#0f1729);border:1px solid #4b3a99}
.cyc .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}.cyc .cn{font-weight:900;font-size:18px}
.cyc .cp{font-weight:900;font-size:20px}.cyc .r2{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:6px;gap:8px;flex-wrap:wrap}
.cyc .cb{height:7px;background:#0a1226;border-radius:6px;margin-top:8px;overflow:hidden}.cyc .cb i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#22d3ee);transition:width 1s}
.cyc .hist{margin-top:8px;font-size:12px;color:var(--dim)}.cyc .hist span{display:inline-block;margin:2px 6px 0 0;padding:2px 8px;border:1px solid var(--line);border-radius:10px;background:#0c1528}
.odo{display:inline-flex;align-items:flex-start;vertical-align:bottom;height:1.14em;line-height:1.14em;overflow:hidden}
.odo .dg{display:inline-block;height:1.14em;overflow:hidden}.odo .dg i{display:block;font-style:normal;transition:transform 1s cubic-bezier(.16,.9,.2,1)}
.odo .dg i b{display:block;height:1.14em;font-weight:inherit}.odo .sp{display:inline-block;white-space:pre}
.meta{align-items:center}
.odo,.odo span,.odo i,.odo b{font-size:inherit!important;color:inherit!important;font-weight:inherit!important;letter-spacing:inherit}
.tkup{animation:tku 1.1s}.tkdn{animation:tkd 1.1s}
@keyframes tku{0%{text-shadow:0 0 0 #10d98a}30%{text-shadow:0 0 18px #10d98a}100%{text-shadow:0 0 0 #10d98a}}
@keyframes tkd{0%{text-shadow:0 0 0 #ff4d6d}30%{text-shadow:0 0 18px #ff4d6d}100%{text-shadow:0 0 0 #ff4d6d}}
.hero{animation:br 5s ease-in-out infinite alternate}@keyframes br{from{box-shadow:0 10px 40px #0008,0 0 0 #22d3ee00}to{box-shadow:0 10px 40px #0008,0 0 34px #22d3ee33}}
.scan{height:2px;margin:8px 0 0;border-radius:2px;background:linear-gradient(90deg,transparent,#22d3ee,#8b5cf6,transparent);background-size:200% 100%;animation:scn 2.6s linear infinite;opacity:.7}
@keyframes scn{from{background-position:200% 0}to{background-position:-200% 0}}
#spark{height:38px;margin-top:10px;position:relative}#spark svg{width:100%;height:100%;display:block}
.rng{position:relative;height:12px;margin:10px 0 4px;background:#0a1226;border-radius:7px;overflow:visible}
.rng .f{position:absolute;left:0;top:0;bottom:0;border-radius:7px;transition:width .9s cubic-bezier(.16,.9,.2,1),background .4s}
.rng u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff9;text-decoration:none}
.rng .pk,.rng .lw{position:absolute;top:-6px;font-size:9px;line-height:1;transform:translateX(-50%);transition:left .9s cubic-bezier(.16,.9,.2,1)}
.rng .pk{color:var(--grn)}.rng .lw{top:auto;bottom:-7px;color:var(--red)}
.coin.win{animation:in .5s both,gw 2.4s ease-in-out infinite alternate}@keyframes gw{from{box-shadow:0 0 10px #10d98a18}to{box-shadow:0 0 26px #10d98a44}}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--grn);margin-right:5px;animation:pu 1.2s infinite}
@media(max-width:380px){.stats{grid-template-columns:repeat(3,1fr)}}

.path{position:relative;height:14px;margin:16px 0 22px;background:#0a1226;border-radius:8px}
.path .z{position:absolute;top:0;bottom:0;border-radius:8px;transition:left .9s cubic-bezier(.16,.9,.2,1),width .9s cubic-bezier(.16,.9,.2,1),background .4s}
.path .tk{position:absolute;top:-4px;bottom:-4px;width:2px;background:#ffffff66}
.path .tl{position:absolute;top:19px;font-size:9px;color:var(--dim);transform:translateX(-50%);white-space:nowrap}
.path .tl.a{transform:none;left:0!important}.path .tl.b{transform:translateX(-100%);left:100%!important}
.path .mk{position:absolute;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#fff;border:3px solid var(--acc);box-shadow:0 0 12px var(--acc);transition:left .9s cubic-bezier(.16,.9,.2,1),border-color .4s,box-shadow .4s;z-index:2}
.path .mk.pos{border-color:var(--grn);box-shadow:0 0 14px var(--grn);animation:pls 1.8s infinite}.path .mk.neg{border-color:var(--red);box-shadow:0 0 14px var(--red)}
@keyframes pls{50%{box-shadow:0 0 22px var(--grn)}}
.path .pkm{position:absolute;top:-9px;font-size:9px;color:var(--grn);transform:translateX(-50%);transition:left .9s}
.togo{font-size:12px;color:var(--dim);text-align:center;margin-bottom:6px}.togo b{color:var(--txt)}
.badge{font-size:10px;font-weight:800;border-radius:8px;padding:2px 7px;margin-left:6px}.badge.tp{background:#10d98a22;color:var(--grn)}.badge.sl{background:#ff4d6d22;color:var(--red)}.badge.o{background:#fbbf2422;color:var(--yel)}
.coin.done{cursor:pointer;animation:in .5s both}
.sec{margin-top:6px}
#eq,#eq *{font-variant-numeric:tabular-nums}#eq.up,#eq.up *{color:#19f59b!important;text-shadow:0 0 28px #19f59b55,0 0 6px #19f59b33}#eq.dn .tkup,#eq.dn.tkup{animation-name:tkd}#eq.up.tkdn,#eq.up .tkdn{animation-name:tku}#eq.dn,#eq.dn *{color:#ff4d6d!important;text-shadow:0 0 28px #ff4d6d55,0 0 6px #ff4d6d33}
.dc{margin:8px 0 0;max-height:70vh;overflow:auto;scrollbar-color:#222f4d #070b14;scrollbar-width:thin}
.dc details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin:6px 0}
.dc summary{display:flex;justify-content:space-between;gap:8px;padding:10px 0;font-size:13px;color:var(--txt);cursor:pointer}
.dc .tr{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:4px 8px;padding:8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
.dc .tr b{color:var(--txt)}.dc .rl{font-size:11px;color:var(--dim);padding:0 0 8px}

.stack{display:flex;flex-direction:column;gap:10px}
.cc{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;animation:in .5s both}
.cc.win{border-color:#10d98a55}.cc.loss{border-color:#ff4d6d44}
.cc .l{min-width:0;flex:1}.cc .nm{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cc .nm i{font-style:normal;font-weight:600;font-size:13px;color:var(--dim);margin-left:6px}
.cc .sb{font-size:12.5px;color:var(--dim);margin-top:5px}.cc .r{text-align:right;white-space:nowrap}
.cc .pn{font-weight:900;font-size:19px;color:var(--grn)}.cc .pn.neg{color:var(--red)}.cc .mx{font-size:13px;color:var(--dim);margin-top:3px}
.cc .mt{height:5px;background:#0a1226;border-radius:4px;margin-top:9px;position:relative}.cc .mt i{position:absolute;top:0;bottom:0;border-radius:4px}.cc .mt u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff7}
.gh{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);font-weight:700}.gh:before{content:"";width:3px;height:16px;background:linear-gradient(var(--acc),var(--vio));border-radius:2px;margin-right:9px}.gh span:first-of-type{flex:1}
.hc{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;margin:0 0 10px;overflow:hidden}
.hc>summary{display:flex;justify-content:space-between;gap:10px;padding:14px;list-style:none;cursor:pointer;color:var(--txt)}.hc>summary::-webkit-details-marker{display:none}
.hc .t1{font-weight:800;font-size:18px}.hc .t1 s{text-decoration:none;color:var(--dim);font-size:11px;margin-left:4px}.hc .t2{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.4}
.hc .rr{text-align:right;white-space:nowrap}.hc .rr b{font-size:19px;display:block}.hc .rr span{font-size:12px;color:var(--dim)}
.hc[open]>summary{border-bottom:1px solid var(--line)}.hc .bd{padding:10px;display:flex;flex-direction:column;gap:8px}.hc .rl{font-size:11px;color:var(--dim);padding:0 4px 2px}

.pt{margin-top:18px}.pth{margin:0;font-size:22px;font-weight:900;letter-spacing:.3px}.ptsub{font-size:14px;color:var(--dim);margin:2px 0 10px;font-weight:600}
.pt .hero{margin-top:0}.gp{margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}.gph{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--dim)}.gp .bar{margin-top:10px}
.st em{display:block;font-style:normal;font-size:11px;color:var(--dim);margin-top:2px}
.cyc .cn{font-size:20px;letter-spacing:.3px}.cyc .cn em{font-style:normal;font-size:12px;font-weight:700;color:var(--dim);margin-left:8px;padding:2px 8px;border:1px solid #4b3a99;border-radius:10px}
.cyc .cd{display:flex;align-items:baseline;gap:10px;margin-top:10px}.cyc .cdl{font-size:15px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.6px}.cyc .cd b{font-size:38px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.5px;line-height:1}
.cyc .hl{margin-top:12px;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--dim)}
.cyc .hg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.cyc .hc{border:1px solid #10d98a88;background:linear-gradient(160deg,#0c2a22,#0c1528);border-radius:12px;padding:8px 8px 9px;text-align:center;box-shadow:0 0 12px #10d98a14}
.cyc .hc b{display:block;font-size:12px;color:#10d98a;letter-spacing:.3px}.cyc .hc u{display:block;text-decoration:none;font-size:17px;font-weight:900;margin-top:3px}.cyc .hc s{display:block;text-decoration:none;font-size:11px;color:var(--dim);margin-top:2px}
@media(max-width:380px){.cyc .hg{grid-template-columns:repeat(2,1fr)}.cyc .cd b{font-size:32px}}
.tmr{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:10px;border:1px solid #22d3ee66;background:#0b2230;color:#22d3ee;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;vertical-align:middle}.tmr.soon{border-color:#fbbf2488;color:#fbbf24;background:#2a2110}.tmr.due{border-color:#ff4d6d88;color:#ff4d6d;background:#2a1018}
.stats{grid-template-columns:repeat(3,1fr)}#s_real{display:block;font-size:11px;font-weight:700;margin-top:2px}#s_real:before{content:"realised ";color:var(--dim);font-weight:400}

.pt .hero{text-align:center;padding:16px 14px 12px;border:1px solid #3d5fbf;background:radial-gradient(120% 150% at 50% 0%,#1d3678,#0d1630 64%)}
.pt .hero .lab{letter-spacing:2.2px;font-size:11px}
.pt .hero .big{font-size:clamp(46px,13.5vw,74px);font-weight:900;letter-spacing:-1.5px;filter:brightness(1.12)}
#eq.up,#eq.up *{text-shadow:0 0 38px #19f59b88,0 0 12px #19f59b66,0 0 2px #19f59baa!important}
#eq.dn,#eq.dn *{text-shadow:0 0 38px #ff4d6d88,0 0 12px #ff4d6d66,0 0 2px #ff4d6daa!important}
.pt .hero .sub{justify-content:center}.pt .hero #spark{height:28px;margin-top:6px}
.cyc{margin-top:10px;padding:10px 12px}.cyc .cd b{font-size:32px}.cyc .cn{font-size:18px}.cyc .cp{font-size:17px}
.cyc .hg{gap:6px}.cyc .hc{padding:6px 6px 7px;border-radius:10px}.cyc .hc b{font-size:11px}.cyc .hc u{font-size:15px;margin-top:2px}.cyc .hc s{font-size:10px}
.stats{gap:6px;margin-top:8px}.st{padding:6px 6px;border-radius:12px}.st b{font-size:14px}.st span{font-size:10px}#s_real{font-size:10px;margin-top:0}
.gp{margin-top:8px;padding:8px 12px;border-radius:12px}.gp .bar{height:9px;margin-top:6px}.gph{font-size:11px}.bl{font-size:11px;margin-top:4px}

.sl{display:flex;align-items:center;gap:10px;margin:18px 2px 8px;font-size:14px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase;color:#a9b8de}.sl:before{content:"";width:4px;height:18px;border-radius:2px;background:#3b82f6}
.pt{margin-top:12px}.pt .hero{padding:16px 14px 12px;border-radius:22px}
.pt .hero .lab{letter-spacing:4px;font-size:12px}
.pt .hero .big{font-size:clamp(36px,11.5vw,66px);letter-spacing:0;margin:8px 0 10px;filter:none}
#eq .odo{height:auto;overflow:visible;align-items:center;gap:.07em}
#eq .dg,#eq .sp:not(.pnt){border:1px solid #ffffff2a;border-radius:.2em;padding:0 .1em;background:linear-gradient(180deg,#ffffff14,#ffffff05);box-shadow:inset 0 0 .3em #0007}
#eq .dg{height:1.14em}#eq .sp{line-height:1.14em}#eq .sp.pnt{padding:0 .02em}
#eq.dn .dg,#eq.dn .sp:not(.pnt){background:#ff4d6d22;border-color:#ff4d6d77;box-shadow:0 0 .3em #ff4d6d44,inset 0 0 .3em #ff4d6d33}
#eq.up .dg,#eq.up .sp:not(.pnt){background:#19f59b1c;border-color:#19f59b77;box-shadow:0 0 .3em #19f59b44,inset 0 0 .3em #19f59b33}
.sub2{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:999px;font-weight:800;font-size:15px;border:1px solid var(--line);background:#0c1528}.chip.up{border-color:#19f59b88;background:#0c2a22}.chip.dn{border-color:#ff4d6d88;background:#2a1018}
.vs{font-size:14px;color:var(--dim);font-weight:700}
.ln{margin-top:10px;font-size:14px;color:var(--dim);text-align:center}.ln b{color:var(--txt)}
.pt .hero #spark{height:46px;margin-top:10px}
.cyc{margin-top:0;padding:14px 16px;border-radius:20px}
.cyc .cd{display:block;margin-top:10px}.cyc .cdl{display:block;font-size:15px;color:var(--dim);font-weight:600;text-transform:none;letter-spacing:0}

function coinUpd(el,c){const w=c.mult>=1;

 {const zc=up?'up':'dn';$('pchip').className='chip '+zc;const se=$('s_eq');roll(se,usd(d.equity),true);se.className=zc;$('h_cash').textContent=usd(d.cash);$('h_open').textContent=d.open.length+'/'+d.max_open}

 {const cur=(d.cycle&&d.cycle.current)||'';const sum=d.closed.reduce((s,c)=>s+c.pnl,0);const sig=cur+'|'+d.closed.map(c=>c.mint+c.exit_time).join('|');const cg=$('cgcur');if(cg._sig!==sig){cg._sig=sig;cg.innerHTML=grpHTML(cur,d.closed.slice().reverse(),sum)}}

 '<div class="lk"><a href="javascript:void(0)" onclick="cpy(\''+w+'\',this)">Copy wallet</a><a href="https://solscan.io/account/'+w+'" target="_blank" rel="noopener">Solscan</a><a href="https://gmgn.ai/sol/address/'+w+'" target="_blank" rel="noopener">GMGN</a></div>'+
 '<div class="ca">'+(c.wallet_label||'')+(c.wallet_score!=null?' · score '+fmt(c.wallet_score,1):'')+(c.wallet_others&&c.wallet_others.length?' · '+c.wallet_others.length+' other wallet(s) also signalled this coin':'')+'</div>'}
function links(l,c){const w=c&&c.wallet;return '<div class="lk"><a href="'+l.dexscreener+'" target="_blank" rel="noopener">DexScreener</a><a href="'+l.gmgn+'" target="_blank" rel="noopener">GMGN</a><a href="'+l.solscan+'" target="_blank" rel="noopener">Solscan</a>'+
 (c?(w?'<a href="https://gmgn.ai/sol/address/'+w+'" target="_blank" rel="noopener" style="border-color:#8b5cf666;color:#c4b5fd">👛 Wallet</a>':'<a style="opacity:.4;pointer-events:none" title="No buyer wallet recorded for this entry">👛 No wallet</a>'):'')+'</div>'}
function openC(m){const c=D.open.find(x=>x.mint===m);if(!c)return;
 $('sb').innerHTML='<button class="x" onclick="hide()">✕</button><div class="lab">'+c.src+' signal · open</div><div class="big '+(c.mult>=1?'up':'')+'" style="font-size:40px">$'+c.sym+' <span class="'+(c.mult>=1?'pos':'neg')+'">'+fmt(c.mult)+'x</span></div>'+
 '<div class="kv"><div><span>Bought</span><b>'+ist(c.entry_time)+' IST</b></div><div><span>Entry price (raw)</span><b>'+px(c.entry_price)+'</b></div>'+
 '<div><span>Invested</span><b>'+usd(c.invested)+'</b></div><div><span>Value now</span><b>'+usd(c.value)+'</b></div>'+
 '<div><span>P&amp;L</span><b class="'+(c.pnl>=0?'pos':'neg')+'">'+sg(c.pnl)+'</b></div><div><span>Peak</span><b>'+fmt(c.peak)+'x</b></div>'+
 '<div><span>Stop (-50%)</span><b>'+px(c.sl_price)+'</b></div><div><span>Take profit (3x, full)</span><b>'+px(c.tp_price)+'</b></div>'+
 '<div><span>Time exit in</span><b>'+left(c.exit_by_epoch)+'</b></div><div><span>Milestones hit</span><b>'+(c.milestones&&c.milestones.length?c.milestones.join('x, ')+'x':'none yet')+'</b></div>'+
 '<div><span>MC / Liq at entry</span><b>'+k(c.mc)+' / '+k(c.liq)+'</b></div><div><span>1h vol · age</span><b>'+k(c.v1h)+' · '+(c.age_h!=null?fmt(c.age_h,1)+'h':'—')+'</b></div></div>'+
 links(c.links,c)+'<div class="ca">'+c.mint+'</div><div class="ca">Paper position. Marks net of 3% modelled friction.</div>';$('sheet').classList.add('show')}
function openX(m){const c=D.closed.find(x=>x.mint===m)||(D.closed_prev||[]).find(x=>x.mint===m)||(D.cycles_done||[]).flatMap(x=>x.trades).find(x=>x.mint===m);if(!c)return;
 $('sb').innerHTML='<button class="x" onclick="hide()">✕</button><div class="lab">closed · '+c.stage+'</div><div class="big" style="font-size:36px">$'+c.sym+' <span class="'+(c.pnl>=0?'pos':'neg')+'">'+fmt(c.exit_mult)+'x</span></div>'+
 '<div class="kv"><div><span>P&amp;L</span><b class="'+(c.pnl>=0?'pos':'neg')+'">'+sg(c.pnl)+'</b></div><div><span>Peak</span><b>'+fmt(c.peak)+'x</b></div><div><span>Bought</span><b>'+ist(c.entry_time)+' IST</b></div><div><span>Sold</span><b>'+ist(c.exit_time)+' IST</b></div><div><span>Entry price</span><b>'+px(c.entry_price)+'</b></div><div><span>Exit reason</span><b>'+c.stage+'</b></div></div>'+links(c.links,c)+'<div class="ca">'+c.mint+'</div>';$('sheet').classList.add('show')}
function hide(){$('sheet').classList.remove('show')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
let last='';
let lastApi=0,EP=null,epAt=0,src='api';
async function getEP(){const t=Date.now();if(t-epAt<60000)return;epAt=t;
 try{const r=await fetch('https://api.github.com/repos/jegankumarsparks-source/Jk1/contents/data/endpoint.json?ref=live',{headers:{'Accept':'application/vnd.github.raw'},cache:'no-cache'});if(r.ok){const j=await r.json();if(j&&j.url)EP=j.url}}catch(e){}
 if(!EP){try{const r=await fetch('https://raw.githubusercontent.com/jegankumarsparks-source/Jk1/live/data/endpoint.json?t='+t,{cache:'no-store'});const j=await r.json();if(j&&j.url)EP=j.url}catch(e){}}}
async function fetchData(){
 const t=Date.now();
 if(!EP)await getEP();
 if(EP){try{const c=new AbortController();const to=setTimeout(()=>c.abort(),4000);const r=await fetch(EP+'/?t='+t,{cache:'no-store',signal:c.signal});clearTimeout(to);if(r.ok){const j=await r.json();if(j&&j.equity!=null){src='direct';return j}}}catch(e){}
  EP=null;epAt=0}
 src='api';
 if(t-lastApi>=70000){lastApi=t;try{const r=await fetch('https://api.github.com/repos/jegankumarsparks-source/Jk1/contents/data/main500.json?ref=live',{headers:{'Accept':'application/vnd.github.raw'},cache:'no-cache'});if(r.ok)return await r.json()}catch(e){}}
 else if(D)return null;
 try{const r=await fetch('https://raw.githubusercontent.com/jegankumarsparks-source/Jk1/live/data/main500.json?t='+t,{cache:'no-store'});return await r.json()}catch(e){}
 try{const r=await fetch('data/main500.json?t='+t,{cache:'no-store'});return await r.json()}catch(e){}
 return null}

let LIVE={},liveAt=0;
function pillUpd(){const p=$('pill');if(!D||!p)return;const sa=Date.now()/1000-(D.state_epoch||D.publish_epoch);const la=(Date.now()-liveAt)/1000;
 if(sa>=300){p.className='pill stale';p.innerHTML='⚠ arena stalled '+Math.round(sa/60)+'m';return}
 p.className='pill on';p.innerHTML=(liveAt&&la<40)?'<i>●</i> LIVE · '+Math.round(la)+'s ago':'<i>●</i> LIVE · '+Math.round(sa)+'s ago'}
function applyLive(){if(!D)return;const F=D.friction||0.03;let v=0;D.open.forEach(c=>{const p=LIVE[c.mint];if(p&&c.entry_price){c._raw=p/c.entry_price;c.mult=Math.round(p/c.entry_price*(1-F)/(1+F)*1000)/1000;c.value=+(c.invested*c.mult).toFixed(2);c.pnl=+(c.value-c.invested).toFixed(2)}v+=c.value});
 D.open_value=+v.toFixed(2);D.equity=+(D.cash+v+(D.rug_restatement_usd||0)).toFixed(2);D.pnl=+(D.equity-D.start).toFixed(2);D.progress_pct=Math.round(Math.max(Math.min(D.pnl/(D.target-D.start)*100,100),0)*10)/10;
 const s=JSON.stringify(D);if(s!==last){last=s;render()}}
async function liveMarks(){if(!D||!D.open||!D.open.length)return;try{const r=await fetch('https://api.dexscreener.com/tokens/v1/solana/'+D.open.map(c=>c.mint).join(','),{cache:'no-store'});const a=await r.json();const best={};
 a.forEach(x=>{const m=x.baseToken&&x.baseToken.address;const p=parseFloat(x.priceUsd);if(!m||!p)return;const l=(x.liquidity&&x.liquidity.usd)||0;if(!best[m]||l>best[m].l)best[m]={l,p}});
 let n=0;Object.keys(best).forEach(m=>{LIVE[m]=best[m].p;n++});if(n){liveAt=Date.now();applyLive()}}catch(e){}}
setInterval(liveMarks,10000);
async function load(){const x=await fetchData();if(x&&(!D||(x.state_epoch||x.publish_epoch)>=(D.state_epoch||D.publish_epoch))){D=x;applyLive()}
 if(D){pillUpd()}}
load();setTimeout(liveMarks,2500);setInterval(load,10000);setInterval(()=>{if(D){pillUpd();cycUpd();document.querySelectorAll('.tmr[data-x]').forEach(tmrUpd)}},1000);
</script></body></html>
