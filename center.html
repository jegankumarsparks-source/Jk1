<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>JK AI MEME RADAR - Command Center</title>
<style>
:root{--bg:#070b14;--bg2:#0b1120;--card:#0f1729;--card2:#16203a;--line:#222f4d;--txt:#eaf0ff;--dim:#8b9bc0;--grn:#10d98a;--yel:#fbbf24;--red:#ff4d6d;--blu:#4c9aff;--acc:#22d3ee;--gold:#fbbf24;--vio:#8b5cf6;--pink:#ff5df2;--glow:0 8px 30px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:radial-gradient(1200px 500px at 85% -10%,#1b1450 0%,transparent 60%),radial-gradient(900px 500px at -10% 0%,#08334a 0%,transparent 55%),var(--bg);background-attachment:fixed;color:var(--txt);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.35;padding-bottom:84px;min-height:100vh;font-variant-numeric:tabular-nums}
a{color:var(--acc);text-decoration:none}
header{position:sticky;top:0;z-index:20;background:rgba(7,11,20,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px}
h1{font-size:17px;letter-spacing:.4px;font-weight:800;background:linear-gradient(90deg,#fff,#22d3ee 45%,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.live{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:#0c1528;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.live.on{color:var(--grn);border-color:#10d98a66;background:#0b2a22}
.live.on::first-letter{animation:pulse 1.6s infinite}
.live.stale{color:var(--yel);border-color:#fbbf2466;background:#2a2108}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.rbtn{margin-left:auto;background:linear-gradient(135deg,#1d2a4d,#16203a);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:8px 13px;font-size:13px;font-weight:600;min-height:40px;cursor:pointer}
.rbtn:hover{border-color:var(--acc)}
.fresh{font-size:11px;color:var(--dim);margin-top:5px}
.tick{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:2px}
.tick::-webkit-scrollbar{display:none}
.tk{flex:0 0 auto;background:linear-gradient(160deg,#16203a,#0f1729);border:1px solid var(--line);border-radius:12px;padding:6px 11px;min-width:96px}
.tk span{display:block;font-size:9.5px;letter-spacing:.8px;color:var(--dim);text-transform:uppercase}
.tk b{font-size:14px;font-weight:800}
.search{margin-top:8px;width:100%;background:#0c1426;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;color:var(--txt);outline:none}
.search:focus{border-color:var(--acc);box-shadow:0 0 0 3px #22d3ee22}
#app{max-width:1240px;margin:0 auto;padding:4px 0 12px}
.pad{padding:12px 14px}
.card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 14px;box-shadow:var(--glow)}
.card[onclick],.counter[onclick],.row[onclick]{cursor:pointer;transition:transform .12s,border-color .2s}
.card[onclick]:hover,.counter[onclick]:hover{border-color:#22d3ee88;transform:translateY(-1px)}
.main-card{border:1px solid #fbbf2477;background:linear-gradient(135deg,#2a2208,#0f1729 70%)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 14px}
.counter{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:13px 8px;text-align:center;min-height:68px;box-shadow:var(--glow)}
.counter b{display:block;font-size:21px;font-weight:800}
.counter span{font-size:10px;letter-spacing:.4px;color:var(--dim);display:block;margin-top:4px;line-height:1.25;text-transform:uppercase}
.tag{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:#121c35;color:var(--dim);border:1px solid var(--line)}
.tag.g{color:var(--grn);border-color:#10d98a55;background:#0b2a22}.tag.y{color:var(--yel);border-color:#fbbf2455;background:#2a2108}.tag.r{color:var(--red);border-color:#ff4d6d55;background:#2d0f1a}.tag.b{color:var(--blu);border-color:#4c9aff55;background:#0d1d38}.tag.gold{color:var(--gold);border-color:#fbbf2488;background:#2a2108}
.row{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid #1a2542;min-height:54px}
.row:hover{background:#ffffff06}
.row:last-child{border-bottom:none}
.row .sym{font-weight:800;min-width:74px}
.row .sub,.sub{font-size:11.5px;color:var(--dim)}
.row .val{margin-left:auto;text-align:right;font-size:13px}
.pos{color:var(--grn)}.neg{color:var(--red)}
.btn{display:inline-block;background:linear-gradient(135deg,#1d2a4d,#16203a);border:1px solid var(--line);border-radius:12px;padding:9px 13px;font-size:12.5px;font-weight:600;margin:4px 4px 0 0;min-height:38px;color:var(--txt)}
.btn:hover{border-color:var(--acc)}
.btn.ca{background:#0b2a22;border-color:#10d98a88;color:var(--grn)}
.sec{font-size:12px;font-weight:700;color:var(--dim);letter-spacing:1.2px;margin:18px 16px 4px;text-transform:uppercase}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:8px 0;border-bottom:1px dashed #1a2542}
.kv:last-child{border:none}
.kv b{font-weight:700;text-align:right}
.kv span{color:var(--dim)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(7,11,20,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:9px 0 11px;color:var(--dim);font-size:10.5px;font-weight:600}
nav a.on{color:var(--acc)}
nav a.on i{background:linear-gradient(135deg,#22d3ee33,#8b5cf633);border-radius:12px}
nav a i{display:block;font-style:normal;font-size:18px;margin:0 auto 2px;width:42px;line-height:28px;transition:background .2s}
.filters{display:flex;gap:7px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:#0f1729;border:1px solid var(--line);border-radius:20px;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--dim);min-height:36px;cursor:pointer}
.chip.on{color:#06101c;background:linear-gradient(135deg,#22d3ee,#8b5cf6);border-color:transparent}
select.chip{appearance:none}
.warn{background:#2a1a05;border:1px solid #7c4a0388;color:#fbbf24;border-radius:14px;padding:11px 13px;font-size:12px;margin:10px 14px}
.exp{background:#0d1d38;border:1px dashed var(--blu);color:#a9cdff;border-radius:14px;padding:9px 12px;font-size:11.5px;margin:8px 14px}
.back{display:inline-block;margin:12px 14px 0;color:var(--dim);font-size:14px;padding:6px 0;font-weight:600}
.sigchip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;padding:3px 9px;border-radius:20px;border:1px solid}
.st-EXTREME{color:var(--pink);border-color:var(--pink);background:#ff5df218}
.st-STRONG{color:var(--gold);border-color:var(--gold);background:#fbbf2418}
.st-BUILDING{color:var(--blu);border-color:var(--blu);background:#4c9aff18}
.st-WATCHING{color:var(--dim);border-color:var(--line)}
.st-BLOCKED,.st-INVALIDATED{color:var(--red);border-color:var(--red);background:#ff4d6d14}
.st-EXPIRED{color:var(--dim);border-color:var(--line);opacity:.6}
.why-line{font-size:13px;line-height:1.7;padding:2px 0}
.pill{font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:20px;border:1px solid var(--line);color:var(--dim);cursor:pointer;margin:2px 4px 2px 0;display:inline-block}
.pill.on{color:#06101c;background:linear-gradient(135deg,#22d3ee,#8b5cf6);border-color:transparent}
pre{white-space:pre-wrap;word-break:break-all;font-size:11px;color:var(--dim)}
.big{font-size:26px;font-weight:800}
.center{text-align:center;color:var(--dim);padding:30px;font-size:13px}
.mono{font-family:ui-monospace,monospace;font-size:11px;word-break:break-all}
table{border-collapse:collapse}
td,th{padding:5px 8px}
details summary{cursor:pointer}
/* FIVE-WALLET FRESH TEST */
.fw-sec{margin:12px 0 4px}
.fw-head{display:flex;align-items:center;gap:8px;margin:2px 16px 10px;flex-wrap:wrap}
.fw-head b{font-size:14px;letter-spacing:.5px}
.fw-grid{display:grid;grid-template-columns:1fr;gap:10px;margin:0 14px}
@media(min-width:560px){.fw-grid{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}
.fw-card{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:15px;cursor:pointer;transition:border-color .3s,transform .15s;position:relative;overflow:hidden;box-shadow:var(--glow)}
.fw-card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--acc),var(--vio))}
.fw-card:hover{border-color:#22d3ee88;transform:translateY(-2px)}
.fw-card.leader{border-color:#fbbf2488;box-shadow:0 0 24px #fbbf2426}
.fw-card.leader::before{background:linear-gradient(90deg,#fbbf24,#ff9f43)}
.fw-rank{font-size:11px;color:var(--dim)}
.fw-badge{font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;border:1px solid var(--gold);color:var(--gold)}
.fw-name{font-size:16px;font-weight:800;margin:6px 0 2px}
.fw-eq{font-size:26px;font-weight:800;transition:color .3s}
.fw-eq.up{color:var(--grn)}.fw-eq.dn{color:var(--red)}
.fw-pl{font-size:12.5px;font-weight:600}
.fw-bar{height:9px;border-radius:8px;background:#070b14;border:1px solid var(--line);margin:9px 0 4px;overflow:hidden}
.fw-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--blu),var(--acc));transition:width .8s ease}
.fw-fill.done{background:linear-gradient(90deg,var(--grn),var(--gold))}
.fw-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:6px}
.fw-sum{background:linear-gradient(135deg,#142340,var(--card));border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 14px;box-shadow:var(--glow)}
.fw-sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.fw-sumgrid>div{text-align:center;background:#070b1466;border:1px solid var(--line);border-radius:12px;padding:9px 4px}
.fw-sumgrid b{display:block;font-size:15px}
.fw-sumgrid span{font-size:9.5px;color:var(--dim);display:block;margin-top:2px;text-transform:uppercase}
/* desktop: sidebar nav + multi-column */
@media(min-width:980px){
 body{padding-bottom:20px;padding-left:210px}
 header{padding:12px 28px 10px}
 .tick{flex-wrap:wrap;overflow:visible}
 .search{max-width:520px}
 nav{top:0;bottom:0;right:auto;width:210px;flex-direction:column;border-top:none;border-right:1px solid var(--line);padding:78px 12px 20px;gap:4px}
 nav::before{content:"⚡ JK RADAR";position:absolute;top:22px;left:20px;font-weight:800;font-size:17px;background:linear-gradient(90deg,#fff,#22d3ee 50%,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
 nav a{flex:none;display:flex;align-items:center;gap:12px;text-align:left;padding:8px 12px;border-radius:14px;font-size:14px}
 nav a i{margin:0;width:34px;line-height:34px;font-size:18px}
 nav a.on{background:#16203a;color:#fff}
 header h1{display:none}
 #app{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:6px;align-items:start;padding:4px 14px}
 #app>.fw-sec,#app>.grid,#app>.sec,#app>.warn,#app>.exp,#app>.filters,#app>.back,#app>.center,#app>.fw-sum,#app>div:not(.card):not(.row){grid-column:1/-1}
 .grid{grid-template-columns:repeat(5,1fr)}
 .fw-grid{grid-template-columns:repeat(5,1fr)}
 .fw-sumgrid{grid-template-columns:repeat(6,1fr)}
 .card{margin:10px 8px}
}
@media(min-width:1500px){#app{max-width:1400px}}
.card[style*="f0b90b"]{border:1px solid #fbbf2477!important;background:linear-gradient(135deg,#2a2208,#0f1729 70%)}
nav a i svg{vertical-align:middle}
@media(max-width:979px){
 .fw-grid{grid-template-columns:1fr 1fr;gap:9px}
 .fw-grid .fw-card:first-child{grid-column:1/-1}
 .fw-card{padding:13px 12px}
 .fw-eq{font-size:22px}
 .fw-meta{flex-wrap:wrap;gap:2px 8px}
 h1{font-size:15px;white-space:nowrap}
}
@media(min-width:980px){
 body:not([data-r=home]) #app>.card:has(.row){grid-column:1/-1}
 body[data-r=wallets] #app>.card{grid-column:1/-1}
}
@media(min-width:980px){body[data-r=token] #app,body[data-r=wallet] #app,body[data-r=sig] #app{display:block;max-width:900px}}
.rbtn{white-space:nowrap;padding:8px 11px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1>⚡ JK AI MEME RADAR</h1>
    <span id="livechip" class="live">connecting…</span>
    <button class="rbtn" onclick="hardRefresh()">⟳ Refresh</button>
  </div>
  <div class="fresh" id="freshline">loading…</div>
  <div class="tick" id="tick"></div>
  <input class="search" id="search" placeholder="🔎 token / symbol / CA / wallet…" oninput="doSearch(this.value)">
</header>
<div id="sigpanel" style="max-width:1200px;margin:12px auto;padding:0 12px"></div>
<div id="app"><div class="center">loading command center…</div></div>
<nav>
  <a href="#/" data-r="/"><i><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></i>Home</a>
  <a href="#/list/watch" data-r="/list"><i><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".6"/></svg></i>Tokens</a>
  <a href="#/wallets" data-r="/wallets"><i><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1"/></svg></i>Wallets</a>
  <a href="#/paper" data-r="/paper"><i><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10l5 4 4-8 4 6 3-3v11z"/></svg></i>Paper</a>
  <a href="#/performance" data-r="/performance"><i><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4"/><path d="M4 20h16"/><rect x="8" y="11" width="3" height="6"/><rect x="14" y="7" width="3" height="10"/></svg></i>Results</a>
  <a href="#/status" data-r="/status"><i><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></i>Status</a>
  <a href="#/signals" data-r="/signals"><i><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.4 5.6L20 9l-4.4 3.9L17 19l-5-3-5 3 1.4-6.1L4 9l5.6-.4z"/></svg></i>Signals</a>
</nav>
<script>
const B='data/';
let S={status:null,summary:null,tokens:null,wallets:null,paper:null,sig:null,health:null,v2:null,performance:null,fw:null,pe:null,tc:{},wc:{}};
let lastTs=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const na=v=>(v===null||v===undefined||v==='')?'<span class="sub">N/A</span>':v;
const k=v=>v==null?'N/A':(v>=1e9?'$'+(v/1e9).toFixed(2)+'B':v>=1e6?'$'+(v/1e6).toFixed(2)+'M':v>=1e3?'$'+(v/1e3).toFixed(1)+'K':'$'+(+v).toFixed(2));
const px=p=>p==null?'N/A':(p<0.001?p.toExponential(2):(+p).toPrecision(4));
const x2=m=>m==null?'N/A':'x'+(+m).toFixed(2);
const ist=iso=>{if(!iso)return'N/A';try{const d=new Date(iso);return d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Kolkata'});}catch(e){return'N/A';}};
const istd=iso=>{if(!iso)return'N/A';try{const d=new Date(iso);return d.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'Asia/Kolkata'});}catch(e){return'N/A';}};
const ago=iso=>{if(!iso)return'N/A';const s=(Date.now()-new Date(iso))/1e3;if(s<60)return Math.round(s)+'s ago';if(s<3600)return Math.round(s/60)+'m ago';return(s/3600).toFixed(1)+'h ago';};
const dur=s=>{if(s==null)return'N/A';s=+s;if(s<60)return s+'s';if(s<3600)return Math.round(s/60)+'m';if(s<86400)return(s/3600).toFixed(1)+'h';return(s/86400).toFixed(1)+'d';};
async function j(p){const r=await fetch(B+p+'?v='+(lastTs||Date.now()));if(!r.ok)throw new Error(p+' '+r.status);return r.json();}
async function loadAll(){
  S.status=await j('status.json');
  if(S.status.ts!==lastTs){
    lastTs=S.status.ts;
    [S.summary,S.tokens,S.wallets,S.paper]=await Promise.all([j('summary.json'),j('tokens.json'),j('wallets.json'),j('paper.json')]);
    try{S.sig=await j('sig_feed.json');}catch(e){S.sig=S.sig||{signals:[]};}
    try{S.health=await j('sig_health.json');}catch(e){S.health=S.health||{components:{}};}
    try{S.v2=await j('sig_v2.json');}catch(e){S.v2=S.v2||{v2:{}};}
    try{S.performance=await j('performance.json');}catch(e){S.performance={error:'UNAVAILABLE'};}
    try{S.fw=await j('fwtest.json');}catch(e){S.fw=S.fw||null;}
    try{S.fwa=await j('fwt_archive_view.json');}catch(e){S.fwa=null;}
    try{S.pe=await j('pewallet.json');}catch(e){S.pe=S.pe||null;}
    try{S.arena=await j('arena_signals.json');}catch(e){S.arena=S.arena||null;}
  }
  freshness();
}
function ticker(){
  const el=$('tick');if(!el)return;
  const fw=S.fw&&S.fw.wallets?S.fw:null,sm=fw?(fw.summary||{}):{},pe=S.pe&&!S.pe.error?S.pe:null;
  const t=(l,v,c)=>`<div class="tk"><span>${l}</span><b ${c?'class="'+c+'"':''}>${v}</b></div>`;
  let h='';
  if(fw){h+=t('FWT equity',sm.equity_total!=null?'$'+(+sm.equity_total).toFixed(2):'N/A',(sm.pnl??0)>=0?'pos':'neg');
    h+=t('FWT P&L',sm.pnl!=null?((sm.pnl>=0?'+':'')+'$'+(+sm.pnl).toFixed(2)):'N/A',(sm.pnl??0)>=0?'pos':'neg');
    h+=t('At $600',(fw.targets_reached!=null?fw.targets_reached:'N/A')+'/5');
    h+=t('Open',(sm.open_total!=null?sm.open_total:'N/A')+'/'+(sm.max_open_total!=null?sm.max_open_total:'N/A'));}
  const c=S.summary&&S.summary.counters;
  if(c){h+=t('Signals today',c.signals_today??'N/A');h+=t('Watch',c.watch_candidates??'N/A');}
  el.innerHTML=h;
}
function freshness(){
  ticker();try{renderSig();}catch(e){}
  const st=S.status;if(!st)return;
  const ageS=(Date.now()-new Date(st.publish_time))/1e3;
  const chip=$('livechip');
  chip.className='live '+(ageS<600?'on':'stale');
  chip.textContent=ageS<600?'● LIVE':'◌ STALE';
  $('freshline').textContent='Data updated '+ago(st.publish_time)+' (last engine publish '+ist(st.publish_time)+' IST) · auto-refresh 10s';
}

function renderSig(){
  const el=$('sigpanel');if(!el)return;const A=S.arena;
  if(!A||!A.signals){el.innerHTML='';return;}
  const rows=A.signals.slice(0,60).map(s=>{
    const bk=Object.entries(s.books||{}).map(([b,v])=>{const o=v.status==='OPEN';const c=o?'#8ab4ff':((v.pnl||0)>=0?'#4ade80':'#f87171');

    const b=P.books[c]; if(!b){h+=`<div class="card">${c}: UNAVAILABLE</div>`;continue;}
    const e={MAIN:'👑',BLUE:'🔵',YELLOW:'🟡',GREEN:'🟢',RED:'🔴'}[c];
    h+=`<div class="card ${c==='MAIN'?'main-card':''}"><div class="hrow"><b>${e} ${c}</b><span class="sub" style="margin-left:auto">${b.sample}</span></div>
    <div class="sub">${esc(b.strategy)}</div><div class="kv"><span>Equity / ROI</span><b>${money(b.equity)} / ${num(b.roi_pct)}%</b></div>
    <div class="kv"><span>Entry / current value (open)</span><b>${money(b.entry_value_open)} / ${money(b.current_value_open)}</b></div>
    <div class="kv"><span>Realized / unrealized P&L</span><b>${money(b.realized_pnl)} / ${money(b.unrealized_pnl)}</b></div>
    <div class="kv"><span>Net P&L</span><b>${money(b.net_pnl)}</b></div>
    <div class="kv"><span>Trades / open / closed</span><b>${b.trades} / ${b.open} / ${b.closed}</b></div>
    <div class="kv"><span>Source-linked / legacy unlinked</span><b>${b.source_linked_n} / ${b.legacy_unlinked_n}</b></div>
    <div class="kv"><span>Wins / losses / win rate</span><b>${b.wins} / ${b.losses} / ${b.win_rate_pct==null?'UNAVAILABLE':num(b.win_rate_pct)+'%'}</b></div>
    <div class="kv"><span>Avg / median realized ROI</span><b>${num(b.average_roi_pct)}% / ${num(b.median_roi_pct)}%</b></div>
    <div class="kv"><span>Profit factor</span><b>${b.profit_factor==null?esc(b.profit_factor_note||'UNAVAILABLE'):num(b.profit_factor)}</b></div>
    <div class="kv"><span>Avg win / loss</span><b>${money(b.average_win)} / ${money(b.average_loss)}</b></div>
    <div class="kv"><span>Observed avg MFE / MAE (n=${b.sampled_excursion_n})</span><b>${num(b.sampled_mfe_pct)}% / ${num(b.sampled_mae_pct)}%</b></div>
    <div class="kv"><span>Max drawdown</span><b>${esc(b.max_drawdown_note)}</b></div>
    <div class="kv"><span>Avg hold / time-to-peak</span><b>${b.average_holding_s==null?'UNAVAILABLE':dur(b.average_holding_s)} / ${b.average_time_to_peak_s==null?'UNAVAILABLE':dur(b.average_time_to_peak_s)}</b></div>
    <div class="kv"><span>Best / worst realized trade</span><b>${b.best_trade?esc(b.best_trade.sym)+' '+money(b.best_trade.realized_pnl):'UNAVAILABLE'} / ${b.worst_trade?esc(b.worst_trade.sym)+' '+money(b.worst_trade.realized_pnl):'UNAVAILABLE'}</b></div>
    ${Math.abs(b.accounting_gap||0)>.01?`<div class="warn">⚠️ UNRECONCILED: equity vs realized + unrealized P&L differs by ${money(b.accounting_gap)}. Source state/ledger needs investigation; neither figure has been adjusted.</div>`:''}
    <div class="sub">${b.closed} closed; performance comparisons need at least ${b.sample_min} closed trades. ${b.sample}.</div></div>`;
  }
  const LL=P.linked_ledger||{trades:[],n:0,completed:0};
  h+=`<div class="sec">VERIFIED LINKED LEDGER (live-wired)</div>`;
  h+=`<div class="card"><div class="kv"><span>Live-linked trades / completed</span><b>${LL.n} / ${LL.completed}</b></div>
  <div class="kv"><span>Integrity</span><b>${LL.integrity_faults?('⚠️ '+LL.integrity_faults+' DATA INTEGRITY ERROR(s) - see logs'):'clean'}</b></div>
  ${LL.label?`<div class="warn">${esc(LL.label)}</div>`:''}
  ${(LL.trades||[]).map(t=>`<div class="row"><div><b>${esc(t.signal_id)}</b><div class="sub">${esc(t.strategy)} · ${esc(t.status)} · $${num(t.position_usd)} @ ${t.entry_price}</div></div><div class="val">${t.realized_pnl==null?(t.unrealized_pnl==null?'PENDING':('$'+num(t.unrealized_pnl)+' open')):('$'+num(t.realized_pnl))}<div class="sub">ROI ${num(t.roi_pct)}% · MFE ${num(t.mfe_pct)}% · MAE ${num(t.mae_pct)}%</div></div></div>`).join('')}
  <div class="sub">Only live-wired entries appear here; historical trades stay UNLINKED/LEGACY. ${esc(LL.sample||'')}</div></div>`;
  h+=`<div class="sec">SIGNAL → OUTCOME (tracked only)</div>`;
  h+=`<div class="card">${(P.signals||[]).map(s=>`<div class="row" onclick="location.hash='#/sig/${esc(s.signal_id)}'"><div><b>$${esc(s.sym)}</b><div class="sub">${esc(s.signal_id)} · ${esc(s.production_state)} · ${s.linked_paper_entries.length?s.linked_paper_entries.length+' source-linked paper entries':'⚠️ SIGNAL OUTCOME PENDING'}</div></div><div class="val">${s.roi_observed_pct==null?'OUTCOME UNAVAILABLE':num(s.roi_observed_pct)+'% sampled'}<div class="sub">MFE ${num(s.mfe_pct)}% · MAE ${num(s.mae_pct)}% · ${s.snapshot_count} snapshots</div></div></div>`).join('')}</div>`;
  return h;
}
async function vStatus(){
  const tg=S.summary.telegram;
  const hc=(S.health&&S.health.components)||{};
  const hicon=st=>st==='ok'?'🟢':st==='degraded'?'🟡':st==='off'?'⚪':'🔴';
  const wsLabel=()=>{const c=hc['websocket']||{};const st=c.status;
    if(st==='ok'&&c.last_msg&&(Date.now()/1000-c.last_msg)<180)return'🟢 WebSocket LIVE';
    if(st==='ok')return'⚪ REST FALLBACK (ws idle)';
    if(st==='reconnecting')return'🟡 RECONNECTING';
    if(st==='connecting'||st==='idle')return'⚪ REST FALLBACK';
    if(st==='down')return'🔴 Feed DOWN';
    return'⚪ REST FALLBACK';};
  const hrow=(label,key)=>{const c=hc[key]||{};return`<div class="kv"><span>${hicon(c.status)} ${label}</span><b>${c.last_ok?ago(new Date(c.last_ok*1000).toISOString()):esc(c.note||'no data')}</b></div>`+(c.note?`<div class="sub" style="padding-left:22px">${esc(c.note)}</div>`:'');};
  return`<a class="back" href="#/">← home</a>
  <div class="sec">SYSTEM HEALTH</div><div class="card">
    ${hrow('DATA FEED','data_feed')}
    <div class="kv"><span>${wsLabel()}</span><b>${esc((hc['websocket']||{}).note||'')}</b></div>
    ${hrow('SIGNAL ENGINE','signal_engine')}
    ${hrow('DATABASE','database')}
    ${hrow('SECURITY PROVIDER','security_provider')}
    <div class="kv"><span>${tg.online?'🟢':'🔴'} TELEGRAM</span><b>${ago(tg.last_delivery)}</b></div>
    <div class="sub" style="margin-top:6px">last successful update shown per component · auto-refresh 10s</div></div>
  <div class="sec">TELEGRAM BOT 3 (PRIMARY)</div><div class="card">
    <div class="kv"><span>state</span><b class="${tg.online?'pos':'neg'}">${tg.online?'ONLINE':'OFFLINE'}</b></div>
    <div class="kv"><span>last delivery</span><b>${istd(tg.last_delivery)} IST (${ago(tg.last_delivery)})</b></div>
    <div class="kv"><span>last kind</span><b>${esc(tg.last_kind||'N/A')}</b></div>
    <div class="kv"><span>last BUY alert</span><b>${istd(tg.last_buy_alert)} IST</b></div>
    <div class="kv"><span>24h deliveries</span><b>${tg.ok_24h} ok · ${tg.errors_24h} errors</b></div></div>
  <div class="sec">YOUR CONTROLS (read-only - set in Telegram)</div><div class="card">
    <div class="kv"><span>instant buy alerts</span><b class="${S.status.settings&&S.status.settings.alerts?'pos':'neg'}">${S.status.settings?(S.status.settings.alerts?'ON':'OFF'):'N/A'}</b></div>
    <div class="kv"><span>wallet-buys summary</span><b>every ${S.status.settings?S.status.settings.interval_min:'?'} min</b></div>
    <div class="kv"><span>watched wallets</span><b>${S.status.settings?S.status.settings.watched_count:0}</b></div>
    <div class="sub">${S.status.settings&&S.status.settings.watched_masked.length?esc(S.status.settings.watched_masked.join(' · ')):'No wallets watched yet'}</div>
    <div class="sub">Telegram commands: <b>/watch &lt;address&gt;</b> alert on every buy from a wallet · <b>/unwatch &lt;address&gt;</b> · <b>/watched</b> list · <b>/interval &lt;min&gt;</b> summary cadence (1-60) · <b>/alerts on|off</b> instant alerts. Replies within a minute.</div></div>
  <div class="sec">DASHBOARD CONTROLS</div><div class="card">
    <div class="sub">Send test / portfolio / alerts from this page: <b>NOT AVAILABLE</b> - GitHub Pages is static hosting; the bot token stays server-side for security. Use the Telegram chat commands instead: /status /paper /live /signals /top /wallets /walletradar /watch /unwatch /watched /interval /alerts.</div></div>
  <div class="sec">WHATSAPP</div><div class="card">
    <div class="kv"><span>report beats</span><b>ACTIVE via assistant (10-min)</b></div>
    <div class="kv"><span>dashboard actions</span><b>NOT CONFIGURED (static page)</b></div></div>
  <div class="sec">ENGINE</div><div class="card">
    <div class="kv"><span>data publish</span><b>${istd(S.status.publish_time)} IST (${ago(S.status.publish_time)})</b></div>
    <div class="kv"><span>auto-refresh</span><b>every 10s (re-pulls published JSON)</b></div>
    <div class="kv"><span>latency honesty</span><b>measured evidence INSUFFICIENT SAMPLE (n=5 VERIFIED) - see backend evidence</b></div></div>`;
}
let searchT=null;
async function doSearch(q){
  clearTimeout(searchT);
  if(!q||q.length<2)return;
  searchT=setTimeout(async()=>{
    q=q.trim();
    if(S.tokens[q])return location.hash='#/token/'+q;
    if(S.wallets[q])return location.hash='#/wallet/'+q;
    const ql=q.toLowerCase();
    const tm=Object.keys(S.tokens).filter(m=>(S.tokens[m].sym||'').toLowerCase().includes(ql)||m.toLowerCase().startsWith(ql)).slice(0,10);
    const wm=Object.keys(S.wallets).filter(a=>a.toLowerCase().startsWith(ql)).slice(0,5);
    let h=`<a class="back" href="#/">← home</a><div class="sec">SEARCH "${esc(q)}"</div>`;
    if(!tm.length&&!wm.length)h+=`<div class="center">no matches in tracked tokens/wallets</div>`;
    if(tm.length)h+=`<div class="card" style="padding:0 12px">${tm.map(m=>row(m,S.tokens[m])).join('')}</div>`;
    if(wm.length)h+=`<div class="card" style="padding:0 12px">${wm.map(a=>`<div class="row" onclick="location.hash='#/wallet/${a}'"><div class="sym">…${a.slice(-8)}</div><div class="val">${S.wallets[a].score!=null?(+S.wallets[a].score).toFixed(1):'N/A'}</div></div>`).join('')}</div>`;
    $('app').innerHTML=h;
  },250);
}
function peSection(){
  const d=S.pe;
  if(!d||d.error)return `<div class="card" style="border:2px solid #f0b90b"><b>🎯 PRE-ENTRY WALLET</b><div class="sub">UNAVAILABLE (no data yet)</div></div>`;
  const a=d.account||{},c=d.counters||{},r=d.rules||{};
  const pos=(d.positions||[]).map(p=>`<div class="row"><div class="sym">$${esc(p.sym||'?')}</div><div class="val">${x2(p.mult)} · $${(+p.value).toFixed(2)}<div class="sub">in ${ago(p.entry_time)}${p.feed_lost?' · ⚠ price feed lost (mark stale '+p.mark_age_s+'s)':''}</div></div></div>`).join('')||'<div class="sub" style="padding:8px 0">no open positions yet - waiting for the next pre-entry card</div>';
  const cl=(d.closed||[]).slice(0,10).map(x=>`<div class="row"><div class="sym">$${esc(x.sym||'?')}</div><div class="val">${esc(x.stage)} · ${(x.pnl>=0?'+':'')}$${(+x.pnl).toFixed(2)}</div></div>`).join('')||'<div class="sub" style="padding:8px 0">no closed trades yet</div>';
  return `<div class="card" style="border:2px solid #f0b90b"><div class="sec" style="margin-top:0">🎯 PRE-ENTRY WALLET · buys every pre-entry card coin</div>
  <div class="sub">PAPER ONLY · $${r.bet}/coin · max ${r.max_open} open · TP ${r.tp}x · SL -50% · RUG = -$${r.bet}</div>
  <div style="font-size:20px;font-weight:700;margin:6px 0">Equity $${(+a.equity).toFixed(2)} <span class="sub">(realized ${(+a.realized).toFixed(2)} · unrealized ${(+a.unreal).toFixed(2)} · cash ${(+a.cash).toFixed(2)})</span></div>
  <div class="sub">open ${a.open}/${r.max_open} · closed ${a.closed} (TP ${a.tp} · SL ${a.sl} · RUG ${a.rug}) · cards seen ${c.cards} · repeat cards ${c.dup_cards} · skipped (full) ${c.skipped_full} · skipped (no price) ${c.skipped_noprice}</div>
  <div class="sec">OPEN</div>${pos}<div class="sec">LAST CLOSED</div>${cl}
  <div class="sub" style="margin-top:8px">${esc(d.label)} Started ${istd(d.start_ts)} IST · updated ${ago(d.publish_time)}.</div></div>`;
}
async function route(){
  const h=(location.hash||'#/').slice(1);
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',h.startsWith(a.dataset.r)));
  let html;
  try{
    if(!S.summary)await loadAll();
    if(h==='/'||h==='')html=await vHome();
    else if(h.startsWith('/list/'))html=await vList(h.split('/')[2]);
    else if(h.startsWith('/token/'))html=await vToken(h.split('/')[2]);
    else if(h.startsWith('/wallet/'))html=await vWallet(h.split('/')[2]);
    else if(h==='/wallets')html=await vWallets();
    else if(h==='/paper')html=await vPaper();
    else if(h==='/performance')html=await vPerformance();
    else if(h==='/status')html=await vStatus();
    else if(h==='/signals')html=await vSignals();
    else if(h.startsWith('/sig/'))html=await vSigDetail(h.split('/')[2]);
    else html=await vHome();
  }catch(e){html=`<div class="center">load error: ${esc(e.message)}<br><br><button class="btn" onclick="hardRefresh()">retry</button></div>`;}
  $('app').innerHTML=html;
  window.scrollTo(0,0);document.body.dataset.r=h.split('/')[1]||'home';
}
window.addEventListener('hashchange',route);
(async()=>{try{await loadAll();}catch(e){}$('app').innerHTML='<div class="center">connecting…</div>';route();})();
</script>
