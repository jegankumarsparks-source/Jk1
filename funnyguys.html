<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1621">
<meta name="apple-mobile-web-app-title" content="FG Relay">
<title>FUNNY GUYS Bot Relay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  body { background:#0e1621; color:#ffffff; display:flex; flex-direction:column; }
  #topbar { padding:10px 14px; background:#17212b; display:flex; flex-direction:column; gap:8px; }
  #topRow { display:flex; align-items:center; gap:8px; }
  #connDot { width:10px; height:10px; border-radius:50%; background:#f15c6d; flex:none; }
  #botPick { flex:1; padding:8px 10px; font-size:14px; border-radius:8px; border:1px solid #242f3d; background:#242f3d; color:#ffffff; outline:none; }
  #addBotBtn { padding:8px 10px; border:none; border-radius:8px; background:#242f3d; color:#64b5f6; font-size:13px; white-space:nowrap; }
  #statusLine { font-size:12px; color:#6d7f8f; }
  #addRow { display:none; gap:8px; flex-wrap:wrap; }
  #addRow input { flex:1; min-width:120px; padding:8px 10px; font-size:13px; border-radius:8px; border:1px solid #242f3d; background:#242f3d; color:#ffffff; outline:none; }
  #addRow button { padding:8px 12px; border:none; border-radius:8px; background:#5288c1; color:#fff; font-size:13px; }
  #msgs { flex:1; overflow-y:auto; padding:14px 12px 8px; display:flex; flex-direction:column; gap:6px; }
  .row { display:flex; }
  .row.mine { justify-content:flex-end; }
  .bubble { max-width:80%; padding:8px 10px 6px; border-radius:10px; font-size:15px; line-height:1.35; word-wrap:break-word; background:#17212b; white-space:pre-wrap; }
  .row.mine .bubble { background:#2b5278; }
  .bubble .who { font-size:11.5px; font-weight:600; color:#64b5f6; margin-bottom:2px; }
  .row.mine .bubble .who { color:#a8c8f0; }
  .bubble .relayTag { font-size:10.5px; color:#6d7f8f; margin-bottom:2px; }
  .bubble .meta { font-size:10.5px; color:#6d7f8f; text-align:right; margin-top:2px; }
  .bubble audio { display:block; width:230px; max-width:230px; height:40px; margin-top:2px; }
  .sys { align-self:center; font-size:12px; color:#6d7f8f; background:#17212b; padding:4px 12px; border-radius:12px; margin:4px 0; max-width:90%; text-align:center; }
  #composer { display:flex; align-items:flex-end; gap:8px; padding:8px 10px; background:#17212b; }
  #textIn { flex:1; padding:12px 14px; font-size:16px; border:none; border-radius:22px; background:#242f3d; color:#ffffff; outline:none; }
  .cbtn { width:46px; height:46px; flex:none; border:none; border-radius:50%; background:#5288c1; color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .cbtn:active { opacity:.85; }
  #micBtn.rec { background:#f15c6d; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.6; } }
  #recBar { display:none; align-items:center; gap:10px; flex:1; padding:0 6px; }
  #recDot { width:12px; height:12px; border-radius:50%; background:#f15c6d; animation:pulse 1s infinite; }
  #recTime { font-size:16px; font-variant-numeric:tabular-nums; }
  #replyBar { display:none; align-items:center; gap:8px; padding:6px 12px; background:#17212b; border-left:3px solid #64b5f6; font-size:13px; color:#ffffff; }
  #replyBar span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #replyCancel { background:none; border:none; color:#6d7f8f; font-size:16px; cursor:pointer; }
  .quote { border-left:2px solid #64b5f6; padding-left:6px; color:#6d7f8f; font-size:12px; margin-bottom:3px; }
  .bubble { cursor:pointer; }
  .av { width:36px; height:36px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; color:#fff; margin-right:8px; align-self:flex-end; }
  .row.mine .av { display:none; }
  .bubble .relayTag { font-style:normal; }
  .fwdHdr { font-size:12px; color:#64b5f6; margin-bottom:2px; }

  #recCancel { margin-left:auto; background:none; border:none; color:#6d7f8f; font-size:15px; cursor:pointer; }
</style>
</head>
<body>
<div id="topbar">
  <div id="topRow">
    <span id="connDot"></span>
    <select id="botPick"></select>
    <button id="addBotBtn">+ bot</button>
  </div>
  <div id="statusLine">connecting...</div>
  <div id="addRow">
    <input id="newName" placeholder="bot name (label)">
    <input id="newTok" placeholder="bot token (stored only on this device)">
    <button id="saveTok">Add bot</button>
  </div>
</div>
<div id="msgs"></div>
<div id="replyBar"><span id="replySnippet"></span><button id="replyCancel">X</button></div>
<div id="composer">
  <div id="recBar"><span id="recDot"></span><span id="recTime">0:00</span><button id="recCancel">Cancel</button></div>
  <input id="textIn" placeholder="Message to FUNNY GUYS..." autocomplete="off">
  <input type="file" id="fileIn" style="display:none">
  <button class="cbtn" id="attBtn" title="Attach file"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
  <button class="cbtn" id="micBtn" title="Record voice"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg></button>
  <button class="cbtn" id="sendBtn" title="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M3 20v-6l8-2-8-2V4l19 8z"/></svg></button>
</div>
<script>
(function(){
  "use strict";
  // HARD-LOCK (owner order): this app talks ONLY to the FUNNY GUYS supergroup.
  var GROUP_CHAT = "-1003961908011";
  // Embedded default bots (owner order: both tokens inside). confirm=false -> another
  // daemon owns offset confirmation on that stream; we observe non-destructively.
  var DEFAULT_BOTS = [
    {name:"BOT 1", token:"8255731830:AAEyyg46NXMvHna2WdFDLKFtvAX3uU8VvzI", confirm:false},
    {name:"BOT 2", token:"8634095089:AAG736RRVPZG8cvCwhYrovXsBtARYcHzCV8", confirm:true}
  ];
  var $=function(id){return document.getElementById(id);};
  var bots=[], streams={}, curBot=0, botNames={};
  var mediaRec=null, recChunks=[], recStart=0, recTimer=null;
  var rendered=[], replyTo=null;
  var seenOrig={};

  function loadBots(){
    bots = DEFAULT_BOTS.map(function(b){ return {name:b.name, token:b.token, confirm:b.confirm}; });
    try{
      var extra = JSON.parse(localStorage.getItem("fgrelay_bots")||"[]");
      extra.forEach(function(b){ if(b && b.token) bots.push({name:b.name||"bot", token:b.token, confirm:true}); });
    }catch(e){}
    var sel=$("botPick"); sel.innerHTML="";
    bots.forEach(function(b,i){
      var o=document.createElement("option"); o.value=i; o.textContent=b.name; sel.appendChild(o);
    });
  }
  function api(tok, method, body){
    return fetch("https://api.telegram.org/bot"+tok+"/"+method,{
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body||{})
    }).then(function(r){return r.json();});
  }
  function esc(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
  function fmtTime(ts){ var d=new Date(ts); return d.getHours()+":"+("0"+d.getMinutes()).slice(-2); }
  function fmtDur(sec){ return Math.floor(sec/60)+":"+("0"+(sec%60)).slice(-2); }
  function scrollBottom(){ var m=$("msgs"); m.scrollTop=m.scrollHeight; }
  function addSys(t){ var d=document.createElement("div"); d.className="sys"; d.textContent=t; $("msgs").appendChild(d); scrollBottom(); }
  var AV_COLORS=["#e17076","#eda86c","#a695e7","#7bc862","#6ec9cb","#65aadd","#ee7aae"];
  function avColor(name){ var s=0; for(var i=0;i<name.length;i++) s=(s*31+name.charCodeAt(i))>>>0; return AV_COLORS[s%AV_COLORS.length]; }
  function initials(name){ var p=name.trim().split(/\s+/); return ((p[0]||"?")[0]+((p[1]||"")[0]||"")).toUpperCase(); }
  function addMsg(o){ // {who, mine, relay, text?, voiceUrl?, ts, mid?, quote?}
    var row=document.createElement("div"); row.className="row"+(o.mine?" mine":"");
    if(!o.mine){
      var av=document.createElement("div"); av.className="av";
      av.style.background=avColor(o.who||"?"); av.textContent=initials(o.who||"?");
      row.appendChild(av);
    }
    var b=document.createElement("div"); b.className="bubble";
    var html='<div class="who">'+esc(o.who)+'</div>';
    if(o.relay) html+='<div class="fwdHdr">Forwarded from '+esc(o.who)+'</div>';
    if(o.quote) html+='<div class="quote">'+esc(o.quote)+'</div>';
    if(o.text!=null) html+='<div>'+esc(o.text)+'</div>';
    if(o.imgUrl) html+='<a href="'+o.imgUrl+'" target="_blank"><img src="'+o.imgUrl+'" style="max-width:100%;border-radius:8px;margin-top:4px"></a>';
    if(o.videoUrl) html+='<video controls preload="metadata" src="'+o.videoUrl+'" style="max-width:100%;border-radius:8px;margin-top:4px"></video>';
    if(o.docUrl) html+='<div style="margin-top:4px"><a href="'+o.docUrl+'" download style="color:#64b5f6">⬇ '+esc(o.docName||"file")+'</a></div>';
    if(o.voiceUrl) html+='<audio controls preload="auto" src="'+o.voiceUrl+'"></audio>';
    html+='<div class="meta">'+fmtTime(o.ts)+'</div>';
    b.innerHTML=html;
    if(o.mid) b.addEventListener("click", function(){ setReply(o.mid, o.text||"[voice]", o.who); });
    row.appendChild(b); $("msgs").appendChild(row); scrollBottom();
    rendered.push({text:(o.text!=null?o.text:null), mine:!!o.mine, ts:(o.ts||Date.now()), voice:!!o.voiceUrl, media:!!(o.imgUrl||o.videoUrl||o.docUrl)});
    if(rendered.length>200) rendered=rendered.slice(-200);
  }
  function setReply(mid, text, who){
    replyTo={mid:mid};
    $("replySnippet").textContent="Reply to "+(who||"")+": "+String(text).slice(0,60);
    $("replyBar").style.display="flex"; $("textIn").focus();
  }
  function clearReply(){ replyTo=null; $("replyBar").style.display="none"; }
  function seenRecentText(text){
    var now=Date.now();
    for(var i=0;i<rendered.length;i++){ var r=rendered[i]; if(now-r.ts<120000 && r.text!=null && r.text===text) return true; }
    return false;
  }
  function isDupeRelay(text, isVoice){
    var now=Date.now();
    for(var i=rendered.length-1;i>=0;i--){
      var r=rendered[i]; if(!r.mine) continue;
      if(now-r.ts>90000) break;
      if(isVoice && r.voice) return true;
      if(isVoice===false && text!=null && r.text===text) return true;
    }
    return false;
  }
  function setConn(on,label){ $("connDot").style.background=on?"#5288c1":"#f15c6d"; $("statusLine").textContent=label; }

  function cur(){ return bots[curBot]; }
  function sendText(){
    var v=$("textIn").value.trim(); if(!v) return;
    var body={chat_id:GROUP_CHAT, text:v};
    if(replyTo) body.reply_to_message_id=replyTo.mid;
    api(cur().token,"sendMessage",body).then(function(d){
      if(d.ok){ addMsg({who:"you (as "+cur().name+")", mine:true, text:v, ts:Date.now(), mid:(d.result||{}).message_id}); $("textIn").value=""; $("textIn").focus(); clearReply(); }
      else addSys("send as "+cur().name+" failed: "+(d.description||"?"));
    }).catch(function(){ addSys("send failed - network"); });
  }

  function pickMime(){
    if(!window.MediaRecorder) return null;
    var c=["audio/ogg;codecs=opus","audio/webm;codecs=opus","audio/webm","audio/mp4"];
    for(var i=0;i<c.length;i++) if(MediaRecorder.isTypeSupported(c[i])) return c[i];
    return "";
  }
  function startRec(){
    if(!window.MediaRecorder){ addSys("Voice recording not supported in this browser"); return; }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      var mime=pickMime();
      try{ mediaRec=new MediaRecorder(stream, mime?{mimeType:mime}:undefined); }
      catch(e){ mediaRec=new MediaRecorder(stream); }
      recChunks=[];
      mediaRec.ondataavailable=function(ev){ if(ev.data&&ev.data.size) recChunks.push(ev.data); };
      mediaRec.onstop=function(){
        stream.getTracks().forEach(function(t){t.stop();});
        var dur=Math.round((Date.now()-recStart)/1000); hideRec();
        if(dur<1){ addSys("Too short - hold the mic a little longer"); return; }
        var blob=new Blob(recChunks,{type:mediaRec.mimeType||"audio/ogg"});
        var fd=new FormData();
        fd.append("chat_id",GROUP_CHAT);
        fd.append("voice",blob,"voice.ogg");
        if(replyTo) fd.append("reply_to_message_id",replyTo.mid);
        fetch("https://api.telegram.org/bot"+cur().token+"/sendVoice",{method:"POST",body:fd})
          .then(function(r){return r.json();}).then(function(d){
            if(d.ok){ addMsg({who:"you (as "+cur().name+")", mine:true, voiceUrl:URL.createObjectURL(blob), ts:Date.now(), mid:(d.result||{}).message_id}); clearReply(); }
            else addSys("voice send as "+cur().name+" failed: "+(d.description||"?"));
          }).catch(function(){ addSys("voice send failed - network"); });
      };
      mediaRec.start(250); recStart=Date.now(); showRec();
    }).catch(function(){ addSys("Microphone permission needed for voice notes"); });
  }
  function stopRec(){ if(mediaRec&&mediaRec.state!=="inactive") mediaRec.stop(); }
  function cancelRec(){
    if(mediaRec&&mediaRec.state!=="inactive"){ mediaRec.ondataavailable=null; mediaRec.onstop=function(){}; try{mediaRec.stop();}catch(e){} }
    hideRec(); addSys("Recording cancelled");
  }
  function showRec(){
    $("recBar").style.display="flex"; $("textIn").style.display="none"; $("micBtn").classList.add("rec");
    recTimer=setInterval(function(){
      var s=Math.floor((Date.now()-recStart)/1000); $("recTime").textContent=fmtDur(s);
      if(s>=60) stopRec();
    },250);
  }
  function hideRec(){
    clearInterval(recTimer); $("recBar").style.display="none"; $("textIn").style.display="";
    $("micBtn").classList.remove("rec"); $("recTime").textContent="0:00";
  }

  function handleUpdate(bi, u){
    var st=streams[bi];
    if(!u || st.seen[u.update_id]) return; st.seen[u.update_id]=1;
    if(bots[bi].confirm) st.offset = u.update_id + 1;
    var m=u.message; if(!m) return;
    if(String(m.chat && m.chat.id)!==GROUP_CHAT) return; // hard lock
    var fromName=(m.from && (m.from.first_name||m.from.username||"member"))||"member";
    var isForward=!!(m.forward_origin || m.forward_from || m.forward_from_chat);
    if(!isForward && m.message_id){ if(seenOrig[m.message_id]) return; seenOrig[m.message_id]=1; }
    if(isForward && m.forward_origin && m.forward_origin.sender_user)
      fromName=(m.forward_origin.sender_user.first_name||m.forward_origin.sender_user.username||fromName);
    var quote=(m.reply_to_message && (m.reply_to_message.text||"[voice]"))||null;
    if(m.photo || m.video || (m.document && !m.voice)){
      var fid=null, kind="doc", label="[file]";
      if(m.photo){ fid=m.photo[m.photo.length-1].file_id; kind="img"; label=(m.caption||"[photo]"); }
      else if(m.video){ fid=m.video.file_id; kind="video"; label=(m.caption||"[video]"); }
      else { fid=m.document.file_id; label=(m.caption||m.document.file_name||"[file]"); }
      if(isForward && (isDupeRelay(label,false) || seenRecentText(label))) return; // mirror once
      var docName=(m.document && m.document.file_name)||null;
      api(bots[bi].token,"getFile",{file_id:fid}).then(function(d){
        if(d.ok){
          var url="https://api.telegram.org/file/bot"+bots[bi].token+"/"+d.result.file_path;
          var o={who:fromName, relay:isForward, text:(m.caption||null), ts:(m.date||0)*1000, mid:m.message_id, quote:quote};
          if(kind==="img") o.imgUrl=url; else if(kind==="video") o.videoUrl=url; else { o.docUrl=url; o.docName=docName||"file"; if(!o.text) o.text=null; }
          addMsg(o);
        }
      });
      return;
    }
    if(m.voice){
      if(isForward && isDupeRelay(null,true)) return; // own voice already shown
      if(isForward){ var now=Date.now(); for(var i=0;i<rendered.length;i++){ var r=rendered[i]; if(r.voice && now-r.ts<120000) return; } } // mirror once
      api(bots[bi].token,"getFile",{file_id:m.voice.file_id}).then(function(d){
        if(d.ok){
          var url="https://api.telegram.org/file/bot"+bots[bi].token+"/"+d.result.file_path;
          addMsg({who:fromName, relay:isForward, voiceUrl:url, ts:(m.date||0)*1000, mid:m.message_id, quote:quote});
        }
      });
      return;
    }
    var t=m.text||""; if(!t) return;
    if(isForward && (isDupeRelay(t,false) || seenRecentText(t))) return; // mirror: show each real message once
    addMsg({who:fromName, relay:isForward, text:t, ts:(m.date||0)*1000, mid:m.message_id, quote:quote});
  }
  function poll(bi){
    var st=streams[bi]; if(!st || !st.on) return;
    var body={timeout:20, limit:50};
    if(bots[bi].confirm && st.offset) body.offset=st.offset;
    api(bots[bi].token,"getUpdates",body).then(function(d){
      if(d.ok){
        if(d.result) d.result.forEach(function(u){ handleUpdate(bi,u); });
        setConn(true,"live - "+Object.keys(streams).length+" stream(s) | FUNNY GUYS only");
        setTimeout(function(){poll(bi);},300);
      } else {
        setConn(false,"stream issue ("+(d.error_code||"?")+") - retrying...");
        setTimeout(function(){poll(bi);}, d.error_code===409?3500:1500);
      }
    }).catch(function(){
      setConn(false,"connection problem - retrying...");
      setTimeout(function(){poll(bi);},3000);
    });
  }
  function startStream(bi){
    if(streams[bi]) return;
    streams[bi]={on:true, offset:0, seen:{}};
    api(bots[bi].token,"getMe").then(function(d){
      if(d.ok){
        botNames[bi]="@"+d.result.username;
        addSys("stream up: "+bots[bi].name+" ("+botNames[bi]+")");
        poll(bi);
      } else {
        addSys(bots[bi].name+": token problem - "+(d.description||"?"));
      }
    }).catch(function(){ addSys(bots[bi].name+": network problem"); });
  }

  loadBots();
  addSys("FUNNY GUYS - live group chat. You type/record as the selected bot; group chat (and relayed bot posts) appears here instantly.");
  for(var i=0;i<bots.length;i++) startStream(i);
  $("botPick").addEventListener("change",function(){ curBot=+this.value; addSys("now sending as: "+cur().name); });
  $("addBotBtn").addEventListener("click",function(){
    var r=$("addRow"); r.style.display=r.style.display==="flex"?"none":"flex";
  });
  $("saveTok").addEventListener("click",function(){
    var t=$("newTok").value.trim(), n=$("newName").value.trim()||("BOT "+(bots.length+1));
    if(!t) return;
    var extra=[]; try{ extra=JSON.parse(localStorage.getItem("fgrelay_bots")||"[]"); }catch(e){}
    extra.push({name:n, token:t});
    localStorage.setItem("fgrelay_bots", JSON.stringify(extra));
    $("newTok").value=""; $("newName").value="";
    loadBots(); startStream(bots.length-1);
    $("botPick").value=bots.length-1; curBot=bots.length-1;
  });
  $("sendBtn").addEventListener("click", sendText);
  $("textIn").addEventListener("keydown", function(e){ if(e.key==="Enter") sendText(); });
  $("micBtn").addEventListener("click", function(){
    if(mediaRec&&mediaRec.state!=="inactive") stopRec(); else startRec();
  });
  $("recCancel").addEventListener("click", cancelRec);
  $("replyCancel").addEventListener("click", clearReply);
  $("attBtn").addEventListener("click", function(){
    if(!cur()){ addSys("add a bot first (tap + bot)"); return; }
    $("fileIn").click();
  });
  $("fileIn").addEventListener("change", function(){
    var f=this.files[0]; if(!f) return; this.value="";
    var kind=(f.type.indexOf("image/")===0)?"photo":((f.type.indexOf("video/")===0)?"video":"doc");
    var method=(kind==="photo")?"sendPhoto":((kind==="video")?"sendVideo":"sendDocument");
    var field=(kind==="photo")?"photo":((kind==="video")?"video":"document");
    var label=(kind==="photo")?"[photo]":((kind==="video")?"[video]":f.name);
    var fd=new FormData(); fd.append("chat_id",GROUP_CHAT); fd.append(field,f,f.name);
    var cap=$("textIn").value.trim(); if(cap) fd.append("caption",cap);
    if(replyTo) fd.append("reply_to_message_id",replyTo.mid);
    addSys("uploading "+f.name+" ...");
    fetch("https://api.telegram.org/bot"+cur().token+"/"+method,{method:"POST",body:fd})
      .then(function(r){return r.json();}).then(function(d){
        if(d.ok){
          addMsg({who:"you (as "+cur().name+")", mine:true, text:(cap||label), ts:Date.now(), mid:(d.result||{}).message_id});
          $("textIn").value=""; clearReply();
        } else addSys("attach send failed: "+(d.description||"?"));
      }).catch(function(){ addSys("attach send failed - network"); });
  });
})();
</script>
</body>
</html>
