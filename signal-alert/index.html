<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JK | Launch Radar</title><meta name="theme-color" content="#09090d"><style>
:root{--bg:#09090d;--surface:#121218;--line:#25252f;--text:#eeeef4;--dim:#a0a0b1;--gold:#ffb800;--green:#65d7ad;--red:#ff667c}*{box-sizing:border-box}body{overflow-wrap:anywhere;margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif;padding-bottom:90px}header{padding:22px 18px 14px;border-bottom:1px solid var(--line);background:radial-gradient(ellipse at top right,#35240e,transparent 65%)}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--gold);font-weight:700}h1{font-size:27px;letter-spacing:-.05em;margin:6px 0}h2{overflow-wrap:anywhere;min-width:0;font-size:17px;margin:0 0 8px}.dim{overflow-wrap:anywhere;min-width:0;color:var(--dim);font-size:12px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.spread{justify-content:space-between}.tag{font-size:10px;padding:3px 7px;border:1px solid var(--line);border-radius:20px;letter-spacing:.03em;color:var(--gold)}main{padding:16px;max-width:920px;margin:auto}.panel{min-width:0;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:12px}.notice{background:#211b10;border-color:#554113;color:#f1c771;font-size:12px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}.stat{padding:16px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,#1b1915,var(--surface))}.big{font-size:28px;letter-spacing:-.06em;margin-top:6px}.accent{color:var(--gold)}.red{color:var(--red)}.green{color:var(--green)}.mono{font:11px/1.6 ui-monospace,monospace;overflow-wrap:anywhere;margin:7px 0;color:var(--dim)}.metrics{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin:14px 0}.metric{min-width:0}.metric strong{display:block;font-size:16px;overflow-wrap:anywhere}.links{display:flex;gap:6px;flex-wrap:wrap}.links a,button{min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#1c1c25;color:var(--text);text-decoration:none;font:12px system-ui}button{cursor:pointer}nav{position:fixed;bottom:0;left:0;right:0;background:#101015;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}nav button{flex:1;min-height:58px;border:0;border-radius:0;background:none;color:var(--dim);padding:12px 3px}nav button.on{color:var(--gold);box-shadow:inset 0 2px var(--gold)}input{width:100%;padding:13px;background:#15151d;border:1px solid var(--line);border-radius:12px;color:var(--text);margin-bottom:12px}.error{color:var(--red)}.ladder{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.level{font-size:11px;border:1px solid var(--line);padding:3px 7px;border-radius:7px;color:var(--dim)}.level.hit{color:var(--green);border-color:#28634e}.empty{padding:35px 12px;text-align:center;color:var(--dim)}@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}#list{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}}
</style></head><body><header><div class="row spread"><span class="eyebrow">JK / SIGNAL INTELLIGENCE</span><span class="tag">INFORMATIONAL ONLY</span></div><h1>Launch Radar<span class="accent">.</span></h1><div class="row spread"><span class="dim">First seen. Every outcome. No hindsight.</span><span class="tag" id="connection">CONNECTING</span></div></header><main><div class="panel notice">UNVERIFIED feed observations, not buy advice. Discovery time is not launch time. Feed windows have gaps. Market-cap multiples are not executable returns.</div><div class="dim" style="margin-bottom:12px"><a style="color:var(--gold)" href="legacy.html">Original radar / book / history ↗</a></div><div id="summary"></div><input id="search" placeholder="Search symbol or contract address" aria-label="Search coins"><div id="content"></div></main><nav><button class="on" data-tab="coins">Discoveries</button><button data-tab="milestones">Milestones</button><button data-tab="outcomes">Outcomes</button><button data-tab="health">System</button></nav><script>
'use strict';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const usd=n=>Number.isFinite(n)?'$'+n.toLocaleString('en-US',{maximumFractionDigits:2}):'NOT OBSERVED';const stamp=n=>n?new Date(n).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',hour12:false})+' IST':'NOT OBSERVED';let tab='coins',data=null,error=null,endpoint=null;
function links(c){if(!/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(c.mint||''))return '';const m=encodeURIComponent(c.mint);return `<div class="links"><a target="_blank" rel="noopener noreferrer" href="https://dexscreener.com/solana/${m}">Dexscreener ↗</a><a target="_blank" rel="noopener noreferrer" href="https://gmgn.ai/sol/token/${m}">GMGN ↗</a><a target="_blank" rel="noopener noreferrer" href="https://solscan.io/token/${m}">Solscan ↗</a></div>`}
function coin(c){const m=c.latest;return `<article class="panel"><div class="row spread"><h2>${esc(c.symbol)}</h2><span class="tag">UNVERIFIED</span></div><div class="dim">Detected ${stamp(c.discoveredAt)}</div><div class="mono">${esc(c.mint)}</div><div class="metrics"><div class="metric"><span class="dim">First observed MCAP</span><strong>${usd(m?.baseline)}</strong><span class="dim">${stamp(m?.baselineAt)}</span></div><div class="metric"><span class="dim">Current MCAP</span><strong>${usd(m?.cap)}</strong><span class="dim">${stamp(m?.at)}</span></div><div class="metric"><span class="dim">Observed multiple</span><strong class="${c.dumpObserved?'red':'accent'}">${Number.isFinite(m?.multiple)?m.multiple.toFixed(2)+'x':'NOT OBSERVED'}</strong></div><div class="metric"><span class="dim">Liquidity</span><strong>${usd(m?.liquidityUsd)}</strong></div></div><div class="ladder">${[2,3,5,10,20,30].map(n=>`<span class="level ${c.hits?.some(h=>h.level===n&&h.series===m?.series)?'hit':''}">${n}x</span>`).join('')}</div><div class="dim">Source: ${esc(c.source)}<br>Mark series: ${esc(m?.series||'NOT OBSERVED')}${c.missingSince?'<br><span class="error">Market data missing since '+stamp(c.missingSince)+'. Last marks may be stale.</span>':''}${c.dumpObserved?'<br><span class="red">A 50%+ fall from a first-observed series baseline was recorded.</span>':''}</div><div style="margin-top:12px">${links(c)}</div></article>`}
function render(){if(!data){$('#content').innerHTML=`<div class="panel empty">${esc(error||'Connecting to the observation worker…')}</div>`;return}const h=data.health;const fresh=!error&&h?.finishedAt&&Date.now()-h.finishedAt<6*60000;$('#connection').textContent=error?'CONNECTION LOST':fresh?(h?.errors?.length||h?.sources?.market?.includes('BACKOFF')?'DEGRADED / FRESH':'RECENT CYCLE'):'STALE / STARTING';$('#connection').style.color=fresh?'var(--green)':'var(--red)';$('#summary').innerHTML=`<div class="stats"><div class="stat"><span class="dim">All detections retained</span><div class="big">${data.counts?.total??0}</div></div><div class="stat"><span class="dim">Cards waiting</span><div class="big">${data.delivery?.filter(x=>x.status==='PENDING').reduce((n,x)=>n+x.count,0)||0}</div></div><div class="stat"><span class="dim">Observed 2x+ coins</span><div class="big green">${data.stats?.hitCoins??'NOT OBSERVED'}</div></div><div class="stat"><span class="dim">Observed 50%+ dumps</span><div class="big red">${data.stats?.dumpCoins??'NOT OBSERVED'}</div></div></div>`;
const q=$('#search').value.toLowerCase(),coins=(data.coins||[]).filter(c=>(c.symbol+' '+c.mint).toLowerCase().includes(q));let html='';
if(tab==='coins')html=`<div class="dim" style="margin-bottom:12px">${error?'<span class="error">Connection lost. Showing cached data. </span>':''}Showing latest ${coins.length} stored coins. ${data.counts?.total||0} total retained. No quality gate is applied.</div><div id="list">${coins.map(coin).join('')||'<div class="empty">No matching detections yet.</div>'}</div>`;
if(tab==='milestones')html=`<div class="panel notice">First OBSERVED marks only. Each source/pool has its own frozen baseline; source switches do not manufacture multiples. Crossings between polls can be missed.</div>`+(data.events||[]).filter(e=>e.body?.startsWith('DISCOVERY')===false&&!e.body?.startsWith('NEW COIN')).map(e=>`<div class="panel"><div class="tag">${esc(e.status)}</div><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 system-ui">${esc(e.body)}</pre></div>`).join('');
if(tab==='outcomes')html=`<div class="panel notice">No win-rate claim. All detections remain in storage, including missing data and dumps. A quoted market-cap spike does not prove a sellable return. Latest ${coins.length} records shown.</div><div id="list">${coins.map(coin).join('')}</div>`;
if(tab==='health')html=`<div class="panel"><h2>Source & delivery health</h2><div class="dim">Latest completed cycle: ${stamp(h?.finishedAt)}<br>Feed window: ${stamp(h?.windowStart)} to ${stamp(h?.windowEnd)}<br>${h?.runtime==='GITHUB_ACTIONS'?'GitHub Actions: five-minute best-effort starts; 120-second feed windows':'Scanner handover: GitHub Actions schedule installed; first scheduled replacement awaiting verification'}<br>Window gaps exist. No claim of all-launch coverage. Cloudflare is the read API only after handover; scanning moves to free public Actions runners. Starts can be delayed, sources can throttle and cards can queue.<br>External calls last run: ${h?.externalCalls??'NOT OBSERVED'}<br>Delivery enabled: ${h?.deliveryEnabled?'YES':'NO'}<br>Detected last run: ${h?.discovered??'NOT OBSERVED'}</div><h2 style="margin-top:18px">Sources</h2><div class="dim">${Object.entries(h?.sources||{}).map(([k,v])=>esc(k+': '+v)).join('<br>')}</div><h2 style="margin-top:18px">Delivery ledger</h2><div class="dim">${(data.delivery||[]).map(x=>esc(x.status+': '+x.count)).join('<br>')}<br>DELIVERY_UNKNOWN is never silently resent.</div><h2 style="margin-top:18px">Limits</h2><div class="dim">Free infrastructure; 500 MB shared database limit, finite retention. No trading, signing or paid streams. Cards can queue at high volume. Latest source error: ${esc(h?.errors?.join('; ')||'none recorded')}</div></div>`;
$('#content').innerHTML=html;}
async function load(){try{if(!endpoint){const c=await fetch('data/discovery-endpoint.json',{cache:'no-store'});if(!c.ok)throw Error('Observation worker is not connected yet. No live data claimed.');endpoint=(await c.json()).url;if(!/^https:\/\/signal-alert-[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev\/data$/.test(endpoint))throw Error('Invalid worker endpoint');}const r=await fetch(endpoint,{cache:'no-store'});if(!r.ok)throw Error('Worker HTTP '+r.status);data=await r.json();error=null;}catch(e){error=e.message;$('#connection').textContent='NO LIVE CONNECTION';}render();}
$('#search').oninput=render;document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render();});load();setInterval(load,30000);
</script></body></html>
