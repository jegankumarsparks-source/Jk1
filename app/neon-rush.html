<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JK NEON RUSH 2040</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0014;font-family:'Courier New',monospace;touch-action:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 100%,#2a0038 0%,#0a0014 75%)}
canvas{display:block;box-shadow:0 0 60px #ff2fd644,0 0 120px #00e5ff22;border-radius:12px}
#ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,0,20,.92);z-index:10;text-align:center;padding:20px}
#ov h1{color:#ff2fd6;font-size:25px;text-shadow:0 0 18px #ff2fd6;letter-spacing:2px;margin-bottom:12px}
#ov .sc{color:#ffe94a;font-size:42px;text-shadow:0 0 22px #ffe94a;margin-bottom:6px}
#ov .bs{color:#00e5ff;font-size:15px;text-shadow:0 0 12px #00e5ff;margin-bottom:8px;white-space:pre-line}
#ov button{background:transparent;border:2px solid #ff2fd6;color:#ff2fd6;font-family:inherit;font-size:18px;padding:13px 32px;border-radius:10px;letter-spacing:2px;text-shadow:0 0 10px #ff2fd6;box-shadow:0 0 18px #ff2fd666;margin-top:16px}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="ov"><h1 id="ovT">NEON RUSH 2040</h1><div class="sc" id="ovS"></div><div class="bs" id="ovB"></div><button id="ovBtn">RUN</button></div>
<script>
(function(){
'use strict';
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W=390,H=844;
function fit(){var s=Math.min(innerWidth/W,innerHeight/H);var d=Math.min(devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';ctx.setTransform(d,0,0,d,0,0);}
fit();addEventListener('resize',fit);
var LS='jknr_best';
var LX=[85,195,305],PY=H-110;
var S,obs,parts;
function newGame(){S={mode:'title',lane:1,spd:6,dist:0,score:0,coins:0,lives:3,best:parseInt(localStorage.getItem(LS)||'0',10)||0,jump:0,shield:0,inv:0,msg:'',msgT:0,shake:0,spawnT:40};}
function say(t){S.msg=t;S.msgT=70;}
function burst(x,y,c,n){for(var i=0;i<n;i++){var a=Math.random()*6.283,sp=1+Math.random()*4;parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,c:c});}}
function spawn(){
 var roll=Math.random();
 if(roll<0.42){var l=Math.floor(Math.random()*3);obs.push({lane:l,y:-40,t:'bar'});if(Math.random()<0.6){var l2=(l+1+Math.floor(Math.random()*2))%3;obs.push({lane:l2,y:-40,t:'bar'});}}
 else if(roll<0.62){var cl=Math.floor(Math.random()*3);for(var i=0;i<5;i++)obs.push({lane:cl,y:-40-i*56,t:'coin'});}
 else if(roll<0.78){obs.push({lane:0,y:-40,t:'bar'});obs.push({lane:1,y:-40,t:'bar'});obs.push({lane:2,y:-40,t:'bar'});var jl=Math.floor(Math.random()*3);obs.push({lane:jl,y:-40,t:'pad'});}
 else if(roll<0.88){obs.push({lane:Math.floor(Math.random()*3),y:-40,t:'shield'});}
 else{var bl=Math.floor(Math.random()*3);obs.push({lane:bl,y:-40,t:'bar'});obs.push({lane:bl,y:-140,t:'coin'});}
}
function physics(){
 if(S.mode!=='play')return;
 S.dist+=S.spd*0.1;
 S.score=Math.floor(S.dist)+S.coins*25;
 if(S.score>S.best){S.best=S.score;localStorage.setItem(LS,String(S.best));}
 S.spd=Math.min(14,S.spd+0.0022);
 if(S.inv>0)S.inv--;
 if(S.shield>0)S.shield--;
 if(S.jump>0)S.jump--;
 if(--S.spawnT<=0){spawn();S.spawnT=Math.max(34,64-S.spd*2.2)+Math.random()*20;}
 for(var i=obs.length-1;i>=0;i--){
  var o=obs[i];o.y+=S.spd;
  if(o.y>H+40){obs.splice(i,1);continue;}
  if(o.lane===S.lane&&Math.abs(o.y-PY)<30){
   if(o.t==='coin'){S.coins++;burst(LX[o.lane],PY,'#ffe94a',5);obs.splice(i,1);}
   else if(o.t==='pad'){S.jump=46;say('JUMP!');burst(LX[o.lane],PY,'#00ff9d',8);obs.splice(i,1);}
   else if(o.t==='shield'){S.shield=600;say('SHIELD ON!');burst(LX[o.lane],PY,'#00e5ff',8);obs.splice(i,1);}
   else if(o.t==='bar'){
    if(S.jump>0){}
    else if(S.shield>0){S.shield=0;say('SHIELD SAVED YOU!');S.shake=6;burst(LX[o.lane],PY,'#00e5ff',12);obs.splice(i,1);}
    else if(S.inv<=0){
     S.lives--;S.inv=110;S.shake=9;burst(LX[o.lane],PY,'#ff3355',16);
     if(S.lives<=0){gameOver();return;}
     say('CRASH! '+S.lives+' LEFT');
     obs.splice(i,1);
    }
   }
  }
 }
}
function gameOver(){
 S.mode='over';
 document.getElementById('ovT').textContent='WIPED OUT';
 document.getElementById('ovS').textContent=S.score;
 document.getElementById('ovB').textContent='BEST '+S.best+' - COINS '+S.coins;
 document.getElementById('ovBtn').textContent='RUN AGAIN';
 document.getElementById('ov').style.display='flex';
}
function move(d){if(S.mode!=='play')return;S.lane=Math.max(0,Math.min(2,S.lane+d));}
function draw(){
 var sx=S.shake?(Math.random()-0.5)*S.shake:0;if(S.shake>0)S.shake*=0.85;
 ctx.fillStyle='#0d0218';ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(sx,0);
 ctx.strokeStyle='#ff2fd622';ctx.lineWidth=1;
 var off=(S.dist*40)%64;
 for(var g=0;g<16;g++){ctx.beginPath();ctx.moveTo(0,g*64+off-64);ctx.lineTo(W,g*64+off-64);ctx.stroke();}
 ctx.strokeStyle='#00e5ff55';ctx.lineWidth=2;
 for(var l=0;l<2;l++){var x=140+l*110;ctx.setLineDash([18,16]);ctx.lineDashOffset=-S.dist*40%34;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
 ctx.setLineDash([]);
 for(var i=0;i<obs.length;i++){var o=obs[i];var x=LX[o.lane];
  if(o.t==='bar'){ctx.fillStyle='#ff335533';ctx.fillRect(x-44,o.y-16,88,32);ctx.strokeStyle='#ff3355';ctx.lineWidth=3;ctx.shadowColor='#ff3355';ctx.shadowBlur=12;ctx.strokeRect(x-44,o.y-16,88,32);ctx.shadowBlur=0;ctx.fillStyle='#ff3355';for(var h=0;h<3;h++)ctx.fillRect(x-36+h*28,o.y-10,16,20);}
  else if(o.t==='coin'){var pl=1+0.18*Math.sin(performance.now()*0.008+o.y);ctx.strokeStyle='#ffe94a';ctx.lineWidth=3;ctx.shadowColor='#ffe94a';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(x,o.y,10*pl,0,6.283);ctx.stroke();ctx.shadowBlur=0;}
  else if(o.t==='pad'){ctx.fillStyle='#00ff9d33';ctx.fillRect(x-40,o.y-12,80,24);ctx.strokeStyle='#00ff9d';ctx.lineWidth=2;ctx.shadowColor='#00ff9d';ctx.shadowBlur=10;ctx.strokeRect(x-40,o.y-12,80,24);ctx.shadowBlur=0;ctx.fillStyle='#00ff9d';ctx.beginPath();ctx.moveTo(x-12,o.y+6);ctx.lineTo(x+12,o.y+6);ctx.lineTo(x,o.y-8);ctx.fill();}
  else if(o.t==='shield'){ctx.strokeStyle='#00e5ff';ctx.lineWidth=3;ctx.shadowColor='#00e5ff';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(x,o.y,13,0,6.283);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#00e5ff';ctx.font='bold 14px Courier New';ctx.textAlign='center';ctx.fillText('S',x,o.y+5);}
 }
 var px=LX[S.lane],py=PY-(S.jump>0?44*Math.sin(S.jump/46*Math.PI):0);
 var blink=S.inv>0&&(S.inv%10<5);
 if(!blink){
  ctx.save();ctx.translate(px,py);
  ctx.fillStyle='#ff2fd6';ctx.shadowColor='#ff2fd6';ctx.shadowBlur=16;
  ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(14,12);ctx.lineTo(-14,12);ctx.closePath();ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-2,4,0,6.283);ctx.fill();
  if(S.shield>0){ctx.strokeStyle='#00e5ff';ctx.lineWidth=2.5;ctx.shadowColor='#00e5ff';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(0,0,24,0,6.283);ctx.stroke();ctx.shadowBlur=0;}
  ctx.restore();
 }
 for(var q=parts.length-1;q>=0;q--){var pt=parts[q];pt.x+=pt.vx;pt.y+=pt.vy;pt.life-=0.03;if(pt.life<=0){parts.splice(q,1);continue;}ctx.globalAlpha=pt.life;ctx.fillStyle=pt.c;ctx.fillRect(pt.x-2,pt.y-2,4,4);ctx.globalAlpha=1;}
 ctx.restore();
 ctx.fillStyle='#00e5ff';ctx.font='bold 18px Courier New';ctx.textAlign='left';ctx.fillText('SCORE '+S.score,12,22);
 ctx.fillStyle='#ff2fd6';ctx.textAlign='right';ctx.fillText('BEST '+S.best,W-12,22);
 ctx.fillStyle='#ffe94a';ctx.fillText('COINS '+S.coins,W-12,44);
 ctx.textAlign='left';for(var l2=0;l2<3;l2++){ctx.fillStyle=l2<S.lives?'#00ff9d':'#1a0a12';ctx.beginPath();ctx.arc(18+l2*18,40,5,0,6.283);ctx.fill();}
 ctx.fillStyle='#7bffea66';ctx.font='12px Courier New';ctx.textAlign='center';ctx.fillText('SPD '+S.spd.toFixed(1),195,44);
 if(S.msgT>0){S.msgT--;ctx.globalAlpha=Math.min(1,S.msgT/30);ctx.fillStyle='#ffe94a';ctx.font='bold 22px Courier New';ctx.textAlign='center';ctx.shadowColor='#ffe94a';ctx.shadowBlur=12;ctx.fillText(S.msg,195,420);ctx.shadowBlur=0;ctx.globalAlpha=1;}
 if(S.mode==='play'){ctx.fillStyle='#7bffea44';ctx.font='12px Courier New';ctx.textAlign='center';ctx.fillText('TAP LEFT / RIGHT TO SWITCH LANE',195,H-14);}
 ctx.textAlign='left';
}
var ov=document.getElementById('ov');
document.getElementById('ovBtn').addEventListener('click',function(){newGame();obs=[];parts=[];S.mode='play';ov.style.display='none';});
function tap(e){if(S.mode!=='play')return;var r=cv.getBoundingClientRect();var t=e.changedTouches?e.changedTouches[0]:e;var x=(t.clientX-r.left)/r.width*W;move(x<W/2?-1:1);}
cv.addEventListener('touchstart',function(e){e.preventDefault();tap(e);},{passive:false});
cv.addEventListener('mousedown',tap);
addEventListener('keydown',function(e){if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(e.key===' '&&S.mode!=='play'){newGame();obs=[];parts=[];S.mode='play';ov.style.display='none';}});
newGame();obs=[];parts=[];
document.getElementById('ovB').textContent='DODGE BARRIERS - GRAB COINS\nGREEN PAD = JUMP - S = SHIELD';
ov.style.display='flex';
function loop(){physics();draw();requestAnimationFrame(loop);}
loop();
window.__NR={
 G:function(){return{mode:S.mode,lane:S.lane,spd:S.spd,score:S.score,coins:S.coins,lives:S.lives,jump:S.jump,shield:S.shield,inv:S.inv,obs:obs.length,msg:S.msg,best:S.best};},
 start:function(){newGame();obs=[];parts=[];S.mode='play';ov.style.display='none';},
 step:function(n){for(var i=0;i<n;i++)physics();},
 move:move,
 spawnAt:function(lane,y,t){obs.push({lane:lane,y:y,t:t});},
 laneX:function(l){return LX[l];}
};
})();
</script>
</body>
</html>
