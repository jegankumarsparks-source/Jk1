<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JK MONSOON BEATS 2040</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#263238}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px 16px;z-index:5;font-family:'Comfortaa',sans-serif;pointer-events:none;color:#ECEFF1}
#score{font-size:26px;font-weight:700}
#combo{font-size:17px;color:#FFCA28}
#acc{font-size:14px;color:#90A4AE}
#judge{position:fixed;top:38%;left:0;right:0;text-align:center;font-family:'Comfortaa';font-size:34px;font-weight:700;z-index:4;pointer-events:none;opacity:0;transition:opacity .1s}
.overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(38,50,56,.97),rgba(55,71,79,.97));font-family:'Comfortaa',sans-serif;text-align:center;padding:20px;color:#ECEFF1}
.overlay.hidden{display:none}
h1{font-size:32px}
.sub{color:#90A4AE;font-size:16px;margin-top:12px;max-width:330px;line-height:1.7}
.btn{margin-top:26px;padding:13px 42px;background:#FFCA28;color:#263238;font-family:'Comfortaa';font-size:22px;font-weight:700;border:none;border-radius:14px;cursor:pointer;box-shadow:0 5px 0 #C79A00}
#grade{font-size:76px;color:#FFCA28;margin-top:6px}
#stats{font-size:15px;color:#90A4AE;margin-top:10px;line-height:1.8}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div id="score">0</div><div id="combo"></div><div id="acc"></div></div>
<div id="judge"></div>
<div class="overlay" id="start">
<h1>🌧️ MONSOON BEATS 2040 🌧️</h1>
<p class="sub">Rain falls on 4 lanes - tap the lane button the moment a drop hits the line! Synthesized monsoon beat: kick, snare, hats, thunder. PERFECT=300 GOOD=100. Combo multiplies! 64 beats of rain!</p>
<button class="btn" id="startBtn">START THE RAIN</button>
</div>
<div class="overlay hidden" id="over">
<h1>🌈 RAIN CLEARED 🌈</h1>
<div id="grade">S</div>
<div id="stats"></div>
<button class="btn" id="overBtn">ENCORE</button>
</div>
<script>
"use strict";
const TAU=Math.PI*2;
const container=document.getElementById('game');
const cv=document.createElement('canvas');container.appendChild(cv);
const g=cv.getContext('2d');
let W=0,H=0;
function resize(){const dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);resize();
const BPM=100,SPB=60/BPM,LANES=4,TRAVEL=2.0,BEATS=64;
const LCOL=['#4FC3F7','#FFCA28','#4FC3F7','#FFCA28'];
let notes=[],clk=0,playing=false,over=false,score=0,combo=0,maxCombo=0,perfects=0,goods=0,misses=0;
let ac=null,master=null,nextBeatI=0,chart=[],judgeT=0,rain=[],flashLane=[-1,0];
function buildChart(){chart=[];
const pat=[[0],[2],[1],[3],[0,2],[1],[3],[2],[0],[1,3],[2],[0,3],[1],[2],[0],[1,2,3]];
for(let b=2;b<BEATS;b++){
const density=b<16?1:(b<32?1.5:2);
if(Math.floor(b)%2===0||b>=16){
for(const l of pat[b%pat.length]){
if(density===1&&b%2!==0&&l!==pat[b%pat.length][0])continue;
chart.push({beat:b,lane:l,hit:false,judged:false});}}
if(b>=24&&b%4===1)chart.push({beat:b+0.5,lane:(b*7)%4,hit:false,judged:false});}
chart.sort((a,b)=>a.beat-b.beat);}
function initAudio(){if(ac)return;
ac=new(window.AudioContext||window.webkitAudioContext)();
master=ac.createGain();master.gain.value=0.5;master.connect(ac.destination);}
function kick(t){const o=ac.createOscillator(),gn=ac.createGain();
o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(38,t+0.12);
gn.gain.setValueAtTime(0.9,t);gn.gain.exponentialRampToValueAtTime(0.001,t+0.22);
o.connect(gn).connect(master);o.start(t);o.stop(t+0.25);}
function snare(t){const b=ac.createBuffer(1,ac.sampleRate*0.12,ac.sampleRate),d=b.getChannelData(0);
for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
const s=ac.createBufferSource();s.buffer=b;
const gn=ac.createGain();gn.gain.setValueAtTime(0.5,t);gn.gain.exponentialRampToValueAtTime(0.001,t+0.12);
s.connect(gn).connect(master);s.start(t);}
function hat(t){const b=ac.createBuffer(1,ac.sampleRate*0.04,ac.sampleRate),d=b.getChannelData(0);
for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
const s=ac.createBufferSource();s.buffer=b;
const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=7000;
const gn=ac.createGain();gn.gain.setValueAtTime(0.22,t);
s.connect(f).connect(gn).connect(master);s.start(t);}
function thunder(t){const b=ac.createBuffer(1,ac.sampleRate*0.8,ac.sampleRate),d=b.getChannelData(0);
for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
const s=ac.createBufferSource();s.buffer=b;
const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(60,t+0.7);
const gn=ac.createGain();gn.gain.setValueAtTime(0.8,t);gn.gain.exponentialRampToValueAtTime(0.001,t+0.8);
s.connect(f).connect(gn).connect(master);s.start(t);}
let audioT0=0;
function schedule(){if(!ac)return;
const ahead=ac.currentTime+0.2;
while(true){const bt=audioT0+nextBeatI*SPB;
if(bt>ahead)break;
kick(bt);
if(nextBeatI%4===2)snare(bt);
if(nextBeatI%2===1)hat(bt+SPB*0.5);
if(nextBeatI%16===8)thunder(bt);
nextBeatI++;}}
function judge(note){const dt=(clk-note.beat*SPB)*1000;
const adt=Math.abs(dt);
if(adt<=70){perfects++;combo++;score+=300*mult();showJudge('PERFECT','#4FC3F7');}
else if(adt<=150){goods++;combo++;score+=100*mult();showJudge('GOOD','#FFCA28');}
else return false;
maxCombo=Math.max(maxCombo,combo);note.hit=true;flashLane=[note.lane,0.12];return true;}
function mult(){return 1+Math.min(3,Math.floor(combo/10));}
function showJudge(t,c){const j=document.getElementById('judge');j.textContent=t;j.style.color=c;j.style.opacity=1;judgeT=0.5;}
function tapLane(l){if(!playing||over)return;
let best=null,bd=1e9;
for(const n of chart){if(n.lane!==l||n.hit||n.judged)continue;
const d=Math.abs(clk-n.beat*SPB);if(d<bd){bd=d;best=n;}}
if(best&&bd<=0.15){if(!judge(best)){/* too far but within window edge */}}
else{combo=0;showJudge('MISS','#EF5350');misses++;}}
function simStep(dt){if(!playing||over)return;
clk+=dt;schedule();
if(judgeT>0){judgeT-=dt;if(judgeT<=0)document.getElementById('judge').style.opacity=0;}
if(flashLane[1]>0)flashLane[1]-=dt;
for(const n of chart){if(!n.hit&&!n.judged&&clk-n.beat*SPB>0.16){n.judged=true;misses++;combo=0;showJudge('MISS','#EF5350');}}
if(Math.random()<dt*30)rain.push({x:Math.random()*W,y:-10,v:500+Math.random()*300});
for(let i=rain.length-1;i>=0;i--){rain[i].y+=rain[i].v*dt;if(rain[i].y>H)rain.splice(i,1);}
const lastBeat=BEATS*SPB;
if(clk>lastBeat+2){playing=false;over=true;
const total=perfects+goods+misses;
const acc=total?Math.round((perfects+goods*0.5)/total*100):0;
const grade=acc>=95?'S':acc>=85?'A':acc>=70?'B':acc>=50?'C':'D';
document.getElementById('grade').textContent=grade;
document.getElementById('stats').innerHTML='SCORE '+score+'<br>PERFECT '+perfects+' · GOOD '+goods+' · MISS '+misses+'<br>MAX COMBO '+maxCombo+' · ACC '+acc+'%';
document.getElementById('over').classList.remove('hidden');}
document.getElementById('score').textContent=score;
document.getElementById('combo').textContent=combo>1?combo+' COMBO x'+mult():'';
const tot=perfects+goods+misses;
document.getElementById('acc').textContent=tot?Math.round((perfects+goods*0.5)/tot*100)+'% acc':'';}
const laneX=l=>(l+0.5)*(W/LANES);
const hitY=()=>H-150;
function noteY(n){return hitY()-(n.beat*SPB-clk)/TRAVEL*(hitY()-60);}
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;
simStep(dt);
const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#263238');bg.addColorStop(1,'#37474F');
g.fillStyle=bg;g.fillRect(0,0,W,H);
g.strokeStyle='rgba(144,164,174,.25)';g.lineWidth=1;
for(const r of rain){g.beginPath();g.moveTo(r.x,r.y);g.lineTo(r.x-3,r.y+16);g.stroke();}
for(let l=0;l<LANES;l++){
g.fillStyle=l===flashLane[0]&&flashLane[1]>0?'rgba(255,202,40,.18)':'rgba(255,255,255,.03)';
g.fillRect(l*(W/LANES)+2,60,W/LANES-4,hitY()-60+40);
g.strokeStyle='rgba(255,255,255,.08)';g.strokeRect(l*(W/LANES)+2,60,W/LANES-4,hitY()-60+40);}
g.fillStyle='#FFCA28';g.fillRect(0,hitY()-3,W,6);
for(const n of chart){if(n.hit||n.judged)continue;const y=noteY(n);if(y<50||y>H)continue;
const x=laneX(n.lane);
g.fillStyle=LCOL[n.lane];g.beginPath();
g.moveTo(x,y-14);g.quadraticCurveTo(x+11,y,x,y+14);g.quadraticCurveTo(x-11,y,x,y-14);g.fill();
g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.arc(x-3,y-4,3,0,TAU);g.fill();}
for(let l=0;l<LANES;l++){const x=laneX(l);
g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.arc(x,hitY()+60,34,0,TAU);g.fill();
g.strokeStyle=LCOL[l];g.lineWidth=2.5;g.stroke();
g.fillStyle=LCOL[l];g.font='700 22px Comfortaa';g.textAlign='center';g.fillText(['◖','●','●','◗'][l],x,hitY()+68);}}
requestAnimationFrame(frame);
buildChart();
function tog(){initAudio();if(ac&&ac.state==='suspended')ac.resume();
notes=[];clk=0;score=0;combo=0;maxCombo=0;perfects=0;goods=0;misses=0;nextBeatI=0;rain=[];flashLane=[-1,0];
buildChart();
if(ac){audioT0=ac.currentTime+0.1;}
playing=true;over=false;
document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');}
document.getElementById('startBtn').addEventListener('click',tog);
document.getElementById('overBtn').addEventListener('click',tog);
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();
const l=Math.floor((e.clientX-r.left)/(W/LANES));tapLane(l);});
window.__RB={G:()=>({score,combo,maxCombo,perfects,goods,misses,playing,over,clk:+clk.toFixed(2),notes:chart.filter(n=>!n.hit&&!n.judged).length,mult:mult()}),
start:tog,sim:(dt)=>simStep(dt),
tapLane,
chartInfo:()=>({total:chart.length,first:chart[0]}),
nextNote:()=>{for(const n of chart){if(!n.hit&&!n.judged)return{lane:n.lane,beat:n.beat,dt:+(n.beat*SPB-clk).toFixed(3)};}return null;},
warpTo:(beat)=>{clk=beat*SPB;}};
</script>
</body>
</html>
