function setDiff(d,el){diff=d;document.querySelectorAll('.diff').forEach(function(e){e.classList.remove('on')});el.classList.add('on');}
function letterScore(w){var s=0;for(var i=0;i<w.length;i++)s+=VW[w[i]]?1:2;return s+w.length*2;}
function canMake(w,letters){var pool=letters.slice();for(var i=0;i<w.length;i++){var j=pool.indexOf(w[i]);if(j<0)return false;pool.splice(j,1);}return true;}
function aiPick(letters){
 var best='',bestS=-1;
 for(var i=0;i<DICT.length;i++){var w=DICT[i];if(w.length<3)continue;
  if(diff===0&&w.length>5)continue;
  if(diff===1&&w.length>6)continue;
  if(canMake(w,letters)){var s=letterScore(w);if(s>bestS){bestS=s;best=w;}
   if(diff<2&&Math.random()<.02)break;
  }}
 if(diff===0&&best.length>4&&Math.random()<.5){// mokka bot picks shorter sometimes
  var shorts=DICT.filter(function(w){return w.length<=4&&canMake(w,letters)});
  if(shorts.length)best=shorts[Math.floor(Math.random()*shorts.length)];
 }
 return best;
}
function genRack(){
 // ensure at least 1 makeable word: start from a random 5-7 letter word, add randoms
 var base='';while(base.length<5){base=DICT[Math.floor(Math.random()*DICT.length)];if(base.length>7)base='';}
 var letters=base.split('');
 while(letters.length<8){letters.push(BGL[Math.floor(Math.random()*26)]);}
 // shuffle
 for(var i=letters.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=letters[i];letters[i]=letters[j];letters[j]=t;}
 return letters;
}

  if(timeLeft<=0){clearInterval(timerIv);submitWord();}

}
function renderRack(){
 var s=document.getElementById('rack'),h='';
 rack.forEach(function(l,i){h+='<div class="tile'+(used[i]?' used':'')+'" onclick="tapTile('+i+')">'+l.toUpperCase()+'</div>';});
 s.innerHTML=h;
}
function renderCur(){document.getElementById('cur').innerHTML=cur.length?cur.map(function(c){return c.toUpperCase()}).join(''):'&nbsp;';}
function tapTile(i){if(locked||used[i])return;used[i]=true;cur.push(rack[i]);renderRack();renderCur();}
function clearWord(){if(locked)return;used=used.map(function(){return false});cur=[];renderRack();renderCur();msg('');}
function msg(t){document.getElementById('msg').textContent=t;}
function submitWord(){
 if(locked)return;locked=true;clearInterval(timerIv);
 var w=cur.join('');
 var meOk=w.length>=3&&DSET[w]&&canMake(w,rack);
 var aiW=aiPick(rack);
 var meS=meOk?letterScore(w):0,aiS=letterScore(aiW);
 if(w.length>0&&!meOk){msg('❌ "'+w.toUpperCase()+'" dictionary-ல இல்ல! 0 points');}
 if(meOk){meScore+=meS;}
 aiScore+=aiS;
 hist.unshift({r:round,me:meOk?w:'—',meS:meS,ai:aiW,aiS:aiS});
 var hs=document.getElementById('hist'),hh='';
 hist.forEach(function(h){hh+='<div class="hrow"><span>R'+h.r+'</span><span class="me"><b>'+h.me.toUpperCase()+'</b> +'+h.meS+'</span><span class="ai"><b>'+h.ai.toUpperCase()+'</b> +'+h.aiS+'</span></div>';});
 hs.innerHTML=hh;
 document.getElementById('meScore').textContent=meScore;
 document.getElementById('aiScore').textContent=aiScore;
 document.getElementById('meWord').textContent=meOk?w.toUpperCase()+' +'+meS:'✗ +0';
 document.getElementById('aiWord').textContent=aiW.toUpperCase()+' +'+aiS;
 msg(meS>aiS?'⚔️ ரவுண்டு உன்னோடது!':meS===aiS?'🤝 Tie!':'🤖 Bot எடுத்துட்டான்!');
 setTimeout(nextRound,2200);
}
function endMatch(){
 over=true;won=meScore>aiScore;
 var key='jkww_best';var prev=parseInt(localStorage.getItem(key)||'0');
 if(meScore>prev)localStorage.setItem(key,meScore);
 document.getElementById('ovTitle').textContent=won?'🏆 WORD WARRIOR!':meScore===aiScore?'🤝 EPIC TIE!':'💀 BOT WINS';
 document.getElementById('ovScore').textContent=meScore+' - '+aiScore;
 document.getElementById('ovText').innerHTML=(meScore>prev?'🎉 NEW RECORD! ':'Best: '+Math.max(prev,meScore))+'<br>Rounds won: '+hist.filter(function(h){return h.meS>h.aiS}).length+'/5';
 document.getElementById('ovTaunt').textContent=won?'KUYIL-AI-அவே முழுங்கிட்டா! 👑':meScore===aiScore?'அடுத்த முறை நிச்சயம் ஜெயி! ⚔️':'Dictionary படி, திரும்ப வா! 😤';
 document.getElementById('ov').classList.remove('hide');
}
function restart(){document.getElementById('ov').classList.add('hide');document.getElementById('menuCard').style.display='block';document.getElementById('gameCard').style.display='none';document.getElementById('histCard').style.display='none';meScore=0;aiScore=0;document.getElementById('meScore').textContent='0';document.getElementById('aiScore').textContent='0';}
window.__WW={G:function(){return {round:round,meScore:meScore,aiScore:aiScore,over:over,won:won,rack:rack.join(''),best:parseInt(localStorage.getItem('jkww_best')||'0'),hist:hist.length}},start:function(d){if(typeof d==='number')diff=d;startMatch()},tapWord:function(w){clearWord();for(var i=0;i<w.length;i++){var idx=rack.findIndex(function(l,j){return l===w[i]&&!used[j]});if(idx<0)return false;used[idx]=true;cur.push(rack[idx]);}renderRack();renderCur();return true},strike:submitWord,dict:function(w){return !!DSET[w]},ai:aiPick};
</script>
