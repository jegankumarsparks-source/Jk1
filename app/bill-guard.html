<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JK Bill Guard · Never miss a due date</title>
<style>
:root{ --bg:#07090f; --card:#10141f; --card2:#161b2a; --line:#232a3d; --txt:#e8ecf5; --mut:#8a90a6; --acc:#7ee787; --neon:#22d3ee; --pink:#f472b6; --warn:#fbbf24; --red:#f87171; }
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{ background:var(--bg); color:var(--txt); font-family:-apple-system,'Segoe UI',Roboto,sans-serif; max-width:480px; margin:0 auto; min-height:100vh; position:relative; }
body::before{ content:''; position:fixed; inset:0; background:radial-gradient(600px 300px at 85% -5%,rgba(251,191,36,.1),transparent),radial-gradient(500px 260px at 5% 0%,rgba(34,211,238,.09),transparent); pointer-events:none; }
.wrap{ position:relative; z-index:1; padding:14px; }
header{ padding:12px 4px 10px; text-align:center; }
h1{ font-size:22px; font-weight:900; }
h1 .g{ background:linear-gradient(90deg,var(--warn),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.sub{ font-size:11.5px; color:var(--mut); margin-top:2px; }
.stats{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:12px; }
.stat{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 8px; text-align:center; }
.stat .v{ font-size:18px; font-weight:900; }
.stat .l{ font-size:10px; color:var(--mut); margin-top:2px; text-transform:uppercase; letter-spacing:.4px; }
.stat.hot .v{ color:var(--red); }
.stat.ok .v{ color:var(--acc); }
.free{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:14px; }
.free .t{ display:flex; justify-content:space-between; font-size:12px; color:var(--mut); margin-bottom:7px; }
.free .t b{ color:var(--txt); }
.bar{ height:10px; background:var(--card2); border-radius:99px; overflow:hidden; }
.bar i{ display:block; height:100%; background:linear-gradient(90deg,var(--acc),var(--neon)); border-radius:99px; transition:width .5s; }
.sec{ font-size:13px; font-weight:800; margin:14px 2px 8px; }
.sec span{ font-weight:400; color:var(--mut); font-size:11px; }
.bill{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin-bottom:10px; display:flex; gap:11px; align-items:center; }
.bill.paid{ opacity:.55; }
.ring{ position:relative; width:58px; height:58px; flex:0 0 auto; }
.ring svg{ transform:rotate(-90deg); }
.ring .dl{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.ring .dl .d{ font-size:16px; font-weight:900; line-height:1; }
.ring .dl .u{ font-size:8.5px; color:var(--mut); text-transform:uppercase; }
.binfo{ flex:1; min-width:0; }
.binfo .n{ font-size:15.5px; font-weight:800; }
.binfo .m{ font-size:12px; color:var(--mut); margin-top:2px; }
.binfo .m.over{ color:var(--red); font-weight:700; }
.binfo .m.soon{ color:var(--warn); font-weight:700; }
.bamt{ text-align:right; }
.bamt .a{ font-size:16px; font-weight:900; color:var(--neon); }
.paybtn{ margin-top:6px; background:linear-gradient(90deg,var(--acc),var(--neon)); color:#04120a; border:0; font-weight:900; font-size:12.5px; border-radius:99px; padding:7px 16px; cursor:pointer; }
.paybtn:active{ transform:scale(.95); }
.paidtag{ margin-top:6px; display:inline-block; font-size:11.5px; font-weight:800; color:var(--acc); }
.delb{ font-size:10px; color:var(--mut); margin-top:4px; cursor:pointer; text-decoration:underline; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:13px; margin-bottom:12px; }
.frow{ display:flex; gap:8px; margin-bottom:8px; }
input,select{ background:var(--card2); border:1px solid var(--line); color:var(--txt); border-radius:12px; padding:11px; font-size:15px; outline:none; }
input:focus,select:focus{ border-color:var(--neon); }
input[type=text]{ flex:1; }
input[type=number]{ width:92px; }
select{ width:64px; }
.addbtn{ width:100%; background:linear-gradient(90deg,var(--warn),var(--pink)); color:#1a0a00; font-weight:900; border:0; border-radius:12px; padding:13px; font-size:15px; cursor:pointer; }
.ghost{ width:100%; background:var(--card2); border:1px dashed var(--line); color:var(--txt); border-radius:12px; padding:12px; font-size:14px; cursor:pointer; margin-bottom:12px; }
.wabtn{ width:100%; background:rgba(126,231,135,.12); border:1px solid rgba(126,231,135,.4); color:var(--acc); border-radius:12px; padding:12px; font-size:14px; font-weight:800; cursor:pointer; }
.empty{ text-align:center; color:var(--mut); font-size:13px; padding:20px 10px; }
.confetti{ position:fixed; top:-10px; width:9px; height:14px; z-index:20; pointer-events:none; border-radius:2px; animation:fall 2.4s ease-in forwards; }
@keyframes fall{ to{ transform:translateY(110vh) rotate(720deg); opacity:0; } }
@keyframes pulse{ 0%,100%{ opacity:1;} 50%{ opacity:.55;} }
.pulse{ animation:pulse 1.2s infinite; }
</style>
</head>
<body>
<div class="wrap">
<header><h1>JK BILL <span class="g">GUARD</span></h1><div class="sub">every due date, guarded · pay, tap, done 🛡️</div></header>
<div class="stats" id="stats"></div>
<div class="free" id="freeBox"></div>
<div class="sec">Bills <span id="billSub">tap PAID when done - it auto-rolls to next month</span></div>
<div id="bills"></div>
<button class="ghost" id="formToggle" onclick="toggleForm()">+ Add a bill</button>
<div class="card" id="formCard" style="display:none">
 <div class="frow"><select id="fEmoji"><option>⚡</option><option>🏠</option><option>📡</option><option>💳</option><option>📺</option><option>🥛</option><option>🔥</option><option>📱</option><option>🏦</option><option>🧾</option></select><input type="text" id="fName" placeholder="Bill name (e.g. EB, Rent)" maxlength="22"></div>
 <div class="frow"><input type="number" id="fAmt" placeholder="Amount ₹" min="1"><input type="number" id="fDay" placeholder="Due day" min="1" max="31"></div>
 <button class="addbtn" onclick="addBill()">ADD BILL</button>
</div>
<button class="wabtn" onclick="waCopy()">📋 Copy WhatsApp summary</button>
</div>
<script>
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem('jkbill_'+k));return v==null?d:v;}catch(e){return d;}},set(k,v){localStorage.setItem('jkbill_'+k,JSON.stringify(v));}};
let bills=LS.get('bills',[
 {id:1,name:'House Rent',amt:8000,day:5,emoji:'🏠',paid:''},
 {id:2,name:'EB Bill',amt:1200,day:10,emoji:'⚡',paid:''},
 {id:3,name:'WiFi',amt:999,day:15,emoji:'📡',paid:''}
]);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());};
const cycleKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
function dueInfo(b){
 const t=today(), y=t.getFullYear(), m=t.getMonth();
 let d=new Date(y,m,Math.min(b.day,daysIn(y,m)));
 if(b.paid===cycleKey(d)){ const nd=new Date(y,m+1,1); d=new Date(nd.getFullYear(),nd.getMonth(),Math.min(b.day,daysIn(nd.getFullYear(),nd.getMonth()))); return {due:d,days:Math.round((d-t)/86400000),paid:true}; }
 return {due:d,days:Math.round((d-t)/86400000),paid:false};
}
function color(days,paid){ if(paid)return 'var(--acc)'; if(days<0)return 'var(--red)'; if(days<=2)return 'var(--red)'; if(days<=7)return 'var(--warn)'; return 'var(--neon)'; }
function render(){
 const t=today();
 const items=bills.map(b=>({b,i:dueInfo(b)}));
 let dueSum=0,paidSum=0,unpaid=0;
 items.forEach(({b,i})=>{ if(i.paid)paidSum+=+b.amt; else {dueSum+=+b.amt; unpaid++;} });
 const upcoming=items.filter(x=>!x.i.paid).sort((a,c)=>a.i.days-c.i.days)[0];
 $('#stats').innerHTML=
  '<div class="stat hot"><div class="v">₹'+dueSum.toLocaleString('en-IN')+'</div><div class="l">to pay</div></div>'+
  '<div class="stat ok"><div class="v">₹'+paidSum.toLocaleString('en-IN')+'</div><div class="l">paid</div></div>'+
  '<div class="stat"><div class="v">'+(upcoming?(upcoming.i.days<0?'OVERDUE':upcoming.i.days+'d'):'-')+'</div><div class="l">next due</div></div>';
 const tot=dueSum+paidSum, pct=tot?Math.round(paidSum/tot*100):100;
 $('#freeBox').innerHTML='<div class="t"><span>Freedom meter <b>'+pct+'%</b></span><span>'+(unpaid?unpaid+' bill'+(unpaid>1?'s':'')+' left':'ALL CLEAR 🎉')+'</span></div><div class="bar"><i style="width:'+pct+'%"></i></div>';
 items.sort((a,c)=>a.i.paid-c.i.paid||a.i.days-c.i.days);
 $('#bills').innerHTML=items.length?items.map(({b,i})=>{
  const c=color(i.days,i.paid);
  const frac=i.paid?1:Math.max(0.06,1-Math.max(0,i.days)/30);
  const meta=i.paid?'Paid ✓ next: '+i.due.toLocaleDateString('en-IN',{day:'numeric',month:'short'})
   :i.days<0?'<span class="m over">OVERDUE by '+(-i.days)+'d · was '+i.due.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+'</span>'
   :i.days===0?'<span class="m over pulse">DUE TODAY ⚠️</span>'
   :i.days<=2?'<span class="m soon">Due '+i.due.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' - hurry!</span>'
   :'<span class="m">Due '+i.due.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+'</span>';
  const R=26,CIRC=2*Math.PI*R;
  return '<div class="bill'+(i.paid?' paid':'')+'"><div class="ring"><svg width="58" height="58"><circle cx="29" cy="29" r="'+R+'" fill="none" stroke="#232a3d" stroke-width="5"/><circle cx="29" cy="29" r="'+R+'" fill="none" stroke="'+c+'" stroke-width="5" stroke-linecap="round" stroke-dasharray="'+(CIRC*frac)+' '+CIRC+'"/></svg><div class="dl"><div class="d" style="color:'+c+'">'+(i.paid?'✓':(i.days<0?'!':i.days))+'</div><div class="u">'+(i.paid?'paid':(i.days<0?'late':'days'))+'</div></div></div><div class="binfo"><div class="n">'+b.emoji+' '+esc(b.name)+'</div><div class="m">'+meta+'</div>'+(i.paid?'<span class="paidtag">GUARDED 🛡️</span>':'<button class="paybtn" onclick="pay('+b.id+')">PAID ✓</button>')+' <span class="delb" onclick="del('+b.id+')">delete</span></div><div class="bamt"><div class="a">₹'+(+b.amt).toLocaleString('en-IN')+'</div></div></div>';
 }).join(''):'<div class="empty">No bills yet - add your first one below 👇</div>';
}
function pay(id){ const b=bills.find(x=>x.id===id); if(!b)return; b.paid=cycleKey(dueInfo({...b,paid:''}).due); LS.set('bills',bills); confetti(); if(navigator.vibrate)try{navigator.vibrate(60);}catch(e){} render(); }
function del(id){ if(!confirm('Delete this bill?'))return; bills=bills.filter(x=>x.id!==id); LS.set('bills',bills); render(); }
function toggleForm(){ const f=$('#formCard'); f.style.display=f.style.display==='none'?'block':'none'; $('#formToggle').textContent=f.style.display==='none'?'+ Add a bill':'− Hide form'; }
function addBill(){
 const name=$('#fName').value.trim(), amt=+$('#fAmt').value, day=+$('#fDay').value;
 if(!name||!amt||!day||day<1||day>31){ alert('Fill name, amount and due day (1-31)'); return; }
 bills.push({id:Date.now(),name,amt,day,emoji:$('#fEmoji').value,paid:''});
 LS.set('bills',bills); $('#fName').value=''; $('#fAmt').value=''; $('#fDay').value=''; render();
}
function waCopy(){
 const items=bills.map(b=>({b,i:dueInfo(b)})).sort((a,c)=>a.i.days-c.i.days);
 let txt='🛡️ *JK Bill Guard* - '+new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'})+'\n';
 items.forEach(({b,i})=>{ txt+='\n'+b.emoji+' '+b.name+' - ₹'+(+b.amt).toLocaleString('en-IN')+(i.paid?' ✅ PAID':(i.days<0?' 🔴 OVERDUE '+(-i.days)+'d':' ⏳ '+i.days+'d left')); });
 const due=items.filter(x=>!x.i.paid).reduce((s,x)=>s+(+x.b.amt),0);
 txt+='\n\n💰 To pay: ₹'+due.toLocaleString('en-IN');
 navigator.clipboard.writeText(txt).then(()=>alert('Copied! Paste in WhatsApp ✅')).catch(()=>alert(txt));
}
function confetti(){ const P=['#22d3ee','#f472b6','#7ee787','#fbbf24','#a78bfa']; for(let i=0;i<22;i++){ const d=document.createElement('div'); d.className='confetti'; d.style.left=Math.random()*100+'vw'; d.style.background=P[i%5]; d.style.animationDelay=(Math.random()*0.4)+'s'; document.body.appendChild(d); setTimeout(()=>d.remove(),3000); } }
render();
</script>
</body>
</html>
