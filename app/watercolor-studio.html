<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JK WATERCOLOR STUDIO 2040</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#f6f1e7;font-family:Georgia,serif;touch-action:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#fbf7ee,#efe6d4)}
canvas#paper{display:block;background:#fffdf6;border-radius:6px;box-shadow:0 8px 40px #8a7a5a44,0 2px 8px #8a7a5a33}
#ui{position:fixed;left:0;right:0;bottom:0;background:#fffaf0f0;border-top:2px solid #e5d9c3;padding:8px 10px 10px;display:flex;flex-direction:column;gap:7px;z-index:5}
#pal{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #0002;box-shadow:inset 0 -3px 6px #0001;cursor:pointer}
.sw.on{border-color:#5a4a2a;transform:scale(1.15)}
#row{display:flex;align-items:center;gap:10px;justify-content:center;font-size:12px;color:#5a4a2a}
#row input[type=range]{width:110px;accent-color:#c98850}
.btn{background:#fff;border:1.5px solid #d8c9ac;color:#5a4a2a;font-family:inherit;font-size:12px;padding:6px 12px;border-radius:16px;cursor:pointer}
.btn:active{background:#f3e9d5}
#gal{display:flex;gap:6px;justify-content:center;min-height:40px}
#gal img{width:52px;height:34px;object-fit:cover;border-radius:4px;border:1px solid #d8c9ac;cursor:pointer}
#ttl{position:fixed;top:10px;left:0;right:0;text-align:center;color:#8a6f4a;font-size:15px;letter-spacing:3px;pointer-events:none}
</style>
</head>
<body>
<div id="ttl">JK WATERCOLOR STUDIO 2040</div>
<div id="wrap"><canvas id="paper"></canvas></div>
<div id="ui">
 <div id="pal"></div>
 <div id="row">
  <span>SIZE</span><input id="size" type="range" min="4" max="60" value="22">
  <span>WATER</span><input id="wet" type="range" min="5" max="60" value="18">
 </div>
 <div id="row">
  <button class="btn" id="undo">UNDO</button>
  <button class="btn" id="clear">CLEAR</button>
  <button class="btn" id="save">SAVE ART</button>
  <button class="btn" id="dl">EXPORT PNG</button>
 </div>
 <div id="gal"></div>
</div>
<script>
(function(){
'use strict';
var cv=document.getElementById('paper'),ctx=cv.getContext('2d');
var W=390,H=844;
var pw,ph;
function fit(){
 var s=Math.min(innerWidth/W,innerHeight/H);
 pw=Math.min(innerWidth-16,W);ph=innerHeight-200;
 cv.width=pw;cv.height=ph;
 var r=cv.getBoundingClientRect();
 paperBG();
}
var PALETTE=[
 {c:'#d94f6b',n:'ROSE'},{c:'#e8a13c',n:'AMBER'},{c:'#f5d94a',n:'LEMON'},
 {c:'#5da85a',n:'LEAF'},{c:'#4a9fd8',n:'SKY'},{c:'#7a5fc9',n:'IRIS'},
 {c:'#8a5a3a',n:'BARK'},{c:'#3a3a4a',n:'INK'},{c:'water',n:'WATER'}
];
var strokes=[],redoStack=[],cur=null,colorIdx=0,downs=0;
var LS='jkws_gallery';
function paperBG(){
 ctx.fillStyle='#fffdf6';ctx.fillRect(0,0,cv.width,cv.height);
 ctx.fillStyle='#f4edda55';
 for(var i=0;i<40;i++)ctx.fillRect(Math.random()*cv.width,Math.random()*cv.height,1.5,1.5);
}
function hex2rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function dab(x,y){
 var size=parseInt(document.getElementById('size').value,10);
 var wet=parseInt(document.getElementById('wet').value,10)/100;
 var p=PALETTE[colorIdx];
 if(p.c==='water'){
  ctx.globalCompositeOperation='destination-out';
  var g0=ctx.createRadialGradient(x,y,0,x,y,size*0.8);
  g0.addColorStop(0,'rgba(0,0,0,0.10)');g0.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g0;ctx.beginPath();ctx.arc(x,y,size*0.8,0,6.283);ctx.fill();
  ctx.globalCompositeOperation='source-over';
  return;
 }
 var rgb=hex2rgb(p.c);
 var a=0.05+wet*0.5;
 ctx.globalCompositeOperation='multiply';
 var g=ctx.createRadialGradient(x,y,0,x,y,size);
 g.addColorStop(0,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+a+')');
 g.addColorStop(0.75,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(a*0.5)+')');
 g.addColorStop(1,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,size,0,6.283);ctx.fill();
 ctx.globalCompositeOperation='source-over';
}
function pos(e){var r=cv.getBoundingClientRect();var t=e.changedTouches?e.changedTouches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
function beginStroke(e){var p=pos(e);cur={pts:[p]};dab(p.x,p.y);downs++;}
function moveStroke(e){if(!cur)return;var p=pos(e);var last=cur.pts[cur.pts.length-1];
 var d=Math.hypot(p.x-last.x,p.y-last.y);
 if(d<3)return;
 var steps=Math.ceil(d/4);
 for(var i=1;i<=steps;i++)dab(last.x+(p.x-last.x)*i/steps,last.y+(p.y-last.y)*i/steps);
 cur.pts.push(p);if(e.cancelable)e.preventDefault();}
function endStroke(){if(cur&&cur.pts.length){strokes.push({snap:cv.toDataURL('image/png')});if(strokes.length>24)strokes.shift();}cur=null;}
function undo(){
 if(!strokes.length)return;
 var s=strokes.pop();
 var img=new Image();
 img.onload=function(){paperBG();ctx.drawImage(img,0,0,cv.width,cv.height);};
 if(strokes.length){var prev=strokes[strokes.length-1].snap;var im2=new Image();im2.onload=function(){ctx.drawImage(im2,0,0,cv.width,cv.height);};im2.src=prev;}
 else paperBG();
}
function clearAll(){strokes=[];paperBG();}
function gallery(){try{return JSON.parse(localStorage.getItem(LS)||'[]');}catch(e){return[];}}
function saveArt(){
 var g=gallery();
 g.unshift(cv.toDataURL('image/jpeg',0.7));
 if(g.length>6)g.pop();
 localStorage.setItem(LS,JSON.stringify(g));
 renderGal();
}
function renderGal(){
 var el=document.getElementById('gal');el.innerHTML='';
 gallery().forEach(function(d){
  var im=document.createElement('img');im.src=d;
  im.onclick=function(){var img=new Image();img.onload=function(){paperBG();ctx.drawImage(img,0,0,cv.width,cv.height);strokes.push({snap:cv.toDataURL('image/png')});};img.src=d;};
  el.appendChild(im);
 });
}
function exportPNG(){
 var a=document.createElement('a');
 a.download='jk-watercolor-'+Date.now()+'.png';
 a.href=cv.toDataURL('image/png');
 a.click();
}
var pal=document.getElementById('pal');
PALETTE.forEach(function(p,i){
 var d=document.createElement('div');d.className='sw'+(i===0?' on':'');
 d.style.background=p.c==='water'?'linear-gradient(135deg,#cfe8ff,#eef8ff)':p.c;
 d.title=p.n;
 d.onclick=function(){colorIdx=i;document.querySelectorAll('.sw').forEach(function(x){x.className='sw';});d.className='sw on';};
 pal.appendChild(d);
});
document.getElementById('undo').onclick=undo;
document.getElementById('clear').onclick=clearAll;
document.getElementById('save').onclick=saveArt;
document.getElementById('dl').onclick=exportPNG;
cv.addEventListener('touchstart',function(e){e.preventDefault();beginStroke(e);},{passive:false});
cv.addEventListener('touchmove',moveStroke,{passive:false});
cv.addEventListener('touchend',function(e){e.preventDefault();endStroke();},{passive:false});
cv.addEventListener('mousedown',beginStroke);
cv.addEventListener('mousemove',function(e){if(cur)moveStroke(e);});
addEventListener('mouseup',endStroke);
fit();addEventListener('resize',fit);
renderGal();
window.__WC={
 G:function(){return{strokes:strokes.length,painting:cur!==null,colorIdx:colorIdx,gallery:gallery().length,downs:downs};},
 dab:function(x,y){dab(x,y);},
 beginStroke:function(x,y){cur={pts:[{x:x,y:y}]};dab(x,y);},
 moveStroke:function(x,y){if(!cur)return;var last=cur.pts[cur.pts.length-1];var d=Math.hypot(x-last.x,y-last.y);var steps=Math.max(1,Math.ceil(d/4));for(var i=1;i<=steps;i++)dab(last.x+(x-last.x)*i/steps,last.y+(y-last.y)*i/steps);cur.pts.push({x:x,y:y});},
 endStroke:endStroke,
 setColor:function(i){colorIdx=i;},
 setSize:function(v){document.getElementById('size').value=v;},
 setWet:function(v){document.getElementById('wet').value=v;},
 undo:undo,
 clear:clearAll,
 saveArt:saveArt,
 pixel:function(x,y){var d=ctx.getImageData(x,y,1,1).data;return[d[0],d[1],d[2]];},
 exportHref:function(){return cv.toDataURL('image/png').slice(0,40);}
};
})();
</script>
</body>
</html>
