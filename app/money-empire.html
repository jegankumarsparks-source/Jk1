:root{ --bg:#070a08; --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.08); --line:rgba(255,255,255,.1); --txt:#eef7ee; --mut:#8ea092; --gold:#fbbf24; --grn:#7ee787; --neon:#34d399; --cyan:#22d3ee; --red:#f87171; --pink:#f472b6; }
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{ background:var(--bg); color:var(--txt); font-family:'Space Grotesk',-apple-system,Roboto,sans-serif; max-width:480px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:76px; }
body::before{ content:''; position:fixed; inset:0; background:radial-gradient(620px 300px at 80% -5%,rgba(251,191,36,.13),transparent),radial-gradient(520px 280px at 8% 0%,rgba(52,211,153,.11),transparent); pointer-events:none; }
h1,h2,.tabbtn .lb{ font-family:'Orbitron','Space Grotesk',sans-serif; }
.big,.stat .v{ font-family:'Audiowide','Orbitron',monospace; font-variant-numeric:tabular-nums; }

body{ font-family:'Space Grotesk','Catamaran',-apple-system,Roboto,sans-serif; }
.topbar{ position:sticky; top:0; z-index:10; background:rgba(7,10,8,.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
.topbar .logo{ font-family:'Orbitron'; font-weight:900; font-size:15px; letter-spacing:1px; background:linear-gradient(90deg,var(--gold),var(--grn)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.topbar .tag{ font-size:10px; color:var(--mut); letter-spacing:2px; }
.wrap{ position:relative; z-index:1; padding:14px; }
.tabbar{ position:fixed; bottom:0; left:0; right:0; z-index:10; max-width:480px; margin:0 auto; background:rgba(7,10,8,.92); backdrop-filter:blur(12px); border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(7,1fr); }
.tabbtn{ background:none; border:0; color:var(--mut); padding:9px 2px 8px; font-size:19px; cursor:pointer; text-align:center; }
.tabbtn .lb{ display:block; font-size:8.5px; margin-top:2px; letter-spacing:.5px; font-weight:700; }
.tabbtn.on{ color:var(--grn); }
.tabbtn.on .lb{ color:var(--grn); }
.page{ display:none; animation:fadein .3s ease; }
.page.on{ display:block; }
@keyframes fadein{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }
.card{ background:var(--glass); border:1px solid var(--line); border-radius:18px; padding:15px; margin-bottom:12px; backdrop-filter:blur(8px); }
.big{ font-size:31px; font-weight:900; font-variant-numeric:tabular-nums; }
.mut{ color:var(--mut); font-size:12px; }
.sec{ font-family:'Orbitron'; font-size:12px; font-weight:700; letter-spacing:1.5px; margin:16px 2px 9px; color:var(--mut); text-transform:uppercase; }
.row{ display:flex; gap:8px; margin-bottom:9px; }
input,select{ background:rgba(0,0,0,.35); border:1px solid var(--line); color:var(--txt); border-radius:12px; padding:12px; font-size:15px; outline:none; font-family:inherit; }
input:focus,select:focus{ border-color:var(--grn); }
input[type=text]{ flex:1; min-width:0; }
input[type=number]{ flex:1; min-width:0; }
.lbl{ font-size:10.5px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px; margin:0 2px 4px; }
.fg{ flex:1; min-width:0; }
.btn{ border:0; border-radius:12px; padding:13px 18px; font-size:14px; font-weight:700; cursor:pointer; font-family:'Space Grotesk'; }
.btn:active{ transform:scale(.96); }
.btn-g{ background:linear-gradient(90deg,var(--grn),var(--neon)); color:#04120a; }
.btn-gold{ background:linear-gradient(90deg,var(--gold),#f97316); color:#1a0e00; }
.btn-o{ background:var(--glass2); border:1px solid var(--line); color:var(--txt); }
.full{ width:100%; }
.stats{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
.stat{ background:var(--glass); border:1px solid var(--line); border-radius:16px; padding:13px; }
.stat .v{ font-size:19px; font-weight:900; font-variant-numeric:tabular-nums; }
.stat .l{ font-size:10px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px; margin-top:3px; }
.badge{ display:inline-block; font-size:10.5px; font-weight:700; border-radius:99px; padding:4px 10px; }
.b-red{ background:rgba(248,113,113,.15); color:var(--red); }
.b-amb{ background:rgba(251,191,36,.15); color:var(--gold); }
.b-grn{ background:rgba(126,231,135,.15); color:var(--grn); }
.b-cyan{ background:rgba(34,211,238,.15); color:var(--cyan); }
.bar{ height:9px; background:rgba(0,0,0,.4); border-radius:99px; overflow:hidden; margin-top:6px; }
.bar i{ display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--grn),var(--neon)); transition:width .5s; }
.bar i.over{ background:linear-gradient(90deg,var(--red),var(--pink)); }
.lrow{ display:flex; align-items:center; gap:9px; padding:9px 2px; border-bottom:1px solid var(--line); font-size:14px; }
.lrow:last-child{ border-bottom:0; }
.lrow .grow{ flex:1; min-width:0; }
.lrow .x{ color:var(--mut); padding:2px 8px; cursor:pointer; font-size:16px; }
.lrow .x:active{ color:var(--red); }
.seg{ display:flex; gap:6px; margin-bottom:12px; }
.seg button{ flex:1; background:var(--glass2); border:1px solid var(--line); color:var(--mut); border-radius:11px; padding:9px 4px; font-size:12px; font-weight:700; cursor:pointer; font-family:'Space Grotesk'; }
.seg button.on{ background:linear-gradient(90deg,rgba(126,231,135,.2),rgba(52,211,153,.2)); border-color:var(--grn); color:var(--grn); }
.ringwrap{ display:flex; align-items:center; gap:13px; }
.donut{ width:74px; height:74px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
.donut .in{ width:54px; height:54px; border-radius:50%; background:var(--bg); display:flex; align-items:center; justify-content:center; font-family:'Orbitron'; font-weight:900; font-size:13.5px; }
table{ width:100%; border-collapse:collapse; font-size:12.5px; font-variant-numeric:tabular-nums; }
th{ text-align:right; color:var(--mut); font-weight:400; font-size:10px; text-transform:uppercase; letter-spacing:.4px; padding:5px 4px; border-bottom:1px solid var(--line); }
th:first-child,td:first-child{ text-align:left; }
td{ text-align:right; padding:6px 4px; border-bottom:1px solid rgba(255,255,255,.05); }
tr.hl td{ color:var(--gold); font-weight:700; }
.confetti{ position:fixed; top:-10px; width:9px; height:14px; z-index:50; pointer-events:none; border-radius:2px; animation:cfall 2.4s ease-in forwards; }
@keyframes cfall{ to{ transform:translateY(110vh) rotate(720deg); opacity:0; } }
.hero{ text-align:center; padding:18px 6px 8px; }
.hero .t{ font-family:'Orbitron'; font-size:21px; font-weight:900; background:linear-gradient(90deg,var(--gold),var(--grn),var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.hero .s{ font-size:11.5px; color:var(--mut); margin-top:4px; }
</style>

<body>
<div class="topbar"><div><div class="logo">JK MONEY EMPIRE</div></div><div class="tag">EST. 2030 🏦</div></div>

<div class="tabbar" id="tabbar"></div>
<script>
/* ============ CORE ============ */
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem('jkme_'+k));return v==null?d:v;}catch(e){return d;}},set(k,v){localStorage.setItem('jkme_'+k,JSON.stringify(v));}};
const dayKey=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const monKey=d=>dayKey(d).slice(0,7);
const inr=n=>{ n=Math.round(+n); if(Math.abs(n)>=10000000) return '₹'+(n/10000000).toFixed(2)+' Cr'; if(Math.abs(n)>=100000) return '₹'+(n/100000).toFixed(2)+' L'; return '₹'+n.toLocaleString('en-IN'); };
const inrFull=n=>'₹'+Math.round(+n).toLocaleString('en-IN');
const CF=['#fbbf24','#7ee787','#34d399','#22d3ee','#f472b6'];
function confetti(){ for(let i=0;i<24;i++){ const d=document.createElement('div'); d.className='confetti'; d.style.left=Math.random()*100+'vw'; d.style.background=CF[i%5]; d.style.animationDelay=(Math.random()*0.4)+'s'; document.body.appendChild(d); setTimeout(()=>d.remove(),3000); } }
function vib(p){ if(navigator.vibrate) try{ navigator.vibrate(p); }catch(e){} }
const TABS=[
 {id:'cmd',e:'⌂',n:'EMPIRE'},
 {id:'grow',e:'📈',n:'GROW'},
 {id:'goals',e:'🎯',n:'GOALS'},
 {id:'budget',e:'📊',n:'BUDGET'},
 {id:'ledger',e:'💸',n:'LEDGER'},
 {id:'worth',e:'💎',n:'WORTH'},
 {id:'vault',e:'🗄️',n:'VAULT'}
];
let curTab='cmd';
$('#tabbar').innerHTML=TABS.map(t=>'<button class="tabbtn" id="tab_'+t.id+'" onclick="go(\''+t.id+'\')">'+t.e+'<span class="lb">'+t.n+'</span></button>').join('');
function go(id){ curTab=id; TABS.forEach(t=>$('#tab_'+t.id).classList.toggle('on',t.id===id)); ({cmd:renderCmd,grow:renderGrow,goals:renderGoals,budget:renderBudget,ledger:renderLedger,worth:renderWorth,vault:renderVault})[id](); window.scrollTo(0,0); }

/* ============ SHARED DATA ============ */
const CATS=['🍜 Food','🛒 Grocery','⛽ Fuel','🎬 Fun','💊 Health','👕 Shopping','🏠 Home','📦 Other'];
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
const today0=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());};
const cycKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
function ledger(){ return LS.get('ledger',[]); }
function monthExp(){ const mk=monKey(); return ledger().filter(e=>e.type==='exp'&&dayKey(new Date(e.ts)).slice(0,7)===mk); }
function monthInc(){ const mk=monKey(); return ledger().filter(e=>e.type==='inc'&&dayKey(new Date(e.ts)).slice(0,7)===mk); }
function dueInfo(b){
 const t=today0(), y=t.getFullYear(), m=t.getMonth();
 let d=new Date(y,m,Math.min(b.day,daysIn(y,m)));
 if(b.paid===cycKey(d)){ const nd=new Date(y,m+1,1); d=new Date(nd.getFullYear(),nd.getMonth(),Math.min(b.day,daysIn(nd.getFullYear(),nd.getMonth()))); return {due:d,days:Math.round((d-t)/86400000),paid:true}; }
 return {due:d,days:Math.round((d-t)/86400000),paid:false};
}
function bills(){ return LS.get('bills',[{id:1,name:'House Rent',amt:8000,day:5,emoji:'🏠',paid:''},{id:2,name:'EB Bill',amt:1200,day:10,emoji:'⚡',paid:''},{id:3,name:'WiFi',amt:999,day:15,emoji:'📡',paid:''}]); }

/* ============ COMMAND ============ */

/* ============ GROW (SIP / EMI / FD / 1Cr) ============ */
let growSub=LS.get('growSub','sip');
function renderGrow(){
 $('#pages').innerHTML='<div class="page on"><div class="hero"><div class="t">WEALTH FORGE</div><div class="s">see your money multiply before you spend a rupee</div></div>'+
 '<div class="seg">'+[['sip','SIP'],['emi','EMI'],['fd','FD'],['cr','₹1 Cr 🚀']].map(s=>'<button class="'+(growSub===s[0]?'on':'')+'" onclick="growGo(\''+s[0]+'\')">'+s[1]+'</button>').join('')+'</div><div id="growbody"></div></div>';
 ({sip:renderSIP,emi:renderEMI,fd:renderFD,cr:renderCR})[growSub]();
}
function growGo(s){ growSub=s; LS.set('growSub',s); renderGrow(); }
function renderSIP(){
 const d=LS.get('sipIn',{m:10000,r:12,y:10});
 $('#growbody').innerHTML='<div class="card"><div class="row"><div class="fg"><div class="lbl">monthly ₹</div><input type="number" id="sM" value="'+d.m+'"></div><div class="fg"><div class="lbl">return %/yr</div><input type="number" id="sR" value="'+d.r+'" step="0.5"></div><div class="fg"><div class="lbl">years</div><input type="number" id="sY" value="'+d.y+'"></div></div><button class="btn btn-g full" onclick="calcSIP()">FORGE IT 📈</button></div><div id="sipOut"></div>';
 calcSIP();
}
function calcSIP(){
 const m=+$('#sM').value||0, r=(+$('#sR').value||0)/100/12, y=+$('#sY').value||0;
 LS.set('sipIn',{m,r:+$('#sR').value||0,y});
 if(!m||!y){ $('#sipOut').innerHTML=''; return; }
 const n=y*12;
 const fv=r>0?m*((Math.pow(1+r,n)-1)/r)*(1+r):m*n;
 const inv=m*n, gain=fv-inv;
 let bal=0, rows='';
 for(let yr=1;yr<=y;yr++){ for(let mo=1;mo<=12;mo++){ bal=r>0?bal*(1+r)+m*(1+r):bal+m; } if(yr<=15||yr===y) rows+='<tr'+(yr===y?' class="hl"':'')+'><td>Yr '+yr+'</td><td>'+inr(m*12*yr)+'</td><td>'+inr(bal)+'</td></tr>'; else if(yr===16) rows+='<tr><td colspan="3" style="text-align:center;color:var(--mut)">…</td></tr>'; }
 $('#sipOut').innerHTML='<div class="stats"><div class="stat"><div class="v">'+inr(inv)+'</div><div class="l">you invest</div></div><div class="stat"><div class="v" style="color:var(--grn)">'+inr(fv)+'</div><div class="l">you get back</div></div></div>'+
 '<div class="card"><div class="ringwrap"><div class="donut" style="background:conic-gradient(var(--grn) '+(gain/(fv||1)*360)+'deg, rgba(255,255,255,.08) 0)"><div class="in">'+Math.round(gain/(fv||1)*100)+'%</div></div><div><div class="mut">WEALTH GAINED</div><div class="big" style="color:var(--grn)">'+inr(gain)+'</div><div class="mut">pure growth, zero extra work 💪</div></div></div></div>'+
 '<div class="card"><div class="mut" style="margin-bottom:6px">YEAR-BY-YEAR</div><table><tr><th>year</th><th>invested</th><th>value</th></tr>'+rows+'</table></div>';
}
function renderEMI(){
 const d=LS.get('emiIn',{p:500000,r:9,n:60});
 $('#growbody').innerHTML='<div class="card"><div class="row"><div class="fg"><div class="lbl">loan ₹</div><input type="number" id="eP" value="'+d.p+'"></div><div class="fg"><div class="lbl">rate %/yr</div><input type="number" id="eR" value="'+d.r+'" step="0.1"></div><div class="fg"><div class="lbl">months</div><input type="number" id="eN" value="'+d.n+'"></div></div><button class="btn btn-gold full" onclick="calcEMI()">CRUNCH IT 🏦</button></div><div id="emiOut"></div>';
 calcEMI();
}
function calcEMI(){
 const p=+$('#eP').value||0, r=(+$('#eR').value||0)/100/12, n=+$('#eN').value||0;
 LS.set('emiIn',{p,r:+$('#eR').value||0,n});
 if(!p||!n){ $('#emiOut').innerHTML=''; return; }
 const emi=r>0?p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1):p/n;
 const tot=emi*n, intt=tot-p;
 let bal=p, rows='';
 for(let mo=1;mo<=Math.min(12,n);mo++){ const i=bal*r, pr=emi-i; bal-=pr; rows+='<tr><td>Mo '+mo+'</td><td>'+inrFull(Math.round(pr))+'</td><td>'+inrFull(Math.round(i))+'</td><td>'+inr(Math.max(0,bal))+'</td></tr>'; }
 $('#emiOut').innerHTML='<div class="stats"><div class="stat"><div class="v" style="color:var(--gold)">'+inrFull(Math.round(emi))+'</div><div class="l">monthly EMI</div></div><div class="stat"><div class="v" style="color:var(--red)">'+inr(intt)+'</div><div class="l">total interest</div></div></div>'+
 '<div class="card"><div class="ringwrap"><div class="donut" style="background:conic-gradient(var(--red) '+(intt/(tot||1)*360)+'deg, var(--grn) 0)"><div class="in">'+Math.round(intt/(tot||1)*100)+'%</div></div><div><div class="mut">INTEREST SHARE</div><div class="big" style="color:var(--red)">'+inr(intt)+'</div><div class="mut">of '+inr(tot)+' total payment</div></div></div></div>'+
 '<div class="card"><div class="mut" style="margin-bottom:6px">FIRST 12 MONTHS</div><table><tr><th>month</th><th>principal</th><th>interest</th><th>balance</th></tr>'+rows+'</table></div>';
}
function renderFD(){
 const d=LS.get('fdIn',{p:100000,r:7,y:5,f:4});
 $('#growbody').innerHTML='<div class="card"><div class="row"><div class="fg"><div class="lbl">lumpsum ₹</div><input type="number" id="fP" value="'+d.p+'"></div><div class="fg"><div class="lbl">rate %/yr</div><input type="number" id="fR" value="'+d.r+'" step="0.1"></div></div><div class="row"><div class="fg"><div class="lbl">years</div><input type="number" id="fY" value="'+d.y+'"></div><div class="fg"><div class="lbl">compounding</div><select id="fF"><option value="1"'+(d.f===1?' selected':'')+'>yearly</option><option value="2"'+(d.f===2?' selected':'')+'>half-yearly</option><option value="4"'+(d.f===4?' selected':'')+'>quarterly</option><option value="12"'+(d.f===12?' selected':'')+'>monthly</option></select></div></div><button class="btn btn-g full" onclick="calcFD()">GROW IT 🌱</button></div><div id="fdOut"></div>';
 calcFD();
}
function calcFD(){
 const p=+$('#fP').value||0, r=(+$('#fR').value||0)/100, y=+$('#fY').value||0, f=+$('#fF').value||1;
 LS.set('fdIn',{p,r:+$('#fR').value||0,y,f});
 if(!p||!y){ $('#fdOut').innerHTML=''; return; }
 const mat=p*Math.pow(1+r/f,f*y), gain=mat-p;
 $('#fdOut').innerHTML='<div class="stats"><div class="stat"><div class="v">'+inr(p)+'</div><div class="l">you deposit</div></div><div class="stat"><div class="v" style="color:var(--grn)">'+inr(mat)+'</div><div class="l">maturity</div></div></div><div class="card" style="text-align:center"><div class="mut">INTEREST EARNED</div><div class="big" style="color:var(--grn)">'+inr(gain)+'</div><div class="mut">effective yield '+(r>0?((Math.pow(1+r/f,f)-1)*100).toFixed(2):0)+'% p.a.</div></div>';
}
function renderCR(){
 const d=LS.get('crIn',{c:200000,m:15000,r:12,age:30});
 $('#growbody').innerHTML='<div class="card"><div class="row"><div class="fg"><div class="lbl">current savings ₹</div><input type="number" id="cC" value="'+d.c+'"></div><div class="fg"><div class="lbl">monthly SIP ₹</div><input type="number" id="cM" value="'+d.m+'"></div></div><div class="row"><div class="fg"><div class="lbl">return %/yr</div><input type="number" id="cR" value="'+d.r+'" step="0.5"></div><div class="fg"><div class="lbl">your age</div><input type="number" id="cA" value="'+d.age+'"></div></div><button class="btn btn-gold full" onclick="calcCR()">PROJECT MY EMPIRE 🚀</button></div><div id="crOut"></div>';
 calcCR();
}
function calcCR(){
 let c=+$('#cC').value||0; const m=+$('#cM').value||0, r=(+$('#cR').value||0)/100/12, age=+$('#cA').value||30;
 LS.set('crIn',{c,m,r:+$('#cR').value||0,age});
 const miles=[2500000,5000000,10000000,20000000,50000000,100000000];
 const hit={}; let mo=0;
 while(mo<600&&Object.keys(hit).length<miles.length){ mo++; c=c*(1+r)+m*(1+r); miles.forEach(t=>{ if(c>=t&&!(t in hit)) hit[t]=mo; }); }
 const fmt=t=>t>=10000000?(t/10000000)+' Cr':(t/100000)+' L';
 const rows=miles.map(t=>{ const h=hit[t]; return '<tr'+(t===10000000?' class="hl"':'')+'><td>₹'+fmt(t)+'</td><td>'+(h?(h/12).toFixed(1)+' yrs':'30+ yrs')+'</td><td>'+(h?'age '+(age+Math.floor(h/12)):'-')+'</td></tr>'; }).join('');
 const cr=hit[10000000];
 $('#crOut').innerHTML='<div class="card" style="text-align:center"><div class="mut">CROREPATI AT</div><div class="big" style="color:var(--gold);font-size:40px">'+(cr?'AGE '+(age+Math.floor(cr/12)):'NOT IN 30Y')+'</div><div class="mut">'+(cr?'in '+(cr/12).toFixed(1)+' years · '+new Date().getFullYear()+Math.ceil(cr/12):'raise the SIP or the return')+' 🎉</div></div>'+
 '<div class="card"><div class="mut" style="margin-bottom:6px">MILESTONE TIMELINE</div><table><tr><th>milestone</th><th>time</th><th>your age</th></tr>'+rows+'</table></div>';
 if(cr&&cr/12<=15) confetti();
}

/* ============ GOALS ============ */
function renderGoals(){
 const goals=LS.get('goals',[]);
 $('#pages').innerHTML='<div class="page on"><div class="hero"><div class="t">GOAL FORGE</div><div class="s">dream it, fund it, ring it 🎯</div></div>'+
 (goals.length?goals.map(g=>{
  const pct=Math.min(100,Math.round(g.saved/g.target*100));
  const eta=g.saved>0&&g.months>0?Math.ceil((g.target-g.saved)/(g.saved/g.months)):null;
  return '<div class="card"><div class="ringwrap"><div class="donut" style="background:conic-gradient(var(--gold) '+(pct*3.6)+'deg, rgba(255,255,255,.08) 0)"><div class="in">'+pct+'%</div></div><div class="grow"><b style="font-size:15.5px">'+esc(g.name)+'</b><div class="mut">'+inr(g.saved)+' of '+inr(g.target)+(pct>=100?' <span class="badge b-grn">FUNDED 🎉</span>':(eta&&eta<120?' <span class="badge b-cyan">~'+eta+' mo to go</span>':''))+'</div><div class="row" style="margin-top:8px;margin-bottom:0"><input type="number" id="ga_'+g.id+'" placeholder="+ add ₹"><button class="btn btn-g" style="padding:10px 16px" onclick="goalAdd('+g.id+')">ADD</button><span class="x" onclick="goalDel('+g.id+')">×</span></div></div></div></div>';
 }).join(''):'<div class="card" style="text-align:center" class="mut"><span class="mut">no goals yet - first one: emergency fund? 🚑</span></div>')+
 '<div class="card"><div class="row"><input type="text" id="gName" placeholder="goal name (e.g. Europe trip ✈️)" maxlength="26"></div><div class="row"><input type="number" id="gTarget" placeholder="target ₹"><input type="number" id="gSaved" placeholder="already saved ₹ (0 ok)"></div><button class="btn btn-gold full" onclick="goalNew()">FORGE GOAL</button></div></div>';
}
function goalNew(){
 const name=$('#gName').value.trim(), target=+$('#gTarget').value, saved=+$('#gSaved').value||0;
 if(!name||!target){ alert('Name and target amount needed'); return; }
 const goals=LS.get('goals',[]); goals.push({id:Date.now(),name,target,saved,months:1});
 LS.set('goals',goals); renderGoals();
}
function goalAdd(id){
 const v=+$('#ga_'+id).value; if(!v)return;
 const goals=LS.get('goals',[]); const g=goals.find(x=>x.id===id); if(!g)return;
 g.saved+=v; g.months=(g.months||1)+0; LS.set('goals',goals); vib(40);
 if(g.saved>=g.target){ confetti(); vib([80,40,80]); }
 renderGoals();
}
function goalDel(id){ if(!confirm('Delete this goal?'))return; LS.set('goals',LS.get('goals',[]).filter(g=>g.id!==id)); renderGoals(); }

/* ============ BUDGET ============ */
function renderBudget(){
 const bud=+LS.get('budget',40000), catBud=LS.get('catBud',{});
 const mE=monthExp();
 const tot=mE.reduce((s,e)=>s+e.amt,0);
 const byCat={}; mE.forEach(e=>{ byCat[e.cat]=(byCat[e.cat]||0)+e.amt; });
 const dayN=new Date().getDate(), dim=daysIn(new Date().getFullYear(),new Date().getMonth());
 const proj=Math.round(tot/dayN*dim);
 const pct=Math.min(100,Math.round(tot/bud*100));
 $('#pages').innerHTML='<div class="page on"><div class="hero"><div class="t">BUDGET RADAR</div><div class="s">day '+dayN+' of '+dim+' · burn under control?</div></div>'+
 '<div class="card"><div class="row"><div class="fg"><div class="lbl">monthly budget ₹</div><input type="number" id="budTotal" value="'+bud+'"></div><button class="btn btn-g" style="align-self:flex-end" onclick="saveBud()">SAVE</button></div>'+
 '<div style="display:flex;justify-content:space-between"><span class="mut">SPENT '+inrFull(tot)+'</span><b style="color:'+(pct>90?'var(--red)':pct>70?'var(--gold)':'var(--grn)')+'">'+pct+'%</b></div><div class="bar"><i class="'+(pct>90?'over':'')+'" style="width:'+pct+'%"></i></div>'+
 '<div class="mut" style="margin-top:8px">pace check: <b style="color:var(--txt)">'+inr(proj)+'</b> projected by day '+dim+' <span class="badge '+(proj>bud?'b-red':'b-grn')+'">'+(proj>bud?(inr(proj-bud)+' OVER ⚠️'):(inr(bud-proj)+' HEADROOM ✓'))+'</span></div></div>'+
 '<div class="sec">Category battleground</div>'+
 CATS.map(c=>{
  const a=byCat[c]||0, cb=catBud[c]||0;
  const cp=cb?Math.min(100,Math.round(a/cb*100)):0;
  return '<div class="card" style="padding:11px 13px"><div style="display:flex;justify-content:space-between;font-size:13.5px"><span>'+c+'</span><span><b>'+inrFull(a)+'</b>'+(cb?'<span class="mut"> / '+inrFull(cb)+'</span>':'')+'</span></div>'+
  (cb?'<div class="bar"><i class="'+(cp>100?'over':'')+'" style="width:'+Math.min(100,cp)+'%"></i></div>':'<div class="mut" style="margin-top:4px">no cap set</div>')+
  '<div class="row" style="margin:7px 0 0"><input type="number" id="cb_'+c.replace(/[^A-Za-z]/g,'')+'" placeholder="cap ₹" value="'+(cb||'')+'"><button class="btn btn-o" style="padding:8px 14px;font-size:12px" onclick="saveCatBud(\''+c+'\',\'cb_'+c.replace(/[^A-Za-z]/g,'')+'\')">SET CAP</button></div></div>';
 }).join('')+'</div>';
}
function saveBud(){ const v=+$('#budTotal').value; if(v>0){ LS.set('budget',v); renderBudget(); } }
function saveCatBud(cat,inp){ const v=+document.getElementById(inp).value; const cb=LS.get('catBud',{}); if(v>0)cb[cat]=v; else delete cb[cat]; LS.set('catBud',cb); renderBudget(); }

/* ============ LEDGER (+ bills + split) ============ */
function renderLedger(){
 const L=ledger().slice().sort((a,b)=>b.ts-a.ts);
 const mE=monthExp(), mI=monthInc();
 const eSum=mE.reduce((s,e)=>s+e.amt,0), iSum=mI.reduce((s,e)=>s+e.amt,0);
 const j=mE.filter(e=>e.who==='Jegan').reduce((s,e)=>s+e.amt,0), dv=eSum-j;
 const settle=j===dv?null:(j>dv?{who:'Divya',to:'Jegan',amt:Math.round((j-dv)/2)}:{who:'Jegan',to:'Divya',amt:Math.round((dv-j)/2)});
 const bs=bills().map(b=>({b,i:dueInfo(b)})).sort((a,c)=>a.i.paid-c.i.paid||a.i.days-c.i.days);
 $('#pages').innerHTML='<div class="page on"><div class="hero"><div class="t">EMPIRE LEDGER</div><div class="s">every rupee accounted · split for two</div></div>'+
 '<div class="stats"><div class="stat"><div class="v" style="color:var(--grn)">'+inr(iSum)+'</div><div class="l">income</div></div><div class="stat"><div class="v" style="color:var(--red)">'+inr(eSum)+'</div><div class="l">expense</div></div></div>'+
 '<div class="card" style="text-align:center">'+(settle?'<span class="badge b-cyan" style="font-size:13px;padding:8px 16px">'+settle.who+' owes '+settle.to+' '+inrFull(settle.amt)+'</span>':'<span class="badge b-grn" style="font-size:13px;padding:8px 16px">split all square ✓</span>')+'</div>'+
 '<div class="card"><div class="row"><select id="lType"><option value="exp">− expense</option><option value="inc">+ income</option></select><input type="number" id="lAmt" placeholder="₹"></div>'+
 '<div class="row"><select id="lCat">'+CATS.map(c=>'<option>'+c+'</option>').join('')+'</select><select id="lWho"><option>Jegan</option><option>Divya</option><option>Joint</option></select></div>'+
 '<div class="row"><input type="text" id="lNote" placeholder="note (e.g. salary, chai, petrol)" maxlength="30"></div>'+
 '<button class="btn btn-g full" onclick="addEntry()">ADD ENTRY</button></div>'+
 '<div class="sec">Recent entries</div><div class="card">'+(L.length?L.slice(0,15).map(e=>'<div class="lrow"><span>'+(e.type==='inc'?'🟢':e.cat.split(' ')[0])+'</span><span class="grow">'+esc(e.note||e.cat)+' <span class="mut">· '+e.who+' · '+new Date(e.ts).toLocaleDateString('en-IN',{day:'numeric',month:'short'})+'</span></span><b style="color:'+(e.type==='inc'?'var(--grn)':'var(--red)')+'">'+(e.type==='inc'?'+':'−')+inrFull(e.amt)+'</b><span class="x" onclick="delEntry('+e.id+')">×</span></div>').join(''):'<div class="mut">empty ledger - add your first entry above</div>')+'</div>'+
 '<div class="sec">🛡️ Bill guard</div>'+
 bs.map(({b,i})=>{
  const badge=i.paid?'<span class="badge b-grn">PAID ✓</span>':i.days<0?'<span class="badge b-red">OVERDUE '+(-i.days)+'d</span>':i.days===0?'<span class="badge b-red">DUE TODAY</span>':i.days<=7?'<span class="badge b-amb">'+i.days+'d</span>':'<span class="badge b-cyan">'+i.days+'d</span>';
  return '<div class="card" style="padding:11px 13px"><div style="display:flex;justify-content:space-between;align-items:center"><span>'+b.emoji+' <b>'+esc(b.name)+'</b> '+badge+'</span><span style="text-align:right"><b style="color:var(--gold)">'+inrFull(b.amt)+'</b>'+(i.paid?'':' <span class="badge b-grn" style="cursor:pointer" onclick="payBill('+b.id+')">PAY</span>')+' <span class="x" onclick="delBill('+b.id+')">×</span></span></div></div>';
 }).join('')+
 '<div class="card"><div class="row"><select id="bEmoji"><option>⚡</option><option>🏠</option><option>📡</option><option>💳</option><option>📺</option><option>🥛</option><option>🔥</option><option>📱</option><option>🏦</option><option>🧾</option></select><input type="text" id="bName" placeholder="bill name" maxlength="20"></div><div class="row"><input type="number" id="bAmt" placeholder="₹"><input type="number" id="bDay" placeholder="due day 1-31"></div><button class="btn btn-gold full" onclick="addBill()">ADD BILL</button></div></div>';
}
function addEntry(){
 const amt=+$('#lAmt').value; if(!amt){ alert('Amount needed'); return; }
 const L=ledger();
 L.push({id:Date.now(),type:$('#lType').value,amt,cat:$('#lCat').value,note:$('#lNote').value.trim(),who:$('#lWho').value,ts:Date.now()});
 LS.set('ledger',L); vib(30); renderLedger();
}
function delEntry(id){ LS.set('ledger',ledger().filter(e=>e.id!==id)); renderLedger(); }
function payBill(id){ const bs=bills(); const b=bs.find(x=>x.id===id); if(!b)return; b.paid=cycKey(dueInfo({...b,paid:''}).due); LS.set('bills',bs);
 const L=ledger(); L.push({id:Date.now(),type:'exp',amt:+b.amt,cat:'🏠 Home',note:b.name+' (bill)',who:'Joint',ts:Date.now()}); LS.set('ledger',L);
 confetti(); vib(60); renderLedger(); }
function delBill(id){ if(!confirm('Delete this bill?'))return; LS.set('bills',bills().filter(x=>x.id!==id)); renderLedger(); }
function addBill(){
 const name=$('#bName').value.trim(), amt=+$('#bAmt').value, day=+$('#bDay').value;
 if(!name||!amt||!day||day<1||day>31){ alert('Fill name, amount, due day (1-31)'); return; }
 const bs=bills(); bs.push({id:Date.now(),name,amt,day,emoji:$('#bEmoji').value,paid:''});
 LS.set('bills',bs); renderLedger();
}

/* ============ NET WORTH ============ */
const ASSET_ICONS=['💵','🏦','🥇','📈','🏠','🚗','💍','📦'];
function worthItems(){ return LS.get('worth',[{id:1,name:'Savings account',icon:'🏦',val:150000},{id:2,name:'Gold (family)',icon:'🥇',val:200000},{id:3,name:'Bike',icon:'🚗',val:90000}]); }
function renderWorth(){
 const items=worthItems();
 const assets=items.filter(i=>i.val>0).reduce((s,i)=>s+i.val,0);
 const liab=items.filter(i=>i.val<0).reduce((s,i)=>s-i.val,0);
 const nw=assets-liab;
 const snaps=LS.get('snaps',[]);
 const mx=Math.max(1,...snaps.map(s=>Math.abs(s.nw)));
 $('#pages').innerHTML='<div class="page on"><div class="hero"><div class="t">NET WORTH</div><div class="s">what you own minus what you owe · the only number that matters</div></div>'+
 '<div class="card" style="text-align:center"><div class="mut">TOTAL NET WORTH</div><div class="big" style="color:'+(nw>=0?'var(--gold)':'var(--red)')+';font-size:38px">'+inr(nw)+'</div><div class="mut" style="margin-top:6px"><span style="color:var(--grn)">'+inr(assets)+' assets</span> · <span style="color:var(--red)">'+inr(liab)+' liabilities</span></div></div>'+
 '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><span class="mut">EMPIRE TIMELINE ('+snaps.length+' snapshots)</span><button class="btn btn-o" style="padding:7px 14px;font-size:12px" onclick="snapNow()">📸 LOG TODAY</button></div>'+
 (snaps.length?'<div style="display:flex;align-items:flex-end;gap:4px;height:70px;margin-top:10px">'+snaps.slice(-14).map(s=>'<div title="'+s.day+': '+inr(s.nw)+'" style="flex:1;background:linear-gradient(180deg,var(--gold),var(--neon));border-radius:4px 4px 0 0;height:'+Math.max(5,Math.round(Math.abs(s.nw)/mx*64))+'px"></div>').join('')+'</div>':'<div class="mut" style="margin-top:8px">log a snapshot each month to watch the empire grow 📈</div>')+'</div>'+
 items.map(i=>'<div class="lrow"><span style="font-size:18px">'+i.icon+'</span><span class="grow"><b>'+esc(i.name)+'</b></span><b style="color:'+(i.val>=0?'var(--grn)':'var(--red)')+'">'+(i.val>=0?'':'−')+inrFull(Math.abs(i.val))+'</b><span class="x" onclick="worthDel('+i.id+')">×</span></div>').join('')+
 '<div class="card" style="margin-top:10px"><div class="row"><select id="wIcon">'+ASSET_ICONS.map(e=>'<option>'+e+'</option>').join('')+'</select><input type="text" id="wName" placeholder="item (e.g. FD at SBI, car loan)" maxlength="24"></div>'+
 '<div class="row"><input type="number" id="wVal" placeholder="value ₹ (minus for loan)"></div>'+
 '<button class="btn btn-gold full" onclick="worthAdd()">ADD TO EMPIRE</button></div></div>';
}
function worthAdd(){
 const name=$('#wName').value.trim(), val=+$('#wVal').value;
 if(!name||!val){ alert('Name and value needed (negative = loan)'); return; }
 const items=worthItems(); items.push({id:Date.now(),name,icon:$('#wIcon').value,val});
 LS.set('worth',items); renderWorth();
}
function worthDel(id){ if(!confirm('Remove this item?'))return; LS.set('worth',worthItems().filter(i=>i.id!==id)); renderWorth(); }
function snapNow(){
 const items=worthItems();
 const nw=items.reduce((s,i)=>s+i.val,0);
 const snaps=LS.get('snaps',[]);
 const today=dayKey();
 if(snaps.length&&snaps[snaps.length-1].day===today){ alert('Already logged today ✅'); return; }
 snaps.push({day:today,nw}); LS.set('snaps',snaps.slice(-36)); confetti(); vib(50); renderWorth();
}

/* ============ VAULT ============ */
function renderVault(){
 const keys=['ledger','bills','goals','budget','catBud','sipIn','emiIn','fdIn','crIn','growSub','worth','snaps'];
 const total=keys.reduce((s,k)=>s+(localStorage.getItem('jkme_'+k)||'').length,0);
 $('#pages').innerHTML='<div class="page on"><div class="hero"><div class="t">DATA VAULT</div><div class="s">your empire lives on THIS phone only</div></div>'+
 '<div class="card" style="text-align:center"><div class="mut">VAULT SIZE</div><div class="big" style="color:var(--gold)">'+(total/1024).toFixed(1)+' KB</div><div class="mut" style="margin-top:5px">no account · no server · no tracking · no cloud</div></div>'+
 '<div class="card"><div class="mut" style="margin-bottom:8px">BACKUP</div><button class="btn btn-g full" onclick="exportAll()">⬇️ EXPORT EMPIRE (JSON)</button><div class="mut" style="margin:10px 0 6px">RESTORE</div><div class="row"><input type="text" id="restoreBox" placeholder="paste backup JSON here"></div><button class="btn btn-o full" onclick="importAll()">⬆️ RESTORE FROM PASTE</button></div>'+
 '<div class="card"><div class="mut" style="margin-bottom:8px">DANGER ZONE</div><button class="btn full" style="background:rgba(248,113,113,.15);border:1px solid var(--red);color:var(--red)" onclick="wipeAll()">🗑️ BURN THE EMPIRE (wipe all)</button></div>'+
 '<div class="mut" style="text-align:center;margin-top:6px">JK MONEY EMPIRE · built for 2030 · 100% offline · fonts embedded for zero-network launch ⚡</div></div>';
}
function exportAll(){
 const out={app:'JK MONEY EMPIRE',exported:new Date().toISOString(),data:{}};
 ['ledger','bills','goals','budget','catBud','sipIn','emiIn','fdIn','crIn','worth','snaps'].forEach(k=>out.data[k]=LS.get(k,null));
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
 a.download='jk-money-empire-'+dayKey()+'.json'; a.click();
}
function importAll(){
 try{
  const j=JSON.parse($('#restoreBox').value);
  if(j.app!=='JK MONEY EMPIRE'||!j.data||typeof j.data!=='object'){ alert('Not a valid JK Money Empire backup'); return; }
  Object.keys(j.data).forEach(k=>{ if(j.data[k]!=null) LS.set(k,j.data[k]); });
  alert('Empire restored ✅'); go('cmd');
 }catch(e){ alert('Invalid JSON - paste the exact backup text'); }
}
function wipeAll(){ if(!confirm('Wipe EVERYTHING? Cannot be undone.'))return; if(!confirm('Really sure? Ledger, bills, goals, budgets - all gone.'))return;
 Object.keys(localStorage).filter(k=>k.startsWith('jkme_')).forEach(k=>localStorage.removeItem(k)); go('cmd'); }

/* ============ LAUNCH ============ */
go('cmd');
</script>
</body>
</html>
