<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>JK AURORA SQUADRON 2040</title>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0B1026}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:10px 14px;z-index:5;font-family:'Audiowide',cursive;pointer-events:none;color:#B7F8DB}
#score{font-size:22px}
#wave{font-size:14px;color:#7BDFF2}
#lives{font-size:14px;color:#FF8FA3}
#bossbar{position:fixed;top:44px;left:15%;right:15%;height:10px;background:rgba(0,0,0,.5);border:1px solid #FF8FA3;border-radius:6px;z-index:5;display:none}
#bossfill{height:100%;background:#FF8FA3;width:100%}
.overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(11,16,38,.96),rgba(35,20,60,.96));font-family:'Audiowide',cursive;text-align:center;padding:20px;color:#B7F8DB}
.overlay.hidden{display:none}
h1{font-size:30px;letter-spacing:2px}
.sub{color:#7BDFF2;font-size:15px;margin-top:12px;max-width:330px;line-height:1.7}
.btn{margin-top:26px;padding:13px 42px;background:#2EC4B6;color:#0B1026;font-family:'Audiowide';font-size:20px;border:none;border-radius:12px;cursor:pointer;box-shadow:0 0 20px rgba(46,196,182,.6)}
#finalScore{font-size:50px;color:#FFCA3A;margin-top:8px}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"><div id="score">0</div><div id="wave">WAVE 1</div><div id="lives">♥♥♥</div></div>
<div id="bossbar"><div id="bossfill"></div></div>
<div class="overlay" id="start">
<h1>🌌 AURORA SQUADRON 🌌</h1>
<p class="sub">DRAG to fly - cannons auto-fire! Drifters weave, divers hunt you, tanks soak damage. Grab power-ups: S=spread R=rapid ⛨=shield. Every 5th wave: a GUARDIAN boss. Survive the aurora storm!</p>
<button class="btn" id="startBtn">LAUNCH</button>
</div>
<div class="overlay hidden" id="over">
<h1>💫 SHIP DOWN 💫</h1>
<div id="finalScore">0</div>
<p class="sub" id="overSub"></p>
<button class="btn" id="overBtn">RELAUNCH</button>
</div>
<script>
"use strict";
const TAU=Math.PI*2;
const container=document.getElementById('game');
const cv=document.createElement('canvas');container.appendChild(cv);
const g=cv.getContext('2d');
let W=0,H=0;
function resize(){const dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);}
addEventListener('resize',resize);resize();
let ship,bullets=[],ebullets=[],enemies=[],powers=[],parts=[],stars=[];
let score=0,wave=1,lives=3,playing=false,over=false,fireT=0,waveT=0,boss=null;
let spread=0,rapid=0,shield=0,invuln=0,targetX=null,targetY=null,aurT=0;
const rand=(a,b)=>a+Math.random()*(b-a);
function reset(){ship={x:W/2,y:H-140};bullets=[];ebullets=[];enemies=[];powers=[];parts=[];
score=0;wave=1;lives=3;fireT=0;waveT=1.5;boss=null;spread=0;rapid=0;shield=0;invuln=0;
stars=[];for(let i=0;i<60;i++)stars.push({x:rand(0,W),y:rand(0,H),s:rand(.3,1.4),v:rand(8,30)});}
function boom(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:rand(-140,140),vy:rand(-140,140),life:rand(.3,.7),c});}
function spawnWave(){
if(wave%5===0){boss={x:W/2,y:-60,hp:60+wave*14,mhp:60+wave*14,t:0,dir:1,volleyT:1.2};enemies=[];}
else{const n=3+Math.min(7,wave);
for(let i=0;i<n;i++){const t=Math.random();
const type=wave>=3&&t<0.3?'tank':(wave>=2&&t<0.65?'diver':'drifter');
enemies.push({x:rand(40,W-40),y:-40-i*50,t:rand(0,TAU),type,hp:type==='tank'?5:2,ph:rand(0,TAU)});}}}
function hitShip(){if(invuln>0)return;
if(shield>0){shield--;invuln=1.2;boom(ship.x,ship.y,'#2EC4B6',12);return;}
lives--;invuln=1.6;boom(ship.x,ship.y,'#FF8FA3',18);
if(lives<=0){playing=false;over=true;
document.getElementById('finalScore').textContent=score;
document.getElementById('overSub').textContent='Reached wave '+wave;
document.getElementById('over').classList.remove('hidden');}}
function simStep(dt){if(!playing||over)return;
aurT+=dt;
// ship move
if(targetX!==null){ship.x+=(targetX-ship.x)*Math.min(1,dt*14);ship.y+=(targetY-ship.y)*Math.min(1,dt*14);
ship.x=Math.max(20,Math.min(W-20,ship.x));ship.y=Math.max(H*0.4,Math.min(H-60,ship.y));}
// fire
fireT-=dt*(rapid>0?1.9:1);
if(fireT<=0){fireT=0.22;
bullets.push({x:ship.x,y:ship.y-16,vx:0,vy:-620});
if(spread>0){bullets.push({x:ship.x-8,y:ship.y-10,vx:-120,vy:-560});bullets.push({x:ship.x+8,y:ship.y-10,vx:120,vy:-560});}}
if(spread>0)spread-=dt;if(rapid>0)rapid-=dt;if(invuln>0)invuln-=dt;
for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;}
bullets=bullets.filter(b=>b.y>-20&&b.x>-20&&b.x<W+20);
// waves
waveT-=dt;
if(!boss&&enemies.length===0&&waveT<=0){wave++;waveT=2;spawnWave();}
// enemies
for(const e of enemies){e.ph+=dt;
if(e.type==='drifter'){e.y+=60*dt;e.x+=Math.sin(e.ph*2)*80*dt;}
else if(e.type==='diver'){e.y+=80*dt;const dx=ship.x-e.x;e.x+=Math.sign(dx)*Math.min(Math.abs(dx),90*dt);}
else{e.y+=35*dt;}
if(e.y>H+30){e.dead=true;}
// enemy fire
e.fireT=(e.fireT??rand(1.5,3))-dt;
if(e.fireT<=0&&e.y>0&&e.y<H*0.7){e.fireT=e.type==='tank'?1.6:2.4;
ebullets.push({x:e.x,y:e.y+12,vx:0,vy:230});}
if(Math.hypot(e.x-ship.x,e.y-ship.y)<24){e.dead=true;hitShip();}}
enemies=enemies.filter(e=>!e.dead);
// boss
if(boss){const b=boss;
if(b.y<90)b.y+=80*dt;
b.t+=dt;b.x=Math.max(70,Math.min(W-70,b.x+b.dir*70*dt));
if(b.x>=W-70||b.x<=70)b.dir*=-1;
b.volleyT-=dt;
if(b.volleyT<=0){b.volleyT=Math.max(0.5,1.4-wave*0.05);
for(let k=-1;k<=1;k++)ebullets.push({x:b.x,y:b.y+20,vx:k*90,vy:260});
if(wave>=10)ebullets.push({x:b.x,y:b.y+20,vx:(ship.x-b.x)*0.5,vy:280});}
if(Math.hypot(b.x-ship.x,b.y-ship.y)<40)hitShip();
if(b.hp<=0){score+=500*wave/5;boom(b.x,b.y,'#FFCA3A',30);boss=null;waveT=2;}
document.getElementById('bossbar').style.display=boss?'block':'none';
if(boss)document.getElementById('bossfill').style.width=(100*boss.hp/boss.mhp)+'%';}
else document.getElementById('bossbar').style.display='none';
// ebullets
for(const b of ebullets){b.x+=b.vx*dt;b.y+=b.vy*dt;
if(Math.hypot(b.x-ship.x,b.y-ship.y)<14){b.dead=true;hitShip();}}
ebullets=ebullets.filter(b=>!b.dead&&b.y<H+20&&b.x>-20&&b.x<W+20);
// bullets vs enemies
for(const b of bullets){if(b.dead)continue;
for(const e of enemies){if(e.dead)continue;
if(Math.abs(b.x-e.x)<16&&Math.abs(b.y-e.y)<14){e.hp--;b.dead=true;
if(e.hp<=0){e.dead=true;score+=e.type==='tank'?30:10;boom(e.x,e.y,e.type==='tank'?'#FF8FA3':'#7BDFF2',8);
if(Math.random()<0.14)powers.push({x:e.x,y:e.y,k:['S','R','⛨'][Math.floor(rand(0,3))]});}
break;}}
if(!b.dead&&boss&&Math.abs(b.x-boss.x)<34&&Math.abs(b.y-boss.y)<20){b.dead=true;boss.hp--;boom(b.x,b.y,'#FFCA3A',3);}}
bullets=bullets.filter(b=>!b.dead);
// powerups
for(const p of powers){p.y+=90*dt;
if(Math.hypot(p.x-ship.x,p.y-ship.y)<26){p.dead=true;
if(p.k==='S')spread=8;else if(p.k==='R')rapid=8;else shield=Math.min(2,shield+1);
score+=5;}}
powers=powers.filter(p=>!p.dead&&p.y<H+20);
for(const s of stars){s.y+=s.v*dt;if(s.y>H){s.y=-5;s.x=rand(0,W);}}
for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)parts.splice(i,1);}
document.getElementById('score').textContent=score;
document.getElementById('wave').textContent='WAVE '+wave;
document.getElementById('lives').textContent='♥'.repeat(Math.max(0,lives))+(shield>0?'⛨':'');}
function aurora(){for(let i=0;i<3;i++){g.beginPath();
for(let x=0;x<=W;x+=16){const y=H*0.22+i*50+Math.sin(x*0.012+aurT*(0.5+i*0.2)+i*2)*26;
x?g.lineTo(x,y):g.moveTo(x,y);}
g.strokeStyle=['rgba(46,196,182,.28)','rgba(123,223,242,.22)','rgba(155,93,229,.20)'][i];
g.lineWidth=30-i*6;g.stroke();}}
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min((now-last)/1000,.05);last=now;
simStep(dt);
g.fillStyle='#0B1026';g.fillRect(0,0,W,H);
for(const s of stars){g.globalAlpha=s.s*0.8;g.fillStyle='#fff';g.fillRect(s.x,s.y,s.s*2,s.s*2);}
g.globalAlpha=1;
aurora();
for(const p of powers){g.fillStyle=p.k==='S'?'#FFCA3A':p.k==='R'?'#7BDFF2':'#2EC4B6';
g.beginPath();g.arc(p.x,p.y,11,0,TAU);g.fill();
g.fillStyle='#0B1026';g.font='bold 13px Audiowide';g.textAlign='center';g.fillText(p.k,p.x,p.y+4);}
for(const e of enemies){g.save();g.translate(e.x,e.y);
if(e.type==='drifter'){g.fillStyle='#7BDFF2';g.beginPath();g.moveTo(0,12);g.lineTo(-11,-8);g.lineTo(0,-3);g.lineTo(11,-8);g.closePath();g.fill();}
else if(e.type==='diver'){g.fillStyle='#FF8FA3';g.beginPath();g.moveTo(0,14);g.lineTo(-10,-10);g.lineTo(10,-10);g.closePath();g.fill();}
else{g.fillStyle='#9B5DE5';g.fillRect(-14,-12,28,24);g.fillStyle='#C77DFF';g.fillRect(-8,-6,16,12);}
g.restore();}
if(boss){g.save();g.translate(boss.x,boss.y);
g.fillStyle='#FF8FA3';g.beginPath();g.moveTo(0,26);g.lineTo(-38,-6);g.lineTo(-18,-18);g.lineTo(18,-18);g.lineTo(38,-6);g.closePath();g.fill();
g.fillStyle='#FFCA3A';g.beginPath();g.arc(0,-2,7,0,TAU);g.fill();g.restore();}
g.fillStyle='#B7F8DB';
for(const b of bullets)g.fillRect(b.x-2,b.y-7,4,10);
g.fillStyle='#FF8FA3';
for(const b of ebullets){g.beginPath();g.arc(b.x,b.y,4.5,0,TAU);g.fill();}
if(invuln<=0||Math.floor(aurT*12)%2===0){
g.save();g.translate(ship.x,ship.y);
g.fillStyle='#2EC4B6';g.shadowColor='#2EC4B6';g.shadowBlur=14;
g.beginPath();g.moveTo(0,-18);g.lineTo(-14,12);g.lineTo(0,5);g.lineTo(14,12);g.closePath();g.fill();
g.shadowBlur=0;g.fillStyle='#B7F8DB';g.beginPath();g.arc(0,-4,4,0,TAU);g.fill();
if(shield>0){g.strokeStyle='rgba(46,196,182,.7)';g.lineWidth=2.5;g.beginPath();g.arc(0,0,24,0,TAU);g.stroke();}
g.restore();}
for(const p of parts){g.globalAlpha=Math.min(1,p.life*3);g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,4,4);}
g.globalAlpha=1;}
requestAnimationFrame(frame);
reset();
function tog(){reset();playing=true;over=false;
document.getElementById('start').classList.add('hidden');document.getElementById('over').classList.add('hidden');}
document.getElementById('startBtn').addEventListener('click',tog);
document.getElementById('overBtn').addEventListener('click',tog);
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();targetX=e.clientX-r.left;targetY=e.clientY-r.top;});
cv.addEventListener('pointermove',e=>{if(e.buttons){const r=cv.getBoundingClientRect();targetX=e.clientX-r.left;targetY=e.clientY-r.top;}});
addEventListener('pointerup',()=>{targetX=null;targetY=null;});
window.__AS={G:()=>({score,wave,lives,playing,over,enemies:enemies.length,bullets:bullets.length,ebullets:ebullets.length,boss:boss?{hp:boss.hp,mhp:boss.mhp}:null,shield,spread:+spread.toFixed(1),rapid:+rapid.toFixed(1),powers:powers.length}),
start:tog,sim:(dt)=>simStep(dt),
moveTo:(x,y)=>{targetX=x;targetY=y;},
clearField:()=>{enemies=[];ebullets=[];},
forceWave:(w)=>{wave=w-1;enemies=[];boss=null;waveT=0;},
refs:()=>({ship,enemies,boss:()=>boss,powers}),
givePower:(k)=>{if(k==='S')spread=8;else if(k==='R')rapid=8;else shield=1;},
spawnPower:(k)=>{powers.push({x:ship.x,y:ship.y-100,k});},
killBoss:()=>{if(boss)boss.hp=1;}};
</script>
</body>
</html>
