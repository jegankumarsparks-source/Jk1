<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090a">
<title>JK App V37 · JK PRO Signal</title>
<style>
:root{--bg:#07090a;--bg2:#0d1113;--card:#11171a;--card2:#161e22;--line:#1f2a2f;--line2:#2a383e;--tx:#e8f0ec;--mut:#8a9a94;--dim:#5d6b66;--lime:#b6ff3b;--lime2:#8fd61a;--limeg:rgba(182,255,59,.14);--red:#ff5a5f;--redg:rgba(255,90,95,.13);--amb:#ffc23b;--ambg:rgba(255,194,59,.13);--cyan:#3be3ff;--cyang:rgba(59,227,255,.12);--vio:#b48bff;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}
body{padding-bottom:84px;min-height:100vh;background:radial-gradient(900px 400px at 50% -120px,rgba(182,255,59,.10),transparent 70%),var(--bg)}
a{color:var(--lime);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.hdr{position:sticky;top:0;z-index:30;background:rgba(7,9,10,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 14px 8px}
.hrow{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--lime),#5fae00);color:#081000;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:16px;letter-spacing:-.5px;box-shadow:0 0 18px rgba(182,255,59,.35)}
.ttl{font-weight:800;font-size:16px;letter-spacing:.2px}
.ttl small{color:var(--lime);font-weight:800;margin-left:4px}
.sub{color:var(--mut);font-size:11px}
.sp{flex:1}
.net{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
.dot.ok{background:var(--lime);box-shadow:0 0 8px var(--lime)}.dot.bad{background:var(--red)}.dot.wait{background:var(--amb)}
.papertag{display:inline-flex;align-items:center;gap:5px;margin-top:7px;font-size:10.5px;font-weight:800;letter-spacing:.8px;color:#081000;background:var(--lime);border-radius:999px;padding:3px 9px}
.papertag.o{background:transparent;color:var(--lime);border:1px solid var(--lime)}
.ticker{margin-top:7px;overflow:hidden;white-space:nowrap;font-size:11.5px;color:var(--mut);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.ticker .tickerIn{display:inline-block;white-space:nowrap;animation:tickmove 30s linear infinite;will-change:transform}
@keyframes tickmove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
body{overscroll-behavior-y:contain}
#ptrBar{position:fixed;top:0;left:0;right:0;z-index:9999;display:flex;justify-content:center;pointer-events:none;transform:translateY(-100%);transition:transform .18s ease-out}
#ptrBar>div{margin-top:6px;background:var(--card,#14161f);border:1px solid var(--line,#2a2e3d);border-radius:999px;padding:6px 14px;font-size:12px;color:var(--mut,#8a8fa3);box-shadow:0 4px 18px rgba(0,0,0,.45)}
#ptrBar.go>div{color:var(--acc,#7ee787);border-color:var(--acc,#7ee787)}
#ptrBar.spin>div{animation:ptrpulse 1s ease-in-out infinite}
@keyframes ptrpulse{50%{opacity:.55}}
.sbtn{background:var(--card,#14161f);border:1px solid var(--line,#2a2e3d);border-radius:10px;font-size:15px;padding:6px 9px;cursor:pointer}
.sovl{position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;padding:14px}
.sovl.on{display:flex}
.sovl .spn{width:100%;max-width:520px;margin-top:38px;background:var(--bg2,#0e1017);border:1px solid var(--line,#2a2e3d);border-radius:16px;padding:12px;max-height:76vh;display:flex;flex-direction:column}
.sovl .srow{display:flex;gap:8px}
.sovl input{flex:1;background:var(--card,#14161f);border:1px solid var(--line,#2a2e3d);border-radius:10px;color:inherit;padding:10px 12px;font-size:15px;outline:none}
.sovl .sres{overflow-y:auto;margin-top:8px}
.sritem{display:flex;align-items:center;gap:7px;padding:9px 6px;border-bottom:1px solid var(--line,#2a2e3d);cursor:pointer;font-size:13.5px}
.sritem:active{background:var(--card,#14161f)}
.sritem .sp{flex:1}
.aflt{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px 8px;padding:2px}.aflt::-webkit-scrollbar{display:none}
.afc{flex:0 0 auto;background:var(--card,#14161f);border:1px solid var(--line,#2a2e3d);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--mut,#8a8fa3);cursor:pointer}
.afc.on{color:var(--acc,#7ee787);border-color:var(--acc,#7ee787)}
.afc .n{opacity:.75}
.dwBg{position:fixed;inset:0;z-index:96;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .22s}
.dwBg.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(78vw,320px);z-index:97;background:var(--bg2,#0e1017);border-right:1px solid var(--line,#2a2e3d);transform:translateX(-102%);transition:transform .25s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column;box-shadow:8px 0 34px rgba(0,0,0,.5)}
.drawer.on{transform:translateX(0)}
.dwHead{padding:16px 16px 10px;border-bottom:1px solid var(--line,#2a2e3d)}
.dwList{overflow-y:auto;padding:8px}
.dwItem{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:12px;cursor:pointer;font-size:14.5px;position:relative}
.dwItem:active{background:var(--card,#14161f)}
.dwItem.on{background:var(--card,#14161f);color:var(--acc,#7ee787)}
.dwItem .di{width:24px;text-align:center}
.dwItem .bd{margin-left:auto}
.race{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line,#2a2e3d);font-size:13px}
.race:last-child{border-bottom:0}
.race .rk{width:22px;text-align:center}
.race .nm{flex:1}
.race .vl{font-weight:800}
.drow{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line,#2a2e3d);cursor:pointer}
.drow:last-child{border-bottom:0}
.drow:active{background:var(--card,#14161f)}
.drk{width:20px;text-align:center;font-weight:900;color:var(--mut,#8a8fa3);font-size:12px}
.dcol{flex:1;min-width:0}
.dcol.r{text-align:right;flex:0 0 auto}
.dnum{font-size:12px;font-weight:700}
.dsub{font-size:10.5px;color:var(--mut,#8a8fa3)}
.jksc{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--acc,#7ee787);border:1px solid var(--line,#2a2e3d);border-radius:99px;padding:2px 8px}
.bztag{font-size:9px;font-weight:800;color:#0d1117;background:var(--acc,#7ee787);border-radius:99px;padding:1px 6px;vertical-align:2px}
.sritem .jk{font-size:11px;color:var(--acc,#7ee787);border:1px solid var(--line,#2a2e3d);border-radius:99px;padding:1px 7px}
@media (prefers-reduced-motion:reduce){.ticker .tickerIn{animation:none}}
.ticker span{display:inline-block;padding-left:100%;animation:tick 60s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.wrap{padding:12px 12px 20px;max-width:720px;margin:0 auto}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card.hl{border-color:rgba(182,255,59,.55);box-shadow:0 0 0 1px rgba(182,255,59,.12),0 0 26px rgba(182,255,59,.08)}
.card.warn{border-color:rgba(255,194,59,.35)}
.card.bad{border-color:rgba(255,90,95,.35)}
.sec{display:flex;align-items:center;gap:8px;margin:16px 2px 8px;font-weight:800;font-size:13px;letter-spacing:.6px;text-transform:uppercase}
.sec .n{color:var(--lime);font-weight:900}
.sec .h{color:var(--mut);font-weight:500;text-transform:none;letter-spacing:0;font-size:11.5px;margin-left:auto;text-align:right}
.m{color:var(--mut)}.d{color:var(--dim)}.g{color:var(--lime)}.r{color:var(--red)}.a{color:var(--amb)}.c{color:var(--cyan)}
.b{font-weight:800}.sm{font-size:12px}.xs{font-size:11px}
.row{display:flex;align-items:center;gap:8px}.col{display:flex;flex-direction:column}
.wrapx{flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;border:1px solid var(--line2);color:var(--mut);white-space:nowrap}
.chip.jk{border-color:rgba(182,255,59,.5);color:var(--lime);background:var(--limeg)}
.chip.jk.lo{border-color:var(--line2);color:var(--mut);background:transparent}
.chip.bz{background:var(--lime);color:#081000;border-color:var(--lime);font-weight:900;letter-spacing:.4px}
.chip.pk{border-color:var(--cyan);color:var(--cyan);background:var(--cyang)}
.chip.nm{border-color:var(--amb);color:var(--amb);background:var(--ambg)}
.chip.rd{border-color:var(--red);color:var(--red);background:var(--redg)}
.chip.wt{border-color:var(--amb);color:var(--amb)}
.chip.vi{border-color:var(--vio);color:var(--vio)}
.btn{border:1px solid var(--line2);background:var(--card2);border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:700}
.btn.p{background:var(--lime);color:#081000;border-color:var(--lime)}
.btn.o{border-color:var(--lime);color:var(--lime);background:transparent}
.btn.rd{border-color:rgba(255,90,95,.6);color:var(--red);background:transparent}
.btn.s{padding:5px 9px;font-size:11.5px;border-radius:9px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.coin{display:flex;gap:10px;align-items:flex-start}
.ic{width:40px;height:40px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--lime);font-size:13px;overflow:hidden}
.ic img{width:100%;height:100%;object-fit:cover}
.cn{font-weight:800;font-size:15px}
.cn .s2{color:var(--mut);font-weight:500;font-size:12px;margin-left:4px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.kv>div{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.kv .k{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px}
.kv .v{font-weight:800;font-size:13px;margin-top:1px;word-break:break-word}
.kv4{grid-template-columns:repeat(4,1fr)}
.kv2{grid-template-columns:repeat(2,1fr)}
.why{margin-top:9px;font-size:12.3px;line-height:1.5;background:rgba(182,255,59,.06);border:1px solid rgba(182,255,59,.22);border-radius:10px;padding:8px 10px}
.why b{color:var(--lime)}
.why.w{background:var(--ambg);border-color:rgba(255,194,59,.3)}.why.w b{color:var(--amb)}
.why.x{background:var(--redg);border-color:rgba(255,90,95,.3)}.why.x b{color:var(--red)}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden;position:relative;margin-top:6px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--lime2),var(--lime));border-radius:9px}
.pbar{position:relative;height:10px;border-radius:9px;background:linear-gradient(90deg,rgba(255,90,95,.45),rgba(255,255,255,.08) 45%,rgba(182,255,59,.5));margin:14px 2px 18px}
.pbar .mk{position:absolute;top:-4px;width:4px;height:18px;border-radius:3px;background:#fff;box-shadow:0 0 8px #fff;transform:translateX(-2px)}
.pbar .en{position:absolute;top:-3px;width:2px;height:16px;background:var(--mut)}
.pbar .lb{position:absolute;top:14px;font-size:10px;color:var(--mut);transform:translateX(-50%);white-space:nowrap}
.pbar .lb.l{transform:none;left:0}.pbar .lb.rr{transform:none;right:0;left:auto}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:8px;font-size:11.5px}
.parts .pl{display:flex;justify-content:space-between;color:var(--mut)}
.parts .pl b{color:var(--tx)}
.mini{width:100%;height:46px;display:block;margin-top:8px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(9,12,13,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 0 calc(7px + env(safe-area-inset-bottom))}
.navin{display:flex;gap:6px;overflow-x:auto;padding:0 10px;scrollbar-width:none;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.navin::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid transparent;background:transparent;border-radius:12px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:62px;color:var(--mut);font-size:11px;font-weight:700;position:relative}
.tab .ti{font-size:17px;line-height:1.1}
.tab.on{background:var(--limeg);border-color:rgba(182,255,59,.45);color:var(--lime)}
.tab .bd{position:absolute;top:1px;right:6px;background:var(--red);color:#fff;border-radius:9px;font-size:9.5px;padding:0 5px;font-weight:900}
.page{display:none}.page.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.strip{background:linear-gradient(135deg,rgba(182,255,59,.16),rgba(182,255,59,.03));border:1px solid rgba(182,255,59,.45);border-radius:16px;padding:12px;margin-bottom:10px;position:relative;overflow:hidden}
.strip:after{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;background:radial-gradient(rgba(182,255,59,.25),transparent 70%)}
.strip.cz{background:linear-gradient(135deg,rgba(255,194,59,.16),rgba(255,194,59,.03));border-color:rgba(255,194,59,.5)}
.strip.cz:after{background:radial-gradient(rgba(255,194,59,.25),transparent 70%)}
.pulse.cz{background:var(--amb);box-shadow:0 0 0 0 rgba(255,194,59,.7)}
.chip.cz{border-color:var(--amb);color:var(--amb);background:var(--ambg);font-weight:900;letter-spacing:.4px}
.card.cz{border-color:rgba(255,194,59,.45);box-shadow:0 0 0 1px rgba(255,194,59,.10),0 0 26px rgba(255,194,59,.07)}
.pbar.cz{background:linear-gradient(90deg,rgba(255,90,95,.45),rgba(255,255,255,.08) 45%,rgba(255,194,59,.55))}
.sw.cz input:checked+span{background:var(--amb)}
.sw.cz input:checked+span:before{background:#1a1206}
.sec.cz .n{color:var(--amb)}
.strip.ln{background:linear-gradient(135deg,rgba(59,227,255,.16),rgba(59,227,255,.03));border-color:rgba(59,227,255,.5)}
.strip.ln:after{background:radial-gradient(rgba(59,227,255,.25),transparent 70%)}
.pulse.ln{background:var(--cyan);box-shadow:0 0 0 0 rgba(59,227,255,.7)}
.chip.ln{border-color:var(--cyan);color:var(--cyan);background:var(--cyang);font-weight:900;letter-spacing:.4px}
.card.ln{border-color:rgba(59,227,255,.45);box-shadow:0 0 0 1px rgba(59,227,255,.10),0 0 26px rgba(59,227,255,.07)}
.pbar.ln{background:linear-gradient(90deg,rgba(255,90,95,.45),rgba(255,255,255,.08) 45%,rgba(59,227,255,.55))}
.sw.ln input:checked+span{background:var(--cyan)}
.sw.ln input:checked+span:before{background:#041a1f}
.sec.ln .n{color:var(--cyan)}
.big{font-size:24px;font-weight:900;letter-spacing:-.5px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 rgba(182,255,59,.7);animation:pl 1.6s infinite;display:inline-block}
.pulse.off{background:var(--dim);animation:none}
@keyframes pl{70%{box-shadow:0 0 0 10px rgba(182,255,59,0)}100%{box-shadow:0 0 0 0 rgba(182,255,59,0)}}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat>div{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:11px;padding:7px 9px}
.stat .k{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.stat .v{font-weight:900;font-size:15px}
.empty{text-align:center;color:var(--mut);padding:14px 8px;font-size:12.5px}
.load{height:74px;border-radius:var(--r);margin-bottom:10px;background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.3s infinite;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}
.list .li{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-120px);z-index:90;background:#0f1a08;border:1px solid var(--lime);color:var(--tx);border-radius:14px;padding:10px 14px;max-width:92vw;width:420px;box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 24px rgba(182,255,59,.2);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);font-size:13px}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast.sell{border-color:var(--amb);background:#1a1406}
.toast.loss{border-color:var(--red);background:#1a0708}
.sheet{position:fixed;inset:0;z-index:80;display:none}
.sheet.on{display:block}
.sheet .bgd{position:absolute;inset:0;background:rgba(0,0,0,.66)}
.sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--bg2);border-top:1px solid var(--line2);border-radius:20px 20px 0 0;padding:6px 14px 30px;animation:up .28s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40%);opacity:.3}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line2);margin:6px auto 10px}
.x{position:sticky;top:0;float:right;background:var(--card2);border:1px solid var(--line2);border-radius:50%;width:32px;height:32px;font-size:16px}
canvas.ch{width:100%;height:190px;display:block;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;margin-top:10px}
.rl{display:flex;gap:7px;align-items:flex-start;font-size:12.3px;padding:4px 0}
.rl .ok{color:var(--lime)}.rl .no{color:var(--red)}
table.t{width:100%;border-collapse:collapse;font-size:12px}

.set{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .lbl{flex:1}.set .lbl div:first-child{font-weight:700}

.set input[type=number]{width:90px}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{opacity:0;width:0;height:0}

.fx{display:flex;justify-content:space-between;align-items:center;gap:8px}

.flash{animation:fl 1.2s}

.pnl-g{color:var(--lime)}.pnl-r{color:var(--red)}
.notice{font-size:11.5px;color:var(--mut);line-height:1.5}
.bigbtn{width:100%;padding:12px;border-radius:12px;font-weight:900;font-size:14px}

function smartCands(){ const now=Date.now(), win=CFG.smartWinM*60e3, out=[];
  for(const m in ST.wbuys){ const L=(ST.wbuys[m]||[]).filter(x=>now-x.ts<win && x.sol>=CFG.smartMinSol); if(!L.length) continue;
    const ws=[...new Set(L.map(x=>x.w))]; const sold=(ST.wsells[m]||[]); const live=ws.filter(w=>sold.indexOf(w)<0);
    out.push({m,ws,live,sol:L.reduce((s,x)=>s+x.sol,0),ts:Math.max(...L.map(x=>x.ts)),flip:live.length===0}); }
  return out.sort((a,b)=>b.live.length-a.live.length||b.ts-a.ts); }
function wName(a){ const W=ST.wallets.find(w=>w.a===a); return W&&W.name?W.name:short(a); }
async function smartTick(){ if(!CFG.smartAuto) return; const B=ST.smart; ST._smSkip=ST._smSkip||{}; const C=smartCands(); if(!C.length) return;
  const need=C.map(x=>x.m).filter(m=>!ST.coins[m]||!(ST.coins[m].price>0)||Date.now()-(ST.coins[m].ts||0)>60e3); if(need.length) await refreshTokens(need,'Smart money');
  for(const o of C){ const c=ST.coins[o.m]; const key=o.m+':'+o.ws.join(',');
    if(B.pos.some(x=>x.m===o.m)) continue;
    if(ST.lastBuyS[o.m]&&Date.now()-ST.lastBuyS[o.m]<CFG.cooldownH*3600e3) continue;
    const skip=why=>{ if(!ST._smSkip[key]){ ST._smSkip[key]=1; logA('info','SMART MONEY skipped '+(c?c.sym:short(o.m))+' - '+why,o.m); } };
    if(o.flip){ skip('the wallet already sold it (quick flip)'); continue; }
    if(o.live.length<CFG.smartMinW){ continue; }
    if(!c||!(c.price>0)){ skip('no live price yet'); continue; }
    if(!buyOk(c)){ skip('liquidity '+fmtUsd(c.liq,0)+' is under the '+fmtUsd(CFG.minLiq,0)+' minimum'); continue; }
    const rb=rugBlockWhy(c); if(rb.length){ skip('rug risk: '+rb.join(' · ')); continue; }
    if(B.pos.length>=CFG.maxPos){ skip('already holding '+CFG.maxPos+' coins'); break; }
    if(B.cash<CFG.stake-1e-9){ skip('smart paper cash '+money(B.cash)+' is under the $'+CFG.stake+' stake'); break; }
    const names=o.live.map(wName).join(', ');
    const P=newPos(c,ST.an[c.m],B,'SMART MONEY copied <b>'+esc(names)+'</b> ('+o.live.length+' tracked wallet'+(o.live.length>1?'s':'')+', '+o.sol.toFixed(2)+' SOL, '+ago(o.ts)+' ago). Exit: when that wallet sells, or +'+CFG.smartTp+'%, or -'+CFG.smartStop+'%.','smart');
    P.tp=P.entry*(1+CFG.smartTp/100); P.tp2=0; P.stop=P.entry*(1-CFG.smartStop/100); P.ws=o.live.slice(); P.tpDone=false;
    B.cash-=P.usd; B.pos.unshift(P); ST.lastBuyS[o.m]=Date.now();
    logA('buy','SMART MONEY BUY '+c.sym+' · $'+P.usd+' at '+fmtPrice(P.entry)+' · copied '+names,c.m);
    pushAlert('buy','SMART MONEY BOUGHT '+c.sym+' · $'+P.usd+' (paper)','Copied '+names+' · exit when they sell, +'+CFG.smartTp+'% ('+fmtPrice(P.tp)+') or -'+CFG.smartStop+'% ('+fmtPrice(P.stop)+')',c.m,true);
  }
  saveBooks(); if(ST.tab==='smart'||ST.tab==='home') renderLight(); }

function importOld(){ if(LS.get('imported',false)) return 0; let added=0; const have=new Set(ST.wallets.map(w=>w.a)); const found={};

  const walk=(v,key,src,depth)=>{ if(depth>7||v==null) return;
    if(Array.isArray(v)){ v.slice(0,3000).forEach(x=>walk(x,key,src,depth+1)); return; }
    if(typeof v==='object'){ const a=[v.addr,v.address,v.a,v.wallet,v.w].find(isAddr);
      if(a&&WK.test(key||'')){ const f=found[a]||(found[a]={a,src,name:'',wr:null}); if(typeof v.name==='string'&&!f.name&&v.name.indexOf('Deployer of')!==0) f.name=v.name.slice(0,40); if(v.wr!=null&&f.wr==null&&isFinite(v.wr)) f.wr=Number(v.wr); }
      for(const k in v){ if(isAddr(k)&&WK.test(key||'')&&v[k]&&typeof v[k]==='object'){ const f=found[k]||(found[k]={a:k,src,name:'',wr:null}); const o=v[k]; if(typeof o.name==='string'&&!f.name&&o.name.indexOf('Deployer of')!==0) f.name=o.name.slice(0,40); if(o.wr!=null&&f.wr==null&&isFinite(o.wr)) f.wr=Number(o.wr); }
        else if(AK.test(k)&&isAddr(v[k])&&WK.test(key||'')){ found[v[k]]=found[v[k]]||{a:v[k],src,name:'',wr:null}; }
        else walk(v[k],WK.test(k)?k:key,src,depth+1); } } };
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); let src=null;

      if(/^jkv_(hidden|keepZ)$/.test(k)&&v&&typeof v==='object'){ Object.assign(kk==='hidden'?ST.hidden:ST.keepZ,v); continue; }
      walk(v,kk,src,0); } }catch(e){}

function parseTx(tx,w){ if(!tx||!tx.meta) return []; const pre={}, post={}; const out=[];
  (tx.meta.preTokenBalances||[]).forEach(b=>{ if(b.owner===w) pre[b.mint]=num(b.uiTokenAmount&&b.uiTokenAmount.uiAmount); });
  (tx.meta.postTokenBalances||[]).forEach(b=>{ if(b.owner===w) post[b.mint]=num(b.uiTokenAmount&&b.uiTokenAmount.uiAmount); });
  const keys=(tx.transaction&&tx.transaction.message&&tx.transaction.message.accountKeys)||[]; const idx=keys.findIndex(k=>(k.pubkey||k)===w);
  const solD=idx>=0?(num(tx.meta.postBalances[idx])-num(tx.meta.preBalances[idx]))/1e9:0;
  // V14: also count wrapped SOL and USDC/USDT spent (many swaps pay with WSOL or stables, native SOL barely moves)
  let baseD=solD+(num(post[SOL_MINT])-num(pre[SOL_MINT])); const su=num(ST.solUsd)||150;
  ['EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v','Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB'].forEach(k=>{ baseD+=(num(post[k])-num(pre[k]))/su; });
  const mints=new Set(Object.keys(pre).concat(Object.keys(post)));
  mints.forEach(m=>{ if(BASE_MINTS.has(m)) return; const d=num(post[m])-num(pre[m]); if(Math.abs(d)<1e-9) return; out.push({m,d,sol:baseD<0?-baseD:0,side:d>0?'buy':'sell'}); });
  return out; }

      parseTx(tx,w).forEach(e=>res.push(Object.assign(e,{sig:s.signature,ts:(s.blockTime||tx.blockTime||0)*1000,w}))); }catch(e){} await sleep(120); }
  return {sigs,res}; }

function importData(f){ if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const o=JSON.parse(r.result); let n=0; for(const k in o) if(/^jk7_/.test(k)&&!/^jk7_tg/.test(k)){ localStorage.setItem(k,o[k]); n++; } toast('Restored '+n+' items - reloading'); setTimeout(()=>location.reload(),900); }catch(e){ toast('Not a JK App backup file','loss'); } }; r.readAsText(f); }

function drawChart(a){ const cv=document.getElementById('bigch'); if(!cv||!a||!a.ohlc||!a.ohlc.length) return; const dpr=window.devicePixelRatio||1; const W=cv.clientWidth, H=cv.clientHeight; cv.width=W*dpr; cv.height=H*dpr; const g=cv.getContext('2d'); g.scale(dpr,dpr);
  const o=a.ohlc, n=o.length; const vh=34; const mx=Math.max(...o.map(x=>x[1])), mn=Math.min(...o.map(x=>x[2]).filter(x=>x>0)); const rg=(mx-mn)||mx||1; const y=v=>6+(1-(v-mn)/rg)*(H-vh-14); const bw=(W-8)/n; const vmx=Math.max(...o.map(x=>x[4]))||1;
  g.strokeStyle='rgba(255,255,255,.05)'; for(let i=1;i<4;i++){ g.beginPath(); g.moveTo(0,i*(H-vh)/4); g.lineTo(W,i*(H-vh)/4); g.stroke(); }
  o.forEach((k,i)=>{ const x=4+i*bw+bw/2, up=k[3]>=k[0]; g.strokeStyle=g.fillStyle=up?'#b6ff3b':'#ff5a5f'; g.beginPath(); g.moveTo(x,y(k[1])); g.lineTo(x,y(k[2])); g.stroke(); const t=y(Math.max(k[0],k[3])), b=y(Math.min(k[0],k[3])); g.fillRect(x-bw*0.35,t,bw*0.7,Math.max(1,b-t));
    g.globalAlpha=.35; const vhh=k[4]/vmx*(vh-4); g.fillRect(x-bw*0.35,H-vhh-2,bw*0.7,vhh); g.globalAlpha=1; });
  const cl=o.map(x=>x[3]); [[9,'#b6ff3b'],[21,'#3be3ff']].forEach(([p,col])=>{ if(n<p) return; const e=ema(cl,p); g.strokeStyle=col; g.globalAlpha=.8; g.lineWidth=1.3; g.beginPath(); e.forEach((v,i)=>{ const x=4+i*bw+bw/2; i?g.lineTo(x,y(v)):g.moveTo(x,y(v)); }); g.stroke(); g.globalAlpha=1; });
  g.fillStyle='#8a9a94'; g.font='10px sans-serif'; g.fillText(fmtPrice(mx),4,12); g.fillText(fmtPrice(mn),4,H-vh-4); }

const V23=Object.assign({mainName:'Main bot',digest:false,bots:[],digestBoard:''},LS.get('v23',{}));

function v23Controls(){return '<div class="'+(TG.rejected?'v23-rejected':'v23-connected')+'">'+(TG.rejected?'Token rejected by Telegram - replace it to reconnect':TG.token?'Connected - token saved permanently on this phone':'Connect a bot once - token stays saved on this phone')+'</div>'+

 '<div class="v23-bot"><b>⏸ Held posts review</b><div class="xs m">An uncertain delivery may have already posted; check Telegram before retrying.</div>'+(TGQ.filter(x=>x.held||x.uncertain).length?TGQ.map((x,i)=>x.held||x.uncertain?'<div class="xs" style="padding:8px;border-top:1px solid #555">'+v23Esc(x.meta&&x.meta.sym||x.meta&&x.meta.type||'Post')+' · '+v23Esc(x.uncertain?'Delivery unknown':'Held')+' <button class="btn s" onclick="v23Queue('+i+',true)">Retry</button> <button class="btn s rd" onclick="v23Queue('+i+',false)">Drop</button></div>':'').join(''):'<div class="xs g">No held posts</div>')+'</div>';

function v23Queue(i,retry){const x=TGQ[i];if(!x)return;if(retry){if(x.uncertain&&!confirm('Check Telegram first: this post may already have arrived. Retry anyway?'))return;delete x.held;delete x.uncertain;delete x.sending;delete x.nextAt;x.replyN=0;x.replyWait=0;}else TGQ.splice(i,1);tgQSave();renderPage('tg');if(retry)tgPump();}
function v23BotsCard(){return '<div class="sec">🤖 My signal bots</div><div class="card"><div class="xs m">Extra bots mirror signal posts only, while this app is open. Each bot keeps its own chats and ON/OFF switch.</div><div class="v23-bot"><b>Main bot</b> <input class="in" maxlength="48" aria-label="Main bot name" value="'+v23Esc(V23.mainName)+'" onchange="V23.mainName=this.value.trim()||\'Main bot\';v23Save()"></div>'+
 V23.bots.map((b,i)=>'<div class="v23-bot"><div class="fx"><b>'+v23Esc(b.name||b.username||'Extra bot')+'</b><label class="sw"><input type="checkbox" '+(b.on?'checked':'')+' onchange="V23.bots['+i+'].on=this.checked;v23Save()"><span></span></label></div><div class="xs g">'+v23Esc(b.username?'@'+b.username:'Connected')+' · '+b.chats.length+' chat(s)</div><input class="in" aria-label="Bot name" maxlength="48" value="'+v23Esc(b.name)+'" onchange="V23.bots['+i+'].name=this.value;v23Save()"><div class="btns"><button class="btn s" onclick="v23Find('+i+')">Find chats</button><button class="btn s" onclick="v23Manual('+i+')">Add chat ID</button><button class="btn s rd" onclick="v23Remove('+i+')">Remove bot</button></div><div id="v23find'+i+'"></div>'+b.chats.map((c,j)=>'<div class="xs" style="padding:6px">'+v23Esc(c.name||c.id)+' <button class="btn s" onclick="v23Test('+i+','+j+')">Test</button> <button class="btn s rd" onclick="v23RemoveChat('+i+','+j+')">Remove</button></div>').join('')+'</div>').join('')+

}
async function v23AddBot(){const t=($('#v23Token')?.value||'').trim();if(!/^\d{5,}:[A-Za-z0-9_-]{20,}$/.test(t)){toast('Invalid token format','loss');return;}if(t===TG.token||V23.bots.some(b=>b.token===t)){toast('Bot already added','loss');return;}const j=await tgApi('getMe',{},t);if(!j.ok){toast('Telegram rejected bot: '+(j.description||'Check token'),'loss');return;}V23.bots.push({token:t,username:j.result.username||'',name:j.result.first_name||j.result.username||'Extra bot',on:false,chats:[]});v23Save();renderPage('tg');}
async function v23Find(i){const b=V23.bots[i];if(!b)return;const j=await tgApi('getUpdates',{limit:100,timeout:0},b.token);if(!j.ok){toast(j.description||'Cannot find chats','loss');return;}const list=new Map();for(const u of j.result||[]){const c=u.message?.chat||u.channel_post?.chat||u.my_chat_member?.chat;if(c)list.set(String(c.id),{id:String(c.id),name:c.title||[c.first_name,c.last_name].filter(Boolean).join(' ')||String(c.id)});}const el=$('#v23find'+i);if(el)el.innerHTML=[...list.values()].map(c=>'<button class="btn s" onclick="v23AddChat('+i+',\''+c.id+'\',this.textContent)">'+v23Esc(c.name)+' · '+c.id+'</button>').join('')||'<span class="xs m">No chats yet. Message the bot or add it to a group, then try again.</span>';}
function v23AddChat(i,id,name){const b=V23.bots[i];if(!b||!(/^-?\d{3,}$/.test(String(id))))return;if(!b.chats.some(c=>c.id===String(id)))b.chats.push({id:String(id),name:String(name||id)});v23Save();renderPage('tg');}
function v23Manual(i){const id=prompt('Telegram chat ID (numeric)');if(id!==null){if(!/^-?\d{3,}$/.test(id.trim())){toast('Invalid chat ID','loss');return;}v23AddChat(i,id.trim(),id.trim());}}
async function v23Test(i,j){const b=V23.bots[i],c=b?.chats[j];if(!c)return;const r=await tgApi('sendMessage',{chat_id:c.id,text:'✅ JK PRO Signal bot test · DYOR · NFA'},b.token);toast(r.ok?'Test sent':r.description||'Test failed',r.ok?'g':'loss');}
function v23Remove(i){if(!confirm('Remove this extra bot from this phone?'))return;V23.bots.splice(i,1);v23Save();renderPage('tg');}

function recordWinningCreator(p){
  const c=ST.coins[p.m]; const dev=c&&c.dev;
  if(!isAddr(dev)||BASE_MINTS.has(dev)) {logA('info','WALLET SIGNAL: '+p.sym+' reached 2x but creator is unavailable; no wallet saved',p.m);return false;}
  const W=ST.winningCreators[dev]||(ST.winningCreators[dev]={a:dev,added:Date.now(),coins:[]});
  if(!W.coins.some(x=>x.m===p.m)) W.coins.unshift({m:p.m,sym:p.sym,at:Date.now(),bot:p.src});
  if(p.entry>0&&num(p.peak)>=p.entry*3)W.premium=true;
  LS.set('winningCreators',ST.winningCreators); logA('info','WALLET SIGNAL saved creator '+short(dev)+' from '+p.sym+' at 2x',p.m);
  if(ST.tab==='winners'||ST.tab==='walletsignal')renderPage(ST.tab);return true;
}
function mintByCreator(tx,w){
  if(!tx||!tx.transaction||!tx.transaction.message||tx.meta&&tx.meta.err)return [];
  const keys=tx.transaction.message.accountKeys||[];
  if(!keys.some(k=>(k.pubkey||k)===w&&(typeof k==='string'||k.signer===true)))return [];
  const ins=[...(tx.transaction.message.instructions||[]),...((tx.meta&&tx.meta.innerInstructions)||[]).flatMap(x=>x.instructions||[])];
  return [...new Set(ins.filter(i=>['spl-token','spl-token-2022'].includes(i.program)&&['initializeMint','initializeMint2'].includes(i.parsed&&i.parsed.type)).map(i=>i.parsed.info&&i.parsed.info.mint).filter(isAddr))];
}
async function creatorPoll(){
  if(ST._creatorBusy||!CFG.walletSignalAuto)return;const wallets=Object.keys(ST.winningCreators);if(!wallets.length){ST.creatorStatus='No winning creators yet';return;}
  ST._creatorBusy=true;const batch=wallets.length<=4?wallets:wallets.slice(ST._creatorIndex||0,(ST._creatorIndex||0)+4);
  ST._creatorIndex=wallets.length<=4?0:((ST._creatorIndex||0)+4)%wallets.length;
  let checked=0, errors=0;
  try{for(const w of batch){try{
    const sigs=await rpc('getSignaturesForAddress',[w,{limit:20}]);const seen=ST.creatorSeen[w];
    // First scan establishes a baseline; never post a historical mint as a new launch.
    if(!seen){if(sigs[0]){ST.creatorSeen[w]=sigs[0].signature;LS.set('creatorSeen',ST.creatorSeen);}checked++;continue;}
    const fresh=[];for(const z of sigs){if(z.signature===seen)break;if(!z.err&&(z.blockTime||0)*1000>=ST.winningCreators[w].added)fresh.push(z);}
    if(sigs[0]){ST.creatorSeen[w]=sigs[0].signature;LS.set('creatorSeen',ST.creatorSeen);}
    for(const z of fresh.reverse().slice(-12)){
      const tx=await rpc('getTransaction',[z.signature,{encoding:'jsonParsed',maxSupportedTransactionVersion:0,commitment:'confirmed'}]);
      for(const m of mintByCreator(tx,w)){if(ST.creatorLaunches[m]||!ST.winningCreators[w])continue;
        ST.creatorLaunches[m]={m,w,ts:(z.blockTime||tx.blockTime||0)*1000,sig:z.signature,status:'waiting for market data'};
        LS.set('creatorLaunches',ST.creatorLaunches);
      }
    }checked++;
  }catch(e){errors++;}await sleep(150);}
  ST.creatorStatus=checked+' creator'+(checked===1?'':'s')+' checked'+(errors?' · '+errors+' RPC error'+(errors===1?'':'s'):'')+' · '+ist(Date.now())+' IST';
  await walletSignalTick();
  }finally{ST._creatorBusy=false;if(ST.tab==='winners'||ST.tab==='walletsignal')renderPage(ST.tab);}
}

let WS_POST_Q=LS.get('wsPostQ',[])||[], WS_POST_BUSY=false;
for(const it of WS_POST_Q)if(it.sending){it.held=true;it.error='Delivery uncertain after reload - check Bot 2 chat';delete it.sending;}LS.set('wsPostQ',WS_POST_Q);
function walletSignalPost(P,c){
 const text=tgBuyText(P,c).replace('JK PRO SIGNAL  /  NEW CALL','JK PRO SIGNAL  /  '+(P.premium?'✨ PREMIUM COIN · PREMIUM WALLET ✨':'WALLET SIGNAL'));
 const media=tgGif(P.m,1,P.name||P.sym);
 const item={m:P.m,text,media,premium:!!P.premium,chat:String(TGP.chat||''),ts:Date.now(),n:0};
 // Only the explicit saved Bot 2 destination is eligible; no fallback to the main bot.
 if(!TGP.token||!TGP.chat||!TGP.on||TGP.chat===String(TG.chat)){item.held=true;item.error='Bot 2 not configured, off, or shares the main chat';}
 if(!media){item.held=true;item.error='GIF unavailable';}
 WS_POST_Q.push(item);LS.set('wsPostQ',WS_POST_Q);wsPostPump();
}
async function wsPostPump(){if(WS_POST_BUSY)return;WS_POST_BUSY=true;
 try{for(const it of WS_POST_Q){
   if(it.held||it.sent||it.sending||it.nextAt&&Date.now()<it.nextAt)continue;
   if(!TGP.token||!TGP.on||String(TGP.chat)!==it.chat||!it.chat||it.chat===String(TG.chat)){it.held=true;it.error='Bot 2 destination changed or unavailable';LS.set('wsPostQ',WS_POST_Q);continue;}
   if(it.text.replace(/<[^>]*>/g,'').length>1024){it.held=true;it.error='GIF caption too long';LS.set('wsPostQ',WS_POST_Q);continue;}
   it.sending=true;LS.set('wsPostQ',WS_POST_Q);
   const j=await tgApi('sendAnimation',{chat_id:it.chat,animation:it.media,caption:it.text,parse_mode:'HTML'},TGP.token);
   delete it.sending;if(j.ok){it.sent=Date.now();TGP.lastOk=Date.now();tgpSave();}
   else if(j.net){it.held=true;it.error='Delivery uncertain - check Bot 2 chat before retry';}
   else if(j.error_code===429){it.nextAt=Date.now()+((j.parameters&&j.parameters.retry_after)||10)*1000;it.error='Rate limited';}
   else if(j.error_code>=500&&it.n++<3){it.nextAt=Date.now()+Math.min(60000,2000*2**it.n);it.error='Bot 2 server error';}
   else {it.held=true;it.error=j.description||'Bot 2 send failed';}
   LS.set('wsPostQ',WS_POST_Q);if(it.nextAt)break;
 }
 WS_POST_Q=WS_POST_Q.filter(it=>!it.sent||Date.now()-it.sent<24*3600e3).slice(-500);LS.set('wsPostQ',WS_POST_Q);
 }finally{WS_POST_BUSY=false;}
}
setInterval(wsPostPump,15000);setInterval(walletSignalTick,30000);
function manageWalletSignal(B){for(const p of B.pos.slice()){
 if(!(p.last>0))continue;const c=ST.coins[p.m],px=p.last;
 let why='',kind='';if(px>=p.entry*1.3){why='Full exit at +30%';kind='TAKE PROFIT';}
 else if(px<=p.entry*0.7){why='Full exit at -30%';kind='STOP';}
 if(kind){const r=closePos(B,p,px,why,kind);logA('sell','WALLET SIGNAL '+kind+' '+p.sym+' · '+sgnMoney(r.pnl),p.m);pushAlert(kind==='STOP'?'loss':'sell','WALLET SIGNAL '+kind+' '+p.sym,why+' · '+sgnMoney(r.pnl),p.m,true);}
}}
function resetWalletSignal(){if(!confirm('Reset only the Wallet Signal $130 paper wallet? Winning creators stay saved.'))return;
 ST.walletSignal={cash:130,start:130,pos:[],closed:[],born:Date.now()};ST.lastBuyWS={};saveBooks();renderAll();}
function renderWalletSignal(){const n=Object.keys(ST.winningCreators).length;
 $('#pg-walletsignal').innerHTML=(ST.walletSignal.pos.some(p=>p.premium)?'<div class="sec">✨ PREMIUM WALLET NEW COINS <span class="n">'+ST.walletSignal.pos.filter(p=>p.premium).length+'</span></div>'+ST.walletSignal.pos.filter(p=>p.premium).map(p=>'<div class="card premium-coin"><b>✨ PREMIUM COIN · '+esc(p.sym)+'</b><div class="xs m">Creator '+esc(short(p.creator))+' reached observed 3x+ on an earlier original-bot coin.</div>'+milestoneTags(p.m)+'<div class="btns">'+links(p.m)+'</div></div>').join(''):'')+botPage(BOTS[4],p=>posCardLaunch(p).replaceAll('LAUNCH AUTO','WALLET SIGNAL').replace('class="card ln"','class="card ln'+(p.premium?' premium-coin':'')+'"').replace('🆕 NEW LAUNCH BUY',p.premium?'✨ PREMIUM COIN · PREMIUM WALLET':'🆕 NEW LAUNCH BUY').replaceAll('LAUNCH AUTO · PAPER','WALLET SIGNAL · PAPER').replace("closeNow('launch'","closeNow('walletsignal'"),n?'Watching '+n+' winning creator'+(n===1?'':'s')+'. No verified, priced new mint passed the filters yet.':'No winning creators yet. A coin from one of the original four bots must reach and book a 2x take-profit before its verified creator is saved.','resetWalletSignal')+
 '<div class="card"><b>Creator watch</b><div class="xs m">'+esc(ST.creatorStatus)+' · '+n+' saved. Bot 2 posts queued: '+WS_POST_Q.filter(x=>!x.sent).length+' (held: '+WS_POST_Q.filter(x=>x.held).length+'). '+WS_POST_Q.filter(x=>x.held).slice(-2).map(x=>esc(x.error)).join(' · ')+'. This browser checks Solana transactions while the page is open. RPC history limits, outages and missing Jupiter creator/price data can delay or miss launches. No backfill posts on first watch. Bot 2 uses its saved chat and GIF only; held posts need review in this tab.</div><div class="btns"><button class="btn s" onclick="creatorPoll()">Refresh creators</button><button class="btn s" onclick="go(\'winners\')">Winning creators</button></div></div>';}
function renderWinningCreators(){const W=Object.values(ST.winningCreators).sort((a,b)=>b.added-a.added);
 $('#pg-winners').innerHTML=botBar('winners')+'<div class="hero sm"><div class="hk">🏅 WINNING CREATORS</div><div class="hs">Creator wallets from original four bots after a booked 2x take-profit</div></div><div class="card"><b>'+W.length+' tracked</b><div class="xs m">'+esc(ST.creatorStatus)+'. Scan works only with this page open and internet; some mint transactions or market data may not be available.</div><button class="btn s" onclick="creatorPoll()">Refresh creators</button></div>'+
 (W.length?W.map(w=>'<div class="card '+(w.premium?'premium-wallet':'')+'"><div class="fx"><b class="mono">'+esc(w.a)+'</b>'+(w.premium?'<span class="mult-tag premium">✨ PREMIUM WALLET · 3x+</span>':'<span class="mult-tag">2x WINNING CREATOR</span>')+'<button class="btn s" onclick="copy(\''+w.a+'\')">Copy</button></div><div class="xs m">Saved '+istDT(w.added)+' · '+w.coins.length+' winning coin'+(w.coins.length===1?'':'s')+'</div>'+w.coins.slice(0,10).map(x=>'<div class="list li">'+esc(x.sym)+' · '+esc(x.bot)+' · '+istDT(x.at)+milestoneTags(x.m)+'</div>').join('')+'</div>').join(''):'<div class="card empty">No winning creators yet. The app will save a real creator wallet once an original bot books a 2x take-profit. No sample wallets are shown.</div>')+
 '<div class="sec">Detected launches</div>'+(Object.values(ST.creatorLaunches).length?Object.values(ST.creatorLaunches).slice(-30).reverse().map(x=>'<div class="card xs">'+esc(short(x.m))+' · '+esc(short(x.w))+' · '+esc(x.status)+'</div>').join(''):'<div class="card empty">No new mint transaction detected from a winning creator yet.</div>');}
/* Only sampled post-call highs and observed paper ticks count. Do not use a prediction or generic 24h change. */
function milestoneX(m){let best=0;
 for(const c of TG_CALLS)if(c.m===m&&c.entry>0&&c.high>=c.entry)best=Math.max(best,c.high/c.entry);
 for(const B of [ST.paper,ST.closest,ST.launch,ST.smart,ST.walletSignal]){
   for(const p of B.pos)if(p.m===m&&p.entry>0)best=Math.max(best,num(p.peak)/p.entry,num(p.last)/p.entry);
   for(const p of B.closed)if(p.m===m&&p.entry>0){for(const f of p.fills||[])if(f.px>0)best=Math.max(best,f.px/p.entry);}
 }return best;
}
function milestoneTags(m){const x=milestoneX(m);if(x<2)return '';
 return '<span class="mult-tag">2x OBSERVED</span>'+(x>=3?'<span class="mult-tag three">3x OBSERVED</span><span class="mult-tag premium">✨ PREMIUM SIGNAL</span>':'')+(x>=5?'<span class="mult-tag five">5x OBSERVED</span>':'');
}
function renderPremiumSignals(){const ids=new Set(TG_CALLS.map(c=>c.m));for(const B of [ST.paper,ST.closest,ST.launch,ST.smart,ST.walletSignal])for(const p of B.pos.concat(B.closed))ids.add(p.m);
 const rows=[...ids].map(m=>({m,x:milestoneX(m)})).filter(o=>o.x>=3).sort((a,b)=>b.x-a.x);
 $('#pg-premium').innerHTML='<div class="hero sm premium-card"><div class="hk">✨ PREMIUM SIGNALS</div><div class="hs">Observed 3x+ after a recorded signal · 2x, 3x and 5x tags come from sampled prices, not forecasts.</div></div>'+
 (rows.length?rows.map(o=>{const c=ST.coins[o.m],name=c&&c.sym||TG_CALLS.find(t=>t.m===o.m)?.sym||short(o.m);
 return '<div class="card premium-card"><div class="fx"><b>'+esc(name)+'</b><b>'+o.x.toFixed(1)+'x observed</b></div>'+milestoneTags(o.m)+'<div class="xs mono m">'+esc(o.m)+'</div><div class="btns">'+links(o.m)+'</div></div>';}).join(''):
 '<div class="card empty">No recorded signal has reached 3x in the price samples saved on this device yet. No premium tag is shown without an observed multiple.</div>');
}
boot();
