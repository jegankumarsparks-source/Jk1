/* ============================================================
   PIPELINE ORCHESTRATOR + BOOT
   Discovery -> Validation -> Wallet research -> Clusters ->
   Validation -> v4 open entry (no screens) -> Paper ledger -> Monitor
   ============================================================ */
const BOOT={
  async init(){
    await DB.init();
    await DB.loadAll();
    RENDER.all();
    // signal + target banners
    S.on('signal',g=>{ BOOT.showSigBanner(g); const r=AUTO.onSignal(g); if(r.ok&&r.pend)U.toast('🤖 pending dip-limit: '+(g.symbol||U.short(g.mint))+' limit $'+r.pend.limitPrice); });
    S.on('target',()=>{ const b=document.getElementById('targetBanner');
      b.textContent='🏁 TARGET_REACHED — verified paper equity ≥ $'+S.settings.targetEquity+'. Entries frozen. (Simulation result, not profit.)';
      b.classList.add('show'); });
    if(S.cycleFrozen){ const b=document.getElementById('targetBanner');
      b.textContent='🏁 TARGET_REACHED — verified paper equity ≥ $'+S.settings.targetEquity+'. Entries frozen. (Simulation result, not profit.)';
      b.classList.add('show'); }
    S.on('data',()=>{ clearTimeout(BOOT._rt); BOOT._rt=setTimeout(()=>{ RENDER.all(); DB.saveAll(); },400); });
    S.on('scanState',()=>RENDER.scanPill());
    // suspension/resumption: revalidate after resume, never fabricate activity
    document.addEventListener('visibilitychange',()=>{
      if(!document.hidden&&S.scanTimer){ console.log('resumed — revalidating'); BOOT.scanNow(); }
    });
    if(S.settings.autoStartOnLoad&&!S.scanTimer)BOOT.start();
    console.log(BUILD_MARKER,'init ok, storage:',DB.mode);
  },
  showSigBanner(g){ const b=document.getElementById('sigBanner');
    b.innerHTML='⚡ NEW PAPER SIGNAL: '+U.esc(g.symbol||U.short(g.mint))+' — score '+g.score+'/100 · PAPER ONLY · tap to view'
      +'<span style="position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;font-weight:900;padding:2px 8px" onclick="event.stopPropagation();document.getElementById(\'sigBanner\').classList.remove(\'show\')">✕</span>';
    b.classList.add('show');
    b.onclick=()=>{ b.classList.remove('show'); S.ui.page='signals'; RENDER.all();
      setTimeout(()=>{ const el=document.getElementById('sig-'+g.id);
        if(el){ el.classList.add('flash'); el.scrollIntoView({behavior:'smooth',block:'center'}); } },200); };
  },
  start(){
    if(S.scanTimer)return;
    S.scanTimer=true;
    const tick=async()=>{ if(!S.scanTimer)return;
      try{ await BOOT.scanNow(); }catch(e){ console.log('cycle error',e); }
      if(S.scanTimer)S.scanTimerId=setTimeout(tick,Math.max(5,S.settings.pollIntervalSec)*1000); };
    tick();
    S.priceTimer=setInterval(()=>{ if(S.settings.autoRefreshPrices)MONITOR.run().then(()=>RENDER.all()); },60000);
    RENDER.scanPill(); U.toast('scanner started — auto-scan every ~'+Math.max(5,S.settings.pollIntervalSec)+'s until STOP (tab-open only)');
  },
  stop(){
    S.scanTimer=false; clearTimeout(S.scanTimerId); clearInterval(S.priceTimer); S.priceTimer=null;
    RENDER.scanPill(); U.toast('scanner stopped');
  },
  async scanNow(){
    if(S.diag.scanning)return;
    const r=await DISCOVERY.runCycle();
    if(r&&r.errors&&r.errors.length)console.log('cycle errors:',r.errors);
    // light-touch auto analysis for fresh validated candidates (bounded)
    let analyzed=0;
    for(const c of S.candidates.values()){
      if(analyzed>=S.settings.maxRugcheckPerCycle)break;
      if(c.state==='DISCOVERED'||c.state==='DATA_INCOMPLETE'&&c.market){
        try{ await BOOT.analyzeOne(c.mint,true); analyzed++; }catch(e){ console.log('analyze err',e); }
      }
    }
    await MONITOR.run();
    try{ await AUTO.runCycle(); }catch(e){ console.log('auto cycle',e); }
    RENDER.all(); await DB.saveAll();
  },
  /* full per-candidate pipeline */
  async analyzeOne(mint,quiet){
    const c=S.candidates.get(mint); if(!c)return;
    // wallet research source: rugcheck report
    if(!c.rugcheck||(U.now()-c.rugcheck.fetchedAt)>10*60*1000){
      try{ c.rugcheck=await DEX.rugcheckReport(mint); c.fieldMeta.rugcheck={source:'rugcheck',observedAt:c.rugcheck.fetchedAt,status:'LIVE'}; }
      catch(e){ c.fieldMeta.rugcheck={source:'rugcheck',observedAt:U.now(),status:'ERROR'}; c.rugcheckError=String(e.message||e).slice(0,120); }
    }
    if(c.rugcheck){
      WALLETS.harvestFromToken(c);
      // research top few wallets (bounded, non-insider first)
      const recs=(c.rugcheck.topHolders||[]).filter(h=>h.address&&!h.insider).slice(0,S.settings.walletResearchPerCandidate||5);
      for(const h of recs){ try{ await WALLETS.researchWallet(h.address); }catch(e){} }
      c.walletEvidence=(c.rugcheck.topHolders||[]).filter(h=>h.address).map(h=>{
        const w=S.wallets.get(h.address);
        return {address:h.address,pct:h.pct,insider:h.insider,state:w?w.state:'UNVERIFIED',
          qualified:w?WALLETS.isQualified(w):false,observedAt:U.now()};
      });
    }
    CLUSTERS.recompute();
    c.risk=RISK.analyze(c);
    const st=QUAL.evaluate(c);
    if(!quiet){ RENDER.all(); U.toast('analysis: '+st); }
    return st;
  },
  async enterPaper(mint){
    const c=S.candidates.get(mint); if(!c)return;
    if(c.state!=='PAPER_SIGNAL'){ U.toast('not in PAPER_SIGNAL state'); return; }
    // re-validate freshness right before entry — stale price never executable
    try{ await DISCOVERY.refreshCandidate(mint); }catch(e){ U.toast('price refresh failed — entry blocked: '+e.message); return; }
    const r=PORT.enter(c);
    U.toast(r.ok?('paper entry opened: '+U.fmt$(r.pos.entrySizeUsd)):('entry blocked: '+r.reason));
    RENDER.all(); DB.saveAll();
  },
  async manualExit(posId){
    const p=S.positions.get(posId); if(!p)return;
    let price=null;
    try{ const pr=await DISCOVERY.refreshPricesFor([p.mint]); if(pr[p.mint]&&pr[p.mint].ok)price=pr[p.mint].priceUsd; }catch(e){}
    const r=PORT.exit(p,'manual exit',price);
    U.toast(r.ok?('exited: '+U.fmt$(r.net)+' (PnL '+U.fmt$(r.pnl)+')'):('exit blocked: '+r.reason));
    RENDER.all(); DB.saveAll();
  },
  async researchWallet(addr){ U.toast('researching wallet…');
    await WALLETS.researchWallet(addr); RENDER.all(); DB.saveAll(); },
  setNum(k,v){ const n=parseFloat(v); if(isNaN(n))return U.toast('invalid number'); S.settings[k]=n; DB.saveAll(); },
  setBool(k,v){ S.settings[k]=!!v; DB.saveAll(); },
  async autoCheck(){ U.toast('🤖 checking open auto positions on real prices…'); await AUTO.runCycle(); RENDER.all(); DB.saveAll(); },
  resetAuto(){ if(!confirm('Reset the AUTO paper book? Positions/history wiped, virtual $'+S.settings.startCapital+' bank refilled. Manual portfolio untouched.'))return; AUTO.positions.clear(); AUTO.pending.clear(); AUTO.history=[]; AUTO.reset(); DB.saveAll(); RENDER.all(); U.toast('auto book reset'); },
  setWeight(k,v){ const n=parseFloat(v); if(isNaN(n))return; S.settings.weights[k]=n;
    const sum=Object.values(S.settings.weights).reduce((a,b)=>a+(+b||0),0);
    const el=document.getElementById('wsum'); if(el)el.textContent='total: '+sum+(sum===100?' ✓':' ✗ must be 100');
    if(sum===100)DB.saveAll(); }
};
window.addEventListener('load',()=>BOOT.init());

/* ============================================================
   R. AutoTradeEngine — separate $200 AUTO paper book.
   entry-open-v4 rules: NO entry screens (owner override) - every
   validated signal places a $10 dip-limit (-20% limit, 60 min
   expiry, fills only on a later real observation <= limit), max 4
   filled slots, exits: 1.5x sell / -25% price stop / liquidity -30%
   defensive exit / rug (>=90% liq drop) = full loss. No time limit.
   PAPER ONLY. Runs only while tab is open.
   ============================================================ */
/* entry-open-v4 rule parameters for the LOCAL auto book (no entry screens per owner typed override 2026-10-13; exit params agent-set per owner voice note) */
const AUTO_V4={stakeUsd:10,maxSlots:4,tpMultiple:1.5,stopMultiple:0.75,defensiveLiqExitDropPct:30,limitBelowSignalPct:20,limitExpiryMinutes:60};
class AutoTradeEngine{
  constructor(){ this.positions=new Map(); this.pending=new Map(); this._cash=null; this.history=[]; }
  cash(){ return this._cash==null?S.settings.startCapital:this._cash; }
  setCash(v){ this._cash=Math.round(v*100)/100; }
  reset(){ this._cash=null; }
  open(){ return [...this.positions.values()].filter(p=>p.status==='OPEN'); }
  fee(){ return AUTO_V4.stakeUsd*S.settings.feePct/100; }
  cost(){ return AUTO_V4.stakeUsd+this.fee(); }
  /* entry-open-v4 entry: place a PENDING dip-limit order on ANY validated signal (no cash/slot consumed until a real fill) */
  onSignal(g){
    if(!S.settings.autoTradeEnabled)return {ok:false,reason:'auto trade disabled'};
    if(g.signalPriceUsd==null)return {ok:false,reason:'signal has no frozen signal-time price (legacy signal)'};
    if([...this.positions.values()].some(p=>p.mint===g.mint&&p.status==='OPEN'))return {ok:false,reason:'position already open for this coin'};
    if([...this.pending.values()].some(o=>o.mint===g.mint))return {ok:false,reason:'pending limit already placed for this coin'};
    if(this.pending.size>=AUTO_V4.maxSlots)return {ok:false,reason:'max '+AUTO_V4.maxSlots+' pending limits already placed'};
    const limitPrice=g.signalPriceUsd*(1-AUTO_V4.limitBelowSignalPct/100);
    const o={id:U.uid('apend'),mint:g.mint,symbol:g.symbol,signalId:g.id,
      placedAt:U.now(),signalRate:g.signalPriceUsd,limitPrice,
      stakeUsd:AUTO_V4.stakeUsd,expiryMinutes:AUTO_V4.limitExpiryMinutes,
      entryLiquidity:g.evidence?g.evidence.liquidityUsd:null};
    this.pending.set(o.id,o);
    this.history.push({t:U.now(),type:'PENDING_PLACED',symbol:g.symbol,mint:g.mint,price:limitPrice,usd:AUTO_V4.stakeUsd,fee:0,reason:'dip-limit placed at $'+limitPrice+' ('+AUTO_V4.limitBelowSignalPct+'% below signal rate $'+g.signalPriceUsd+')'});
    g.autoConsumed=true;
    S.emit('data');
    return {ok:true,pend:o};
  }
  /* slot refill: pull qualifying unconsumed signals into free slots */
  refill(){
    let filled=0;
    for(const g of [...S.signals.values()].sort((a,b)=>b.createdAt-a.createdAt)){
      if(this.pending.size>=AUTO_V4.maxSlots)break;
      if(g.consumed||g.autoConsumed)continue;
      if(g.signalPriceUsd==null)continue;
      const r=this.onSignal(g); if(r.ok)filled++;
    }
    return filled;
  }
  /* monitoring: pendings fill/expire, open positions exit - real data only, never acts on missing price. */
  async runCycle(){
    // 1. pendings: expire, cancel on a blocked fill, or fill on a real observation at/below limit
    if(this.pending.size){
      const pmints=[...new Set([...this.pending.values()].map(o=>o.mint))];
      const ppx=await DISCOVERY.refreshPricesFor(pmints);
      for(const o of [...this.pending.values()]){
        if(U.now()-o.placedAt>o.expiryMinutes*60000){
          this.pending.delete(o.id);
          this.history.push({t:U.now(),type:'PENDING_EXPIRED',symbol:o.symbol,mint:o.mint,price:o.limitPrice,usd:0,fee:0,reason:'dip-limit expired after '+o.expiryMinutes+' min without a real fill'});
          continue;
        }
        const pr=ppx[o.mint];
        if(!pr||!pr.ok||pr.priceUsd==null)continue; // honest: no fill on missing data
        if(pr.priceUsd<=o.limitPrice){
          if(this.open().length>=AUTO_V4.maxSlots){ this.pending.delete(o.id); this.history.push({t:U.now(),type:'PENDING_CANCELLED',symbol:o.symbol,mint:o.mint,price:pr.priceUsd,usd:0,fee:0,reason:'limit reached but all '+AUTO_V4.maxSlots+' slots full — cancelled'}); continue; }
          if(this.cash()<this.cost()){ this.pending.delete(o.id); this.history.push({t:U.now(),type:'PENDING_CANCELLED',symbol:o.symbol,mint:o.mint,price:pr.priceUsd,usd:0,fee:0,reason:'limit reached but auto bank insufficient ('+U.fmt$(this.cash())+') — cancelled'}); continue; }
          const qty=AUTO_V4.stakeUsd/pr.priceUsd;
          const pos={id:U.uid('ap'),mint:o.mint,symbol:o.symbol,signalId:o.signalId,
            entryAt:U.now(),entryRate:pr.priceUsd,entrySizeUsd:AUTO_V4.stakeUsd,feeUsd:this.fee(),qty,
            entryLiquidity:pr.liquidityUsd!=null?pr.liquidityUsd:o.entryLiquidity,
            status:'OPEN',lastPrice:pr.priceUsd,lastPriceAt:pr.observedAt,priceState:'LIVE',
            exitAt:null,exitPrice:null,exitReason:null,exitValueUsd:null,realizedPnl:null,
            rules:'entry-open-v4: no entry screens; dip-limit fill at real observed price; exits 1.5x / -25% price stop / -30% liquidity defensive exit / rug full loss. no time limit. PAPER ONLY.'};
          this.setCash(this.cash()-this.cost());
          this.positions.set(pos.id,pos);
          this.pending.delete(o.id);
          this.history.push({t:U.now(),type:'AUTO_ENTRY',symbol:o.symbol,mint:o.mint,price:pr.priceUsd,usd:AUTO_V4.stakeUsd,fee:pos.feeUsd,reason:'dip-limit fill at $'+pr.priceUsd+' (real observation <= limit $'+o.limitPrice+')'});
          U.toast('🤖 dip-limit FILLED: '+(o.symbol||U.short(o.mint))+' @ $'+pr.priceUsd);
        }
      }
    }
    // 2. open positions: honest exits on real data (rug > defensive liq > 1.5x TP > -25% stop)
    const open=this.open();
    if(!open.length){ this.refill(); S.emit('data'); return {checked:0}; }
    const mints=[...new Set(open.map(p=>p.mint))];
    const prices=await DISCOVERY.refreshPricesFor(mints);
    for(const p of open){
      const pr=prices[p.mint];
      if(!pr||!pr.ok||pr.priceUsd==null){ p.priceState='UNAVAILABLE'; continue; } // honest: no action on missing data
      p.lastPrice=pr.priceUsd; p.lastPriceAt=pr.observedAt; p.priceState='LIVE';
      const x=pr.priceUsd/p.entryRate;
      // rug check first: liquidity gone per real data
      if(p.entryLiquidity&&pr.liquidityUsd!=null){
        const drop=(p.entryLiquidity-pr.liquidityUsd)/p.entryLiquidity*100;
        if(pr.liquidityUsd<=S.settings.rugLiquidityUsd||drop>=S.settings.rugLiquidityDropPct){
          this._close(p,0,'RUG PULL — liquidity collapsed ('+U.fmt$(p.entryLiquidity)+' -> '+U.fmt$(pr.liquidityUsd)+', real data). Full position lost.');
          continue;
        }
      }
      // defensive liquidity exit: -30% vs entry
      if(p.entryLiquidity&&pr.liquidityUsd!=null){
        const ldrop=(p.entryLiquidity-pr.liquidityUsd)/p.entryLiquidity*100;
        if(ldrop>=AUTO_V4.defensiveLiqExitDropPct){
          this._close(p,pr.priceUsd,'defensive exit — liquidity -'+ldrop.toFixed(1)+'% vs entry (rule: -'+AUTO_V4.defensiveLiqExitDropPct+'%)');
          continue;
        }
      }
      if(x>=AUTO_V4.tpMultiple){ this._close(p,pr.priceUsd,'1.5x target hit ('+x.toFixed(2)+'x) — auto sell'); continue; }
      if(x<=AUTO_V4.stopMultiple){ this._close(p,pr.priceUsd,'-25% price stop ('+((x-1)*100).toFixed(1)+'%) — auto exit'); continue; }
    }
    this.refill();
    S.emit('data');
    return {checked:open.length};
  }
  _close(p,exitPrice,reason){
    p.status='CLOSED'; p.exitAt=U.now(); p.exitReason=reason;
    if(exitPrice>0){
      const gross=p.qty*exitPrice; const fee2=gross*S.settings.feePct/100;
      p.exitValueUsd=Math.round((gross-fee2)*100)/100; p.exitPrice=exitPrice;
      p.realizedPnl=Math.round((p.exitValueUsd-p.entrySizeUsd-p.feeUsd)*100)/100;
      this.setCash(this.cash()+p.exitValueUsd);
    }else{
      p.exitValueUsd=0; p.exitPrice=0;
      p.realizedPnl=Math.round(-(p.entrySizeUsd+p.feeUsd)*100)/100; // rug: full loss
    }
    this.history.push({t:U.now(),type:p.exitValueUsd>0?'AUTO_EXIT':'RUG_LOSS',symbol:p.symbol,mint:p.mint,price:p.exitPrice,usd:p.exitValueUsd,reason});
    S.emit('data');
  }
  stats(){
    const closed=[...this.positions.values()].filter(p=>p.status==='CLOSED');
    const wins=closed.filter(p=>(p.realizedPnl||0)>0);
    let eq=this.cash(),ok=true;
    for(const p of this.open()){ if(p.lastPrice==null){ok=false;continue;} eq+=p.qty*p.lastPrice; }
    return {open:this.open().length,closed:closed.length,wins:wins.length,rugs:closed.filter(p=>p.exitValueUsd===0).length,
      realized:Math.round(closed.reduce((a,p)=>a+(p.realizedPnl||0),0)*100)/100,
      equity:Math.round(eq*100)/100,valuationsComplete:ok};
  }
}
const AUTO=new AutoTradeEngine();

/* ============================================================
   S. SRVBOOK — read-only mirror of the 24/7 server-side paper
   book published at ./book.json (committed by us when the trade
   agent sends updates: on every entry/exit + daily). The book
   file ages between events — its generatedAt is always labeled
   "last book update", never "live". This device fetches CURRENT
   prices for open mints itself (Dexscreener) with their own
   freshness labels. Missing/failed file states are honest.
   ============================================================ */
const SRVBOOK={state:'idle',data:null,fetchedAt:0,error:null,lastTry:0,live:{},liveAt:0,
  ts(g){ if(g==null)return null; if(typeof g==='number')return g>1e12?g:g*1000; const t=Date.parse(g); return isNaN(t)?null:t; },
  async refresh(force){
    const now=U.now();
    if(!force&&now-this.lastTry<60000)return; // throttle: at most one fetch/min
    this.lastTry=now; if(!this.data)this.state='loading';
    try{
      const r=await fetch('book.json?ts='+now,{cache:'no-store'});
      if(r.status===404){ this.state='missing'; this.data=null; this.error=null; }
      else if(!r.ok){ this.state='error'; this.error='HTTP '+r.status; }
      else{ const j=await r.json(); this.data=j; this.state='ok'; this.error=null; }
      this.fetchedAt=U.now();
    }catch(e){ this.state='error'; this.error=String((e&&e.message)||e); }
    this.refreshLive();
    if(typeof S!=='undefined'&&S.ui&&S.ui.page==='autotrade')try{RENDER.all();}catch(e){}
  },
  /* current prices for open server positions, fetched by THIS device */
  async refreshLive(force){
    if(!this.data)return;
    const mints=[...new Set((this.data.positions||[]).filter(p=>(p.status||'').toUpperCase()!=='CLOSED'&&p.mint).map(p=>p.mint))];
    if(!mints.length)return;
    const now=U.now(); if(!force&&now-this.liveAt<45000)return; this.liveAt=now;
    try{
      const pr=await DISCOVERY.refreshPricesFor(mints);
      for(const m of Object.keys(pr||{}))if(pr[m]&&pr[m].ok&&pr[m].priceUsd!=null)this.live[m]={price:pr[m].priceUsd,at:pr[m].observedAt||U.now()};
      if(S.ui&&S.ui.page==='autotrade')try{RENDER.all();}catch(e){}
    }catch(e){ /* keep old live marks, they carry their own timestamps */ }
  }
};

/* ============================================================
   S2. SRVSCAN — read-only mirror of the 24/7 server-side
   scanner feed at ./server-scan.json (committed every ~5 min by
   the GitHub Actions server scanner, which runs the same engine
   code as this page). generatedAt is labeled as the last server
   cycle time, never "live". Missing/failed states are honest.
   ============================================================ */
const SRVSCAN={state:'idle',data:null,fetchedAt:0,error:null,lastTry:0,
  async refresh(force){
    const now=U.now();
    if(!force&&now-this.lastTry<60000)return; // throttle: at most one fetch/min
    this.lastTry=now; if(!this.data)this.state='loading';
    try{
      const r=await fetch('server-scan.json?ts='+now,{cache:'no-store'});
      if(r.status===404){ this.state='missing'; this.data=null; this.error=null; }
      else if(!r.ok){ this.state='error'; this.error='HTTP '+r.status; }
      else{ const j=await r.json(); this.data=j; this.state='ok'; this.error=null; }
      this.fetchedAt=U.now();
    }catch(e){ this.state='error'; this.error=String((e&&e.message)||e); }
    if(typeof S!=='undefined'&&S.ui&&S.ui.page==='overview')try{RENDER.all();}catch(e){}
  }
};

const DETAILUI={

    h+='<div class="row" style="margin:4px 0"><span class="mint">'+(p.mint||'—')+'</span>'+(p.mint?RENDER.copyBtn(p.mint):'')+'</div>';
    if(p.mint)h+=this.linksFor(p.mint,null);
    h+='<div class="card"><h3>Position (24/7 server book)</h3>'
      +this.kv('entry rate (frozen)',(p.entryRate!=null?'$'+p.entryRate:'—')+(p.entryAt?' · '+new Date(SRVBOOK.ts(p.entryAt)).toLocaleString():''))
      +(p.entrySizeUsd!=null?this.kv('size','$'+p.entrySizeUsd+(p.feeUsd!=null?' + fee $'+p.feeUsd:'')+(p.qty?' · qty '+Math.round(p.qty).toLocaleString():'')):'')
      +(p.entryLiquidity!=null?this.kv('liquidity at entry',U.fmt$(p.entryLiquidity)):'')
      +(open?this.kv('live price NOW (this device)',lp?'$'+lp.price+' · '+U.age(lp.at)+' ago':'fetching… (Dexscreener)'):'')
      +this.kv('price in book snapshot',(p.lastPrice!=null?'$'+p.lastPrice:'—')+(p.lastPriceAt?' · as of '+new Date(SRVBOOK.ts(p.lastPriceAt)).toLocaleString():''))
      +(p.currentX!=null?this.kv('multiple @ book update',(+p.currentX).toFixed(3)+'x'):'')
      +(p.exitReason?this.kv('exit',U.esc(p.exitReason)):'')
      +(p.exitValueUsd!=null?this.kv('exit value / realized',U.fmt$(p.exitValueUsd)+' / '+((p.realizedPnl||0)>=0?'+':'')+U.fmt$(p.realizedPnl||0)):'')
      +(p.exitAt?this.kv('closed',new Date(SRVBOOK.ts(p.exitAt)).toLocaleString()):'')
      +(p.rules?'<div class="small" style="margin-top:4px">'+U.esc(p.rules)+'</div>':'')+'</div>';
    h+='<div class="note">Score breakdown, wallet evidence and risk verdict are NOT AVAILABLE server-side — book.json carries position facts only. Not invented here. Book last updated: '+(SRVBOOK.ts(d.generatedAt)?new Date(SRVBOOK.ts(d.generatedAt)).toLocaleString():'unknown')+'.</div>';
    if(S.candidates.get(p.mint))h+='<div class="row"><button class="btn sm" onclick="DETAILUI.open(\'candidate\',\''+p.mint+'\')">open token detail (this device has it) →</button></div>';
    return h;
  },
  /* ---- MANUAL PORTFOLIO position ---- */
  portpos(id){
    const p=S.positions.get(id); if(!p)return null;
    const unr=p.status==='OPEN'?PORT.unrealized(p):null;
    let h='<div class="row"><b style="font-size:17px">'+U.esc(p.symbol||U.short(p.mint))+'</b>'+RENDER.badge(p.status,p.status==='OPEN'?'b-live':'b-dim')+RENDER.badge('MANUAL BOOK','b-info')+'<span class="sp"></span>'+(p.status==='CLOSED'?'<b style="color:'+((p.realizedPnl||0)>=0?'var(--grn)':'var(--red)')+'">'+U.fmt$(p.realizedPnl)+'</b>':'')+'</div>';
    h+='<div class="row" style="margin:4px 0"><span class="mint">'+p.mint+'</span>'+RENDER.copyBtn(p.mint)+'</div>';
    h+=this.linksFor(p.mint,null);
    h+='<div class="card"><h3>Position (manual paper book)</h3>'
      +this.kv('entry','$'+p.entryPrice.toPrecision(4)+' · '+U.fmt$(p.entrySizeUsd)+' · '+new Date(p.openedAt).toLocaleString())
      +this.kv('last price',p.lastPrice!=null?'$'+p.lastPrice.toPrecision(4)+' · '+U.age(p.lastPriceAt)+' ago'+(p.priceStale?' (STALE — not treated as current)':''):'UNAVAILABLE — not treated as current')
      +(p.status==='OPEN'?this.kv('unrealized',unr==null?'UNAVAILABLE':U.fmt$(unr)):'')
      +this.kv('score at entry',p.scoreAtEntry==null?'—':p.scoreAtEntry+' ('+p.scoreVersion+')')
      +(p.milestonesHit&&p.milestonesHit.length?this.kv('milestones',p.milestonesHit.map(m2=>m2+'x').join(' · ')):'')
      +(p.status==='CLOSED'?this.kv('exit',U.esc(p.exitReason||''))+this.kv('realized',U.fmt$(p.realizedPnl)):'');
    h+='</div>';
    if(p.status==='OPEN')h+='<div class="row"><button class="btn red sm" onclick="event.stopPropagation();BOOT.manualExit(\''+p.id+'\');DETAILUI.close()">exit now (paper)</button></div>';
    if(S.candidates.get(p.mint))h+='<div class="row"><button class="btn sm" onclick="DETAILUI.open(\'candidate\',\''+p.mint+'\')">open token detail →</button></div>';
    return h;
  }
};
function openDetail(kind,key){ DETAILUI.open(kind,key); }

</script>
</body>
