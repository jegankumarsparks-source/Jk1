<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e11"><link rel="icon" href="data:,">
<title>JK FUTURE TRADE</title>
<style>
:root{--bg:#0b0e11;--card:#1e2329;--card2:#2b3139;--line:#2b3139;--txt:#eaecef;--dim:#848e9c;--grn:#0ecb81;--red:#f6465d;--yel:#f0b90b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;padding-bottom:60px}
a{color:var(--yel);text-decoration:none}
.wrap{max-width:640px;margin:0 auto;padding:12px 12px}
.top{display:flex;align-items:center;gap:8px;padding:6px 2px}
.top .logo{font-weight:900;font-size:18px;letter-spacing:.5px}
.top .logo span{color:var(--yel)}
.live{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--grn);border:1px solid #0ecb8155;background:#0ecb8114;border-radius:20px;padding:4px 10px;font-weight:700}
.live i{width:7px;height:7px;border-radius:50%;background:var(--grn);animation:pu 1.4s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.15}}
.hero{margin-top:10px;background:linear-gradient(160deg,#1e2329,#161b21);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;top:-60px;right:-60px;width:200px;height:200px;background:radial-gradient(circle,#f0b90b22,transparent 70%);animation:fl 6s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(-30px,20px)}}
.lab{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.wr{font-size:clamp(40px,12vw,56px);font-weight:900;line-height:1.05}
.wr small{font-size:16px;color:var(--dim);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.st{background:#161b21;border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center}
.st b{display:block;font-size:16px}.st span{font-size:10px;color:var(--dim)}
.st.w b{color:var(--grn)}.st.l b{color:var(--red)}
h2{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin:18px 2px 8px;display:flex;justify-content:space-between;align-items:center}
h2 .cnt{color:var(--yel)}
.sig{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;animation:in .45s both}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
.sig.long{border-left:4px solid var(--grn)}.sig.short{border-left:4px solid var(--red)}
.shead{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.pair{font-weight:800;font-size:18px}
.perp{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.dir{margin-left:auto;font-weight:900;font-size:13px;padding:6px 14px;border-radius:8px;letter-spacing:.5px}
.dir.LONG{background:var(--grn);color:#04120b}.dir.SHORT{background:var(--red);color:#fff}
.ob{padding:4px 14px 10px;font-variant-numeric:tabular-nums}
.ob .r{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #242b33;font-size:14px}
.ob .r:last-child{border-bottom:0}
.ob .k{color:var(--dim)}.ob .v{font-weight:700}
.v.tp{color:var(--grn)}.v.sl{color:var(--red)}
.prog{height:6px;background:#0f1318;border-radius:4px;margin:8px 14px 4px;position:relative;overflow:hidden}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,var(--yel),var(--grn));transition:width .8s}
.plab{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);padding:0 14px 8px}
.ev{margin:0 14px 10px;background:#161b21;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11px;color:var(--dim)}
.ev b{color:var(--txt)}
.actions{display:flex;gap:8px;padding:0 14px 14px}
.btn{flex:1;text-align:center;font-weight:800;font-size:14px;padding:12px;border-radius:10px}
.btn.bz{background:var(--yel);color:#1a1400}
.btn.ghost{background:#2b3139;color:var(--txt)}
.res{font-weight:900;padding:6px 14px;border-radius:8px;font-size:13px;margin-left:auto}
.res.WIN{background:#0ecb8122;color:var(--grn);border:1px solid #0ecb8155}
.res.LOSS{background:#f6465d22;color:var(--red);border:1px solid #f6465d55}
.res.EXPIRED{background:#848e9c22;color:var(--dim);border:1px solid #848e9c55}
.pnl{font-weight:800;font-size:14px}
.empty{padding:26px;text-align:center;color:var(--dim);border:1px dashed var(--line);border-radius:16px;font-size:13px}
.note{margin-top:16px;font-size:11px;color:var(--dim);line-height:1.7;background:#161b21;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.upd{font-size:10px;color:var(--dim);text-align:right;margin-top:4px}
</style></head>
<body><div class="wrap">
<div class="top"><div class="logo">JK <span>FUTURE</span> TRADE</div><div class="live"><i></i>SIGNALS LIVE</div></div>
<div class="hero">
<div class="lab">Engine win rate (closed signals)</div>
<div class="wr" id="wr">-<small> %</small></div>
<div class="stats">
<div class="st w"><b id="wins">0</b><span>WINS</span></div>
<div class="st l"><b id="losses">0</b><span>LOSSES</span></div>
<div class="st"><b id="open">0</b><span>OPEN</span></div>
<div class="st"><b id="avg">-</b><span>AVG PNL%</span></div>
</div><div class="upd" id="upd"></div></div>
<h2>Open signals <span class="cnt" id="ocnt"></span></h2>
<div id="openList"><div class="empty">No open signals. Engine scans 31 Binance USD-M perps every ~2 min (15m breakout + volume + open interest + funding filters). Strict filters = fewer, cleaner signals.</div></div>
<h2>Closed signals <span class="cnt" id="ccnt"></span></h2>
<div id="closedList"></div>
<div class="note" id="srcnote"></div>
</div>
<script>
const DATA='https://api.github.com/repos/jegankumarsparks-source/Jk1/contents/data/futures.json?ref=live';
const fmt=(p)=>{if(p==null)return'-';const a=Math.abs(p);let d=a>=100?1:(a>=1?3:5);return p.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d})};
const ago=(t)=>{const s=Math.max(0,Date.now()/1000-t);if(s<60)return Math.floor(s)+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';return Math.floor(s/3600)+'h ' +Math.floor(s%3600/60)+'m ago'};
const bz=(sym)=>'https://www.binance.com/en/futures/'+sym;
function card(s,open){
 const pctT=open?Math.min(100,Math.max(0,((s.dir==='LONG'?(s.last_price-s.entry):(s.entry-s.last_price))/ (s.dir==='LONG'?(s.target-s.entry):(s.entry-s.target))*100))):100;
 const pnl=open?((s.dir==='LONG'?(s.last_price-s.entry):(s.entry-s.last_price))/s.entry*100):s.pnl_pct;
 const ev=s.evidence||{};
 return `<div class="sig ${s.dir.toLowerCase()}">
 <div class="shead"><span class="pair">${s.sym.replace('USDT','')}</span><span class="perp">USDT PERP</span>
 ${open?`<span class="dir ${s.dir}">${s.dir==='LONG'?'BUY / LONG':'SELL / SHORT'}</span>`:`<span class="pnl" style="color:${s.pnl_pct>=0?'var(--grn)':'var(--red)'}">${s.pnl_pct>=0?'+':''}${s.pnl_pct}%</span><span class="res ${s.result}">${s.result}</span>`}</div>
 <div class="ob">
 <div class="r"><span class="k">Entry</span><span class="v">${fmt(s.entry)}</span></div>
 <div class="r"><span class="k">Target (TP)</span><span class="v tp">${fmt(s.target)}</span></div>
 <div class="r"><span class="k">Invalidation (SL)</span><span class="v sl">${fmt(s.stop)}</span></div>
 ${open?`<div class="r"><span class="k">Last price</span><span class="v">${fmt(s.last_price)}</span></div>`:`<div class="r"><span class="k">Exit</span><span class="v">${fmt(s.exit)}</span></div>`}
 </div>
 ${open?`<div class="prog"><i style="width:${pctT}%"></i></div><div class="plab"><span>entry</span><span>${pctT.toFixed(0)}% to target</span></div>`:''}
 <div class="ev">Evidence: breakout <b>${fmt(ev.breakout_level)}</b> · volume <b>${ev.vol_ratio}x</b> avg · OI 1h <b>${ev.oi_chg_1h_pct==null?'warming up':ev.oi_chg_1h_pct+'%'}</b> · funding <b>${ev.funding==null?'-':(ev.funding*100).toFixed(4)+'%'}</b>${ev.ls_ratio?' · long/short <b>'+ev.ls_ratio+'</b>':''} · ${ago(s.t)} old</div>
 <div class="actions"><a class="btn bz" href="${bz(s.sym)}">Open ${s.sym.replace('USDT','')} Perp in Binance</a></div>
 </div>`;
}
async function load(){
 try{
  const r=await fetch(DATA,{headers:{'Accept':'application/vnd.github.raw'},cache:'no-cache'});
  const d=await r.json();
  const cl=d.closed||[];const w=cl.filter(x=>x.result==='WIN').length,l=cl.filter(x=>x.result==='LOSS').length;
  document.getElementById('wins').textContent=w;document.getElementById('losses').textContent=l;
  document.getElementById('open').textContent=(d.open||[]).length;
  document.getElementById('wr').innerHTML=(w+l)?(100*w/(w+l)).toFixed(0)+'<small> % ('+(w+l)+' closed)</small>':'-<small> no closed signals yet</small>';
  const avg=cl.length?cl.reduce((a,x)=>a+x.pnl_pct,0)/cl.length:null;
  document.getElementById('avg').textContent=avg==null?'-':(avg>=0?'+':'')+avg.toFixed(2)+'%';
  document.getElementById('upd').textContent='updated '+ago(d.updated)+' · pass '+d.passes;
  document.getElementById('ocnt').textContent=(d.open||[]).length?'':'none';
  if((d.open||[]).length)document.getElementById('openList').innerHTML=d.open.map(s=>card(s,true)).join('');
  document.getElementById('ccnt').textContent=cl.length||'none yet';
  document.getElementById('closedList').innerHTML=cl.slice().reverse().slice(0,30).map(s=>card(s,false)).join('')||'<div class="empty">No closed signals yet. First results land here with honest WIN/LOSS labels.</div>';
  document.getElementById('srcnote').innerHTML='<b>Honest labels:</b> signals only - you trade by hand on Binance, you set your own leverage. Entry/target/stop from 15m breakout + volume + open interest + funding. Price data: OKX public API (Binance API is geo-blocked from our server; same perps, prices track within a hair). '+(d.warmup?'Engine warming up: open-interest baseline builds over the first hour, signals start after. ':'')+'Leverage can lose money fast - the win rate above is the engine\'s own track record, not a promise.';
 }catch(e){document.getElementById('upd').textContent='data load failed - retrying';}
}
load();setInterval(load,60000);
</script></body></html>
